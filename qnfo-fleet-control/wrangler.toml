# DO-MIGRATION-NOTE-1 2026-09-22 (R3/F2): a `wrangler deploy --dry-run` validates
# client-side structure ONLY - it cannot prove the server accepts this migration. The
# class already exists (created via the API), so a real wrangler deploy may FAIL CLOSED
# (Cloudflare rejects a creating migration for an already-depended-on class). It never
# wipes. The operative deploy path remains scripts/raw_put.py (binding-preserving).

name = "qnfo-fleet-control"
main = "worker.js"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# MERGE WAVE A (2026-09-11): qnfo-fleet-advisor + qnfo-fleet-calibrator + qnfo-fleet-deploy merged
# into ONE worker (3 -> 1). Subsystems dispatched by path: /advisor/*, /cal/*, else deploy control plane.
# Cron dispatch: "*/20 * * * *" -> advisor; "0 3|0 4 1|30 3 1" -> calibrator; else -> deploy.
# Canonical deploy: CF API multipart (as-built 2026-09-11). This toml is the spec; wrangler deploy needs
# verify against live bindings (DEPLOY-VERIFY-VERSION-1).

[triggers]
crons = ["*/20 * * * *", "0 3 * * *", "0 4 1 * *", "30 3 * * 1", "0 * * * *"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "AUDIT_DB"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "DB_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[r2_buckets]]
binding = "R2_AUDIT"
bucket_name = "qnfo-audit"

[[r2_buckets]]
binding = "CANONICAL"
bucket_name = "qnfo-canonical"

[[kv_namespaces]]
binding = "KV_CAL"
id = "d3768b93a76640be83151b00a8b42717"

binding = "SVC_PERSONAL_API"
service = "personal-api"
environment = "production"

[[services]]
binding = "SVC_QNFO_AI"
service = "qnfo-ai"
environment = "production"

[[services]]
binding = "SVC_QNFO_INFRA"
service = "qnfo-infra"
environment = "production"

[[services]]
binding = "SVC_QNFO_INTENT"
service = "qnfo-intent-orchestrator"
environment = "production"

# FleetAdvisor Durable Object (advisor + calibration subsystem; stateless -- uses no
# state.storage). LIVE namespace: qnfo-fleet-control_FleetAdvisor (class FleetAdvisor,
# script qnfo-fleet-control). This binding is what made the toml binding-INCOMPLETE before
# 2026-09-19: live had 24 bindings, the toml declared 17, so a wrangler deploy would have
# SILENTLY DROPPED the DO + 6 secrets (BINDING-PRESERVATION-1). Added 2026-09-19.
# VERIFIED 2026-09-19: the live namespace is SQLite-backed (use_sqlite:true ->
# new_sqlite_classes is the CORRECT migration type; every DO namespace in the account is
# use_sqlite:true). The namespace was created out-of-band (raw content API, as-built
# 2026-09-11), so the first wrangler deploy applies this Create migration; if CF rejects it
# for the already-existing class the deploy FAILS CLOSED (no change). OPERATIVE DEPLOY PATH
# remains scripts/raw_put.py (binding-preserving /content PUT -- no migration, no risk).

[vars]
ADVISOR_ITERS = "3"
ADVISOR_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
CF_ACCOUNT_ID = "edb167b78c9fb901ea5bca3ce58ccc4b"
PROBE_WORKERS = "qnfo-ai,qnfo-ops,qnfo-kaizen,qnfo-paper-reviser,qnfo-research-exec,qnfo-fleet-control,qnfo-intent-orchestrator,qnfo-gateway,qnfo-infra"
REVIEW_MODEL = "@cf/openai/gpt-oss-120b"

# Secrets (set via CF API; values in credential stores / rotated 2026-09-11):
# CF_API_TOKEN, CF_DEPLOY_TOKEN, DEPLOY_ADMIN_TOKEN, ADVISOR_TOKEN, SELFHEAL_TOKEN, RUN_SECRET

# FleetAdvisor DO (AUDIT-REMEDIATE-1 2026-09-22; verified vs live CF bindings).
# The class already exists (created via raw_put); see the migration note above.
[[durable_objects.bindings]]
name = "FleetAdvisor"
class_name = "FleetAdvisor"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FleetAdvisor"]
