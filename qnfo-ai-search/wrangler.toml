name = "qnfo-ai-search"
main = "worker.js"
# COMPAT-ADVANCE-WAVE-1 (2026-10-12, metric workers_compat_date_behind, qnfo-ops COMPAT-DATE-DECLARED-APPLY-1): the date moves
# to 2026-10-10 on the next canonical deploy. Reviewed against qnfo-ops COMPAT_FLIPS between the old date and this one:
# 2026-08-04 nodejs_compat default on (this worker reads no timer id as a number, has no typeof process/Buffer branch and
# imports no node: module), 2026-10-01 Durable Object eviction (no Durable Object here). /ops/deploy keeps the date only
# when /health answers with the deployed VERSION and otherwise restores the previous date (deployment_history compat-restore).
# compat-advance: reviewed 2026-10-12
compatibility_date = "2026-10-10"
workers_dev = true
# charter-pillar: reach
# 2.0.0 (ASK-LOOP-1): also serves ask.qwav.tech (folded in from the static Pages project ask-qwav, so the worker count
# does not grow) and runs the ask surface's measure-evaluate-improve loop on the hourly cron below.

[[ai_search_namespaces]]
binding = "AI_SEARCH"
namespace = "default"
remote = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# qnfo-gateway serves papers.qnfo.org and graph-api.qnfo.org by host; idea-hub serves the public idea threads.
[[services]]
binding = "GATEWAY"
service = "qnfo-gateway"

[[services]]
binding = "IDEAS"
service = "idea-hub"

[triggers]
crons = ["41 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

# WORKERS-STANDARDS-1 (owner standards 2026-10-12): logs and traces declared. Workers docs: `enabled` alone turns on logs only;
# traces need [observability.traces]. Traces are sampled at the default rate of 1 (low-traffic worker).
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.05 # TRACES-SAMPLING-BEFORE-BILLING-1: stored traces bill from 2026-12-01
