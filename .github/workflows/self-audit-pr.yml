name: self-audit-pr

# SELF-AUDIT-1 and NO-STANDALONE-DOCS-1 (owner directive 2026-11-06): the CLAUDE.md text rule becomes a check. A PR body needs a Self-audit section with a Real output line and a
# Not thinking about line that names a concrete gap with a fix or issue; a PR that changes documents without code fails. scripts/r2_doc_audit.test.mjs holds the cases.
# Style: step names colon-free, no heredocs, no inline python.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit tests for the checks
        run: node scripts/r2_doc_audit.test.mjs

      - name: Read the PR body and file list
        run: |
          set -uo pipefail
          gh pr view "$PR" --json body --jq .body > body.txt
          gh pr diff "$PR" --name-only > files.txt

      - name: Check the PR against SELF-AUDIT-1
        run: node scripts/self_audit_pr.mjs --body body.txt --files files.txt
