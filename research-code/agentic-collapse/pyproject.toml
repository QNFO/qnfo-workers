[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-collapse"
version = "0.1.0"
description = "Reference implementation of the Agentic Collapse model: a time-delayed stochastic system for epistemic stability in autonomous AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LicenseRef-QNFO-ULA-2.1" }
dependencies = []
authors = [{ name = "Rowan Brad Quni-Gudzinas" }]
keywords = ["autonomous agents", "AI safety", "delay differential equations", "epistemic stability", "reproducibility"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
]

[project.urls]
Paper = "https://papers.qnfo.org/"

[project.scripts]
agentic-collapse = "agentic_collapse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
