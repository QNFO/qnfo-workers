name: restore-container-config-1485

# CONTAINER-CONFIG-RESTORE-4 (2026-09-29, qnfo-ops; issues #1485 / #1487).
#
# GAP THIS CLOSES -- MEASURED, NOT INFERRED
#   scripts/restore_container_config.py (CONTAINER-CONFIG-RESTORE-3) was added to main at
#   19:37:57Z (commit 125aaf65) as the /content-metadata restore path, but a listing of
#   .github/workflows on main contains NO workflow that references it. The restore script
#   therefore had no runner: [[containers]] could not be restored by ANY automatic path.
#   A script with no runner is not a remediation path.
#
# WHY BOTH PATHS RUN HERE
#   ci-status/deploy-containers-pilot.json (head 139b2dce, ts 19:37:34Z) records
#   wrangler_outcome=failure AND nomig_outcome=failure, then its own last-resort step
#   shipped CODE ONLY via raw_put.py -- which by construction cannot restore [[containers]]
#   (deployment_history id 182, 19:37:37Z). The wrangler failure TEXT was never captured
#   anywhere, so every subsequent iteration was blind. This run captures it and the
#   /content-metadata attempt side by side, and writes both into a committed artifact.
#
# FAIL-CLOSED / NO-REGRESSION
#   Every step is continue-on-error:true and every step that follows another carries
#   if: always(), so a guard failure can never skip the recovery step -- that was the
#   WRANGLER-NOT-SKIPPABLE-1 / CI-CLASS defect that let #1485 survive a "successful" run.
#   The authoritative assertion is GET /settings `containers` non-empty, read back
#   independently of whatever the deploy steps claim. A red run mutates nothing that was
#   not already absent.
#
# CONTAINER-CONFIG-RESTORE-5 (this revision, qnfo-ops 2026-09-29)
#   The previous revision of THIS file could never report failure: the authoritative
#   read-back step ended with `raise SystemExit(0)` on the absent path -- exit code 0,
#   i.e. SUCCESS -- and the step also carries continue-on-error:true. A run in which
#   [[containers]] was STILL ABSENT therefore produced a green job with only a buried
#   ::error:: annotation (same class as CI-CLASS / WRANGLER-NOT-SKIPPABLE-1: a guard that
#   cannot fail). Fixed to SystemExit(1), and a new FINAL GATE step (no continue-on-error)
#   now decides the run: it exits 1 when the /settings read-back shows containers absent.
#   A green run therefore means exactly one thing -- containers non-empty.
#   `schedule` is still deliberately absent (SCHEDULE-EVENT-NEVER-FIRES-1: the schedule
#   event has never fired on this repo); this revision relies on its own path push.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-container-config-1485.yml'
      - 'scripts/restore_container_config.py'
      - 'qnfo-containers-pilot/wrangler.toml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-container-config-1485
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER: qnfo-containers-pilot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pre-state - GET /settings read-back
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          acct = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          tok = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          ua = "QNFO-fleet-ci/1.0 (+https://qnfo.org; restore-container-config-1485)"
          url = "https://api.cloudflare.com/client/v4/accounts/%s/workers/scripts/qnfo-containers-pilot/settings" % acct
          out = {}
          try:
              r = urllib.request.Request(url, headers={"Authorization": "Bearer " + tok, "User-Agent": ua})
              d = json.load(urllib.request.urlopen(r, timeout=60))
              res = d.get("result") or {}
              out = {
                  "success": d.get("success"),
                  "containers": res.get("containers"),
                  "bindings": [b.get("name") for b in (res.get("bindings") or [])],
                  "compatibility_date": res.get("compatibility_date"),
                  "compatibility_flags": res.get("compatibility_flags"),
                  "migrations": res.get("migrations"),
              }
          except Exception as e:
              out = {"error": "%s: %s" % (type(e).__name__, e)}
          print(json.dumps(out, indent=2))
          open("/tmp/pre_settings.json", "w").write(json.dumps(out, indent=2))
          PY

      - name: attempt 1 - wrangler deploy (captures the never-captured failure text)
        id: wrangler
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          cd qnfo-containers-pilot
          npx --yes wrangler@4 deploy --name qnfo-containers-pilot 2>&1 | tee /tmp/wrangler.log
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: attempt 2 - restore via /content metadata (CONTAINER-CONFIG-RESTORE-3)
        id: restore
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/restore_container_config.py 2>&1 | tee /tmp/restore.log

      - name: authoritative read-back - is containers present?
        id: verify
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          acct = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          tok = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          ua = "QNFO-fleet-ci/1.0 (+https://qnfo.org; restore-container-config-1485)"
          url = "https://api.cloudflare.com/client/v4/accounts/%s/workers/scripts/qnfo-containers-pilot/settings" % acct
          out = {}
          try:
              r = urllib.request.Request(url, headers={"Authorization": "Bearer " + tok, "User-Agent": ua})
              d = json.load(urllib.request.urlopen(r, timeout=60))
              res = d.get("result") or {}
              out = {
                  "containers": res.get("containers"),
                  "bindings": [b.get("name") for b in (res.get("bindings") or [])],
              }
          except Exception as e:
              out = {"error": "%s: %s" % (type(e).__name__, e)}
          print(json.dumps(out, indent=2))
          open("/tmp/post_settings.json", "w").write(json.dumps(out, indent=2))
          if not out.get("containers"):
              print("::error::[[containers]] STILL ABSENT - #1485 remains open; see the artifact for both failure texts")
              raise SystemExit(1)
          print("CONTAINERS RESTORED: " + json.dumps(out["containers"]))
          PY

      - name: publish outcome artifact (always)
        if: always()
        run: |
          set -uo pipefail
          mkdir -p ci-status
          python3 - <<'PY'
          import json, subprocess

          def rd(p, n=5000):
              try:
                  return open(p, encoding="utf-8", errors="replace").read()[-n:]
              except Exception as e:
                  return "UNREADABLE: %s" % e

          def sh(cmd):
              try:
                  return subprocess.run(cmd, shell=True, capture_output=True, text=True).stdout.strip()
              except Exception as e:
                  return "ERR %s" % e

          art = {
              "workflow": "restore-container-config-1485",
              "marker": "CONTAINER-CONFIG-RESTORE-5",
              "issues": [1485, 1487],
              "head": sh("git rev-parse HEAD"),
              "ts": sh("date -u +%Y-%m-%dT%H:%M:%SZ"),
              "pre_settings": rd("/tmp/pre_settings.json", 2500),
              "wrangler_tail": rd("/tmp/wrangler.log", 5000),
              "restore_log": rd("/tmp/restore.log", 5000),
              "post_settings": rd("/tmp/post_settings.json", 2500),
          }
          json.dump(art, open("ci-status/restore-container-config-1485.json", "w"), indent=2)
          print(json.dumps(art, indent=2)[:8000])
          PY
          git config user.name "qnfo-selfheal-bot"
          git config user.email "fleet-bot@qnfo.org"
          git add ci-status/restore-container-config-1485.json
          if git diff --cached --quiet; then
            echo "artifact unchanged"
            exit 0
          fi
          git commit -m "chore(ci): restore-container-config-1485 outcome [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main >/dev/null 2>&1 || true
            if git push origin HEAD:main; then
              echo "artifact pushed on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::artifact push failed after 5 attempts"

      - name: summarize
        if: always()
        run: |
          {
            echo "## restore-container-config-1485"
            echo ""
            echo "Closes: #1485 (CONTAINER-CONFIG-DROPPED-1) / #1487 (PRESERVE-WORKER-METADATA-1)"
            echo ""
            echo "attempt1 wrangler=${{ steps.wrangler.outcome }} attempt2 content-metadata=${{ steps.restore.outcome }} readback=${{ steps.verify.outcome }}"
            echo ""
            echo "Authoritative assertion: GET /settings \`containers\` non-empty."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: gate - FAIL the run if containers is absent (CONTAINER-CONFIG-RESTORE-5)
        if: always()
        run: |
          if [ ! -f /tmp/post_settings.json ]; then
            echo "::error::/tmp/post_settings.json missing - the authoritative read-back never ran; treating as FAILURE (fail-closed)"
            exit 1
          fi
          python3 -c "import json,sys; d=json.load(open('/tmp/post_settings.json')); c=d.get('containers'); print('containers read-back:', json.dumps(c)); sys.exit(0 if c else 1)"
          echo "GATE PASS: [[containers]] present in GET /settings read-back - #1485 closable"
