name = "qnfo-subscribers"
main = "worker.js"
compatibility_date = "2026-08-01"

# qnfo.org newsletter subscriber list + weekly research digest.
# Canonical source: QNFO/qnfo-workers/qnfo-subscribers/worker.js

[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "LIVING"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[send_email]]
binding = "SEND_EMAIL"
name = "SEND_EMAIL"

# secret (set via wrangler secret put): SUBSCRIBERS_TOKEN

[triggers]
crons = ["0 16 * * 1"]
