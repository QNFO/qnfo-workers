name = "qnfo-model-eval"
main = "worker.js"
# COMPAT-ADVANCE-WAVE-3 (2026-10-19, RESOLVE-ALL-OPEN-1, agent_issues 99953/99955, worker_compat_state live 2026-09-01):
# the date moves from 2026-09-01 to 2026-10-10 on the next canonical deploy. Reviewed against qnfo-ops COMPAT_FLIPS
# between the two dates: 2026-10-01 Durable Object eviction (no Durable Object here). worker.js has no node: import, no
# typeof process/Buffer branch and no timer id read as a number. /ops/deploy keeps the date only when /health answers.
# compat-advance: reviewed 2026-10-19
compatibility_date = "2026-10-10"
workers_dev = true
# charter-pillar: autonomy (CF-MODEL-EVAL-1)
#
# WHY THE PILLAR IS autonomy: the fleet's model choice must not depend on the owner
# noticing that Cloudflare shipped a model. This worker discovers the live catalog,
# benchmarks new models against the incumbents, and carries a winner onto the ladder
# and the roadmap without a human in the loop.
#
# BINDINGS: D1 + AI, and (AB-HARNESS-1) a service binding to qnfo-ai authenticated by props, not a key. It can read the
# fleet's registers and spend Workers AI neurons; it cannot deploy, cannot edit code, and holds no credential. The worst it
# can do when wrong is file a bad promotion issue, which the merge gate refuses.
#
# CADENCE (REGULAR, not once-a-day): every 6 hours at minute 17. The per-run model
# cap comes from cf_model_eval_config.max_models_per_run so throughput is tunable
# without a deploy, and a wall-clock deadline inside runLoop stops a run cleanly.
# CRON_RATE_GUARD-1: one fire per 6h, far under the guard's limit.
#
# traces are declared explicitly: the top-level [observability] switch enables logs
# only, and a worker that ships with no traces cannot be diagnosed after the fact.

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# limits-not-declared: an evaluation loop bounded by wall clock, not by CPU -- but a
# pathological model reply must not run to the platform wall.
[limits]
cpu_ms = 30000

[triggers]
crons = ["20 * * * *"]

[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# AB-HARNESS-1 (agent_issues 2828): the paired A/B quality harness calls the post-change model, and the judges, through
# qnfo-ai with pin_model true, so the answer measured is the one a worker would get. Same-account workers.dev fetch returns
# 404 from a Worker; a service binding is the fleet pattern. INTERNAL-CALLER-PROPS-1 (#1703): qnfo-ai authenticates the
# binding by ctx.props.caller, so no copy of the router key is created here (installed by qnfo-ops BINDING-PROPS-APPLY-1).
[[services]]
binding = "QNFO_AI"
service = "qnfo-ai"
props = { caller = "qnfo-model-eval" }
