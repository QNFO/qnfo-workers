name: apply-analyzer-exclusion-table

# SELFHEAL-EXCLUSION-TABLE-1 (issue 1376, 2026-09-29).
#
# WHY THIS WORKFLOW EXISTS: scripts/analyzer-exclusion-table-patch.py repairs
# telemetryAnalyze() in qnfo-ops/worker.js so the self-heal analyzer classifies
# failures with the SAME predicate as the tool_failures_24h view (the D1 table
# tool_error_exclusions, 25 patterns / 8 classes). The script was committed
# (a694991f) with NO workflow to invoke it -- ORPHANED-APPLIER-1, the exact
# defect class the sibling apply-selfheal-analyzer.yml header warns about.
# This workflow IS that execution path.
#
# THE DEFECT (verified live 2026-09-29): the analyzer hardcoded a TWO-pattern
# exclusion (meta NOT LIKE '%no such column%' / '%no such table%') while the
# authoritative classifier holds 25. Consequence: the self-heal loop's primary
# signal counted agent-authored input errors ("malformed JSON", "empty SQL",
# "unknown tool", "is not available", HTTP 5, SELFTEST-, C:/Users client-path
# violations) and the same-zone fetch artifact (#1190) as tool malfunction, so
# it filed tickets for non-defects.
#
# VERIFIED PRE-STATE (clone at 17101f0): VERSION 2.37.22-github409-retry,
# marker SELFHEAL-EXCLUSION-TABLE-1 count 0, old predicate present 2x,
# mirror byte-identical, applier RC=0 -> VERSION 2.37.23-analyzer-excl-table.
#
# VERSION-PIN-AGNOSTIC-1 (issue 1355): the preflight asserts the ANALYZER
# PROPERTY (marker + classifier join present), never a frozen version literal,
# so a stale pin cannot block a real fix (STALE-PREFLIGHT-1).
#
# DEPLOY: scripts/raw_put.py PUTs the CF API /content endpoint (code only,
# BINDING-PRESERVATION-1, fail-closed, and now deploy-guard lock+ledger wired).
# The applier writes worker.js AND its deployed-current mirror in one commit so
# mirror-guard stays green and the qnfo-fleet-control redeploy cron cannot
# revert the fix.
#
# NOTE commit messages are passed as single-line -m flags, never as an inline
# multi-line string: a multi-line git commit -m inside a run: | scalar puts
# continuation lines at column 1, terminates the scalar, and makes the whole
# workflow invalid YAML -- the documented defect that produced runs with zero
# jobs.

on:
  push:
    paths:
      - 'scripts/analyzer-exclusion-table-patch.py'
      - '.github/workflows/apply-analyzer-exclusion-table.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-analyzer-exclusion-table
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply patch (fail-closed)
        id: apply
        run: |
          set -euo pipefail
          python3 scripts/analyzer-exclusion-table-patch.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change produced (already applied)"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: ESM syntax gate (blocking)
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cp qnfo-ops/worker.js /tmp/excl-check.mjs
          node --check /tmp/excl-check.mjs
          echo "ESM parse OK"

      - name: Mirror parity for the patched pair (blocking)
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cmp qnfo-ops/worker.js qnfo-ops/deployed-current.worker.js
          echo "qnfo-ops source and mirror are byte-identical"

      - name: Commit and push (push-race retry)
        if: steps.apply.outputs.changed == 'true'
        env:
          BR: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "qnfo-selfheal-bot"
          git config user.email "ops@qnfo.org"
          git add -u
          if git diff --cached --quiet; then
            echo "nothing staged; exiting"
            exit 0
          fi
          git diff --cached --stat
          SUBJECT="fix(qnfo-ops): #1376 self-heal analyzer honours tool_error_exclusions"
          BODY="Issue 1376: telemetryAnalyze() hardcoded a two-pattern exclusion (meta NOT LIKE '%no such column%' / '%no such table%') while the authoritative classifier tool_error_exclusions holds 25 patterns across 8 classes, and the tool_failures_24h view already joins it. The analyzer therefore counted agent-authored input errors and already-classified transients as tool malfunction and filed tickets for non-defects. The analyzer now uses the same predicate as the view (NOT EXISTS over instr(meta,pattern) / instr(text,pattern)), so one classifier is the single source of truth and adding a pattern suppresses it in both with no code change. The applier writes worker.js and its deployed-current mirror in one commit so mirror-guard stays green and the fleet redeploy cron cannot revert the fix."
          FOOT="Co-authored-by: Chatbox <chatbox@chatboxai.com>"
          git commit -m "$SUBJECT" -m "$BODY" -m "$FOOT"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BR"; then
              echo "push OK on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed; refetching and rebasing"
            git fetch origin "$BR"
            if ! git rebase "origin/$BR"; then
              git rebase --abort || true
              git reset --hard "origin/$BR"
              python3 scripts/analyzer-exclusion-table-patch.py
              git add -u
              if git diff --cached --quiet; then
                echo "patch already present at origin; nothing to push"
                exit 0
              fi
              git commit -m "$SUBJECT" -m "$BODY" -m "$FOOT"
            fi
            sleep 5
          done
          echo "push failed after 5 attempts"
          exit 1

  deploy:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight - artifact must carry the exclusion-table fix (version-pin-agnostic)
        id: pre
        run: |
          set -euo pipefail
          VER="$(grep -o 'var VERSION = "[^"]*";' qnfo-ops/worker.js | head -1 | sed 's/^var VERSION = "//; s/";$//')"
          echo "artifact_version=$VER" >> "$GITHUB_OUTPUT"
          echo "artifact VERSION=$VER"
          test "$(grep -cF 'SELFHEAL-EXCLUSION-TABLE-1' qnfo-ops/worker.js || true)" -ge 1
          test "$(grep -cF 'tool_error_exclusions' qnfo-ops/worker.js || true)" -ge 1
          test "$(grep -cF 'instr(COALESCE' qnfo-ops/worker.js || true)" -ge 1
          cmp qnfo-ops/worker.js qnfo-ops/deployed-current.worker.js
          echo "preflight OK: analyzer joins tool_error_exclusions; mirrors byte-identical"

      - name: Deploy qnfo-ops (binding-preserving CF API /content PUT)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/raw_put.py qnfo-ops qnfo-ops/worker.js

      - name: Verify LIVE bundle carries the exclusion-table fix
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECT_VER: ${{ steps.pre.outputs.artifact_version }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/qnfo-ops/content" \
            -o /tmp/live-excl.js
          echo "live-bytes=$(wc -c < /tmp/live-excl.js)"
          echo "expected-version=$EXPECT_VER"
          test "$(grep -cF "$EXPECT_VER" /tmp/live-excl.js || true)" -ge 1
          test "$(grep -cF 'SELFHEAL-EXCLUSION-TABLE-1' /tmp/live-excl.js || true)" -ge 1
          test "$(grep -cF 'tool_error_exclusions' /tmp/live-excl.js || true)" -ge 1
          echo "VERIFIED: live qnfo-ops analyzer honours tool_error_exclusions"
