name: apply-404hint-list-1

# CF-WORKER-READ-404-HINT-LIST-1 -- residual gap in the #1382 fix.
# Applies scripts/patch-404hint-list-1.py (fail-closed, idempotent), commits the
# patched qnfo-ops bundle + mirror, deploys through scripts/raw_put.py
# (binding-preserving /content PUT, now guard-wired), then verifies the fix by
# grepping the DEPLOYED content via the CF API -- authoritative, not /health.
#
# Fires on push to its own paths, so writing this file triggers the run.

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-404hint-list-1.py"
      - ".github/workflows/apply-404hint-list-1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-404hint-list-1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch (fail-closed)
        run: |
          set -euo pipefail
          export REPO_ROOT="$GITHUB_WORKSPACE"
          python3 scripts/patch-404hint-list-1.py
          echo "--- post-state ---"
          echo "marker_list=$(grep -c 'CF-WORKER-READ-404-HINT-LIST-1' qnfo-ops/worker.js || true)"
          echo "new_wording=$(grep -c 'Pass an exact name from this list' qnfo-ops/worker.js || true)"
          echo "old_wording=$(grep -c 'Use an exact name from that list' qnfo-ops/worker.js || true)"

      - name: Commit patched bundle + mirror
        run: |
          set -euo pipefail
          git config user.name "qnfo-selfheal-bot"
          git config user.email "bot@qnfo.org"
          git add qnfo-ops/worker.js qnfo-ops/deployed-current.worker.js
          if git diff --cached --quiet; then
            echo "NO_CHANGES (already applied) - skipping commit"
            exit 0
          fi
          git commit -m "fix(qnfo-ops): 404 hint always returns real worker names (#1382 residual, CF-WORKER-READ-404-HINT-LIST-1)"
          git push origin HEAD:main

      - name: Deploy qnfo-ops (binding-preserving)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 scripts/raw_put.py qnfo-ops qnfo-ops/worker.js

      - name: Verify fix in DEPLOYED content (authoritative)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/qnfo-ops/content/v2"
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -s -m 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Accept: application/javascript" "$URL" || true)
            NEW=$(printf '%s' "$BODY" | grep -c 'Pass an exact name from this list' || true)
            MARK=$(printf '%s' "$BODY" | grep -c 'CF-WORKER-READ-404-HINT-LIST-1' || true)
            VER=$(printf '%s' "$BODY" | grep -o 'var VERSION = "[^"]*"' | head -1 || true)
            echo "attempt $i: new_wording=$NEW marker=$MARK $VER"
            if [ "$NEW" -ge 1 ] && [ "$MARK" -ge 1 ]; then
              echo "DEPLOY_VERIFIED"
              exit 0
            fi
            sleep 10
          done
          echo "DEPLOY_VERIFY_FAILED (another deploy may have overwritten /content - re-run this workflow)"
          exit 1
