name: identity-guard

# IDENTITY-GUARD-1 (2026-10-01, pillar reach)
#
# Live worker sources must not carry retired identity labels ("QNFO Research Collective", "Quniverse Research
# Foundation") or claims the public record does not support (patent portfolio, clearance-eligible, unlinked media,
# shifting publication counts, physics headline claims). docs/STRATEGY.md s2 is the wording; the owner's Identity doc
# (owner_docs identity) lists what failed a check. Comments, detector patterns and lines marked
# `identity-guard: allow` are skipped.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# GHA-AUDIT-1: a newer push to a PR cancels the superseded run; push runs are grouped per sha and never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  identity-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Identity lexicon guard
        run: python3 scripts/identity-guard.py .

      # Offline suites for the identity changes that ride the canonical deploy (node:sqlite needs Node 22):
      # PROFILE-SYNC-1 (qnfo-social).
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Bluesky profile sync offline suite (qnfo-social)
        run: node qnfo-social/profile-sync.test.mjs
