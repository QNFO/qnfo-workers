name = "qnfo-gateway"
main = "worker.js"
compatibility_date = "2026-08-01"


[observability]
enabled = true
head_sampling_rate = 1

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "qnfo-graph"
database_id = "a1954b92-d681-4d02-b1f6-f9a2eb4c265d"

[[d1_databases]]
binding = "LIVING_PAPER"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[r2_buckets]]
binding = "QNFO_BUCKET"
bucket_name = "qnfo"

# SCHOLAR-PDF-URL-1 (#1714): qnfo-pdf renders each paper to pdf/<slug>.pdf here (papers.pdf_path). The gateway serves it
# at /papers/<slug>.pdf when the paper's Zenodo record carries no PDF.
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "qnfo-releases"

# MATH-BROWSER-2 (#1890): the 06:00 cron samples five live paper pages through qnfo-pdf's internal /math-check
# (Browser Run + MathJax) and serves the report as browser_sample in /api/render-health.
[[services]]
binding = "PDF_SVC"
service = "qnfo-pdf"

# Secrets (wrangler secret put): SYNC_TOKEN, TURNSTILE_SECRET

[triggers]
crons = ["0 6 * * *"]
