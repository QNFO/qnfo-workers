name = "qnfo-email"
main = "worker.js"
compatibility_date = "2026-08-01"
# OWNER-CMD-OPS-522-1 (2026-09-30): same-zone subrequests (email handler on qnfo.org -> ops.qnfo.org) only reach
# another Worker with this flag; without it every owner command 522d (#1472). Applied by the deployers' declared-flag union.
compatibility_flags = ["global_fetch_strictly_public"]

# Bindings verified from live CF API 2026-09-22 (BINDING-PRESERVATION-1).
# This config was previously ABSENT from the repo, so every deploy had to carry
# the bindings + compatibility_date out-of-band; an omitted compatibility_date
# silently dropped the live value. Tracked here so the repo is the deploy source
# of truth (REPO-IS-DEPLOY-SOURCE-1).

# Native Email Routing send binding — tokenless (no API key needed).
send_email = [
  { name = "SEND_EMAIL" }
]



[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "AUDIT_DB"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# ITINERARY-INGEST-1 (#1881, charter pillar personal): the itinerary parser writes personal-life.events (lodging/travel rows
# the away gate and the brief read). Writes happen only for DMARC-verified booking-company or owner mail; see worker.js.
[[d1_databases]]
binding = "PERSONAL"
database_name = "personal-life"
database_id = "e8d6c61a-10b7-4086-b81e-9e6e85afa407"

# Daily inbound-digest cron. NOTE: qnfo-email is also invoked via the qnfo.org
# email-routing worker (fetch handler); this cron drives scheduled() ->
# sendInboundDigest(). Reminder dispatch lives in qnfo-calendar-intake.
# CRON-RATE-CEILING-1 (owner directive 2026-09-23): this declaration previously said
# "*/5 * * * *" while the LIVE schedule was already "0 7 * * *" -- a latent violation
# (288 fires/24h) that any wrangler deploy would have applied. Repo now matches LIVE.
[triggers]
crons = ["0 7 * * *"]

# Secrets (set via `wrangler secret put`, never committed):
#   GATEWAY_EMAIL_KEY   - AI Gateway key for reply drafting
#   INGEST_TOKEN        - /ingest auth
#   OPS_KEY             - ops command passthrough
