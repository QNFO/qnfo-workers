# DO-MIGRATION-NOTE-1 2026-09-22 (R3/F2): a `wrangler deploy --dry-run` validates
# client-side structure ONLY - it cannot prove the server accepts this migration. The
# class already exists (created via the API), so a real wrangler deploy may FAIL CLOSED
# (Cloudflare rejects a creating migration for an already-depended-on class). It never
# wipes. The operative deploy path remains scripts/raw_put.py (binding-preserving).

name = "qnfo-fleet-control"
# charter-pillar: autonomy   (QUNIVERSE-CHARTER-1: the governance kernel; see docs/QUNIVERSE-CHARTER.md)
main = "worker.js"
# COMPAT-ADVANCE-WAVE-2 (2026-10-12, metric workers_compat_date_behind, qnfo-ops COMPAT-DATE-DECLARED-APPLY-1): the date moves
# from 2026-09-08 to 2026-10-10 on the next canonical deploy. Reviewed against qnfo-ops COMPAT_FLIPS between the two dates:
# 2026-08-04 nodejs_compat default on: this worker already declares the flag, so nothing changes;
# 2026-10-01 Durable Object eviction (pending I/O keeps this worker's Durable Object in memory until it completes). /ops/deploy reads /health through its
# COMPAT-HEALTH-BINDINGS-2 binding before the upload, keeps the date only when /health answers with the deployed VERSION
# and otherwise restores the previous date (deployment_history compat-restore).
# compat-advance: reviewed 2026-10-12
compatibility_date = "2026-10-10"
# FLEET-PROBE-1042-1 (2026-09-30): without global_fetch_strictly_public a subrequest from this worker
# to another *.q08.workers.dev worker is Cloudflare error 1042 (same-zone), served as HTTP 404. Measured:
# fleet_state_snapshots recorded workers_up=3/38 because only custom-domain probes succeeded.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

# MERGE WAVE A (2026-09-11): qnfo-fleet-advisor + qnfo-fleet-calibrator + qnfo-fleet-deploy merged
# into ONE worker (3 -> 1). Subsystems dispatched by path: /advisor/*, /cal/*, else deploy control plane.
# Cron dispatch: "*/20 * * * *" -> advisor; "0 3|0 4 1|30 3 1" -> calibrator; else -> deploy.
# Canonical deploy: CF API multipart (as-built 2026-09-11). This toml is the spec; wrangler deploy needs
# verify against live bindings (DEPLOY-VERIFY-VERSION-1).


[observability]
enabled = true
head_sampling_rate = 1

# OBSERVABILITY-TRACES-1 (2026-10-12, Workers best practices): logs stay at 100%; traces are sampled, because this worker's
# hourly ticks make hundreds of subrequests each.
[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[triggers]
# REMEDIATION-2X-1 (0.26.2, owner directive 2026-10-13): the 20-minute slot runs every 10 minutes (CRON-RATE-CEILING-1 floor).
crons = ["*/10 * * * *", "0 3 * * *", "0 4 1 * *", "30 3 * * 1", "0 * * * *"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "AUDIT_DB"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "DB_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# PORTFOLIO-LOOP-1 (QNFO-PORTFOLIO-1, 2026-10-01): program_registry (WBS codes -> github_repo) lives in portfolio-state;
# the portfolio loop joins every QNFO repository to its WBS codes through this binding. The canonical deploy installs
# declared bindings; the loop degrades to "wbs: no PORTFOLIO binding" if it is absent.
[[d1_databases]]
binding = "PORTFOLIO"
database_name = "portfolio-state"
database_id = "d80fdf2a-0a60-45a3-968b-2907ce806dcd"

[[r2_buckets]]
binding = "R2_AUDIT"
bucket_name = "qnfo-audit"

[[r2_buckets]]
binding = "CANONICAL"
bucket_name = "qnfo-canonical"

[[kv_namespaces]]
binding = "KV_CAL"
id = "d3768b93a76640be83151b00a8b42717"

[[services]]
binding = "SVC_PERSONAL_API"
service = "personal-api"
environment = "production"

[[services]]
binding = "SVC_QNFO_AI"
service = "qnfo-ai"
environment = "production"
# INTERNAL-CALLER-PROPS-1 (#1703): qnfo-ai authenticates this binding by ctx.props.caller, so a router key
# rotation no longer strands this worker. Installed by qnfo-ops BINDING-PROPS-APPLY-1 on the canonical deploy.
props = { caller = "qnfo-fleet-control" }

[[services]]
binding = "SVC_QNFO_INFRA"
service = "qnfo-infra"

# PDF-BACKLOG-RELAY-1 (0.19.1): the */20 tick relays qnfo-pdf POST /backlog/tick while its own cron is silent (SCHOLAR-PDF-ALL-1, #2410).
[[services]]
binding = "SVC_QNFO_PDF"
service = "qnfo-pdf"
environment = "production"

[[services]]
binding = "SVC_QNFO_INTENT"
service = "qnfo-intent-orchestrator"
environment = "production"

# DEPLOY-DRIFT-CF-1 (0.26.0): the */20 tick deploys a worker whose main VERSION has been ahead of live for 45 minutes, with no
# canonical-deploy run active, through qnfo-ops POST /ops/deploy (the deploy's second runner; spof_registry 'GitHub Actions').
# qnfo-ops authenticates this binding by props.caller (OPS-INTERNAL-CALLER-1, #1703), never by a copy of the router key.
# Installed by qnfo-ops BINDING-PROPS-APPLY-1 on the canonical deploy.
[[services]]
binding = "SVC_QNFO_OPS"
service = "qnfo-ops"
environment = "production"
props = { caller = "qnfo-fleet-control" }

# FleetAdvisor Durable Object (advisor + calibration subsystem; stateless -- uses no
# state.storage). LIVE namespace: qnfo-fleet-control_FleetAdvisor (class FleetAdvisor,
# script qnfo-fleet-control). This binding is what made the toml binding-INCOMPLETE before
# 2026-09-19: live had 24 bindings, the toml declared 17, so a wrangler deploy would have
# SILENTLY DROPPED the DO + 6 secrets (BINDING-PRESERVATION-1). Added 2026-09-19.
# VERIFIED 2026-09-19: the live namespace is SQLite-backed (use_sqlite:true ->
# new_sqlite_classes is the CORRECT migration type; every DO namespace in the account is
# use_sqlite:true). The namespace was created out-of-band (raw content API, as-built
# 2026-09-11), so the first wrangler deploy applies this Create migration; if CF rejects it
# for the already-existing class the deploy FAILS CLOSED (no change). OPERATIVE DEPLOY PATH
# remains scripts/raw_put.py (binding-preserving /content PUT -- no migration, no risk).

[vars]
ADVISOR_ITERS = "3"
ADVISOR_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
CF_ACCOUNT_ID = "edb167b78c9fb901ea5bca3ce58ccc4b"
PROBE_WORKERS = "qnfo-ai,qnfo-ops,qnfo-research-exec,qnfo-error-selfheal,qnfo-fleet-control,qnfo-social,qnfo-intent-orchestrator,qnfo-cloud-ops,qnfo-gateway,qnfo-infra"
REVIEW_MODEL = "@cf/openai/gpt-oss-120b"

# Secrets (set via CF API; values in credential stores / rotated 2026-09-11):
# CF_API_TOKEN, CF_DEPLOY_TOKEN, DEPLOY_ADMIN_TOKEN, ADVISOR_TOKEN, SELFHEAL_TOKEN, RUN_SECRET,
# GITHUB_TOKEN (LAND-CODE-FIX-1 2026-09-27: commits deployed-ahead fixes back to QNFO/qnfo-workers main)

# FleetAdvisor DO (AUDIT-REMEDIATE-1 2026-09-22; verified vs live CF bindings).
# The class already exists (created via raw_put); see the migration note above.
[[durable_objects.bindings]]
name = "FleetAdvisor"
class_name = "FleetAdvisor"

[exports.FleetAdvisor]
type = "durable-object"
storage = "sqlite"
