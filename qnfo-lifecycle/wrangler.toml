name = "qnfo-lifecycle"
main = "worker.js"
compatibility_date = "2026-08-10"
# LIFECYCLE-PING-1042-1 (2026-10-05, agent_issues 1994): runPing and runSync fetch *.q08.workers.dev; without
# global_fetch_strictly_public that subrequest is Cloudflare error 1042 (same zone), served as HTTP 404. Measured:
# 150 "[lifecycle] PING FAIL ... HTTP 404" rows in worker_logs 2026-10-02..05 while both URLs answer 200 from outside.
# Same fix as FLEET-PROBE-1042-1 in qnfo-fleet-control/wrangler.toml.
compatibility_flags = ["global_fetch_strictly_public"]


[observability]
enabled = true
head_sampling_rate = 1

[ai]
binding = "AI"

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "qnfo-backups"

[[d1_databases]]
binding = "IPATENT_DB"
database_name = "ipatent-db"
database_id = "19cc87d6-4207-477c-bf8c-94fb231b8965"

[[d1_databases]]
binding = "LIVING_PAPER"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[vectorize]]
binding = "PAPER_VZ"
index_name = "qwav-research-v2"

[[d1_databases]]
binding = "PORTFOLIO_STATE"
database_name = "portfolio-state"
database_id = "d80fdf2a-0a60-45a3-968b-2907ce806dcd"

[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "QNFO_GRAPH"
database_name = "qnfo-graph"
database_id = "a1954b92-d681-4d02-b1f6-f9a2eb4c265d"

[triggers]
# CRON-CONSOLIDATE-1 (2026-09-27): 8 -> 5 crons. The four lightweight daily D1 tasks
# (lifecycle 0 3, memory-maintain 0 4, ula-check 0 7, drift-audit) are bundled into the
# single 0 3 fire. The former "9 6 * * *" was DEAD (handler keyed on "0 6 * * *").
# CRON-SINGLE-TRIGGER-1 (2026-10-02, #1785): ONE hourly trigger; worker.js CRON_TABLE holds the former list
# (0 * * * *, 0 0 1 * *, 0 3 * * *, 0 5 * * *, 0 8 * * 1) and runs each entry in the hour it fired.
crons = ["0 * * * *"]

# Secrets (wrangler secret put): CF_API_TOKEN
