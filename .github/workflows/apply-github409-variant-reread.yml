name: apply-github409-variant-reread

# GITHUB-409-VARIANT-RETRY-GAP-1 execution path (issue 1396, 2026-09-29).
#
# WHY THIS WORKFLOW EXISTS: scripts/github409-variant-reread-patch.py repairs the retry
# loop inside qnfo-ops's own github_file_write tool. A fix that lives only in the repo
# with no execution path to production repeats ORPHANED-APPLIER-1, which this session has
# already hit twice (an applier committed to main that nothing ever runs; a workflow whose
# version pin went stale so its deploy job silently skipped -- issues 1355, 1383, 1394).
#
# DEFECT (issue 1396, MEDIUM)
#   githubFileWrite()'s 409/422 retry did `if (!curSha) break;` after re-reading the file
#   sha. That re-read is the same api.github.com that rate-limits this worker's egress IP
#   (a 403 from api.github.com was observed from this egress during the session), so when
#   the re-read was throttled the retry aborted on its first iteration and the caller saw
#   the ORIGINAL 409 with attempts=1 -- the retry existed but could not engage for that
#   payload shape. Two further fragilities: the status test used strict === against a
#   number, so a string status would disable both the retry and the success path; and a
#   failed re-read left body.sha stale, guaranteeing the one retry that did happen would
#   lose again.
#
# FIX
#   The sha re-read is bounded-retried in its own right (3 attempts, linear backoff); a
#   failed re-read no longer aborts the loop; status comparison is numeric via statusOf();
#   and the result reports sha_reread_failed so the audit log can separate "no conflict"
#   from "conflict we could not resolve because the re-read was throttled".
#
# VERSION-PIN-AGNOSTIC-1: the preflight asserts the FIXED PROPERTIES and the prior
#   invariants, never a frozen version literal. The applier itself locates the version
#   line by pattern -- this repository regressed a version string once today
#   (2.37.25 -> 2.37.24), so a frozen literal would fail closed on a bump that is not
#   this applier's business.
#
# PUSH-RACE-RETRY-1: the commit-back rebases onto the live branch and retries, because a
#   bare `git push` in this repo is the exception that loses, not the norm.
#
# DEPLOY: scripts/raw_put.py PUTs the CF API /content endpoint (code only, live bindings
#   preserved, fail-closed, and it appends a deployment_history row). The applier writes
#   worker.js AND its deployed-current mirror in one commit so mirror-guard stays green.
#
# NOTE the commit message is passed as single-line -m flags, never as an inline
# multi-line string: a multi-line commit message inside a `run: |` scalar puts
# continuation lines at column 1, terminates the scalar, and invalidates the YAML.

on:
  push:
    paths:
      - 'scripts/github409-variant-reread-patch.py'
      - '.github/workflows/apply-github409-variant-reread.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-github409-variant-reread
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply patch (fail-closed)
        id: apply
        run: |
          set -euo pipefail
          python3 scripts/github409-variant-reread-patch.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change produced (already applied)"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: ESM syntax gate (blocking)
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cp qnfo-ops/worker.js /tmp/gh409v-check.mjs
          node --check /tmp/gh409v-check.mjs
          echo "ESM parse OK"

      - name: Mirror parity for the patched pair (blocking)
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cmp qnfo-ops/worker.js qnfo-ops/deployed-current.worker.js
          echo "qnfo-ops source and mirror are byte-identical"

      - name: Commit and push (PUSH-RACE-RETRY-1)
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "qnfo-selfheal-bot"
          git config user.email "ops@qnfo.org"
          git add -u
          if git diff --cached --quiet; then
            echo "nothing staged; exiting"
            exit 0
          fi
          git diff --cached --stat
          SUBJECT="fix(qnfo-ops): #1396 github_file_write retry no longer aborts on a throttled sha re-read"
          BODY="githubFileWrite()'s 409/422 retry did 'if (!curSha) break;' after re-reading the file sha. That re-read is the same api.github.com that rate-limits this worker's egress IP, so a throttled re-read aborted the retry on its first iteration and the caller saw the ORIGINAL 409 with attempts=1. The re-read is now bounded-retried (3 attempts, linear backoff), a failed re-read no longer aborts the loop, status comparison is numeric via statusOf() so a string status cannot disable both the retry and the success path, and the result reports sha_reread_failed. Both worker.js and its deployed-current mirror are written so the fleet redeploy cron cannot revert the fix."
          FOOT="Co-authored-by: Chatbox <chatbox@chatboxai.com>"
          git commit -m "$SUBJECT" -m "$BODY" -m "$FOOT"
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git rebase --autostash "origin/$BRANCH" || git rebase --abort || true
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected on attempt $i (concurrent writer); retrying"
            sleep 5
          done
          echo "::error::push failed after 5 attempts - fix NOT applied"
          exit 1

  deploy:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight - artifact must carry the reread fix (version-pin-agnostic)
        id: pre
        run: |
          set -euo pipefail
          VER="$(grep -o 'var VERSION = "[^"]*";' qnfo-ops/worker.js | head -1 | sed 's/^var VERSION = "//; s/";$//')"
          echo "artifact_version=$VER" >> "$GITHUB_OUTPUT"
          echo "artifact VERSION=$VER"
          test "$(grep -cF 'GITHUB-409-VARIANT-RETRY-GAP-1' qnfo-ops/worker.js || true)" -ge 1
          test "$(grep -cF 'sha_reread_failed' qnfo-ops/worker.js || true)" -ge 1
          test "$(grep -cF 'statusOf' qnfo-ops/worker.js || true)" -ge 1
          test "$(grep -cF 'for (let g = 0; g < 3 && !curSha; g++)' qnfo-ops/worker.js || true)" -ge 1
          test "$(grep -cF 'if (!curSha) break;' qnfo-ops/worker.js || true)" -eq 0
          test "$(grep -cF 'GITHUB-409-RETRY-1' qnfo-ops/worker.js || true)" -ge 1
          test "$(grep -cF 'sha_retried' qnfo-ops/worker.js || true)" -ge 1
          test "$(grep -cF 'conflict_status' qnfo-ops/worker.js || true)" -ge 1
          test "$(grep -cF '_errs >= 25' qnfo-ops/worker.js || true)" -ge 1
          cmp qnfo-ops/worker.js qnfo-ops/deployed-current.worker.js
          cp qnfo-ops/worker.js /tmp/gh409v-deploy.mjs
          node --check /tmp/gh409v-deploy.mjs
          echo "preflight OK: reread fix present, prior invariants intact, mirror parity green"

      - name: Deploy to Cloudflare (binding-preserving /content PUT)
        run: python3 scripts/raw_put.py qnfo-ops qnfo-ops/deployed-current.worker.js

      - name: Verify live worker reports the new artifact version
        run: |
          set -euo pipefail
          sleep 12
          EXPECTED="$(grep -o 'var VERSION = "[^"]*";' qnfo-ops/worker.js | head -1 | sed 's/^var VERSION = "//; s/";$//')"
          echo "expected live version: $EXPECTED"
          python3 - "$EXPECTED" <<'PY'
          import json, sys, urllib.request
          expected = sys.argv[1]
          req = urllib.request.Request("https://ops.qnfo.org/health", headers={"User-Agent": "qnfo-ci"})
          with urllib.request.urlopen(req, timeout=30) as r:
              body = json.loads(r.read().decode("utf-8"))
          live = str(body.get("version", ""))
          print("live version: %s" % live)
          if live != expected:
              raise SystemExit("LIVE MISMATCH: expected %s, got %s" % (expected, live))
          print("LIVE CONFIRMED: ops.qnfo.org reports %s" % live)
          PY
