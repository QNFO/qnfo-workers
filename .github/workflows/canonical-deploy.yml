name: canonical-deploy

# CANONICAL-DEPLOY-AUTO-1 (2026-09-29). Issues #1406, #1442, #1443, #1390, #1448.
#
# WHY THIS WORKFLOW EXISTS
#   Every automated deploy in this repo went through scripts/raw_put.py, which
#   performs exactly ONE Cloudflare call (PUT /content) and therefore:
#     1. never acquires the deploy-guard lock  -> the mutation is classified
#        DEPLOY-UNCOORDINATED-DEPLOY (issues #1442, #1443, #1340-#1343)
#     2. never writes a fleet_deploys ledger row -> DEPLOY-UNLOGGED-MUTATION
#     3. never PUTs /schedules -> crons declared in wrangler.toml are INERT
#        (ledger notes read "schedules=FAILED" on nearly every raw_put.py row)
#   scripts/canonical_deploy.py is the repo's own canonical path: it calls
#   POST https://ops.qnfo.org/ops/deploy, which performs the ordered sequence
#   lock acquire -> PUT /content -> live verify -> guard /ledger -> PUT /schedules.
#   Nothing in .github/workflows invoked it. This workflow does.
#
# WHAT IT DOES
#   On a push to main that touches any worker source or wrangler config, it
#   resolves the set of CHANGED worker directories, maps each to its declared
#   worker name, and canonical-deploys exactly those workers. Blast radius is
#   one push diff; it never sweeps the whole fleet unless explicitly asked.
#
# FAIL-CLOSED
#   * an empty OPS_ROUTER_AUTH_KEY is an ERROR, not a silent skip
#   * any per-worker non-zero exit sets the job exit code to 1
#   * a duplicate-name directory (name ending -legacy-dup, issue #1384) is
#     refused rather than deployed, because two configs resolving to one
#     Cloudflare script is exactly how the canonical worker gets clobbered
#
# STYLE CONSTRAINTS (the classes this file must not join)
#   * WORKFLOW-YAML-LINT-1: every step name below is colon-free, because an
#     unquoted colon in a step name made a sibling workflow unparseable and
#     GitHub created zero-job runs with no log.
#   * No heredocs and no inline python inside run blocks, so YAML indentation
#     can never be read as script indentation.

on:
  push:
    branches: [main]
    paths:
      - "**/worker.js"
      - "**/wrangler.toml"
      - "deploy-targets.txt"
      - ".github/workflows/canonical-deploy.yml"
  workflow_dispatch:
    inputs:
      workers:
        description: "space separated worker names to deploy (empty means only workers changed in this push)"
        required: false
        default: ""
      all:
        description: "set true to deploy every worker listed in deploy-targets.txt"
        required: false
        default: "false"
      dry_run:
        description: "set true to print the plan without calling Cloudflare"
        required: false
        default: "false"

permissions:
  contents: write
  actions: read

concurrency:
  group: canonical-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve the target worker set
        id: targets
        env:
          IN_ALL: ${{ github.event.inputs.all }}
          IN_WORKERS: ${{ github.event.inputs.workers }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
          EV_BEFORE: ${{ github.event.before }}
          EV_AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          : > /tmp/targets.txt
          if [ "${IN_ALL:-false}" = "true" ]; then
            echo "mode=manifest"
            awk 'NF && $1 !~ /^#/ {print $1" "$2}' deploy-targets.txt >> /tmp/targets.txt
          elif [ -n "${IN_WORKERS:-}" ]; then
            echo "mode=explicit"
            # WORKER-RESURRECTION-GUARD-1: an explicitly named worker is a stated intent, so it may be created.
            # FOLDED-RETIRED-EXPLICIT-GUARD-1 (#254): the FOLDED/RETIRED markers were honoured only in push-diff mode,
            # so an explicit dispatch for qnfo-fleet-calibrator (folded into qnfo-fleet-control) recreated the retired
            # worker with its crons (run 36844766144). A marked directory is never deployed, named explicitly or not.
            for w in $IN_WORKERS; do
              if [ -f "$w/FOLDED" ] || [ -f "$w/RETIRED" ]; then echo "refuse $w (FOLDED/RETIRED marker: $(head -1 "$w/FOLDED" "$w/RETIRED" 2>/dev/null | head -1))"; continue; fi
              echo "$w $w/worker.js create" >> /tmp/targets.txt
            done
          else
            echo "mode=push-diff"
            if [ -z "${EV_BEFORE:-}" ] || [ "$EV_BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "no usable push base commit, nothing to resolve"
            else
              # DEPLOY-BASE-LAST-SUCCESS-1 (2026-10-01): GitHub keeps one PENDING run per concurrency group, so a burst of
              # merges cancels the middle run (cancel-in-progress false only protects the RUNNING one). The next run then
              # diffed only its own push and the middle commit's workers never deployed (run 36854646057, PR 305: dashboard,
              # social, gateway stayed on the old versions). The base is the head of the last successful push-mode run when
              # that commit is an ancestor of this push's base, so the set only ever widens and a cancelled or skipped
              # commit rides the next run.
              BASE="$EV_BEFORE"
              LAST_OK=$(gh run list -R "$GITHUB_REPOSITORY" --workflow canonical-deploy.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha' 2>/dev/null || true)
              if [ -n "$LAST_OK" ] && [ "$LAST_OK" != "null" ] && git merge-base --is-ancestor "$LAST_OK" "$EV_BEFORE" 2>/dev/null; then
                BASE="$LAST_OK"
              fi
              echo "diff base $BASE (push before $EV_BEFORE, last successful push deploy ${LAST_OK:-none})"
              git diff --name-only "$BASE" "$EV_AFTER" > /tmp/changed.txt || true
              # WORKER-RESURRECTION-GUARD-1 (2026-10-01): only a worker.js ADDED in this push may CREATE a worker. Touching an
              # existing directory must never resurrect a retired worker (qnfo-agent-ws was recreated by a wrangler-only push).
              git diff --name-only --diff-filter=A "$BASE" "$EV_AFTER" > /tmp/added.txt || true
              awk -F/ '/\/worker\.js$/ || /\/wrangler\.toml$/ {print $1}' /tmp/changed.txt | sort -u > /tmp/dirs.txt
              while read -r d; do
                [ -z "$d" ] && continue
                [ -f "$d/worker.js" ] || continue
                [ -f "$d/wrangler.toml" ] || continue
                n=$(grep -m1 -E '^[[:space:]]*name[[:space:]]*=' "$d/wrangler.toml" | sed -E 's/.*"([^"]+)".*/\1/')
                if [ -z "$n" ]; then echo "skip $d (no declared name)"; continue; fi
                case "$n" in *-legacy-dup) echo "refuse $d (duplicate-name directory, issue 1384)"; continue;; esac
                # CANONICAL-SKIP-CONTAINERS-1 (2026-09-30): /ops/deploy refuses container workers on
                # purpose ("CONTAINER-CONFIG-DROPPED-1: ... is a container worker", HTTP 502, run
                # 36732337041) because a /content PUT drops the [[containers]] config. Selecting one
                # here made every change under qnfo-containers-pilot/ turn this workflow red for a
                # refusal that is the guard working. They ship through deploy-containers-pilot.yml /
                # restore-container-config-1485.yml (wrangler), so skip them in push-diff mode.
                # WORKER-FOLD-SKIP-1 (2026-10-01): a FOLDED marker means the worker's duties now live inside other
                # workers (qnfo-autopilot, notes-intake); deploying the old directory would recreate a retired worker.
                if [ -f "$d/FOLDED" ]; then echo "skip $d (FOLDED: $(head -1 "$d/FOLDED"))"; continue; fi
                if [ -f "$d/RETIRED" ]; then echo "skip $d (RETIRED: $(head -1 "$d/RETIRED"))"; continue; fi
                # WRANGLER-ONLY-SKIP-1 (2026-10-01, watchdog issue 254): /ops/deploy PUTs /content and only PRESERVES bindings that
                # already exist on the live worker, so a worker that has never been deployed and declares D1/R2/KV/Vectorize bindings
                # gets CF API 400 (qnfo-fleet-calibrator, run 36842708566). Such a worker needs its first deploy through wrangler; a
                # WRANGLER-ONLY marker (first line = reason) keeps it out of this push-diff set until that has happened.
                if [ -f "$d/WRANGLER-ONLY" ]; then echo "skip $d (WRANGLER-ONLY: $(head -1 "$d/WRANGLER-ONLY"))"; continue; fi
                if grep -q '^\[\[containers\]\]' "$d/wrangler.toml"; then echo "skip $d (container worker: canonical /content deploy refuses it by design; deployed by deploy-containers-pilot / restore-container-config-1485)"; continue; fi
                if grep -qx "$d/worker.js" /tmp/added.txt; then echo "$n $d/worker.js create" >> /tmp/targets.txt; else echo "$n $d/worker.js" >> /tmp/targets.txt; fi
              done < /tmp/dirs.txt
            fi
          fi
          sort -u /tmp/targets.txt -o /tmp/targets.txt || true
          echo "--- resolved targets ---"
          cat /tmp/targets.txt || true
          echo "count=$(wc -l < /tmp/targets.txt | tr -d ' ')"

      - name: Deploy through the canonical path
        id: deploy
        env:
          OPS_ROUTER_AUTH_KEY: ${{ secrets.OPS_ROUTER_AUTH_KEY }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -uo pipefail
          if [ ! -s /tmp/targets.txt ]; then
            echo "NO_TARGETS nothing to deploy"
            exit 0
          fi
          if [ -z "${OPS_ROUTER_AUTH_KEY:-}" ]; then
            echo "::error::OPS_ROUTER_AUTH_KEY is not configured - the canonical path cannot run and this gate refuses to no-op"
            exit 1
          fi
          DRY=""
          if [ "${IN_DRY:-false}" = "true" ]; then DRY="--dry-run"; fi
          fail=0
          while read -r name path create; do
            [ -z "$name" ] && continue
            CR=""
            if [ "${create:-}" = "create" ]; then CR="--allow-create"; fi
            echo "=== canonical deploy $name from $path $DRY $CR"
            if python3 scripts/canonical_deploy.py --worker "$name" --path "$path" $DRY $CR; then
              echo "OK $name"
            else
              echo "::error::canonical deploy failed for $name"
              fail=1
            fi
          done < /tmp/targets.txt
          echo "deploy_fail=$fail"
          exit $fail

      - name: Write the ci-status artifact
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p ci-status
          printf '{"workflow":"canonical-deploy","issue":"1406 1442 1443 1390","head":"%s","ts":"%s"}\n' \
            "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci-status/canonical-deploy.json
          cat ci-status/canonical-deploy.json

      - name: Upload the ci-status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-deploy-status
          path: ci-status/canonical-deploy.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit the ci-status artifact back
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -uo pipefail
          git config user.name "qnfo-selfheal-bot"
          git config user.email "bot@qnfo.org"
          # ARTIFACT-PUSH-CONFLICT-1: snapshot re-apply, never a rebase conflict (was: run 36760796833).
          git add ci-status/canonical-deploy.json
          bash scripts/push_artifact.sh "ci(status): canonical-deploy [skip ci]" ci-status/canonical-deploy.json || true
