name: attach-lifecycle-custom-domain

# ATTACH-LIFECYCLE-CUSTOM-DOMAIN-1 (agent_issues #1517), 2026-09-30.
#
# WHY A DEDICATED WORKFLOW AND NOT AN APPLIER UNDER scripts/*patch*.py
# -------------------------------------------------------------------
# apply-pending-patches.yml owns scripts/*patch*.py and deploys changed workers. This
# change is NOT a worker edit -- it is an account-level API mutation (Workers custom
# domain). Running it under the applier would misreport it as a code patch and give it
# no verification of its own. Instead this mirrors the proven self-triggering pattern
# already used by lifecycle-sot-and-deploy.yml: `push` on this file (and its script)
# starts its own first run, so no dispatch credential is required -- the GITHUB_TOKEN
# available to the ops endpoint cannot dispatch workflows.
#
# ATTACH-DOMAIN-OBSERVABLE-1 (added 2026-09-30 by qnfo-ops)
# ---------------------------------------------------------
# v1 ran the script and nothing else. A failed run therefore left NO durable trace:
# deployment_history had zero custom_domain rows, no ci-status artifact existed, and
# the Actions log API is not reachable from the ops endpoint (unauthenticated
# api.github.com answers 403 rate-limited from the shared egress IP). The blocker was
# unreadable, not merely unfixed. v2 commits the script's JSON artifact back to main
# on every outcome, so the exact Cloudflare status and error body are always
# recoverable with a plain repo read.
#
# FAILURE-ARTIFACT-LOSS-1: the script writes ci-status/attach-lifecycle-custom-domain.json
# on EVERY exit path, so a run that lands nothing is still visible.
# COMMITBACK-PUSH-RACE-1 / the 409 class: commit-back retries with pull --rebase
# --autostash because fleet agents push every few minutes.
# SILENT-LANDING-LOSS-1: commit-back is fail-loud; a lost landing goes red.
# WORKFLOW-YAML-LINT-1: every step name below is colon-free.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-lifecycle-custom-domain.yml'
      - 'scripts/attach-lifecycle-custom-domain.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: attach-lifecycle-custom-domain
  cancel-in-progress: false

jobs:
  attach-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the idempotent fail-closed attach script
        id: attach
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          rc=0
          python3 scripts/attach-lifecycle-custom-domain.py || rc=$?
          echo "attach_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "ATTACH_RC=$rc"
          exit 0

      - name: Echo the attach result artifact
        run: |
          set -uo pipefail
          if [ -f ci-status/attach-lifecycle-custom-domain.json ]; then
            cat ci-status/attach-lifecycle-custom-domain.json
          else
            echo "NO_ARTIFACT_WRITTEN"
          fi

      - name: Commit the attach result back to main (race-safe)
        id: commitback
        run: |
          set -uo pipefail
          git config user.name "qnfo-selfheal-bot"
          git config user.email "bot@qnfo.org"
          git add -A ci-status/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "ci(attach-domain): record ATTACH-LIFECYCLE-CUSTOM-DOMAIN-1 result [skip ci]"
          for i in 1 2 3 4 5; do
            echo "commit-back attempt $i"
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "PUSH_OK attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "PUSH_FAILED after 5 attempts"
          exit 1
