# DO-MIGRATION-NOTE-1 2026-09-22 (R3/F2): a `wrangler deploy --dry-run` validates
# client-side structure ONLY - it cannot prove the server accepts this migration. The
# class already exists (created via the API), so a real wrangler deploy may FAIL CLOSED
# (Cloudflare rejects a creating migration for an already-depended-on class). It never
# wipes. The operative deploy path remains scripts/raw_put.py (binding-preserving).

name = "qnfo-agent-orchestrator"
main = "worker.js"
compatibility_date = "2026-08-10"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "AGENT_TASK"
class_name = "AgentTask"

# AgentTask class already exists (created via API, not a wrangler migration).
# Binding-only: a Create migration for an existing class is rejected by CF.

[ai]
binding = "AI"

[[d1_databases]]
binding = "LIVING_PAPER"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[vectorize]]
binding = "PAPER_VZ"
index_name = "qwav-research-v2"

[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "QNFO_GRAPH"
database_name = "qnfo-graph"
database_id = "a1954b92-d681-4d02-b1f6-f9a2eb4c265d"

[[r2_buckets]]
binding = "QNFO_PROJECTS"
bucket_name = "qnfo-projects"

# Secrets (wrangler secret put): DISPATCH_TOKEN, GITHUB_TOKEN, SYNC_TOKEN, TEST_TOKEN, ZENODO_TOKEN
