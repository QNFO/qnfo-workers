name: apply-restore-container-config-bindings

# CONTAINER-CONFIG-RESTORE-5-BINDINGS (2026-09-29, issues #1485 / #1487).
#
# WHY THIS WORKFLOW EXISTS -- the last mile that four prior attempts never reached.
#   qnfo-containers-pilot's container config was destroyed at 2026-09-29T19:30:35.100Z by
#   qnfo-ops:cf_worker_deploy (deployment_history id 172), which rebuilt upload metadata
#   from GET /bindings; [[containers]] is SCRIPT-LEVEL metadata, not a binding, so it was
#   silently dropped. First container.error landed 8 seconds later (19:30:43.591Z):
#   "Cannot read properties of undefined (reading 'running')".
#
#   MEASURED CHAIN OF FAILED RESTORES (this is the whole point of the file):
#     restore-3 (scripts/restore_container_config.py)
#       sent {main_module, containers, compatibility_date} and NO `exports`
#       -> PUT /content HTTP 400, code 100402
#          [provisioned_class_missing_from_config] class 'ShellContainer' has a
#          provisioned DO namespace but is not declared in `exports`
#     restore-4 (scripts/restore_container_config_exports.py)
#       added `exports` -> PUT /content HTTP 200 at 19:45:06Z (ci-status/
#       restore-container-config-1485.json), BUT sent NO `bindings` on the stated
#       assumption that "/content preserves live bindings" (BINDING-PRESERVATION-1 by
#       omission). THAT ASSUMPTION IS FALSE -- PUT /content REPLACES the script.
#       Measured after: cf_worker_bindings -> count 1, only {secret_text PILOT_TOKEN}.
#       The D1 binding AUDIT and the Durable Object binding SHELL_CONTAINER were DELETED,
#       and the runtime error moved to "reading 'idFromName'" (env.SHELL_CONTAINER
#       undefined). Container tools still returned HTTP 500.
#
# WHAT THIS WORKFLOW DOES
#   Runs scripts/restore_container_config_bindings.py, which PUTs /content with metadata
#   carrying ALL FOUR fields that are individually required:
#       bindings      [{d1 AUDIT}, {durable_object_namespace SHELL_CONTAINER}]
#       keep_bindings ["secret_text"]        -> preserves PILOT_TOKEN's value
#       exports       {ShellContainer: {type: durable-object, storage: sqlite}}
#       containers    [{class_name, image, instance_type, max_instances}]
#   and fails closed (exit 3, no mutation) if wrangler.toml lacks the containers, D1 or
#   DO-binding declarations, if /settings is unreadable, if the PUT != 200, or if any
#   binding or the containers block is still absent afterwards.
#
# AUTHORITATIVE VERIFICATION
#   /health CANNOT detect this outage class -- it is served by the top-level fetch and
#   never touches ctx.container. That false green is why earlier "successful" runs were
#   meaningless. The real signal is /status, which reaches the Durable Object; it is
#   probed here when PILOT_TOKEN is configured. A ci-status artifact is ALWAYS published
#   so "ran and failed" stays distinguishable from "never ran".
#
# CI-TRIGGER-SKIP-1: this workflow never writes [skip ci] in a commit it needs to trigger.
# STALE-PREFLIGHT-1: no gate here pins a version literal; gates assert properties.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-restore-container-config-bindings.yml'
      - 'scripts/restore_container_config_bindings.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-restore-container-config-bindings
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: assert the containers + bindings blocks are present in wrangler.toml
        run: |
          set -euo pipefail
          f=qnfo-containers-pilot/wrangler.toml
          for key in '\[\[containers\]\]' 'class_name = "ShellContainer"' 'image = ' \
                     'instance_type = ' 'max_instances = ' '\[\[durable_objects.bindings\]\]' \
                     '\[\[d1_databases\]\]'; do
            if ! grep -Eq "$key" "$f"; then
              echo "::error::wrangler.toml is missing required key: $key -- refusing to restore"
              exit 1
            fi
          done
          echo "WRANGLER_DECLARATIONS_OK"

      - name: python syntax gate
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/restore_container_config_bindings.py
          echo "PY_COMPILE_OK"

      - name: restore (fail-closed)
        id: restore
        run: |
          set -euo pipefail
          set +e
          python3 scripts/restore_container_config_bindings.py > /tmp/restore.log 2>&1
          RC=$?
          set -e
          tail -c 3000 /tmp/restore.log
          echo "restore_rc=$RC" >> "$GITHUB_OUTPUT"

      - name: probe /status (the only signal that reaches ctx.container)
        id: probe
        run: |
          set -euo pipefail
          set +e
          if [ -z "${PILOT_TOKEN:-}" ]; then
            echo "probe-skipped (PILOT_TOKEN unset)"
            echo "sig=probe-skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -sS --max-time 30 -H "Authorization: Bearer ${PILOT_TOKEN}" \
              "https://qnfo-containers-pilot.q08.workers.dev/status" || true)
            echo "attempt=$i body=${BODY:0:400}"
            if echo "$BODY" | grep -q '"running"'; then
              echo "sig=ok" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "sig=still-failing" >> "$GITHUB_OUTPUT"
          exit 0

      - name: publish ci-status artifact (always)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ci-status
          python3 - "${{ steps.restore.outputs.restore_rc }}" \
                    "${{ steps.probe.outputs.sig }}" <<'PY'
          import json, os, sys, datetime
          rc, sig = sys.argv[1], sys.argv[2]
          tail = ""
          try:
              tail = open("/tmp/restore.log", encoding="utf-8", errors="replace").read()[-2500:]
          except OSError:
              pass
          json.dump({
              "workflow": "apply-restore-container-config-bindings",
              "marker": "CONTAINER-CONFIG-RESTORE-5-BINDINGS",
              "issues": [1485, 1487],
              "restore_rc": rc,
              "status_signature": sig,
              "head": os.environ.get("GITHUB_SHA", ""),
              "ts": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "log_tail": tail,
          }, open("ci-status/restore-container-config-bindings.json", "w"), indent=2)
          PY
          git config user.name "qnfo-selfheal-bot"
          git config user.email "fleet-bot@qnfo.org"
          git add ci-status/restore-container-config-bindings.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(ci-status): record CONTAINER-CONFIG-RESTORE-5-BINDINGS outcome [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 3))
          done

      - name: fail the job if the restore did not succeed
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.restore.outputs.restore_rc }}" != "0" ]; then
            echo "::error::container config restore failed (rc=${{ steps.restore.outputs.restore_rc }}) -- #1485 still open"
            exit 1
          fi
          if [ "${{ steps.probe.outputs.sig }}" = "still-failing" ]; then
            echo "::error::/content restored but /status still fails -- #1485 still open"
            exit 1
          fi
          echo "RESTORE_VERIFIED sig=${{ steps.probe.outputs.sig }}"
