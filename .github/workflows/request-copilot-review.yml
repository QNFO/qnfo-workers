name: request-copilot-review

# REQUEST-COPILOT-REVIEW-1 (2026-11-01; LANE-WAITS-FOR-REVIEW-1, agent_issues 1000872, issue 5515, pillar autonomy): lever 1 of 4. The merge lane merged #5366 while the
# automated code review of its head was running, and no workflow requested that review at all (the ruleset rule copilot_code_review cannot be written with the app token:
# 403 Resource not accessible by integration). Every ready pull request into main now gets a request for the Copilot reviewer, with the workflow GITHUB_TOKEN first and
# QNFO_GH_PAT, the fleet user credential, as the documented second path. Levers 2 to 4 (hold the merge for a High-severity finding on the head, never wait more than 8
# minutes for a review that has not arrived, feed the findings to the code loop) are not here and stay open on the issue.
#
# A REQUEST NEVER BLOCKS A MERGE: both steps are continue-on-error and a third says so when neither worked. The merge lane refuses a pull request while a check that is not
# required has failed (bhMergeDecide: "check(s) failed on <sha>"), so a job that went red because the reviewer could not be requested would stop the lane for that pull
# request. The first draft of this workflow (Copilot, #5516) had a fallback step without continue-on-error.
# A draft is a work in progress and a Copilot session opens its pull request as an empty draft: the request is made when the pull request is ready (opened ready, or
# ready_for_review), which also keeps the AI spend to one review per ready pull request. An already requested reviewer is left alone.
#
# PULL_REQUEST_TARGET AND A SECRET ARE SAFE HERE: the workflow definition runs from the base branch, so a pull request cannot change it before it merges; nothing is checked out
# and nothing is executed from the pull request; the only pull request value used is its number, an integer from the event, handed over through env and never put in a
# `run:` expression; the secret reaches one step whose commands are fixed. It is a path scripts/copilot-pr-lifecycle.mjs would never approve for a Copilot pull request
# (DENY_PATHS: .github/), so a person-equivalent session reviewed and landed it. scripts/request-copilot-review.test.mjs runs both step scripts against a fake gh.
# Style: step names colon-free, no heredocs, no inline python, inputs travel through env (workflow-lint.py).

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
    branches: [main]

permissions:
  pull-requests: write

concurrency:
  group: request-copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request:
    if: ${{ github.event.pull_request.draft == false }}
    # RUNNER-PIN-2 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest becomes Ubuntu 26 by 2026-11-19 (a notice on every job meanwhile); pinned to ubuntu-24.04 until an ubuntu-26.04 trial run is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Request the automated review with GITHUB_TOKEN
        id: primary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewer='copilot-pull-request-reviewer[bot]'
          endpoint="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers"
          requested="$(gh api "$endpoint" --jq '.users[].login')"
          if printf '%s\n' "$requested" | grep -Fxq "$reviewer"; then
            exit 0
          fi
          gh api --method POST "$endpoint" -f "reviewers[]=$reviewer" >/dev/null

      - name: Request the automated review with the fleet user credential
        id: fallback
        if: ${{ steps.primary.outcome != 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.QNFO_GH_PAT }}
        run: |
          reviewer='copilot-pull-request-reviewer[bot]'
          endpoint="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers"
          requested="$(gh api "$endpoint" --jq '.users[].login')"
          if printf '%s\n' "$requested" | grep -Fxq "$reviewer"; then
            exit 0
          fi
          gh api --method POST "$endpoint" -f "reviewers[]=$reviewer" >/dev/null

      - name: Say so when no review could be requested
        if: ${{ steps.primary.outcome != 'success' && steps.fallback.outcome != 'success' }}
        run: echo "::warning::request-copilot-review could not request the reviewer on pull request ${PR_NUMBER} with either credential; the merge is not blocked (REQUEST-COPILOT-REVIEW-1)"
