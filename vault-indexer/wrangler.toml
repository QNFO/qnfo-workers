name = "vault-indexer"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

[triggers]
# CRON-RATE-CEILING-1 (owner directive 2026-09-23): a cron may not fire more than once
# per 10 minutes / more than 144 times per 24h. Was "*/5 * * * *" = 288 fires/24h.
# scheduled(event, env, ctx) calls run(env) with no cron-string branch, so the
# incremental vault re-index simply sweeps on a 10-minute cadence instead of 5.
crons = ["*/10 * * * *"]

[[r2_buckets]]
binding = "VAULT"
bucket_name = "obsidian-vault"

[[d1_databases]]
binding = "PERSONAL"
database_name = "personal-life"
database_id = "e8d6c61a-10b7-4086-b81e-9e6e85afa407"

[[vectorize]]
binding = "VZ"
index_name = "personal-life"

[ai]
binding = "AI"
