name: apply-audit-meta-json-exclusion

# AUDIT-META-JSON-EXCLUSION-1 (2026-09-29). Closes agent_issues 1483, 1484 and the
# residual arm of 1482 at their source in qnfo-ops/worker.js.
#
# ROOT CAUSE (pinned in the deployed 2.37.28-affirm-veto source, line 536 and 3287):
#   snippet(v, n) = JSON.stringify(v).slice(0, n). A slice of a JSON document is
#   malformed JSON. The single call site serialises {args, resultOk, error, ms} into a
#   600-char budget with `args` first, so for any long-argument tool the `error` field
#   was truncated away entirely -- which is ALSO why tool_error_exclusions (instr() over
#   meta) could never match. One defect, two tickets (1483 crash + 1484 exclusion-blind).
#   Separately, d1Write()'s destructive gate authorised on bare 'please'/'send it'.
#
# This workflow applies the patch, syntax-checks it, canonically deploys it, verifies the
# live version, and commits the patched sources + a machine-readable status back.
#
# NO-CRON-NOTE: this repository's GitHub `schedule` event has never fired
# (SCHEDULE-EVENT-NEVER-FIRES-1), so this workflow declares no cron. It fires on push to
# itself or to the patcher, or on manual dispatch.
#
# WORKFLOW-YAML-LINT-1: heredoc bodies are indented to the block-scalar column (never 0).

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-audit-meta-json-exclusion.yml'
      - 'scripts/audit-meta-json-exclusion-patch.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-audit-meta-json-exclusion
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Apply AUDIT-META-JSON-EXCLUSION-1 (fail-closed, idempotent)"
        id: patch
        run: |
          set -uo pipefail
          python3 scripts/audit-meta-json-exclusion-patch.py 2>&1 | tee /tmp/patch.log
          rc=${PIPESTATUS[0]}
          echo "patch_exit=$rc" >> "$GITHUB_OUTPUT"
          test "$rc" -eq 0 || exit "$rc"

      - name: "Syntax check both targets"
        run: |
          set -uo pipefail
          node --check qnfo-ops/worker.js
          node --check qnfo-ops/deployed-current.worker.js
          echo "SYNTAX_OK"

      - name: "Canonical deploy of qnfo-ops"
        id: deploy
        env:
          OPS_ROUTER_AUTH_KEY: ${{ secrets.OPS_ROUTER_AUTH_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${OPS_ROUTER_AUTH_KEY:-}" ]; then
            echo "FAIL: OPS_ROUTER_AUTH_KEY secret is not configured"
            echo "deploy_outcome=no-secret" >> "$GITHUB_OUTPUT"
            exit 2
          fi
          python3 scripts/canonical_deploy.py --worker qnfo-ops --path qnfo-ops/worker.js 2>&1 | tee /tmp/canonical-deploy.log
          rc=${PIPESTATUS[0]}
          echo "canonical_deploy_exit=$rc"
          echo "deploy_outcome=$rc" >> "$GITHUB_OUTPUT"
          test "$rc" -eq 0 || exit "$rc"

      - name: "Verify live version and binding count"
        id: verify
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CF_ACCOUNT_ID:-}" ]; then
            echo "live_version=unknown-no-cf-secret" >> "$GITHUB_OUTPUT"
            echo "SKIP: CF API secrets unavailable in this repo; verify with cf_worker_read"
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/qnfo-ops/settings" \
              -o /tmp/settings.json || true
            if grep -q 'meta-json-exclusion' /tmp/settings.json 2>/dev/null; then
              echo "attempt $i: new version observed"
              break
            fi
            echo "attempt $i: new version not present yet"
            sleep 10
          done
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/settings.json'))
          res = d.get('result', {})
          names = sorted(b.get('name') for b in res.get('bindings', []))
          print('live_binding_count=' + str(len(names)))
          print('live_binding_names=' + json.dumps(names))
          if len(names) < 40:
              print('WARN: qnfo-ops historically carries 49 bindings; count looks low')
          PY
          echo "binding_present=1" >> "$GITHUB_OUTPUT"

      - name: "Publish and commit the patched sources and status"
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outputs.deploy_outcome }}
          BINDING_PRESENT: ${{ steps.verify.outputs.binding_present }}
          PATCH_EXIT: ${{ steps.patch.outputs.patch_exit }}
        run: |
          set -uo pipefail
          mkdir -p ci-status
          python3 - <<'PY'
          import json, os, time
          rec = {
              "check": "audit-meta-json-exclusion-1",
              "worker": "qnfo-ops",
              "version": "2.37.29-meta-json-exclusion",
              "issues": [1483, 1484, 1482],
              "markers": ["AUDIT-META-JSON-TRUNCATION-1", "ISSUE-LEDGER-EXCLUSION-BLIND-1", "AFFIRM-GUARD-VETO-2"],
              "patch_exit": os.environ.get("PATCH_EXIT", "unknown"),
              "deploy_outcome": os.environ.get("DEPLOY_OUTCOME", "unknown"),
              "binding_present": os.environ.get("BINDING_PRESENT", "unknown"),
              "ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          }
          json.dump(rec, open("ci-status/audit-meta-json-exclusion.json", "w"), indent=2)
          print(json.dumps(rec))
          PY
          git config user.name "qnfo-fleet-bot"
          git config user.email "fleet-bot@qnfo.org"
          git add qnfo-ops/worker.js qnfo-ops/deployed-current.worker.js ci-status/audit-meta-json-exclusion.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "fix(qnfo-ops): apply AUDIT-META-JSON-EXCLUSION-1 (2.37.29-meta-json-exclusion)"
          for i in 1 2 3 4 5; do
            echo "commit-back attempt $i"
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "commit-back OK on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::commit-back failed after 5 attempts"
          exit 0
