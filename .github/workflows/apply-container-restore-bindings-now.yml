name: apply-container-restore-bindings-now

# CONTAINER-CONFIG-RESTORE-9-NOW (2026-09-29, issues #1485 / #1487 / #1493).
#
# LIVE OUTAGE THIS REPAIRS (measured, not inferred):
#   cf_worker_bindings(qnfo-containers-pilot) -> count 1, only {secret_text PILOT_TOKEN}.
#   The AUDIT d1 binding and the SHELL_CONTAINER durable-object binding were DESTROYED at
#   2026-09-29T19:45:02Z by a /content PUT that carried `exports` + `containers` but
#   omitted `bindings`. PUT /content REPLACES script metadata; omission is destructive for
#   non-secret bindings (secrets survive only because secret_text lives outside the upload).
#   Runtime signature before: "Cannot read properties of undefined (reading 'running')".
#   Runtime signature after:  "Cannot read properties of undefined (reading 'idFromName')"
#   (env.SHELL_CONTAINER undefined). Blast radius: shell_exec, exec_python, exec_node,
#   container_install, git_clone_exec, container_workspace_exec, shell_pipeline.
#
# WHY A NEW FILE INSTEAD OF REUSING apply-restore-container-config-bindings.yml:
#   that workflow is correct but has never produced ci-status/restore-container-config-
#   bindings.json, so it has never executed (ORPHANED-APPLIER-1 / CI-TRIGGER-SKIP-1 class).
#   This file is self-firing on its own path and selects whichever restore script exists,
#   so a missing/renamed script fails loudly instead of silently doing nothing.
#
# AUTHORITATIVE VERIFICATION: /health is a FALSE GREEN for this class - it is served by the
#   top-level fetch and never touches ctx.container. Only /status reaches the Durable
#   Object, so that is the signal probed here. An artifact is published ALWAYS so that
#   "ran and failed" stays distinguishable from "never ran".
#
# STALE-PREFLIGHT-1: no gate pins a version literal; gates assert properties only.
# CI-TRIGGER-SKIP-1: the artifact commit carries [skip ci]; this workflow's own trigger is
#   its file path, which the artifact commit does not touch, so no trigger loop exists.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-container-restore-bindings-now.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-container-restore-bindings-now
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: pick the restore script (fail loudly if none)
        id: pick
        run: |
          set -euo pipefail
          for s in scripts/restore_container_config_bindings.py \
                   scripts/restore_container_config.py \
                   scripts/restore_container_config_exports.py; do
            if [ -f "$s" ]; then
              echo "PICKED $s"
              echo "script=$s" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::no container restore script present in scripts/ -- refusing"
          exit 1

      - name: python syntax gate
        run: |
          set -euo pipefail
          python3 -m py_compile "${{ steps.pick.outputs.script }}"
          echo "PY_COMPILE_OK"

      - name: restore (fail-closed)
        id: restore
        run: |
          set +e
          python3 "${{ steps.pick.outputs.script }}" > /tmp/restore.log 2>&1
          RC=$?
          set -e
          tail -c 3000 /tmp/restore.log || true
          echo "restore_rc=$RC" >> "$GITHUB_OUTPUT"

      - name: probe /status (the only signal that reaches ctx.container)
        id: probe
        run: |
          set +e
          if [ -z "${PILOT_TOKEN:-}" ]; then
            echo "probe-skipped (PILOT_TOKEN unset)"
            echo "sig=probe-skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -sS --max-time 30 -H "Authorization: Bearer ${PILOT_TOKEN}" \
              "https://qnfo-containers-pilot.q08.workers.dev/status" || true)
            echo "attempt=$i body=${BODY:0:400}"
            if echo "$BODY" | grep -q '"running"'; then
              echo "sig=ok" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "sig=still-failing" >> "$GITHUB_OUTPUT"
          exit 0

      - name: publish artifact (always)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ci-status
          python3 - "${{ steps.restore.outputs.restore_rc }}" \
                    "${{ steps.probe.outputs.sig }}" \
                    "${{ steps.pick.outputs.script }}" <<'PY'
          import datetime
          import json
          import os
          import sys
          rc, sig, script = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              tail = open("/tmp/restore.log", encoding="utf-8", errors="replace").read()[-2500:]
          except OSError:
              tail = ""
          json.dump({
              "workflow": "apply-container-restore-bindings-now",
              "marker": "CONTAINER-CONFIG-RESTORE-9-NOW",
              "issues": [1485, 1487, 1493],
              "script": script,
              "restore_rc": rc,
              "status_signature": sig,
              "head": os.environ.get("GITHUB_SHA", ""),
              "ts": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "log_tail": tail,
          }, open("ci-status/container-restore-bindings-now.json", "w"), indent=2)
          PY
          git config user.name "qnfo-selfheal-bot"
          git config user.email "fleet-bot@qnfo.org"
          git add ci-status/container-restore-bindings-now.json
          if git diff --cached --quiet; then
            echo "no artifact change"
            exit 0
          fi
          git commit -m "chore(ci): container-restore-bindings-now outcome [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "PUSH_OK"
              exit 0
            fi
            git pull --rebase --autostash || true
            sleep 3
          done
          echo "::error::artifact push failed"
          exit 1
