name = "qnfo-infra"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# Secrets:
#   INFRA_TOKEN - Bearer token for all endpoints
#   CF_TOKEN    - Cloudflare API token (account read + GraphQL analytics)
#   CF_ACCOUNT  - account id

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["30 6 * * *", "0 18 * * *"]

# v1.2.0 UNIFIED RETRIEVAL ORACLE — D1 bindings (state snapshots + records)
[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "GRAPH"
database_name = "qnfo-graph"
database_id = "a1954b92-d681-4d02-b1f6-f9a2eb4c265d"

[[d1_databases]]
binding = "LIVING"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[d1_databases]]
binding = "PERSONAL"
database_name = "personal-life"
database_id = "e8d6c61a-10b7-4086-b81e-9e6e85afa407"

[[d1_databases]]
binding = "PORTFOLIO"
database_name = "portfolio-state"
database_id = "d80fdf2a-0a60-45a3-968b-2907ce806dcd"

[ai]
binding = "AI"

# Vectorize — all QNFO + personal semantic indexes
[[vectorize]]
binding = "VZ"
index_name = "qnfo-infra"

[[vectorize]]
binding = "PAPER_VZ"
index_name = "qwav-research-v2"

[[vectorize]]
binding = "NOTES_VZ"
index_name = "qnfo-notes"

[[vectorize]]
binding = "TASKS_VZ"
index_name = "qnfo-tasks"

[[vectorize]]
binding = "LOG_VZ"
index_name = "qnfo-ai-log"

[[vectorize]]
binding = "HANDOFFS_VZ"
index_name = "qnfo-handoffs"

[[vectorize]]
binding = "IPATENT_VZ"
index_name = "ipatent-corpus"

[[vectorize]]
binding = "PL_VZ"
index_name = "personal-life"
