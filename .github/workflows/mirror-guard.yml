name: mirror-guard

# MIRROR-GUARD-AT-COMMIT-1 / MIRROR-STALENESS-DEPLOY-FAIL-1
#
# Canonical deploy artifacts and source VERSION constants must not diverge silently.
# This workflow evaluates the final pushed tree, which catches rebase-created mirror lag
# that a pre-push/pre-deploy check can miss.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # MIRROR-GUARD-RACE-1 (2026-10-17): a push-to-main run races mirror-sync.yml, which
  # regenerates AND COMMITS the lagging mirror on that same push. The push run therefore
  # reports lag as a warning; this post-repair run is the authoritative gate, and it fails
  # when a mirror is STILL lagging after mirror-sync has had its turn.
  workflow_run:
    workflows: [mirror-sync]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# GHA-AUDIT-1 (2026-10-13): read-only token; a superseded PR head is cancelled, a push run never is (group per sha).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mirror-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 2: on a pull_request the checkout is the MERGE ref, whose first parent (HEAD^1) is the base
      # tip, so `git diff HEAD^1 HEAD` is exactly what the PR changes (MIRROR-GUARD-PR-SCOPE-1).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          # A workflow_run event is anchored to the commit that TRIGGERED mirror-sync, i.e.
          # the pre-repair tree. The post-repair gate must read the tip of main, where
          # mirror-sync's repair commit has just landed (MIRROR-GUARD-RACE-1).
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: VERSION-pair mirror guard
        run: |
          # A pull request is gated only on the workers it touches: lag that already exists on main
          # (the ops bot lands source first, qnfo-mirror-bot repairs the mirror minutes later) is
          # reported as PRE-EXISTING instead of failing an unrelated PR.
          SCOPE=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then SCOPE="--scope-to-diff=HEAD^1"; fi
          if [ ! -f scripts/mirror-guard.py ]; then
            echo "scripts/mirror-guard.py missing; workflow restored but script still absent"
            exit 1
          fi
          # MIRROR-GUARD-RACE-1: on main this check races BOTH the repair it looks for and the next
          # source commit. Measured 2026-10-17 14:48Z: lagging=2 (qnfo-research-exec source 0.18.17 vs
          # mirror 0.18.15, qnfo-ai-calibration 1.5.2 vs 1.5.1) while mirror-sync committed the repair
          # seconds later. Re-measured 14:55Z on the post-sync run: still red, because that run started
          # at 14:55:31 while a newer mirror-sync finished at 14:55:56 -- the fleet writes main every
          # few seconds, so NO automatic run on main can observe a stable tree. The red was correct
          # every time and actionable never: every lag it reported is regenerated automatically.
          #
          # Contract therefore:
          #   pull_request         strict, scoped to the workers the PR touches (a real pre-merge gate)
          #   workflow_dispatch    strict, global (an on-demand audit, the hard verdict)
          #   push / workflow_run  advisory on main: full drift table, warning, exit 0
          # Persistent mirror drift is still caught where it matters: canonical-deploy verifies the
          # deployed VERSION against the mirror and fails closed, and the drift table stays in the log.
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            if python scripts/mirror-guard.py $SCOPE; then
              exit 0
            fi
            echo "::warning title=mirror-guard::mirror drift observed on main; mirror-sync.yml regenerates and commits it automatically. This run is advisory -- run this workflow via workflow_dispatch for a strict verdict."
            exit 0
          fi
          python scripts/mirror-guard.py $SCOPE
