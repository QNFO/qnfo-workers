name = "qnfo-research-supervisor"
main = "worker.js"
compatibility_date = "2026-08-10"
workers_dev = true
usage_model = "standard"

# v1.0.0 (2026-09-06): durable supervisor over the research-publication pipeline.
# Surveys research_queue / version_queue / social_threads / paper_revision_log and remediates
# conservative stalls (stale research-exec claims, stale version_queue 'publishing').
# D1-only (no auth, no service bindings). Schedule rides the [[workflows]] binding.

[[workflows]]
name = "research-supervisor"
binding = "RESEARCH_SUPERVISOR"
class_name = "ResearchSupervisor"
schedules = ["*/15 * * * *"]

[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "LIVING_PAPER"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"
