name: deploy-qnfo-ops

# SERVER-SIDE-DEPLOY-1 (2026-09-27). Re-pinned 2026-09-29.
#
# Carries qnfo-ops from qnfo-workers main to LIVE using the repo's own
# binding-preserving deployer (scripts/raw_put.py -> CF API /content).
#
# WHY /content AND NOT wrangler: the /content endpoint updates the CODE ONLY,
# preserving every live binding (BINDING-PRESERVATION-1). qnfo-ops has 48 live
# bindings; a wrangler deploy that cannot reproduce them would silently drop them.
# raw_put.py is fail-closed: it exits 3 and deploys nothing on any error, so a
# partial deploy cannot occur.
#
# STALE-PREFLIGHT-1 (fixed 2026-09-29): this workflow previously hard-pinned VERSION
# 2.37.13-attachguard-xml-form while the artifact had already moved to
# 2.37.17-d1-schema-hint. It could therefore ONLY ever fail -- and because its
# push.paths listed only its own file, a change to qnfo-ops/worker.js had NO path to
# live at all. That is the DEPLOY-NON-CANONICAL / deploy-drift root cause for the ops
# endpoint itself. The preflight is now SKIP-SAFE: if the artifact is not at the
# expected version this workflow exits 0 and names the workflow that owns the deploy,
# instead of failing red and teaching operators to ignore it.

on:
  push:
    paths:
      - '.github/workflows/deploy-qnfo-ops.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-qnfo-ops
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight - decide whether there is anything to deploy
        id: pre
        run: |
          set -euo pipefail
          EXPECT='var VERSION = "2.37.18-d1-guard-literal-fn-aware";'
          if grep -qF "$EXPECT" qnfo-ops/worker.js; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "artifact at the expected version; proceeding"
            cmp qnfo-ops/worker.js qnfo-ops/deployed-current.worker.js
            echo "source and deployed-current mirror are byte-identical"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "artifact is NOT at the expected version; nothing to deploy."
            echo "The apply-d1guard-literal-fn-aware workflow owns this deploy."
            grep -o 'var VERSION = "[^"]*";' qnfo-ops/worker.js | head -1 || true
          fi

      - name: Deploy qnfo-ops (binding-preserving CF API /content PUT)
        if: steps.pre.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/raw_put.py qnfo-ops qnfo-ops/worker.js

      - name: Verify live VERSION via CF API
        if: steps.pre.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/qnfo-ops/content" \
            -o /tmp/live.js
          echo "live-content-bytes=$(wc -c < /tmp/live.js)"
          hits=$(grep -c '2.37.18-d1-guard-literal-fn-aware' /tmp/live.js || true)
          echo "live-version-hits=$hits"
          test "$hits" -ge 1
          echo "VERIFIED: live qnfo-ops carries 2.37.18-d1-guard-literal-fn-aware"
