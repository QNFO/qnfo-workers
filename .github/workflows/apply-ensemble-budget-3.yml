name: apply-ensemble-budget-3

# ENSEMBLE-BUDGET-3 driver (2026-09-29).
#
# ROOT CAUSE: ENSEMBLE-BUDGET-2 rebalanced the *shares* but left the total ensemble deadline at
# 45e3 ms. The measured latencies of the ensemble legs are 31 s - 145 s (ai_queries 2026-09-27 ->
# 2026-09-29: gpt-oss-120b avg 144947 ms, kimi-k2.6 avg 59479 ms, deepseek-v4-pro avg 31087 ms),
# so every stage slice was cut off, primaryText stayed "" and the handler returned FALLBACK_TEXT.
# MEASURED after the BUDGET-2 deploy: model=ensemble n=26 canned=26 max completion 112 tok,
# avg latency 49925 ms - the observed latency IS the exhausted budget, not model time.
#
# FIX: raise the total deadline to 120e3 ms with real stage slices (primary 60e3, DeepSeek
# fallback 36e3, retry 18e3; floors 20e3 / 15e3 / 8e3). The caller (qnfo-research-exec gwCall)
# aborts at 24e4 ms, so 120e3 fits with margin.
#
# NO-CRON-NOTE: this repository's GitHub `schedule` event has never fired
# (SCHEDULE-EVENT-NEVER-FIRES-1), so this workflow declares no cron. It fires on push to itself
# or on manual dispatch.
#
# WORKFLOW-YAML-LINT-1: no step name in this file contains an unquoted colon-space.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ensemble-budget-3.yml'
      - 'scripts/patch-ensemble-budget-3.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-ensemble-budget-3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "Run the applier (idempotent, fail-closed)"
        id: apply
        run: |
          set -uo pipefail
          python3 scripts/patch-ensemble-budget-3.py 2>&1 | tee /tmp/apply.log
          rc=${PIPESTATUS[0]}
          echo "applier_exit=$rc" >> "$GITHUB_OUTPUT"
          test "$rc" -eq 0 || exit "$rc"

      - name: "Verify marker, syntax, and that the 45e3 deadline is gone"
        id: verify
        run: |
          set -uo pipefail
          fail=0
          for f in qnfo-ai/worker.js qnfo-ai/deployed-current.worker.js; do
            if grep -qF "ENSEMBLE-BUDGET-3" "$f"; then
              echo "MARKER OK ENSEMBLE-BUDGET-3 in $f"
            else
              echo "MARKER MISSING ENSEMBLE-BUDGET-3 in $f"
              fail=1
            fi
            cp "$f" /tmp/check.mjs
            if node --check /tmp/check.mjs; then
              echo "SYNTAX OK $f"
            else
              echo "SYNTAX FAIL $f"
              fail=1
            fi
          done
          if grep -qF 'const ENSEMBLE_BUDGET_MS = 45e3;' qnfo-ai/worker.js; then
            echo "LEGACY 45e3 DEADLINE STILL PRESENT in qnfo-ai/worker.js"
            fail=1
          else
            echo "LEGACY 45e3 DEADLINE REMOVED in qnfo-ai/worker.js"
          fi
          if grep -qF 'const ENSEMBLE_BUDGET_MS = 120e3;' qnfo-ai/worker.js; then
            echo "NEW 120e3 DEADLINE PRESENT"
          else
            echo "NEW 120e3 DEADLINE MISSING"
            fail=1
          fi
          for pair in "_stageCap(0.5, 2e4)" "_stageCap(0.3, 1.5e4)" "_stageCap(0.15, 8e3)"; do
            if grep -qF "$pair" qnfo-ai/worker.js; then
              echo "SLICE OK $pair"
            else
              echo "SLICE MISSING $pair"
              fail=1
            fi
          done
          echo "verify_fail=$fail" >> "$GITHUB_OUTPUT"
          test "$fail" -eq 0

      - name: "Commit the patch back to main (race-safe)"
        id: commit
        run: |
          set -uo pipefail
          git config user.name "qnfo-fleet-bot"
          git config user.email "fleet-bot@qnfo.org"
          if git diff --quiet; then
            echo "commit_outcome=no-op"
            echo "commit_outcome=no-op" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m "fix(ensemble): ENSEMBLE-BUDGET-3 raise total deadline to 120e3 with real stage slices" || true
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "commit_outcome=pushed"
              echo "commit_outcome=pushed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push attempt $i failed, rebasing"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "commit_outcome=push-failed"
          echo "commit_outcome=push-failed" >> "$GITHUB_OUTPUT"
          exit 1

      - name: "Canonical deploy qnfo-ai"
        id: deploy_ai
        continue-on-error: true
        env:
          OPS_ROUTER_AUTH_KEY: ${{ secrets.OPS_ROUTER_AUTH_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${OPS_ROUTER_AUTH_KEY:-}" ]; then
            echo "SKIP qnfo-ai deploy (OPS_ROUTER_AUTH_KEY not configured)"
            exit 0
          fi
          python3 scripts/canonical_deploy.py --worker qnfo-ai --path qnfo-ai/worker.js 2>&1 | tee /tmp/deploy-ai.log
          echo "deploy_ai_exit=${PIPESTATUS[0]}"

      - name: "Assert the deployed qnfo-ai bundle carries the marker"
        id: live
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ACCOUNT_ID:-}" ]; then
            echo "SKIP live assertion (CF_API_TOKEN or CF_ACCOUNT_ID not configured)"
            echo "live_marker=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/live.js -w '%{http_code}' \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/qnfo-ai/content")
            if [ "$code" = "200" ] && grep -qF "ENSEMBLE-BUDGET-3" /tmp/live.js; then
              echo "LIVE MARKER OK (attempt $i)"
              echo "live_marker=present" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "attempt $i http=$code marker_absent, retrying"
            sleep 10
          done
          echo "LIVE MARKER MISSING after 6 attempts"
          echo "live_marker=missing" >> "$GITHUB_OUTPUT"
          exit 1

      - name: "Publish machine-readable status"
        if: always()
        run: |
          mkdir -p ci-status
          printf '{"marker":"ENSEMBLE-BUDGET-3","applier_exit":"%s","verify_fail":"%s","commit_outcome":"%s","live_marker":"%s","ts":"%s"}\n' \
            "${{ steps.apply.outputs.applier_exit }}" \
            "${{ steps.verify.outputs.verify_fail }}" \
            "${{ steps.commit.outputs.commit_outcome }}" \
            "${{ steps.live.outputs.live_marker }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci-status/ensemble-budget-3.json
          cat ci-status/ensemble-budget-3.json

      - name: "Commit status artifact (race-safe)"
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          git config user.name "qnfo-fleet-bot"
          git config user.email "fleet-bot@qnfo.org"
          git add -f ci-status/ensemble-budget-3.json
          git commit -m "ci(ensemble): status artifact [skip ci]" || exit 0
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          exit 0
