name: apply-outreach-selector-terminal-status

# OUTREACH-SELECTOR-TERMINAL-STATUS-1 (issues 1294 / 1508, 2026-09-30).
#
# WHY THIS WORKFLOW EXISTS: scripts/outreach-selector-terminal-status-patch.py
# repairs jobOutreach() in qnfo-cloud-ops/worker.js. The script was committed
# with no invocation path -- ORPHANED-APPLIER-1, the defect class the sibling
# apply-analyzer-exclusion-table.yml header warns about. This workflow IS that
# execution path.
#
# THE DEFECT (confirmed by direct read of the deployed bundle, 2026-09-30):
# jobOutreach() drains outreach_queue with
#     WHERE status IN ('pending','needs-email') ORDER BY created_at ASC LIMIT 10
# and two of its non-terminal branches `continue` WITHOUT writing a status:
#   * duplicate-contact branch -> out.skipped_dupe++; continue;
#   * invalid-email branch     -> out.errors.push(...); continue;
# Both leave the row at status='pending', so it is re-selected on every run and
# permanently occupies a slot in the oldest-10 window. The no-email branch DOES
# write, but writes status='needs-email', which the selector also matches -- a
# closed loop. The applier narrows the selector to status='pending' and writes
# status='skipped-dup' / 'skipped-invalid' in the two silent branches.
#
# HONEST SCOPE NOTE (verified live 2026-09-30): all 25 pending rows classify as
# SENDABLE (0 duplicate, 0 invalid, 0 no-email), so this defect is LATENT, not
# the current blocker for the lane. The current blocker is CRON REGISTRATION
# (issue 1500): worker_schedules shows qnfo-cloud-ops registered with a single
# cron "30 5 * * 1" while its own AMS_SCHEDULE declares 22 jobs, and
# scheduler_state holds cron_offset but NO cron_fingerprint, proving
# syncSchedules() never completed. That is why the DEPLOY job below uses
# scripts/canonical_deploy.py rather than scripts/raw_put.py: the canonical
# path performs lock acquire -> PUT /content -> live verify -> guard /ledger ->
# PUT /schedules, and that final PUT is what restores the AMS_SCHEDULE crons
# (raw_put.py performs only the /content PUT, which is why ledger rows read
# schedules=FAILED -- issue 1498).
#
# PRE-EXISTING CONDITION THIS WORKFLOW DOES NOT FIX (recorded, not hidden):
# qnfo-cloud-ops/worker.js and qnfo-cloud-ops/deployed-current.worker.js are
# NOT byte-identical (measured 2026-09-30: 125646 vs 125067 bytes). The usual
# "mirror parity" gate (cmp, as used by apply-analyzer-exclusion-table.yml) is
# therefore deliberately replaced here by PROPERTY assertions on both files.
# Mirror divergence for this worker is a separate open condition.
#
# STYLE CONSTRAINTS (the classes this file must not join)
#   * WORKFLOW-YAML-LINT-1: every step name below is colon-free, because an
#     unquoted colon in a step name made a sibling workflow unparseable and
#     GitHub created zero-job runs with no log.
#   * No heredocs and no inline python inside run blocks, so YAML indentation
#     can never be read as script indentation.
#   * Commit messages are single-line -m flags, never an inline multi-line
#     string (a multi-line git commit -m inside a run scalar terminates the
#     scalar and makes the whole workflow invalid YAML).

on:
  push:
    paths:
      - 'scripts/outreach-selector-terminal-status-patch.py'
      - '.github/workflows/apply-outreach-selector-terminal-status.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-outreach-selector-terminal-status
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply patch fail-closed
        id: apply
        run: |
          set -euo pipefail
          python3 scripts/outreach-selector-terminal-status-patch.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change produced (already applied)"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: ESM syntax gate blocking
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cp qnfo-cloud-ops/worker.js /tmp/outreach-check.mjs
          node --check /tmp/outreach-check.mjs
          echo "ESM parse OK"

      - name: Property gate on both files blocking
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          for f in qnfo-cloud-ops/worker.js qnfo-cloud-ops/deployed-current.worker.js; do
            test "$(grep -cF 'skipped-dup' "$f" || true)" -ge 1
            test "$(grep -cF 'skipped-invalid' "$f" || true)" -ge 1
            test "$(grep -cF "WHERE status = 'pending' ORDER BY created_at ASC LIMIT 10" "$f" || true)" -ge 1
            test "$(grep -cF "status IN ('pending','needs-email')" "$f" || true)" -eq 0
            echo "property OK: $f"
          done

      - name: Commit and push with push-race retry
        if: steps.apply.outputs.changed == 'true'
        env:
          BR: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "qnfo-selfheal-bot"
          git config user.email "ops@qnfo.org"
          git add -u
          if git diff --cached --quiet; then
            echo "nothing staged; exiting"
            exit 0
          fi
          git diff --cached --stat
          SUBJECT="fix(qnfo-cloud-ops): #1294 #1508 jobOutreach writes terminal statuses"
          BODY="jobOutreach() drained outreach_queue with WHERE status IN ('pending','needs-email') ORDER BY created_at ASC LIMIT 10, and its duplicate-contact branch (out.skipped_dupe++; continue;) and invalid-email branch (out.errors.push(); continue;) both continued WITHOUT writing a status. Those rows therefore stayed pending and re-occupied a slot in the oldest-10 window on every run, while the no-email branch wrote status=needs-email which the same selector matches, forming a closed loop. The applier narrows the selector to status='pending' and writes status='skipped-dup' and status='skipped-invalid' so no row can block the window indefinitely. It edits worker.js and its deployed-current mirror together. Live data check 2026-09-30: all 25 pending rows classify as sendable, so this is a latent defect; the lane's actual blocker is cron registration (issue 1500)."
          FOOT="Co-authored-by: Chatbox <chatbox@chatboxai.com>"
          git commit -m "$SUBJECT" -m "$BODY" -m "$FOOT"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BR"; then
              echo "push OK on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed; refetching and rebasing"
            git fetch origin "$BR"
            if ! git rebase "origin/$BR"; then
              git rebase --abort || true
              git reset --hard "origin/$BR"
              python3 scripts/outreach-selector-terminal-status-patch.py
              git add -u
              if git diff --cached --quiet; then
                echo "patch already present at origin; nothing to push"
                exit 0
              fi
              git commit -m "$SUBJECT" -m "$BODY" -m "$FOOT"
            fi
            sleep 5
          done
          echo "push failed after 5 attempts"
          exit 1

  deploy:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight artifact must carry the terminal-status fix version-pin-agnostic
        run: |
          set -euo pipefail
          for f in qnfo-cloud-ops/worker.js qnfo-cloud-ops/deployed-current.worker.js; do
            test "$(grep -cF 'skipped-dup' "$f" || true)" -ge 1
            test "$(grep -cF 'skipped-invalid' "$f" || true)" -ge 1
            test "$(grep -cF "WHERE status = 'pending' ORDER BY created_at ASC LIMIT 10" "$f" || true)" -ge 1
            echo "preflight OK: $f"
          done

      - name: Canonical deploy qnfo-cloud-ops content verify ledger schedules
        env:
          OPS_ROUTER_AUTH_KEY: ${{ secrets.OPS_ROUTER_AUTH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPS_ROUTER_AUTH_KEY:-}" ]; then
            echo "::error::OPS_ROUTER_AUTH_KEY is not configured - the canonical path cannot run and this gate refuses to no-op"
            exit 1
          fi
          python3 scripts/canonical_deploy.py --worker qnfo-cloud-ops --path qnfo-cloud-ops/worker.js

      - name: Verify LIVE bundle carries the terminal-status fix
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/qnfo-cloud-ops/content" \
            -o /tmp/live-outreach.js
          echo "live-bytes=$(wc -c < /tmp/live-outreach.js)"
          test "$(grep -cF 'skipped-dup' /tmp/live-outreach.js || true)" -ge 1
          test "$(grep -cF 'skipped-invalid' /tmp/live-outreach.js || true)" -ge 1
          test "$(grep -cF "WHERE status = 'pending' ORDER BY created_at ASC LIMIT 10" /tmp/live-outreach.js || true)" -ge 1
          echo "VERIFIED: live qnfo-cloud-ops jobOutreach writes terminal statuses"
