name = "jnl-pipeline"
main = "worker.js"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

[[d1_databases]]
binding = "AUDIT"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# binding CORPUS: type=vectorize (see deployed config)

# secret: JNL_OPS_TOKEN -> wrangler secret put JNL_OPS_TOKEN

# secret: JNL_TOKEN -> wrangler secret put JNL_TOKEN

[[r2_buckets]]
binding = "PARSE_CACHE"
bucket_name = "jnl-parse-cache"

[[kv_namespaces]]
binding = "STATE"
id = "0cf89b469bcb47058e343611d9117897"

# secret: ZENODO_TOKEN -> wrangler secret put ZENODO_TOKEN

# CRON-RATE-CEILING-1 (owner directive 2026-09-23): declared here so a repo-sourced deploy
# cannot WIPE the live schedules. This file previously carried no [triggers] at all while
# LIVE ran two crons -- repo/live drift AND a deploy-from-repo hazard.
# Values mirror LIVE exactly: this is a parity fix, NOT a re-time.
# DISPATCHER CONTRACT (load-bearing): worker.js scheduled() branches on the LITERAL cron
# string --  "*/10 * * * *" -> jnl-watch   |   "23 */2 * * *" -> jnl-referee.
# The live "*/30 * * * *" matches NO branch and is therefore a dead trigger (48 wasted
# invocations/day); resolving that is a separate change, deliberately not folded in here.
[triggers]
crons = ["*/30 * * * *", "23 */2 * * *"]
