name = "qnfo-ops-jobs-reaper"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# D17 + D19 remediation. Runs every 5 minutes; each cycle is a handful of D1
# statements, so no [limits] cpu_ms override is needed (the platform default 30s
# active-CPU ceiling is far above what this does).

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

# Same database as qnfo-ops (binding name matches, so the SQL is portable between
# the two workers). Copy of qnfo-ops/wrangler.toml [[d1_databases]] QNFO_AUDIT.
[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# No service bindings, no secrets. This worker needs write access to exactly one
# table (ops_jobs) plus an append to cloud_ops_events. Deliberately minimal so it
# can be audited at a glance and cannot touch anything else.
