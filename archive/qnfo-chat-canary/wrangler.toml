name = "qnfo-chat-canary"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# QNFO.OPS.011A/011B (2026-09-02) - behavioral chat canary (15 */3 * * *) +
# research-daily-brief send guard (30 6 * * *, WORKER-SEND-GUARD-1).
# Secrets: ROUTER_AUTH_KEY (qnfo-ai router key), RUN_TOKEN (manual /run gate)
[triggers]
crons = ["15 */3 * * *", "30 6 * * *"]

[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "OUTREACH"
database_name = "qnfo-outreach"
database_id = "d5077252-8187-41b2-a44e-f84f8724ee36"

# Service binding to qnfo-ai (same-account workers.dev public fetch returns 404 from a Worker;
# service bindings are the fleet pattern, cf. orchestrator QNFO_AI).
[[services]]
binding = "QNFO_AI"
service = "qnfo-ai"

[[send_email]]
name = "SEND_EMAIL"
allowed_destination_addresses = ["rwnquni@outlook.com"]

[observability]
enabled = true
head_sampling_rate = 1
