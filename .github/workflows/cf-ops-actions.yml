name: cf-ops-actions
# CI-ACTION-IDENTITY-1 (2026-10-13): the run title names the action, so scripts/ci_watchdog.py files a failure per action and
# a green run of a different action never closes it (ci-watchdog #1033: gen-activitypub-key under the cf-ops-actions name).
run-name: cf-ops-actions ${{ inputs.action }} ${{ inputs.target }}

# CF-OPS-ACTIONS-1 (2026-10-01). Allowlisted Cloudflare API actions for steps an agent session cannot
# run (it holds no CF token): delete a script whose repo directory carries a RETIRED/FOLDED marker,
# AI Gateway log attribution, Workers AI neurons by model, gateway cost by model, Access scope probe.
# All logic lives in scripts/cf_ops_actions.py; each action prints one RESULT_JSON line.
# Dispatch only (GitHub schedule never fires on this repo). Never prints a secret.
# Style: step names colon-free, no heredocs, no inline python (workflow-lint.py).

on:
  workflow_dispatch:
    inputs:
      action:
        description: "report | worker-history | kv-secret-scan | delete-worker | delete-vectorize-index | gateway-logs | ai-neurons | gateway-cost | access-probe | r2-get"
        required: true
        type: choice
        options:
          - report
          - worker-history
          - kv-secret-scan
          - ops-intake-probe
          - r2-get
          - ai-neurons
          - gateway-cost
          - gateway-logs
          - access-probe
          - delete-worker
          - delete-vectorize-index
          - zaraz-remove-tool
          - zaraz-get
          - zaraz-set-ga4
          - spare-domain-canon
          - d1-backup
          - unbind-d1
          - delete-d1
          - unbind-service
          - gen-activitypub-key
          - noz-scrub-bodies
          - noz-scrub-graph
      target:
        description: "worker name (worker-history, delete-worker), KV namespace id (kv-secret-scan), index name (delete-vectorize-index) ops-workspace path (r2-get) or zone (zaraz-remove-tool) or database name (d1-backup, delete-d1) or WORKER:BINDING (unbind-d1, unbind-service)"
        required: false
        default: ""
      model:
        description: "model filter (gateway-logs), tool match (zaraz-remove-tool), or dry|live for zaraz-set-ga4, spare-domain-canon, noz-scrub-bodies and noz-scrub-graph"
        required: false
        default: ""
      gateway:
        description: "AI Gateway id (gateway-logs only)"
        required: false
        default: "default"

permissions:
  contents: read

# One group per action+target: a single shared group kept only ONE pending run, so dispatching several
# actions back to back silently cancelled the middle ones (runs 2-4 on 2026-10-01).
concurrency:
  group: cf-ops-actions-${{ github.event.inputs.action }}-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 60 (was 15): noz-scrub-graph live (run 136, 2026-10-12) writes about 3,000 D1 statements one REST call at a time and was
    # cancelled by the 15-minute limit with the scrub half done; every action here is re-runnable, so a long run is cheap to
    # finish and expensive to cut short.
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPS_ROUTER_AUTH_KEY: ${{ secrets.OPS_ROUTER_AUTH_KEY }}
      IN_ACTION: ${{ github.event.inputs.action }}
      IN_TARGET: ${{ github.event.inputs.target }}
      IN_MODEL: ${{ github.event.inputs.model }}
      IN_GATEWAY: ${{ github.event.inputs.gateway }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the allowlisted action
        run: |
          set -uo pipefail
          python3 scripts/cf_ops_actions.py "$IN_ACTION" --target "${IN_TARGET:-}" --model "${IN_MODEL:-}" --gateway "${IN_GATEWAY:-default}"
