# DO-MIGRATION-NOTE-1 2026-09-22 (R3/F2): a `wrangler deploy --dry-run` validates
# client-side structure ONLY - it cannot prove the server accepts this migration. The
# class already exists (created via the API), so a real wrangler deploy may FAIL CLOSED
# (Cloudflare rejects a creating migration for an already-depended-on class). It never
# wipes. The operative deploy path remains scripts/raw_put.py (binding-preserving).

name = "personal-api"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# ============================================================
# personal-api (personal twin) - canonical repo mirror (2026-09-03)
# Recreated from the live deployed bundle (no local source existed) so the
# worker now has a canonical git home + wrangler deploy path. Bindings below
# reproduce the live settings. Secrets (never in git): API_KEY, CAL_TOKEN,
# CF_TOKEN, INFRA_TOKEN.
# v3.1.0: VISION-1 personal endpoint accepts images (vision-capable WA models
# ordered first; upstream no longer answers "no image" via non-vision
# deepseek) + MEDIA-INGEST-1 image capture to R2 personal-media + D1 table.
# ============================================================

[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "PERSONAL"
database_name = "personal-life"
database_id = "e8d6c61a-10b7-4086-b81e-9e6e85afa407"

[[vectorize]]
binding = "VZ"
index_name = "personal-life"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "personal-media"

[[services]]
binding = "CAL_API"
service = "calendar-api"
environment = "production"

# Secrets (wrangler secret put): API_KEY, CAL_TOKEN, CF_TOKEN, INFRA_TOKEN

# PersonalTwinAgent Durable Object (deployed; class pre-exists with live instances).
# Binding-only on purpose: the class was created by a prior migration. Do NOT re-declare it
# under new_classes — Cloudflare rejects "new-class migration to a class already depended on"
# by existing Durable Objects (code 10074), verified on qnfo-ops 2026-09-14.
[[durable_objects.bindings]]
name = "PERSONAL_TWIN_AGENT"
class_name = "PersonalTwinAgent"

# DO-EXPORTS-RECONCILE-1 (2026-09-26): wrangler 4.118 fails a deploy unless every provisioned
# Durable Object class is declared in `exports`. Mirrors the qnfo-fleet-control fix.
[exports.PersonalTwinAgent]
type = "durable-object"
storage = "sqlite"

[triggers]
crons = ["5 5 * * *"]
