name: deploy-gate

# The repo IS the deploy source: qnfo-fleet-control redeploys qnfo-ops from main on a */20
# cron. A broken bundle or a leftover merge marker on main is therefore not merely a red CI
# run -- it is a bundle the cron can carry, or silently fail to carry (WORKER-BUILD-GATE-1).
# This workflow is the permanent gate that must stay green before anything reaches main.
#
# Gates enforced (see scripts/deploy_gate.py):
#   WORKER-BUILD-GATE-1     `wrangler deploy --dry-run` -- a REAL bundle build
#   CONFLICT-MARKER-GATE-1  # The coordinated + logged deploy itself happens LOCALLY under
# `deploy_guard.py with-lock` (DEPLOY-GUARD-BYPASS-1); CI validates the artifact, it does
# not deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine changed worker dirs
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD^"
          fi
          git diff --name-only "$BASE" HEAD 2>/dev/null | awk -F/ 'NF>1{print $1}' | sort -u | sed '/^$/d' > /tmp/changed.txt || true
          echo "changed dirs:"; cat /tmp/changed.txt || true

      - name: Gate every changed worker dir (build + conflict markers)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          rc=0
          while read -r d; do
            [ -z "$d" ] && continue
            if [ -f "$d/wrangler.toml" ]; then
              echo "::group::deploy-gate $d"
              python3 scripts/deploy_gate.py --check "$d" || rc=1
              echo "::endgroup::"
            else
              echo "skip $d (no wrangler.toml)"
            fi
          done < /tmp/changed.txt
          exit $rc

      - name: Gate ALL worker dirs (full sweep on manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          rc=0
          for d in */ ; do
            d="${d%/}"
            if [ -f "$d/wrangler.toml" ]; then
              echo "::group::deploy-gate $d"
              python3 scripts/deploy_gate.py --check "$d" || rc=1
              echo "::endgroup::"
            fi
          done
          exit $rc

      # CRON-RATE-CEILING-1 (owner directive 2026-09-23): no worker cron may execute more
      # than once every 10 minutes, nor more than 144 times in any 24-hour period.
      # Runs on EVERY push over ALL worker dirs -- a cron regression must fail CI even when
      # the edited worker is not the one carrying the offending cron.
      - name: CRON-RATE-CEILING-1 sweep (all worker dirs)
        run: python3 scripts/cron_rate_guard.py --root .

      # NARRATIVE-PROMPT-GUARD-1 (2026-09-26): a free-form narrative system prompt must
      # guide PROCESS, not prescribe specific output TEXT. Fails if a narrative-generation
      # worker source re-acquires the output-text prescriptions stripped from qnfo-ai v5.28.6.
      - name: NARRATIVE-PROMPT-GUARD-1 (narrative prompt guides process, not output text)
        run: python3 scripts/narrative-prompt-guard.py

      # CLOUDFLARE-ONLY-HOST-1 (owner directive 2026-10-01): all data, dashboards and UI are hosted on Cloudflare,
      # never on claude.ai. Fails when any tracked file links a claude.ai-hosted artifact, doc or page as a place
      # the fleet or the owner keeps something. Runs on every push and PR over the whole tree.
      - name: CLOUDFLARE-ONLY-HOST-1 (no fleet data or UI on claude.ai)
        run: python3 scripts/cloudflare-only-host-guard.py

      # IDENTITY-WEEKLY-1: the weekly identity review that replaced a claude.ai Routine runs in qnfo-fleet-dashboard,
      # the only worker bound to the private qnfo-identity store; its offline suite (synthetic doc, stubbed APIs,
      # recording D1, Monday-once throttle) must stay green.
      - name: IDENTITY-WEEKLY-1 offline suite (qnfo-fleet-dashboard)
        run: node qnfo-fleet-dashboard/identity-weekly.test.mjs

      # OWNER-EDIT-1 + IDENTITY-STORE-1: the owner edits owner_docs (the Identity doc) on fleet.qnfo.org, stored in the
      # private qnfo-identity D1. The suite drives the real fetch handler against in-memory SQLite D1s (node:sqlite needs
      # Node 22, so this last step switches runtime).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: OWNER-EDIT-1 and IDENTITY-STORE-1 offline suite (qnfo-fleet-dashboard)
        run: node qnfo-fleet-dashboard/owner-edit.test.mjs

      # OBJECTIVE-REVISION-APPLY-1 + OWNER-NOTES-ROUTE-1: owner decisions made on fleet.qnfo.org are applied on Cloudflare
      # (ratified weight changes, constraints filed as fleet work, card notes queued as intents), never by a session.
      - name: OBJECTIVE-REVISION-APPLY-1 and OWNER-NOTES-ROUTE-1 offline suite (qnfo-fleet-dashboard)
        run: node qnfo-fleet-dashboard/objective-apply.test.mjs

      # WATCHMAKER-INDEX-1: the fleet's own daily count of recurring operations that still need a person or a session.
      - name: WATCHMAKER-INDEX-1 offline suite (qnfo-fleet-dashboard)
        run: node qnfo-fleet-dashboard/watchmaker.test.mjs

      # OWNER-QUEUE-MCP-1 (pillar autonomy): the owner's queue is readable and answerable from any MCP client through the
      # dashboard's own emailed-code gate (qnfo-tools-mcp owner_queue / owner_code / owner_act); the code never reaches mcp_log.
      - name: OWNER-QUEUE-MCP-1 offline suite (qnfo-tools-mcp)
        run: node qnfo-tools-mcp/owner-queue.test.mjs

      # MSGRAPH-MAIL-1 + MSGRAPH-NO-CODES-1 (pillar personal): Outlook.com mail through Microsoft Graph into email_index.
      # Mocked Microsoft login and Graph over a node:sqlite D1; one-time codes must never be indexed.
      - name: MSGRAPH-MAIL-1 offline suite (personal-api)
        run: node --test personal-api/msgraph/msgraph.test.mjs
      # AWAY-GATE-2 (pillar personal, #1884): the brief hides Amsterdam on-site events inside a lodging away window.
      - name: AWAY-GATE-2 offline suite (personal-api)
        run: node personal-api/away-gate.test.mjs
      # CONNECTION-LEDGER-1 step 1 (pillar personal, #1951): went answers become Ledger people and in_person interactions, idempotently.
      - name: CONNECTION-LEDGER-1 offline suite (personal-api)
        run: node personal-api/ledger-sync.test.mjs
      # ITINERARY-INGEST-1 + SOURCE-FRESHNESS-1 (pillar personal, #1881): flight/hotel confirmation parser, idempotent upsert,
      # DMARC gate and freshness guard in qnfo-email, against fakes.
      - name: ITINERARY-INGEST-1 offline suite (qnfo-email)
        run: node qnfo-email/itinerary-ingest.test.mjs
      # WORK-WITH-ME-1 + WORK-WITH-ME-METRIC-1 (pillar reach): qnfo.org/work-with-me makes no claim STRATEGY s2.2 rules out,
      # every offer mails rowan.quni@qnfo.org with a [work-with-me:<offer>] subject tag and valid JSON-LD; the reach ingest
      # counts those tagged contacts and the page's RUM views over 30 days, idempotently, into reach_signals and metric_registry.
      # Q08-METRICS-1 (pillar reach): q08 counts human vs crawler reads per day and serves the 7d aggregates on /api/metrics.
      - name: Q08-METRICS-1 offline suite (q08-signal-engine)
        run: node q08-signal-engine/metrics.test.mjs
      - name: WORK-WITH-ME-1 page suite (qnfo-gateway)
        run: node qnfo-gateway/work-with-me.test.mjs
      - name: WORK-WITH-ME-METRIC-1 offline suite (qnfo-fleet-dashboard)
        run: node qnfo-fleet-dashboard/work-with-me.test.mjs
      # ASK-LOOP-1: ask.qwav.tech measures, evaluates, tunes and dispatches its own fixes (qnfo-ai-search). The suite drives
      # the real handler and cron with stubbed AI Search, gateway, idea-hub and Workers AI over in-memory SQLite.
      - name: ASK-LOOP-1 offline suite (qnfo-ai-search)
        run: node qnfo-ai-search/ask-loop.test.mjs
      # SELECTED-WORKS-OPENALEX-1 (#1786) + IMPACT-FAILCLOSED-2 (#1782): the daily citation pass measures all seven selected
      # works (STRATEGY s2.4) whatever their age, and /run?commit=1 refuses callers while IMPACT_TOKEN is unset.
      - name: SELECTED-WORKS-OPENALEX-1 offline suite (qnfo-paper-indexer)
        run: node qnfo-paper-indexer/impact.test.mjs
      # AIG-BINDING-1 (#1784): qnfo-ai embedding calls go through AI Gateway default (24h cache, metadata worker/purpose on
      # the log entry, one plain-binding retry on a gateway error); chat calls and caller options are unchanged.
      - name: AIG-BINDING-1 offline suite (qnfo-ai)
        run: node qnfo-ai/aig-binding.test.mjs
      # DS-402-BREAKER-1 (qnfo-ai 5.31.2): an empty DeepSeek balance (HTTP 402) opens a 60-minute breaker instead of a
      # failed paid round trip per request.
      - name: DS-402-BREAKER-1 offline suite (qnfo-ai)
        run: node --no-warnings qnfo-ai/ds-402-breaker.test.mjs
      # ENSEMBLE-RUN-LOG-1 (qnfo-ai 5.31.3, #1889): every ensemble call leaves one cloud_ops_events row with the primary
      # and validator families and the verdict, so same-family agreement is measurable. ENSEMBLE-FAMILY-DISJOINT-1
      # (5.31.4): the same suite holds the pool to one model per family and the validator to another family than the primary.
      - name: ENSEMBLE-RUN-LOG-1 offline suite (qnfo-ai)
        run: node --no-warnings qnfo-ai/ensemble-run-log.test.mjs
      # UTF8-DEPLOY-1: worker source fetched from GitHub reaches the upload as the same UTF-8 text (no double encoding).
      - name: UTF8-DEPLOY-1 offline suite (qnfo-ops)
        run: node qnfo-ops/utf8-deploy.test.mjs
      # CRON-APPLY-PARSE-1: the canonical deploy applies the [triggers] crons assignment, not the first "crons" in a comment
      # (radar-hub, qnfo-cloud-ops and qnfo-fleet-dashboard schedules were never applied); sweeps every live wrangler.toml.
      - name: CRON-APPLY-PARSE-1 offline suite (qnfo-ops)
        run: node qnfo-ops/cron-apply-parse.test.mjs
      # REVISER-FLAGGED-DEADEND-1 (#1812): a HIGH reviser finding becomes an unconfirmed internal_errata row (with the model
      # confidence and the reviser run id) plus an internal-open errata_queue row; nothing is queued or shown to readers.
      - name: REVISER-FLAGGED-DEADEND-1 offline suite (qnfo-paper-reviser)
        run: node --no-warnings qnfo-paper-reviser/flagged-errata.test.mjs
      # MATH-DELIM-1 / TABLE-SEP-1: paper renderer regressions from the 2026-10-02 full-corpus sweep (qnfo-gateway).
      - name: Paper renderer suite (qnfo-gateway)
        run: node qnfo-gateway/render.test.mjs
      # REACH-LAYER-1 (pillar reach): every qnfo.org / papers.qnfo.org HTML page carries a share image, canonical, JSON-LD
      # with the owner's ORCID, the author credit, Work with me, the iPatent link and a subscribe box (or the declared
      # no-form link on work-with-me), and passes the REACH-IDEATION checks copied from qnfo-fleet-control.
      - name: REACH-LAYER-1 offline suite (qnfo-gateway)
        run: node qnfo-gateway/reach-layer.test.mjs
      # HUB-SWR-1 (#1910): the qnfo.org home is served from the edge cache and rebuilt in the background.
      - name: HUB-SWR-1 offline suite (qnfo-gateway)
        run: node qnfo-gateway/hub-swr.test.mjs
      # idea-hub 1.5.4: share card + iPatent link (#1919 #1920) and the stale-while-revalidate home.
      - name: IDEAS reach + SWR offline suite (idea-hub)
        run: node idea-hub/reach-swr.test.mjs
      # CODE-TASK-MERGE-RUNNER-1: qnfo-fleet-control merges code-loop PRs itself. The suite replays the merge decision (every
      # refusal), the CI kick, merge, deploy and live verification and the inverse-patch revert against a scripted GitHub and
      # an in-memory D1 (node:sqlite, so it runs here after the Node 22 switch).
      - name: CODE-TASK-MERGE-RUNNER-1 offline suite (qnfo-fleet-control)
        run: |
          set -euo pipefail
          out=$(node qnfo-fleet-control/code-merge.test.mjs)
          echo "$out"
          echo "$out" | grep -q " 0 failed" \
            || { echo "::error::code-merge runner suite reported failures"; exit 1; }
      # BRANCH-HYGIENE-1: merged branches are deleted, an unmerged branch is archived (refs/archive/<branch>) before it is deleted,
      # open pull requests and in-flight code tasks are never touched. Scripted GitHub + in-memory D1.
      - name: BRANCH-HYGIENE-1 offline suite (qnfo-fleet-control)
        run: |
          set -euo pipefail
          out=$(node qnfo-fleet-control/branch-hygiene.test.mjs)
          echo "$out"
          echo "$out" | grep -q " 0 failed" \
            || { echo "::error::branch-hygiene suite reported failures"; exit 1; }
      # SELF-REPAIR-1 (#1768): a code task whose model attempts fail retries in backoff rounds and is then handed to the fleet as one
      # agent_issues row, never parked as a needs_human owner card. The suite replays ct_qldqse7ngltdth (a 93 KB q08-shaped worker,
      # a duplicate SEARCH, two no-block replies) through to a patch that git-applies, and runs the dashboard's own owner-card query.
      - name: SELF-REPAIR-1 offline suite (qnfo-code-orchestrator)
        run: node --no-warnings qnfo-code-orchestrator/self-repair.test.mjs
      # QDS-1: qds.css served; HTML 404s for browsers and JSON for API clients; the privacy notice; archive and QWAV hosts;
      # each paper's JSON-LD names its own licence (LICENSE-ONE-1).
      - name: QDS-1 gateway pages offline suite (qnfo-gateway)
        run: node --no-warnings qnfo-gateway/qds-pages.test.mjs
      # ASK-GAP-1: questions the corpus could not answer become idea proposals once each, through the public research gate,
      # at most five a run and never while triage is backed up (idea-hub's own runAskGap on an in-memory D1).
      - name: ASK-GAP-1 offline suite (idea-hub)
        run: node --no-warnings idea-hub/ask-gap.test.mjs
      - name: OPEN-ACCESS-1 offline suite (qnfo-fleet-dashboard)
        run: node qnfo-fleet-dashboard/open-access.test.mjs
      # FLEET-CONSOLE-1: the owner console in the command line (issue detail, SQL, issue edits, dispatch, deploy, merge):
      # owner-only reads and actions, destructive ones behind a confirm button and a fresh code, no loop-token access,
      # SQL writes refused on protected tables and backed up before UPDATE/DELETE.
      - name: FLEET-CONSOLE-1 offline suite (qnfo-fleet-dashboard)
        run: node --no-warnings qnfo-fleet-dashboard/fleet-console.test.mjs
      # OPS-PUBLIC-READ-1: qnfo-ops answers a chat with no key, or a stale one, in public read-only mode (free tier, only
      # fleet_status, backlog_status and privacy-safe public_data, capped per visitor and per day); private stores, writes,
      # paid upstreams, caches, durable jobs and checkpoints stay behind the key.
      - name: OPS-PUBLIC-READ-1 offline suite (qnfo-ops)
        run: node qnfo-ops/public-read.test.mjs
      # SECRET-CHANGE-WATCH-1: qnfo-ops records every worker secret change (never a value) and files one consumer check per
      # worker per change day, with a heartbeat the watchmaker reads.
      - name: SECRET-CHANGE-WATCH-1 offline suite (qnfo-ops)
        run: node qnfo-ops/secret-watch.test.mjs
      # ERROR-DETAIL-CAPTURE-1: qnfo-ops copies Workers Logs error events into worker_logs (outcome, exception name and
      # message; URL path only, emails, tokens and long numbers masked, as worker_logs is served publicly).
      - name: ERROR-DETAIL-CAPTURE-1 offline suite (qnfo-ops)
        run: node qnfo-ops/error-capture.test.mjs
      # DS-402-BREAKER-1 (qnfo-ops 2.38.41, #1986, #1939): one paid 402 per hour at most, shared across isolates via
      # cloud_ops_events kind ds-402-breaker; D1-CALLER-REJECT-1 (#1925): a refused model SQL is logged as rejected.
      - name: DS-402-BREAKER-1 offline suite (qnfo-ops)
        run: node --no-warnings qnfo-ops/ds-402-breaker.test.mjs
      - name: D1-CALLER-REJECT-1 offline suite (qnfo-ops)
        run: node --no-warnings qnfo-ops/d1-caller-reject.test.mjs
      # GUARD-RCS-CANCELLED-1: a concurrency-cancelled or skipped guard run is not a guard that failed closed.
      - name: GUARD-RCS-CANCELLED-1 offline suite (qnfo-fleet-dashboard)
        run: node qnfo-fleet-dashboard/guard-rcs.test.mjs
      # FLEET-CMD-1: the fleet command line (input outside the 10s refresh, open reads, emailed-code actions, 15-min step-up
      # for destructive ones, validated AI proposals, no hanging asks).
      - name: FLEET-CMD-1 offline suite (qnfo-fleet-dashboard)
        run: node qnfo-fleet-dashboard/fleet-cmd.test.mjs
      # ASK-RETRY-1: asks abandoned by a stopped worker are answered again by the cron (bounded), fastest model first.
      - name: ASK-RETRY-1 offline suite (qnfo-fleet-dashboard)
        run: node qnfo-fleet-dashboard/ask-retry.test.mjs
      # IPATENT-USAGE-1: iPatent counts searches and drafts by broad topic only (never their text); the dashboard reads them.
      - name: IPATENT-USAGE-1 offline suites (qnfo-ipatent, qnfo-fleet-dashboard)
        run: |
          node qnfo-ipatent/usage.test.mjs
          node qnfo-ipatent/fleet-link.test.mjs
          node qnfo-subscribers/fleet-link.test.mjs
          node qnfo-ipatent/routes.test.mjs
          node qnfo-ipatent/error-json.test.mjs
          node --no-warnings qnfo-ipatent/bench-dataset.test.mjs
          node qnfo-fleet-dashboard/ipatent-usage.test.mjs
      # Q08-REVIEW-2026-10-31 (#1716): the one-shot q08 decision on bot-filtered RUM page views and the cadence cap
      # q08-signal-engine reads (Q08-CADENCE-CAP-1); a deferral never satisfies the remediation probe.
      - name: Q08-REVIEW-2026-10-31 offline suite (qnfo-fleet-dashboard + q08-signal-engine)
        run: node qnfo-fleet-dashboard/q08-review.test.mjs
      # PERFORMANCE-LOOP-1 (1.17.4): engaged_human_sessions_28d from bot-filtered RUM, unmeasured (never 0) on a failed or thin read.
      - name: ENGAGED-HUMAN-SESSIONS-1 offline suite (qnfo-fleet-dashboard)
        run: node qnfo-fleet-dashboard/performance.test.mjs
      # OWNER-SURFACE-HONESTY-1 + OBJECTIVE-AUTHORITY-TRUTH-1 (1.17.8): an inbox card only for mail that owes a reply (rules
      # in parity with qnfo-email-orchestrator INBOUND-SLA-1), data answers that need no model, plain answers on a model
      # failure, mail facts in the Ask context (public vs owner fields), and the credential behind every ratification.
      - name: OWNER-SURFACE-HONESTY-1 offline suite (qnfo-fleet-dashboard)
        run: node qnfo-fleet-dashboard/owner-surface.test.mjs
      # OWNER-MORNING-1: credit runway from the 7-day third-party gateway burn, /api/changes, an honest health pill,
      # human-only pageviews, a 60 s poll and a public refresh that does not re-measure the whole fleet.
      - name: OWNER-MORNING-1 offline suite (qnfo-fleet-dashboard)
        run: node --no-warnings qnfo-fleet-dashboard/owner-morning.test.mjs
      # REACH-INGEST-BACKFILL-1 (qnfo-fleet-dashboard 1.21.7, #1711): a day the reach ingest missed in the last 7 is
      # filled by the next tick (one day per tick).
      - name: REACH-INGEST-BACKFILL-1 offline suite (qnfo-fleet-dashboard)
        run: node --no-warnings qnfo-fleet-dashboard/reach-backfill.test.mjs

      # SAI-COMPOSITE-WEIGHTS-1 (#1739): survival_state.sai and the charter's Autonomy composite are the owner-weighted SAI.
      # The suite locks the scorer's SAI formula to the dashboard's computeSai (parity on a live fixture and 400 random
      # inputs), proves a sai_config weight change moves the SAI, and replays the DoD against an in-memory SQLite D1.
      - name: SAI-COMPOSITE-WEIGHTS-1 offline suite (qnfo-autonomy-scorer, parity with qnfo-fleet-dashboard)
        run: node --test qnfo-autonomy-scorer/sai.test.mjs

      # OUTREACH-CONSENT-1 + OUTREACH-OPTOUT-EVIDENCE-1 (#1710): cold email carries the opt-out line, never a fake "Re:",
      # honours suppression and the shared caps, and records per-send opt-out evidence the DoD probe reads.
      - name: OUTREACH-CONSENT-1 offline suite (qnfo-cloud-ops)
        run: node qnfo-cloud-ops/outreach-consent.test.mjs
      # OUTREACH-LEARNER-1 (docs/STRATEGY.md s6.4): reply outcomes and Beta posteriors per segment, Thompson allocation
      # inside the unchanged shared caps, the stop rule, kill switch, the two reach metrics (and their trigger migration),
      # and SENT-AS-YOU-DELIVERY-1 (the daily digest mailed once to the owner's qnfo.org address).
      - name: OUTREACH-LEARNER-1 offline suite (qnfo-cloud-ops)
        run: node qnfo-cloud-ops/outreach-learner.test.mjs
      - name: OUTREACH-CF-DOW-1 cron weekday check (qnfo-outreach)
        run: node qnfo-outreach/cron-dow.test.mjs
      - name: KAIZEN-CF-MONDAY-1 cron weekday check (qnfo-kaizen)
        run: node qnfo-kaizen/cron-dow.test.mjs
      # 2026-10-05 remediation (cluster B2): LAND-BUNDLE-GUARD-1 (#1985), REPO-LIVE-DRIFT-1 (#1879), lifecycle cadence units
      # and UNMEASURED class (#1865), SECRET-ONLY-LEDGER-1 (#1976).
      - name: LAND-BUNDLE-GUARD-1 offline suite (qnfo-fleet-control)
        run: node --no-warnings qnfo-fleet-control/land-bundle.test.mjs
      - name: REPO-LIVE-DRIFT-1 offline suite (qnfo-fleet-control)
        run: node --no-warnings qnfo-fleet-control/repo-live-drift.test.mjs
      - name: REMEDIATION-REOPEN-1 offline suite (qnfo-fleet-control)
        run: node --no-warnings qnfo-fleet-control/remediation-reopen.test.mjs
      - name: METRIC-FRESHNESS cadence units offline suite (qnfo-lifecycle)
        run: node --no-warnings qnfo-lifecycle/metric-freshness.test.mjs
      - name: SECRET-ONLY-LEDGER-1 offline suite (qnfo-deploy-guard)
        run: node --no-warnings qnfo-deploy-guard/secret-only-ledger.test.mjs

      # REACH-LOOPS-WATCH-1: the delegated identity and reach loops record their runs on Cloudflare (WATCHMAKER_OPS reads
      # them). qnfo-social SOCIAL-RUN-LEDGER-1; qnfo-cloud-ops EMAIL-TRIAGE-D1-1 (triage reads D1, no EMAIL_API_KEY) and
      # ZENODO-UA-1 (honest User-Agent); radar-hub JOB-MARKET-INLINE-1, MENTION-RADAR-LEDGER-1, EVENTS-RADAR-CF-DOW-1.
      - name: SOCIAL-RUN-LEDGER-1 offline suite (qnfo-social)
        run: node qnfo-social/run-ledger.test.mjs
      # SOCIAL-DISTRIBUTION-LEARNER-1 (STRATEGY 6.4): the Thompson-sampling distribution learner chooses only among queued
      # posts inside the weekly cap, pause flag and content gates, credits each post's 72h reward once, and its kill switch
      # restores the old order. The drain's own gate suite runs with it, since the learner changes how the drain picks.
      - name: SOCIAL-DISTRIBUTION-LEARNER-1 offline suite (qnfo-social)
        run: node qnfo-social/social-learner.test.mjs
      - name: qnfo-social posting gates offline suite (POST-ID-UTM-1, OWNER-VOICE-CONTENT-GATE-1, SOCIAL-ADHOC-GATE-1)
        run: node qnfo-social/social-gates.test.mjs
      - name: CARD-RELEASE-1 offline suite (qnfo-social; an owner queue card releases a waiting post)
        run: node qnfo-social/card-release.test.mjs
      # REACH-SELECT-1 + REACH-REFILL-1 (pillar reach): the fleet composes and queues threads itself, only about STRATEGY 2.4
      # selected works and pillar 1-3 papers; the queue refills from the selected works when it runs low.
      - name: REACH-SELECT-1 offline suite (qnfo-social)
