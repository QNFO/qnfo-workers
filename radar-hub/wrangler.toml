name = "radar-hub"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# Bindings verified from live CF API 2026-09-13 (BINDING-PRESERVATION-1)
[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "AUDIT_DB"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[services]]
binding = "CAL_API"
service = "qnfo-lifecycle"
environment = "production"
# CAL-CALLER-PROPS-1 (2026-10-05): radar-hub holds no CAL_TOKEN secret, so calendar-api refused every personal-radar call
# (0 posted after 2026-09-23). calendar-api 0.7.1+ authorizes this binding by its props; the canonical deploy installs them
# (qnfo-ops BINDING-PROPS-APPLY-1). No key copy.
props = { caller = "radar-hub", member = "calendar-api" }

[[services]]
binding = "EMAIL"
service = "qnfo-email"
environment = "production"

# workflow binding: JOB_MARKET_WATCH -> class JobMarketWatchWorkflow
# Set via CF dashboard or wrangler.toml [[workflows]] block when class is defined in main

# OBSIDIAN_WRITER service binding removed 2026-10-01 (RADAR-HUB-REDEPLOY-1): its target worker obsidian-writer is no longer in the
# account, and Cloudflare rejects an upload that binds a missing worker (error 10144). worker.js guards every use with
# `if (env.OBSIDIAN_WRITER)`, so the vault-note step is skipped and the D1 writes (the actual output) are unaffected.

[[d1_databases]]
binding = "PERSONAL_DB"
database_name = "personal-life"
database_id = "e8d6c61a-10b7-4086-b81e-9e6e85afa407"

[[d1_databases]]
binding = "RADAR_DB"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[r2_buckets]]
binding = "VAULT"
bucket_name = "obsidian-vault"

# workflow binding (AUDIT-REMEDIATE-1 2026-09-22; verified vs live CF bindings)
[[workflows]]
binding = "JOB_MARKET_WATCH"
name = "job-market-watch"
class_name = "JobMarketWatchWorkflow"

# RADAR-HUB-REDEPLOY-1 (2026-10-01): the worker vanished unrecorded around 2026-09-25 and a deleted worker loses its schedules,
# so they are declared here (the canonical deploy applies them). They are exactly the cron strings the default export routes:
# events 0 5 * * 2 | arxiv 30 8 * * * | research 0 6 1 * *, 0 8 * * 7, 0 9 * * 7 | citation 0 11 1,15 * * |
# job-market 0 7 * * 2 | personal 30 5 * * 2, 0 6 * * *
# EVENTS-RADAR-CF-DOW-1 (2026-10-02): events was "0 5 * * 1", which is Sunday in Cloudflare's numbering (1=Sunday..7=Saturday);
# the radar reads its weekly sources only on Mondays, so "0 5 * * 2" (Monday 05:00Z). Same count of crons (net-zero).
[triggers]
# CRON-SINGLE-TRIGGER-1 (2026-10-02, #1785): ONE hourly trigger; worker.js CRON_TABLE holds the former list
# (0 5 * * 2, 30 8 * * *, 0 6 1 * *, 0 8 * * 7, 0 9 * * 7, 0 11 1,15 * *, 0 7 * * 2, 30 5 * * 2, 0 6 * * *) and runs each entry in the hour it fired.
crons = ["0 * * * *"]
