name: workflow-lint

# WORKFLOW-YAML-LINT-1 (2026-09-29).
#
# Structural prevention for the class that silently killed the canonical qnfo-ops
# deploy path: an unquoted colon inside a step NAME made deploy-qnfo-ops.yml
# unparseable, so GitHub created runs with ZERO jobs, conclusion=failure, and no
# job log for any monitor to read. The deploy stopped happening and nothing said so.
#
# A workflow that cannot produce a job must never reach main. This gate parses every
# workflow file and requires a non-empty `jobs:` mapping, and it fails closed.
#
# scripts/workflow-lint.py is the checker; it is also runnable standalone.

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/workflow-lint.py'
      - 'scripts/secret-mutation-guard.py'
      - 'scripts/secret-mutation-allowlist.txt'
      - 'scripts/secret_lock.py'
      - 'scripts/*.py'
      - 'scripts/status_unchanged.py'
      - 'scripts/status_unchanged_test.py'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/*.py'
      - 'scripts/secret-mutation-allowlist.txt'
      - 'scripts/status_unchanged.py'
      - 'scripts/status_unchanged_test.py'
  workflow_dispatch:

permissions:
  contents: read

# GHA-AUDIT-1: a newer push to a PR cancels the superseded run; push runs are grouped per sha and never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # RUNNER-PIN-2 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest becomes Ubuntu 26 by 2026-11-19 (a notice on every job meanwhile); pinned to ubuntu-24.04 until an ubuntu-26.04 trial run is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - run: pip install --quiet pyyaml

      - name: Lint every workflow file (fail closed)
        run: python3 scripts/workflow-lint.py

      - name: STATUS-NOOP-SKIP-1 self-test (skip stamp-only status commits, never an outcome change)
        run: python3 scripts/status_unchanged_test.py

      - name: SECRET-LOCK-ENFORCE-1 guard (fail CI when a secrets or bindings mutation skips the secret-lock)
        run: python3 scripts/secret-mutation-guard.py

      # ANNOTATION-FIXTURE-QUIET-1 (2026-10-20): the tests feed fake lock outages to scripts/secret_lock.py, which prints a real
      # `::warning::SECRET-LOCK-UNAVAILABLE ...` workflow command; the runner turned the five fixture lines into five warning
      # annotations on every green run, which read as a live lock outage. The helper switches commands off around the test only.
      - name: SECRET-LOCK-ENFORCE-1 offline tests
        run: bash scripts/stop-commands.sh python3 scripts/secret-mutation-guard_test.py

      - name: CANONICAL-DEPLOY-SKIP-1 offline tests (a refused creation of an absent worker is a skip, any other failure still fails)
        run: python3 scripts/canonical_deploy_skip_test.py
