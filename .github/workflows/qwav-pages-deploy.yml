# QWAV-PAGES-DEPLOY-1 (2026-10-12, agent_issues 2424, 2307; charter pillar reach). qwav.org is the Cloudflare Pages project
# "qwav", built from the public repository QNFO/qwav. On 2026-10-12 a merge to that repository's main (PR 131, the Zenodo
# scrub) produced no new deployment within 10 minutes, so the project is not git-connected; this workflow is the fleet's
# deploy path for it: it checks out QNFO/qwav at the requested ref and runs a Pages direct upload with the repository's
# Cloudflare token. Rollback: dispatch again with the previous ref (the Pages dashboard keeps every deployment).
name: qwav-pages-deploy
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "QNFO/qwav git ref to deploy (branch, tag or sha)"
        required: false
        default: "main"
      project:
        description: "Pages project name"
        required: false
        default: "qwav"
      branch:
        description: "Pages deployment branch (main = production)"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: qwav-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out QNFO/qwav
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: QNFO/qwav
          ref: ${{ inputs.ref }}
          path: site
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Refuse a tree that still names the retired deposit service in a public page
        shell: bash
        run: |
          set -euo pipefail
          hits=$(grep -rIl -i -E 'zenodo|10\.5281/' site --include='*.html' --exclude-dir=.git || true)
          if [ -n "$hits" ]; then echo "::error::public HTML still names the retired deposit service:"; echo "$hits"; exit 1; fi
          echo "public HTML clean"
      - name: Pages direct upload
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IN_PROJECT: ${{ inputs.project }}
          IN_BRANCH: ${{ inputs.branch }}
        run: |
          set -uo pipefail
          cd site
          rm -rf .git .wrangler
          rc=0
          npx --yes wrangler@4 pages deploy . --project-name "$IN_PROJECT" --branch "$IN_BRANCH" --commit-dirty=true 2>&1 | tee ../deploy.log || rc=$?
          echo "wrangler rc=$rc"
          if [ "$rc" != "0" ]; then
            if grep -q -E 'Authentication error|10000|not authorized|403' ../deploy.log; then
              echo "::error::the repository token is refused for Pages writes: record the exact text below on agent_issues 2424 (this is the evidence an owner token is needed)"
            fi
            exit "$rc"
          fi
      - name: Verify the production host
        shell: bash
        run: |
          set -uo pipefail
          for i in 1 2 3 4 5 6; do
            body=$(curl -s -m 20 https://qwav.org/ || true)
            if [ -n "$body" ] && ! printf '%s' "$body" | grep -q -i -E 'zenodo|10\.5281/'; then echo "qwav.org clean on try $i"; exit 0; fi
            sleep 20
          done
          echo "::warning::qwav.org still shows the old build after 2 minutes (edge cache or a custom domain on another project); the deployment itself succeeded"
