name: deploy-containers-pilot

# CONTAINER-DEPLOY-WORKFLOW-MISSING-1 (2026-09-29). This file did not exist; it is the
# workflow qnfo-containers-pilot/wrangler.toml references as the only path that transmits
# [[containers]]. See the commit message for the full evidence chain.
#
# CONTAINER-DEPLOY-NEVER-RAN-1 (2026-09-29, later the same day). The workflow existed but
# had ZERO runs: the public Actions page for this workflow reported "0 workflow run
# results", and qnfo-containers-pilot's modified_on stayed pinned at 19:35:03.886591Z
# after a push that touched qnfo-containers-pilot/**. A deploy workflow that has never run
# is not a deploy path. Two things are therefore added here:
#   1. a self-triggering push path (this file itself), so an edit to the workflow is
#      sufficient to fire it -- no dependence on a second file changing;
#   2. an `if: always()` status step that commits ci-status/deploy-containers-pilot.json,
#      because a workflow whose only output is a step summary cannot be verified from
#      outside the runner. This fleet has repeatedly been unable to distinguish "the
#      deploy ran and failed" from "the deploy never ran"; the artifact removes that
#      ambiguity.
# Trigger surface stays deliberately broad (push to main + the pilot dir + this file +
# dispatch) because the failure mode being fixed is a trigger that never fired.

on:
  push:
    branches: [main]
    paths:
      - 'qnfo-containers-pilot/**'
      - '.github/workflows/deploy-containers-pilot.yml'
  workflow_dispatch:
    inputs:
      verify_only:
        description: "true = skip deploy, only run the container verification probe"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: deploy-containers-pilot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: assert the containers block is present in wrangler.toml
        id: assert
        run: |
          set -euo pipefail
          f=qnfo-containers-pilot/wrangler.toml
          for key in '\[\[containers\]\]' 'class_name = "ShellContainer"' 'image = ' 'instance_type = ' 'max_instances = ' '\[\[migrations\]\]'; do
            if ! grep -Eq "$key" "$f"; then
              echo "::error::wrangler.toml is missing required key: $key -- refusing to deploy"
              exit 1
            fi
          done
          echo "containers block present:"
          sed -n '/\[\[containers\]\]/,/^$/p' "$f"

      - name: wrangler deploy (transmits [[containers]])
        id: deploy
        if: ${{ github.event.inputs.verify_only != 'true' }}
        working-directory: qnfo-containers-pilot
        run: |
          set -o pipefail
          # --keep-vars preserves dashboard-set vars; secrets live in the secrets store.
          # Output is tee'd so the status artifact can carry the real failure text:
          # DO-MIGRATION-NOTE-1 warns this deploy can FAIL CLOSED on a creating migration
          # for an already-depended-on class, and a bare ::error:: cannot distinguish that
          # from a token problem or a bundling error.
          npx --yes wrangler@4 deploy --keep-vars 2>&1 | tee /tmp/wrangler.log
        env:
          WRANGLER_SEND_METRICS: "false"
        continue-on-error: true

      - name: wait for propagation
        if: ${{ github.event.inputs.verify_only != 'true' }}
        run: sleep 20

      - name: verify container config is live (closes #1485)
        id: verify
        run: |
          set -uo pipefail
          base="https://qnfo-containers-pilot.q08.workers.dev"
          if [ -z "${PILOT_TOKEN:-}" ]; then
            echo "::warning::PILOT_TOKEN not available to this workflow - container verification SKIPPED, #1485 NOT closed by this run"
            echo "rc=skipped-no-token" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code="$(curl -s -o /tmp/status.json -w '%{http_code}' -H "Authorization: Bearer $PILOT_TOKEN" "$base/status" || true)"
          echo "GET /status -> $code"
          cat /tmp/status.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "rc=probe-http-$code" >> "$GITHUB_OUTPUT"
            echo "::error::/status returned $code - container config still not live (#1485 open)"
            exit 1
          fi
          if grep -q "Cannot read properties of undefined" /tmp/status.json; then
            echo "rc=ctx-container-undefined" >> "$GITHUB_OUTPUT"
            echo "::error::/status reports the ctx.container-undefined signature - #1485 still open"
            exit 1
          fi
          echo "rc=ok" >> "$GITHUB_OUTPUT"
          echo "container config verified live"
        env:
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
        continue-on-error: true

      - name: publish status artifact (always)
        if: always()
        run: |
          set -uo pipefail
          mkdir -p ci-status
          wrangler_tail="$(tail -n 40 /tmp/wrangler.log 2>/dev/null | tr -d '\r' | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')"
          deploy_outcome="${{ steps.deploy.outcome }}"
          verify_rc="${{ steps.verify.outputs.rc }}"
          head_sha="$(git rev-parse HEAD)"
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > ci-status/deploy-containers-pilot.json <<JSON
          {
            "workflow": "deploy-containers-pilot",
            "marker": "CONTAINER-DEPLOY-NEVER-RAN-1",
            "head_sha": "$head_sha",
            "ts": "$ts",
            "deploy_outcome": "$deploy_outcome",
            "verify_rc": "$verify_rc",
            "wrangler_tail": $wrangler_tail
          }
          JSON
          python3 -c "import json;json.load(open('ci-status/deploy-containers-pilot.json'))" \
            && echo "status artifact is valid JSON" \
            || { echo "::error::status artifact is not valid JSON"; exit 1; }
          cat ci-status/deploy-containers-pilot.json
          git config user.name  "qnfo-fleet-bot"
          git config user.email "fleet-bot@qnfo.org"
          git add ci-status/deploy-containers-pilot.json
          if git diff --cached --quiet; then
            echo "no status change"
            exit 0
          fi
          git commit -m "chore(ci-status): deploy-containers-pilot outcome [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "status artifact pushed on attempt $i"
              exit 0
            fi
            echo "push rejected on attempt $i; rebasing onto origin/main"
            git pull --rebase --autostash origin main || true
          done
          echo "::error::could not push status artifact after 5 attempts"
          exit 1

      - name: summarize outcome
        if: always()
        run: |
          echo "## deploy-containers-pilot" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Closes: CONTAINER-CONFIG-DROPPED-1 / issue #1485" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "deploy_outcome=${{ steps.deploy.outcome }} verify_rc=${{ steps.verify.outputs.rc }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A green run means \`wrangler deploy\` transmitted the [[containers]] block AND" >> "$GITHUB_STEP_SUMMARY"
          echo "the authenticated /status probe came back 200 without the" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ctx.container\`-undefined signature. A red run is fail-closed and wipes nothing." >> "$GITHUB_STEP_SUMMARY"
