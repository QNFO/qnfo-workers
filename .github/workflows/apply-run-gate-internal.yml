name: apply-run-gate-internal

# INTERNAL-SERVICE-BINDING-AUTH-1 (2026-09-27)
#
# Problem: qnfo-backlog-exec `/run` required `Authorization: Bearer $RUN_TOKEN`.
# qnfo-ops triggers the drain over the BACKLOG service binding
# (env.BACKLOG.fetch("https://backlog.internal/run")) and holds 49 live bindings,
# none named RUN_TOKEN. Every drain attempt returned HTTP 401 -- the close handoff
# behind REMEDIATION-NONCONVERGENCE-1 (#1200) and DETECT-ACT-LOOP-SEVERED-1 (#1207).
#
# Deploy method: scripts/raw_put.py -> CF API /content (code-only PUT). This preserves
# every live binding (BINDING-PRESERVATION-1) and is fail-closed: it exits 3 and deploys
# nothing on any error, so a partial deploy cannot occur.
#
# Trigger: a push touching this file, or manual workflow_dispatch.

on:
  push:
    # BRANCH-FILTER-1 (2026-09-30): without this, a push to ANY branch that touches this workflow's paths ran it,
    # including its production deploy / push-to-main steps. Editing lifecycle-sot-and-deploy.yml on a PR branch did
    # exactly that (run 36740563280, a real qnfo-lifecycle /content PUT from a feature branch).
    branches: [main]
    paths:
      - '.github/workflows/apply-run-gate-internal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-run-gate-internal
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply INTERNAL-SERVICE-BINDING-AUTH-1 patch
        run: python3 scripts/run-gate-internal-patch.py

      - name: Preflight - artifact must carry the fix and parse
        run: |
          set -euo pipefail
          v=$(grep -c 'var VERSION = "1.7.0-run-gate-internal";' qnfo-backlog-exec/worker.js || true)
          x=$(grep -c 'internalCall' qnfo-backlog-exec/worker.js || true)
          y=$(grep -c 'CF-Connecting-IP' qnfo-backlog-exec/worker.js || true)
          echo "version-hits=$v internalCall-hits=$x cf-connecting-ip-hits=$y"
          test "$v" = "1"
          test "$x" = "2"
          test "$y" -ge 1
          node --check qnfo-backlog-exec/worker.js
          echo "preflight OK: patch applied and worker.js parses"

      - name: Deploy qnfo-backlog-exec (binding-preserving CF API /content PUT)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/raw_put.py qnfo-backlog-exec qnfo-backlog-exec/worker.js

      - name: Verify live VERSION via CF API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/qnfo-backlog-exec/content" \
            -o /tmp/live.js
          echo "live-content-bytes=$(wc -c < /tmp/live.js)"
          hits=$(grep -c '1.7.0-run-gate-internal' /tmp/live.js || true)
          echo "live-version-hits=$hits"
          test "$hits" -ge 1
          echo "VERIFIED: live qnfo-backlog-exec carries 1.7.0-run-gate-internal"
