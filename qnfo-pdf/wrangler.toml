name = "qnfo-pdf"
main = "worker.js"
# COMPAT-ADVANCE-WAVE-2 (2026-10-12, metric workers_compat_date_behind, qnfo-ops COMPAT-DATE-DECLARED-APPLY-1): the date moves
# from 2026-03-24 to 2026-10-10 on the next canonical deploy. Reviewed against qnfo-ops COMPAT_FLIPS between the two dates:
# earlier flips between 2026-03-24 and 2026-08-01 (WebSocket close handling, error serialization, Workflows error text, TLS options): this
# worker opens no WebSocket, uses no RPC or Workflows binding and no node:tls.
# 2026-08-04 nodejs_compat default on (this worker reads no timer id as a number, has no typeof process/Buffer branch and
# imports no node: module);
# 2026-10-01 Durable Object eviction (no Durable Object here). /ops/deploy reads /health through its
# COMPAT-HEALTH-BINDINGS-2 binding before the upload, keeps the date only when /health answers with the deployed VERSION
# and otherwise restores the previous date (deployment_history compat-restore).
# compat-advance: reviewed 2026-10-12
compatibility_date = "2026-10-10"


[observability]
enabled = true
head_sampling_rate = 1

# WORKERS-STANDARDS-1 (owner standards 2026-10-12): logs and traces declared. Workers docs: `enabled` alone turns on logs only;
# traces need [observability.traces]. Traces are sampled at the default rate of 1 (low-traffic worker).
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

head_sampling_rate = 0.05 # TRACES-SAMPLING-BEFORE-BILLING-1: stored traces bill from 2026-12-01
[browser]
binding = "BROWSER"

[[d1_databases]]
binding = "LIVING"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "qnfo-releases"

# SCHOLAR-PDF-ALL-1 (1.2.0, agent_issues 2410, pillar reach): the backlog loop records each run in cloud_ops_events (job qnfo-pdf) and
# writes metric_registry.scholar_pdf_backlog; the canonical deploy installs this binding (BINDING-INSTALL). Reads and writes stay to
# those two tables.
[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# SCHOLAR-PDF-ALL-1: one fire every 10 minutes (CRON-RATE-CEILING-1: 144 a day), PDF_BACKLOG_BATCH renders per fire; 472 papers without a
# PDF on 2026-10-12 clear in about 14 hours. The second path for the same outcome is the on-demand GET /pdf/<slug> render; a stalled loop
# is detected by fm-pdf-backlog-stalled (migrations/2026-10-12-30-scholar-pdf-backlog.sql).
[triggers]
crons = ["*/10 * * * *"]

[vars]
PDF_BACKLOG_BATCH = "6"
