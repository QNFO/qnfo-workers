name = "qnfo-calendar-intake"
main = "worker.js"
compatibility_date = "2026-09-13"
compatibility_flags = ["nodejs_compat"]

# Native Email Routing send binding (tokenless).
# AUDIT-REMEDIATE-1 2026-09-22: the previous `[[send_email]]` array-of-tables form was
# invalid and the binding was undeclared at top level (a wrangler deploy would have
# wiped SEND_EMAIL). Top-level keys must precede any [table]/[[array]] header.
send_email = [
  { name = "SEND_EMAIL", allowed_destination_addresses = ["rwnquni@outlook.com"] }
]

[triggers]
# CRON-RATE-CEILING-1 (owner directive 2026-09-23): no worker cron may execute more
# than once every 10 minutes, nor more than 144 times in any 24-hour period.
# Was "*/5 * * * *" = 288 fires/24h at 5-minute spacing.
# Re-timing is safe: scheduled() runs sch()+dis() with no cron-string branch, and dis()
# dispatches reminders WHERE remind_at <= now LIMIT 20, so delivery simply lands within
# 10 minutes of remind_at instead of 5. Reminder offsets (-1440/-60 min) are unaffected.
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "D1"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[services]]
binding = "CAL_API"
service = "calendar-api"
environment = "production"

[ai]
binding = "AI"

# Secrets (wrangler secret put): CAL_EMAIL_TOKEN, INGEST_TOKEN
