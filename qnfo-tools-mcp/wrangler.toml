name = "qnfo-tools-mcp"
main = "worker.js"
# COMPAT-ADVANCE-WAVE-2 (2026-10-12, metric workers_compat_date_behind, qnfo-ops COMPAT-DATE-DECLARED-APPLY-1): the date moves
# from 2026-08-01 to 2026-10-10 on the next canonical deploy. Reviewed against qnfo-ops COMPAT_FLIPS between the two dates:
# 2026-08-04 nodejs_compat default on (this worker reads no timer id as a number, has no typeof process/Buffer branch and
# imports no node: module);
# 2026-10-01 Durable Object eviction (no Durable Object here). /ops/deploy reads /health through its
# COMPAT-HEALTH-BINDINGS-2 binding before the upload, keeps the date only when /health answers with the deployed VERSION
# and otherwise restores the previous date (deployment_history compat-restore).
# compat-advance: reviewed 2026-10-12
compatibility_date = "2026-10-10"
workers_dev = true

# Secrets:
#   MCP_TOKEN     - Bearer token clients must present (?token= or Authorization header)
#   RT            - qnfo-ai router key used for outbound web_search/history_recall calls
#   EMAIL_API_KEY - qnfo-email Worker API key (same value as qnfo-email's API_KEY binding)
#   INTENT_TOKEN  - qnfo-intent-orchestrator key (express_desire / intents_list)
#   INFRA_TOKEN   - qnfo-infra key (infra_status / infra_analytics / infra_records)

[observability]
enabled = true
head_sampling_rate = 1

# D1 audit log (qnfo-audit)

# WORKERS-STANDARDS-1 (owner standards 2026-10-12): logs and traces declared. Workers docs: `enabled` alone turns on logs only;
# traces need [observability.traces]. Traces are sampled at the default rate of 1 (low-traffic worker).
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

head_sampling_rate = 0.05 # TRACES-SAMPLING-BEFORE-BILLING-1: stored traces bill from 2026-12-01
[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# Service bindings
[[services]]
binding = "EMAIL"
service = "qnfo-email"
environment = "production"

[[services]]
binding = "QNFO_AI"
service = "qnfo-ai"
environment = "production"
# INTERNAL-CALLER-PROPS-1 (#1703): qnfo-ai authenticates this binding by ctx.props.caller, so a router key
# rotation no longer strands this worker. Installed by qnfo-ops BINDING-PROPS-APPLY-1 on the canonical deploy.
props = { caller = "qnfo-tools-mcp" }

[[services]]
binding = "QNFO_INTENT"
service = "qnfo-intent-orchestrator"
environment = "production"

[[services]]
binding = "QNFO_INFRA"
service = "qnfo-infra"
environment = "production"

# STALE-BINDING-FIX (2026-09-15): PL_SEARCH binding to the retired search worker removed. Target returns
# 404 (not deployed). Since 1.2.1 personal_search calls QNFO_INTENT /personal/search.
# v1.1.1 - self-registration to the qnfo-ops service registry (cross-service discovery).
# Secret: REGISTRY_TOKEN (shared with qnfo-ops /registry/register) - set via wrangler secret put.
[[services]]
binding = "QNFO_OPS"
service = "qnfo-ops"
environment = "production"
