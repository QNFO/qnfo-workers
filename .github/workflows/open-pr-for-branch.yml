name: open-pr-for-branch
run-name: open-pr-for-branch ${{ github.ref_name }}
# COMPANION-PR-1: a session without a working GitHub token pushes a claude/** branch and this opens the pull request, so the lane merges it after checks.
# BOOTSTRAP-GATED-CHECKS-1 (owner directive 2026-11-10: "audit and remediate all failure modes ... impeding autonomous bootstrapping"): a pull request opened
# with the workflow token makes github-actions[bot] the actor of its pull_request run, and GitHub holds that run at action_required, so pr-checks never ran
# on 8 open claude/** pull requests (2026-11-10) and the lane could not merge any. The fleet user credential opens it instead, so checks start at once;
# the workflow token stays the fallback when the secret is absent.
on:
  push:
    branches:
      - 'claude/**'
permissions:
  contents: read
  pull-requests: write
jobs:
  open:
    timeout-minutes: 5
    # RUNNER-PIN-2 (2026-11-04): pinned to ubuntu-24.04 because ubuntu-latest moves to Ubuntu 26 until 2026-11-19; unpin after a green trial run on ubuntu-26.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Open a pull request when none exists
        env:
          GH_TOKEN: ${{ secrets.QNFO_GH_PAT || github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$n" = "0" ]; then
            # OPEN-PR-RACE-1 (2026-11-13): a session that has a token opens its own pull request seconds after the push, so the list above can read 0 and the
            # create then fails with "already exists" (run 43434633251 on #11514 stayed red and the PR merged over it). An existing PR is the goal, not a failure.
            if ! out=$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --title "$BRANCH" --body "Opened by open-pr-for-branch (COMPANION-PR-1) for a session without a GitHub token. work-claim: unreachable (no fleet network); no other open PR touches this branch." 2>&1); then
              echo "$out"
              if echo "$out" | grep -q 'already exists'; then echo "a pull request already exists for $BRANCH; nothing to do"; else exit 1; fi
            else
              echo "$out"
            fi
          fi
