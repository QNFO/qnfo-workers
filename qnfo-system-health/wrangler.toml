name = "qnfo-system-health"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

# R2 obsidian-vault: daily system-health markdown notes
[[r2_buckets]]
binding = "VAULT"
bucket_name = "obsidian-vault"

# Service bindings: core workers probed via Workers-to-Workers (public q08.workers.dev fetches 404 from Worker runtime)
[[services]]
binding = "QNFO_AI"
service = "qnfo-ai"
environment = "production"

[[services]]
binding = "PERSONAL_API"
service = "personal-api"
environment = "production"

[[services]]
binding = "CLOUD_OPS"
service = "qnfo-cloud-ops"
environment = "production"

[[services]]
binding = "KAIZEN"
service = "qnfo-kaizen"
environment = "production"

[[services]]
binding = "PAPER_INDEXER"
service = "qnfo-paper-indexer"
environment = "production"

[[services]]
binding = "ERROR_SELFHEAL"
service = "qnfo-error-selfheal"
environment = "production"

[triggers]
crons = ["0 5 * * *"]

[observability]
enabled = true
