name: apply-cron-only-class-2

# CRON_ONLY-2 (issue #1402) applier runner - credential-free by design.
#
# APPLIER-CI-CREDENTIAL-GAP-1 (issue #1486): apply-cron-only-class-1 gated its
# commit-back on a behavioural check that requires the live CF script list
# (scripts/deploy-drift-guard.py lines 323-324 read CF_ACCOUNT_ID +
# CLOUDFLARE_API_TOKEN). With no CF secrets in CI the guard degrades to
# NOT_DEPLOYED, the positive check classifies nothing (positive_classified=""),
# and the commit-back never runs - so #1402 could never land. Evidence:
# ci-status/cron-only-class-1.json, ts 2026-09-29T19:30:58Z, pre 0 -> post 9
# in the runner tree, no main-side change.
#
# This runner invokes scripts/patch-cron-only-class-2.py, whose ONLY pre-commit
# gate is `py_compile`; every behavioural check runs post-commit as non-blocking
# DIAG output. A red run is therefore always self-explaining.
#
# CI-TRIGGER-SKIP-1: no [skip ci] anywhere in this file or in its commit messages.

on:
  push:
    paths:
      - 'scripts/patch-cron-only-class-2.py'
      - '.github/workflows/apply-cron-only-class-2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-cron-only-class-2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: record pre-patch state
        run: |
          set -e
          echo "guard bytes: $(wc -c < scripts/deploy-drift-guard.py)"
          echo "CRON_ONLY before: $(grep -c CRON_ONLY scripts/deploy-drift-guard.py || true)"
          cp scripts/deploy-drift-guard.py /tmp/pre-guard.py

      - name: apply CRON_ONLY-2 patch
        id: patch
        continue-on-error: true
        run: |
          set +e
          python3 scripts/patch-cron-only-class-2.py > /tmp/patch.log 2>&1
          rc=$?
          echo "patch_rc=$rc"
          echo "patch_rc=$rc" >> "$GITHUB_OUTPUT"
          cat /tmp/patch.log
          exit 0

      - name: py_compile gate (the only pre-commit gate)
        id: gate
        run: |
          set -e
          python3 -m py_compile scripts/deploy-drift-guard.py
          echo "py_compile OK"

      - name: commit patched guard
        run: |
          set -e
          git config user.name "qnfo-ci"
          git config user.email "ci@qnfo.org"
          git add scripts/deploy-drift-guard.py
          if git diff --cached --quiet; then
            echo "no source change to commit (already applied)"
            exit 0
          fi
          git commit -m "fix(drift-guard): CRON_ONLY-2 class scheduled-only workers as CRON_ONLY (issue #1402)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main >/dev/null 2>&1 || true
            if git push origin HEAD:main; then echo "commit-back push OK attempt $i"; exit 0; fi
            echo "push attempt $i rejected - retrying"
            sleep 6
          done
          echo "COMMIT-BACK FAILED after 5 attempts"
          exit 1

      - name: verify landed on main
        run: |
          set -e
          git fetch origin main
          git show origin/main:scripts/deploy-drift-guard.py > /tmp/landed.py
          grep -qF 'CRON_ONLY-2' /tmp/landed.py
          python3 -m py_compile /tmp/landed.py
          echo "LANDED OK on origin/main with $(grep -c CRON_ONLY /tmp/landed.py) CRON_ONLY occurrences"

      - name: DIAG - post-commit behavioural checks (non-blocking)
        if: always()
        continue-on-error: true
        run: |
          set +e
          echo "--- DIAG positive control: ai-health-prober ---"
          python3 scripts/deploy-drift-guard.py ai-health-prober 2>&1 | tail -20
          echo "--- DIAG negative control: cron-neg-probe (has workers_dev) ---"
          mkdir -p cron-neg-probe
          printf 'name = "cron-neg-probe"\nworkers_dev = true\n\n[triggers]\ncrons = ["*/20 * * * *"]\n' > cron-neg-probe/wrangler.toml
          python3 scripts/deploy-drift-guard.py cron-neg-probe 2>&1 | tail -20
          rm -rf cron-neg-probe
          echo "--- DIAG negative control: cron-nocfg-probe (no config) ---"
          mkdir -p cron-nocfg-probe
          python3 scripts/deploy-drift-guard.py cron-nocfg-probe 2>&1 | tail -20
          rm -rf cron-nocfg-probe

      - name: publish outcome artifact
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p ci-status
          PRE=$(grep -c CRON_ONLY /tmp/pre-guard.py 2>/dev/null || echo 0)
          POST=$(grep -c CRON_ONLY scripts/deploy-drift-guard.py 2>/dev/null || echo 0)
          PRC="${{ steps.patch.outputs.patch_rc }}"
          HEAD=$(git rev-parse HEAD)
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 - "$PRE" "$POST" "$PRC" "$HEAD" "$TS" <<'PY'
          import json, sys
          pre, post, prc, head, ts = sys.argv[1:6]
          doc = {
              "workflow": "apply-cron-only-class-2",
              "issue": "1402 / CRON_ONLY-2",
              "marker": "CRON_ONLY-2",
              "pre_marker_count": pre,
              "post_marker_count": post,
              "patch_rc": prc,
              "head": head,
              "ts": ts,
              "credential_free": True,
          }
          open("ci-status/cron-only-class-2.json", "w").write(json.dumps(doc, indent=2, sort_keys=True) + "\n")
          print(json.dumps(doc))
          PY
          git config user.name "qnfo-selfheal-bot"
          git config user.email "selfheal@qnfo.org"
          git add ci-status/cron-only-class-2.json
          if git diff --cached --quiet; then echo "artifact unchanged"; exit 0; fi
          git commit -m "ci(cron-only-class-2): outcome artifact"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main >/dev/null 2>&1 || true
            if git push origin HEAD:main; then echo "artifact push OK attempt $i"; exit 0; fi
            sleep 6
          done
          echo "artifact push failed"
