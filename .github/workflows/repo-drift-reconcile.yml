name: repo-drift-reconcile

# REPO-IS-DEPLOY-SOURCE-1 / SERVER-SIDE-DEPLOY-1: the recurring "job that lands code fixes".
# Capability (proven 2026-09-27): detect repo<->live drift -> GET /workers/scripts/{name}
# (multipart-wrapped live source) -> unwrap -> write the byte-true mirror -> commit.
# Idempotent: writes a mirror ONLY when its VERSION differs from the live /health version.
# The readable source worker.js is NEVER touched (convention: mirror = byte-true artifact).
on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-drift-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect drift and sync mirrors to live
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ACCT: edb167b78c9fb901ea5bca3ce58ccc4b
        run: |
          set -u
          changed=0
          for w in $(git ls-files | grep -E '^[^/]+/worker\.js$' | sed -E 's#/worker\.js$##' | sort -u); do
            [ -f "$w/deployed-current.worker.js" ] || continue

            lv=$(curl -sS -m 8 "https://$w.q08.workers.dev/health" 2>/dev/null \
                 | python3 -c "import sys,json;print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
            [ -n "$lv" ] || continue

            mv=$(grep -m1 -oE 'VERSION[[:space:]]*=[[:space:]]*["'\'']([^"'\'']+)' "$w/deployed-current.worker.js" 2>/dev/null \
                 | sed -E 's/.*["'\'']//' || true)

            [ "$mv" = "$lv" ] && continue
            echo "DRIFT $w :: mirror=[$mv] live=[$lv]"

            if [ -z "${CF_TOKEN:-}" ]; then
              echo "  no CF_API_TOKEN secret; detect-only for $w"; continue
            fi

            curl -sS -m 60 "https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/scripts/$w" \
              -H "Authorization: Bearer $CF_TOKEN" -o /tmp/raw.bin 2>/dev/null || { echo "  fetch failed"; continue; }

            python3 - "$w" <<'PY'
import sys
w = sys.argv[1]
raw = open('/tmp/raw.bin', 'rb').read()
i = raw.find(b'\r\n\r\n')
if i < 0:
    print('  no multipart boundary; mirror unchanged'); sys.exit(0)
body = raw[i+4:]
j = body.rfind(b'\r\n--')
if j > 0:
    body = body[:j]
open(f'{w}/deployed-current.worker.js', 'wb').write(body)
print('  wrote', len(body), 'bytes')
PY
            git add "$w/deployed-current.worker.js"
            changed=1
          done

          if [ "$changed" = "1" ]; then
            git -c user.email='drift-reconcile@qnfo.org' -c user.name='repo-drift-reconcile' \
              commit -m "chore(drift): auto-reconcile deployed-current mirrors to the live deployed artifact"
            git push
          else
            echo "no drift; nothing to commit"
          fi
