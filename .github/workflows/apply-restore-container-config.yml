name: apply-restore-container-config

# CONTAINER-CONFIG-RESTORE-3-APPLIER (2026-09-29, issues #1485 / #1487).
#
# WHY THIS FILE EXISTS -- MEASURED, NOT INFERRED
#   scripts/restore_container_config.py is a complete restore path for the [[containers]]
#   script-level metadata that qnfo-ops:cf_worker_deploy dropped at 19:30:35Z (deployment
#   history id 172; first container.error row 8s later, "Cannot read properties of undefined
#   (reading 'running')"). But the script had NO workflow, so it never ran -- the
#   ORPHANED-APPLIER-1 class: the fix is in the repo and the defect stays live.
#
#   The two other attempted paths are measurably dead ends:
#     .github/workflows/deploy-containers-pilot.yml -> ci-status/deploy-containers-pilot.json
#       reports wrangler_outcome=failure, nomig_outcome=failure (both migration and
#       no-migration paths rejected); its verify step passes only because /health is served
#       by the top-level fetch and never touches ctx.container -- a FALSE-POSITIVE gate.
#     ci-status/container-binding-guard-1.json -> wrangler_outcome=failure,
#       wrangler_nomig_outcome=skipped.
#   cf_worker_deploy cannot carry [[containers]] because containers are SCRIPT METADATA,
#   not a binding: GET /bindings returns only {d1 AUDIT, secret_text PILOT_TOKEN,
#   durable_object_namespace SHELL_CONTAINER}.
#
# WHAT THIS WORKFLOW DOES
#   Runs scripts/restore_container_config.py, which:
#     - parses [[containers]] from qnfo-containers-pilot/wrangler.toml (fail-closed if absent)
#     - reads live /settings for compatibility_date/flags (COMPAT-PRESERVE-1)
#     - PUTs /content with metadata {main_module, containers, compatibility_date[, flags]}
#       and deliberately OMITS bindings (BINDING-PRESERVATION-1 by omission -- rebuilding
#       bindings from a partial read is what caused the incident)
#     - deliberately does NOT send [[migrations]] (class already exists; DO-MIGRATION-NOTE-1)
#     - re-reads /settings and asserts containers is present AND the AUDIT d1 binding survived
#   The workflow then probes the AUTHORITATIVE signal -- /status, which reaches the Durable
#   Object and therefore touches ctx.container -- instead of /health, which cannot detect
#   this outage class at all.
#
# ARTIFACT IS MANDATORY (CONTAINER-DEPLOY-NEVER-RAN-1 / FAILURE-ARTIFACT-LOSS-1): a run
# whose only output is a step summary cannot be verified from outside the runner. This
# workflow always commits ci-status/restore-container-config.json, including the restore
# log tail, so "ran and failed" is distinguishable from "never ran".

# CONTAINER-WORKFLOW-SPRAWL-1 (2026-09-30, agent_issues #1506): DISPATCH-ONLY (break-glass).
# This one-shot restore used to fire on every push touching scripts/restore_container_config.py or
# qnfo-containers-pilot/wrangler.toml, alongside four sibling restorers and the real deploy
# (deploy-containers-pilot.yml). Measured on the 2026-09-30T18:33Z push: FIVE unconditional
# /content re-uploads of qnfo-containers-pilot in 13 s (fleet_deploys 1080-1086), racing each other
# for the deploy lock. The automatic path is now container-config-selfheal-cron.yml, gated by
# scripts/container_restore_gate.py (restore only on evidence of the #1485 class). Run this by hand
# only when that gate is wrong.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-restore-container-config
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: assert the containers block is present in wrangler.toml
        run: |
          set -euo pipefail
          f=qnfo-containers-pilot/wrangler.toml
          for key in '\[\[containers\]\]' 'class_name = "ShellContainer"' 'image = ' 'instance_type = ' 'max_instances = '; do
            if ! grep -Eq "$key" "$f"; then
              echo "::error::wrangler.toml is missing required key: $key -- refusing to restore"
              exit 1
            fi
          done
          echo "containers block present:"
          sed -n '/\[\[containers\]\]/,/^$/p' "$f"

      - name: restore [[containers]] via /content script metadata
        id: restore
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/restore_container_config.py 2>&1 | tee /tmp/restore.log
          rc=${PIPESTATUS[0]}
          echo "restore rc=$rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: probe the authoritative signal (/status reaches the Durable Object)
        id: probe
        continue-on-error: true
        run: |
          set -uo pipefail
          base="https://qnfo-containers-pilot.q08.workers.dev"
          if [ -z "${PILOT_TOKEN:-}" ]; then
            echo "::warning::PILOT_TOKEN unavailable - probe skipped"
            echo "signature=probe-skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code="$(curl -s -o /tmp/s.json -w '%{http_code}' -H "Authorization: Bearer $PILOT_TOKEN" "$base/status" || true)"
          echo "GET /status -> $code"
          cat /tmp/s.json || true
          echo
          if grep -q "Cannot read properties of undefined" /tmp/s.json 2>/dev/null; then
            echo "signature=ctx-container-undefined" >> "$GITHUB_OUTPUT"
            echo "::error::/status still reports ctx.container undefined - #1485 OPEN"
            exit 1
          fi
          echo "signature=clean" >> "$GITHUB_OUTPUT"
          echo "container config verified live - #1485 closable"

      - name: publish outcome artifact
        if: always()
        env:
          RESTORE_RC: ${{ steps.restore.outputs.rc }}
          PROBE_SIG: ${{ steps.probe.outputs.signature }}
        run: |
          mkdir -p ci-status
          python3 - <<'PY'
          import json, os, time
          try:
              log = open("/tmp/restore.log", encoding="utf-8", errors="replace").read()[-4000:]
          except OSError:
              log = ""
          out = {
              "workflow": "apply-restore-container-config",
              "marker": "CONTAINER-CONFIG-RESTORE-3-APPLIER",
              "restore_rc": os.environ.get("RESTORE_RC", ""),
              "status_signature": os.environ.get("PROBE_SIG", ""),
              "log_tail": log,
              "ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          }
          with open("ci-status/restore-container-config.json", "w") as fh:
              json.dump(out, fh, indent=2)
          print(json.dumps({k: v for k, v in out.items() if k != "log_tail"}, indent=2))
          PY

      - name: commit outcome artifact
        if: always()
        run: |
          set -uo pipefail
          git config user.name "qnfo-ci"
          git config user.email "ci@qnfo.org"
          git add ci-status/restore-container-config.json
          if git diff --cached --quiet; then
            echo "no artifact change to commit"
            exit 0
          fi
          git commit -m "chore(ci): apply-restore-container-config outcome [skip ci]"
          for i in 1 2 3; do
            if git push; then echo "pushed"; exit 0; fi
            git pull --rebase --autostash || true
          done
          echo "::error::artifact push failed after 3 attempts"
          exit 1
