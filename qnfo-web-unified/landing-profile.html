<section class="program-overview">
  <h2>QNFO: Quantum Foundations / Non-Foundational Ontology</h2>
  <p>A cross-domain synthesis research program at the intersection of ultrametric physics, the Laws of Form (Spencer-Brown), information physics, paradigm engineering, and consilience. Five independent programs converge on non-Archimedean (ultrametric) mathematics — the <em>same structure</em> discovered through <em>different routes</em>, providing genuine cross-domain consilience (KIF-29).</p>
</section>

<section>
  <h2 style="text-align:center;color:#fff;font-size:1.1rem;margin-bottom:1rem;">Five Research Pillars</h2>
  <div class="pillars">
    <div class="pillar">
      <h3><span class="code ump">UMP</span> Ultrametric Physics</h3>
      <p>Ultrametric (p-adic) spaces for quantum systems. Hierarchical error suppression in hardware geometry. Adelic QFT. Bruhat-Tits tree unification of renormalization group, quantum error correction, and AdS/CFT. 4-Kelvin quantum computing roadmap.</p>
    </div>
    <div class="pillar">
      <h3><span class="code slb">SLB</span> Laws of Form</h3>
      <p>Spencer-Brown's calculus of distinctions as a formal substrate for measurement and ontology. The void → distinction → form hierarchy. Autaxys quantum computing grounded in the primary algebra. Non-foundational foundations that do not presuppose set theory.</p>
    </div>
    <div class="pillar">
      <h3><span class="code inm">INM</span> Information Physics</h3>
      <p>Information as primitive physical category. Adelic Shannon theory: rate-distortion on the adele ring. Measurement stratigraphy as information-theoretic layering. Shannon entropy generalized to ultrametric distinguishability graphs.</p>
    </div>
    <div class="pillar">
      <h3><span class="code cfe">CFE</span> Paradigm Engineering</h3>
      <p>Systematic methodology for paradigm creation, evaluation, and comparison. KIF gates for adversarial symmetry: Bayesian evidential weight (KIF-60), null-equivalence protocol, methodological independence. Epistemic hygiene: scaffold-invariant claim evaluation.</p>
    </div>
    <div class="pillar">
      <h3><span class="code res">RES</span> Consilience</h3>
      <p>Cross-domain synthesis methodology. KIF-29: independent convergence from disconnected domains as the gold standard of evidence. Valuation Theory to the Void framework. Universal Consilience Prompt. Falsifiability audit of contemporary physics.</p>
    </div>
  </div>
</section>
