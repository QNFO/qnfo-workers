name: deploy-pages-qnfo-publications

# ARCHIVE-PAGES-UNDEPLOYABLE-1 (#1393, filed 2026-09-29)
#
# Problem: qnfo-web-unified/archive-qnfo.html is the source of archive.qnfo.org
# (see qnfo-web-unified/README.md: "QNFO Research Archive | archive.qnfo.org |
# qnfo-publications Pages | archive-qnfo.html"). The repo carries 36+ workflows,
# NONE of which deployed a Cloudflare Pages project. Commit f6601128 repaired the
# file, but production still served the pre-fix bytes, so the fix was inert.
#
# FULL-REPLACE RISK: RESOLVED BY EVIDENCE (2026-09-29T16:16:01Z)
#   pages_project_audit id 1 (written by .github/workflows/pages-inventory.yml):
#     project        = qnfo-publications
#     file_count     = 1
#     files_json     = ["/index.html"]
#     deployment_count = 25
#     latest_created = 2026-08-31T21:09:43Z
#     domains        = qnfo-publications.pages.dev, archive.qnfo.org
#   The project holds EXACTLY ONE asset. A `wrangler pages deploy dist/` full
#   replace therefore swaps /index.html for /index.html and can delete nothing.
#
# FROZEN-LITERAL-GATE-1 (fixed 2026-09-29T17:20Z)
#   The gates below previously hard-pinned the literal '446 QNFO papers'.
#   Commit 5c3e3262 (#1111 PUBLIC-COUNTS-COVERAGE-DRIFT-1) deliberately removed
#   that drifting literal -- so Gate A began failing and the deploy aborted on
#   every subsequent push, leaving production stale. The same class of defect as
#   the version-literal pins that blocked other deploys today.
#   The gates are now PROPERTY-BASED. They assert invariants that must hold for
#   any correct version of the page, so a future count correction cannot break
#   the deployer again.
#
# TRIGGERS
#   1. push to main touching the source page (or this workflow) -> autonomous deploy.
#   2. workflow_dispatch with confirm=DEPLOY -> deliberate manual re-publish.
#
# FAIL-CLOSED GATES:
#   A. Content gate on the staged asset:
#        - structural repair present   : <style> tag
#        - provenance present          : 'count basis (#1111)'
#        - #1111 invariant respected   : NO '<n> QNFO papers' drifting literal
#        - corruption markers absent   : '658+', '2,500+', trailing grid-template-column
#   B. Post-deploy live verification against https://archive.qnfo.org/ using the
#      same provenance marker, which only exists in the corrected bytes.
#   C. If the staged file is missing or implausibly small -> exit 1.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to publish the repaired archive page to qnfo-publications"
        required: true
        default: ""
      project:
        description: "Pages project name"
        required: true
        default: "qnfo-publications"
  push:
    branches: [main]
    paths:
      - "qnfo-web-unified/archive-qnfo.html"
      - ".github/workflows/deploy-pages-qnfo-publications.yml"

permissions:
  contents: read

concurrency:
  group: pages-qnfo-publications
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Gate 0 - trigger authorisation
        run: |
          set -euo pipefail
          EV="${{ github.event_name }}"
          if [ "$EV" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
              echo "::error::confirm input must be exactly DEPLOY (got '${{ github.event.inputs.confirm }}')"
              exit 1
            fi
            echo "authorised: manual dispatch with DEPLOY confirmation"
          elif [ "$EV" = "push" ]; then
            echo "authorised: push to main on a Pages source path"
          else
            echo "::error::unsupported event '$EV'"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Gate A - stage and validate the asset
        run: |
          set -euo pipefail
          PROJECT="${{ github.event.inputs.project }}"
          [ -n "$PROJECT" ] || PROJECT="qnfo-publications"
          echo "project=$PROJECT" >> "$GITHUB_ENV"
          test -f qnfo-web-unified/archive-qnfo.html || { echo "::error::source page missing"; exit 1; }
          mkdir -p dist
          cp qnfo-web-unified/archive-qnfo.html dist/index.html
          bytes=$(wc -c < dist/index.html)
          echo "staged bytes: $bytes"
          [ "$bytes" -gt 5000 ] || { echo "::error::staged page implausibly small ($bytes)"; exit 1; }

          # --- structural repair MUST be present ---
          grep -q '<style>' dist/index.html || { echo "::error::style tag not repaired"; exit 1; }

          # --- count provenance MUST be present (FROZEN-LITERAL-GATE-1) ---
          # This comment records the measured basis for the counts and is the
          # freshness marker Gate B also uses. It must survive any future edit.
          grep -q 'count basis (#1111)' dist/index.html || { echo "::error::count provenance comment (#1111) missing"; exit 1; }

          # --- #1111 INVARIANT: no drifting paper-count literal may be published ---
          # The page must NOT hardcode a '<number> QNFO papers' figure, because
          # the underlying corpus count is disputed across surfaces and drifts.
          if grep -qE '[0-9][0-9,]* QNFO papers' dist/index.html; then
            echo "::error::drifting hardcoded paper-count literal present (violates #1111)"
            grep -nE '[0-9][0-9,]* QNFO papers' dist/index.html || true
            exit 1
          fi

          # --- corruption markers MUST be absent ---
          if grep -qE 'grid-template-column$' dist/index.html; then echo "::error::truncated grid rule still present"; exit 1; fi
          if grep -q '658+' dist/index.html; then echo "::error::stale 658+ count still present"; exit 1; fi
          if grep -q '2,500+' dist/index.html; then echo "::error::stale 2,500+ count still present"; exit 1; fi
          echo "content gate passed (property-based)"

      - name: Upload staged artifact
        uses: actions/upload-artifact@v4
        with:
          name: qnfo-publications-dist
          path: dist
          if-no-files-found: error

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.project }} --branch=main

      - name: Gate B - verify live
        run: |
          set -euo pipefail
          sleep 20
          for i in 1 2 3 4 5; do
            code=$(curl -sS --max-time 25 -o /tmp/live.html -w '%{http_code}' https://archive.qnfo.org/ || echo 000)
            echo "attempt $i http=$code bytes=$(wc -c < /tmp/live.html 2>/dev/null || echo 0)"
            if [ "$code" = "200" ] && grep -q 'count basis (#1111)' /tmp/live.html; then
              grep -q '<style>' /tmp/live.html || { echo "::error::live style tag still malformed"; exit 1; }
              if grep -q '658+' /tmp/live.html; then echo "::error::live still serves stale 658+"; exit 1; fi
              if grep -qE '[0-9][0-9,]* QNFO papers' /tmp/live.html; then
                echo "::error::live still publishes a drifting paper-count literal (violates #1111)"
                exit 1
              fi
              echo "VERIFY_OK archive.qnfo.org now serves the corrected page"
              exit 0
            fi
            sleep 15
          done
          echo "::error::live verification failed after 5 attempts"
          exit 1
