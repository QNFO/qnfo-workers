name: deploy-containers-pilot

# CONTAINER-DEPLOY-WORKFLOW-MISSING-1 (2026-09-29). This file did not exist; it is the
# workflow qnfo-containers-pilot/wrangler.toml references as the only path that transmits
# [[containers]]. See the commit message for the full evidence chain.
#
# CONTAINER-DEPLOY-NEVER-RAN-1 (2026-09-29). The workflow existed but had ZERO runs.
# Fixed by adding a self-triggering push path (this file itself) and an always() status
# artifact, because a workflow whose only output is a step summary cannot be verified
# from outside the runner.
#
# CONTAINER-DEPLOY-FALSE-GREEN-1 (2026-09-29). The workflow ran and reported SUCCESS
# while the container config was absent. Root cause of the false green, from the
# committed artifacts:
#   ci-status/deploy-containers-pilot.json ->
#     {"wrangler_outcome":"failure","nomig_outcome":"failure",
#      "verify_outcome":"success","health_http":"200"}
#   ci-status/container-binding-guard-1.json ->
#     {"wrangler_outcome":"failure","post_version":""}
# Two independent workflows attempted `wrangler deploy` and both FAILED, yet neither run
# was red, because:
#   (a) verify probed /health, which returns 200 from the worker even when the container
#       config is missing - only /status exposes the `ctx.container`-undefined signature;
#   (b) a missing PILOT_TOKEN produced `exit 0` (a skip reported as success).
# Blast radius of the state being masked: every container tool was dead from
# 19:30:43.591Z (110 cloud_ops_events rows of kind=container.error).
# This revision makes green mean green: /status is probed, a missing token is a hard
# failure, and a final gate fails the job when the deploy failed or verify did not pass.

on:
  push:
    branches: [main]
    paths:
      - 'qnfo-containers-pilot/**'
      - '.github/workflows/deploy-containers-pilot.yml'
  workflow_dispatch:
    inputs:
      verify_only:
        description: "true = skip deploy, only run the container verification probe"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: deploy-containers-pilot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: assert the containers block is present in wrangler.toml
        id: assert
        run: |
          set -euo pipefail
          f=qnfo-containers-pilot/wrangler.toml
          for key in '\[\[containers\]\]' 'class_name = "ShellContainer"' 'image = ' 'instance_type = ' 'max_instances = ' '\[\[migrations\]\]'; do
            if ! grep -Eq "$key" "$f"; then
              echo "::error::wrangler.toml is missing required key: $key -- refusing to deploy"
              exit 1
            fi
          done
          echo "containers block present:"
          sed -n '/\[\[containers\]\]/,/^$/p' "$f"

      - name: report credential availability (diagnostic, never a silent skip)
        id: creds
        run: |
          set -uo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "api_token=present"; else echo "api_token=MISSING"; fi
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo "account_id=present"; else echo "account_id=MISSING"; fi
          if [ -n "${{ secrets.PILOT_TOKEN }}" ]; then echo "pilot_token=present"; else echo "pilot_token=MISSING"; fi

      - name: wrangler deploy (transmits containers config)
        id: deploy
        if: ${{ github.event.inputs.verify_only != 'true' }}
        working-directory: qnfo-containers-pilot
        run: |
          set -o pipefail
          # --keep-vars preserves dashboard-set vars; secrets live in the secrets store.
          # Output is tee'd so the status artifact and the job summary carry the real
          # failure text: DO-MIGRATION-NOTE-1 warns this deploy can FAIL CLOSED on a
          # creating migration for an already-depended-on class, and a bare ::error::
          # cannot distinguish that from a token problem or a bundling error. That
          # ambiguity is exactly what made the previous failure unattributable.
          npx --yes wrangler@4 deploy --keep-vars 2>&1 | tee /tmp/wrangler.log
        env:
          WRANGLER_SEND_METRICS: "false"
        continue-on-error: true

      - name: wait for propagation
        if: ${{ github.event.inputs.verify_only != 'true' }}
        run: sleep 20

      - name: verify container config is live (closes #1485)
        id: verify
        run: |
          set -uo pipefail
          base="https://qnfo-containers-pilot.q08.workers.dev"
          if [ -z "${{ secrets.PILOT_TOKEN }}" ]; then
            echo "rc=no-token" >> "$GITHUB_OUTPUT"
            echo "::error::PILOT_TOKEN is not available to this workflow, so the container config CANNOT be verified. This is a FAILURE, not a skip: an unverifiable deploy must never be reported as success (CONTAINER-DEPLOY-FALSE-GREEN-1)."
            exit 1
          fi
          code="$(curl -s -o /tmp/status.json -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.PILOT_TOKEN }}" "$base/status" || true)"
          echo "GET /status -> $code"
          cat /tmp/status.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "rc=probe-http-$code" >> "$GITHUB_OUTPUT"
            echo "::error::/status returned $code - container config still not live (#1485 open)"
            exit 1
          fi
          if grep -q "Cannot read properties of undefined" /tmp/status.json; then
            echo "rc=ctx-container-undefined" >> "$GITHUB_OUTPUT"
            echo "::error::/status reports the ctx.container-undefined signature - #1485 still open"
            exit 1
          fi
          echo "rc=ok" >> "$GITHUB_OUTPUT"
          echo "container config verified live"
        continue-on-error: true

      - name: publish status artifact (always)
        if: always()
        run: |
          set -uo pipefail
          mkdir -p ci-status
          python3 - <<'PY'
          import json, os, subprocess
          tail = ""
          try:
              with open("/tmp/wrangler.log", "r", errors="replace") as fh:
                  tail = "".join(fh.readlines()[-40:])
          except Exception as exc:
              tail = "wrangler log unavailable: %s" % exc
          def out(name):
              return os.environ.get(name, "")
          doc = {
              "workflow": "deploy-containers-pilot",
              "marker": "CONTAINER-DEPLOY-FALSE-GREEN-1",
              "head_sha": subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip(),
              "ts": subprocess.check_output(["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"]).decode().strip(),
              "deploy_outcome": out("DEPLOY_OUTCOME"),
              "verify_rc": out("VERIFY_RC"),
              "api_token": out("CRED_API"),
              "account_id": out("CRED_ACCT"),
              "pilot_token": out("CRED_PILOT"),
              "wrangler_tail": tail,
          }
          with open("ci-status/deploy-containers-pilot.json", "w") as fh:
              json.dump(doc, fh, indent=2)
              fh.write("\n")
          print(json.dumps(doc, indent=2))
          PY
          git config user.name  "qnfo-fleet-bot"
          git config user.email "fleet-bot@qnfo.org"
          git add ci-status/deploy-containers-pilot.json
          if git diff --cached --quiet; then
            echo "no status change"
            exit 0
          fi
          git commit -m "chore(ci-status): deploy-containers-pilot outcome [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "status artifact pushed on attempt $i"
              exit 0
            fi
            echo "push rejected on attempt $i; rebasing onto origin/main"
            git pull --rebase --autostash origin main || true
          done
          echo "::error::could not push status artifact after 5 attempts"
          exit 1
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_RC: ${{ steps.verify.outputs.rc }}
          CRED_API: ${{ steps.creds.outputs.api_token }}
          CRED_ACCT: ${{ steps.creds.outputs.account_id }}
          CRED_PILOT: ${{ steps.creds.outputs.pilot_token }}

      - name: fail-closed gate (a dead container must never be a green run)
        if: always()
        run: |
          set -uo pipefail
          deploy_outcome="${{ steps.deploy.outcome }}"
          verify_rc="${{ steps.verify.outputs.rc }}"
          echo "deploy_outcome=$deploy_outcome verify_rc=$verify_rc"
          if [ "$deploy_outcome" = "failure" ]; then
            echo "::error::wrangler deploy failed, so the containers config was NOT transmitted and every container tool remains dead. Run is red by design (CONTAINER-DEPLOY-FALSE-GREEN-1)."
            exit 1
          fi
          if [ "$verify_rc" != "ok" ]; then
            echo "::error::container verification did not pass (verify_rc=$verify_rc); #1485 remains open. Run is red by design."
            exit 1
          fi
          echo "deploy succeeded and the authenticated /status probe verified the container config is live"

      - name: summarize outcome
        if: always()
        run: |
          {
            echo "## deploy-containers-pilot"
            echo ""
            echo "Closes: CONTAINER-CONFIG-DROPPED-1 / issue #1485"
            echo "Guards: CONTAINER-DEPLOY-FALSE-GREEN-1"
            echo ""
            echo "deploy_outcome=${{ steps.deploy.outcome }} verify_rc=${{ steps.verify.outputs.rc }}"
            echo ""
            echo "A green run means wrangler transmitted the containers config AND the"
            echo "authenticated /status probe returned 200 without the ctx.container-undefined"
            echo "signature. A red run is fail-closed and wipes nothing."
            echo ""
            echo "### wrangler output tail (why the deploy failed, if it did)"
            echo ""
            echo '```'
            tail -n 40 /tmp/wrangler.log 2>/dev/null || echo "no wrangler log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
