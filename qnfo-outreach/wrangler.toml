name = "qnfo-outreach"
main = "worker.js"
compatibility_date = "2026-09-01"

send_email = [
  { type = "send_email", name = "SEND_EMAIL" }
]


[observability]
enabled = true
head_sampling_rate = 1

# OUTREACH-CF-DOW-1 (2026-10-02, #1710; same class as qnfo-cloud-ops CF-DOW-1 #1473): Cloudflare numbers weekdays
# 1=Sunday..7=Saturday, so the old "1-5" ran Sunday-Thursday and never on Friday. "2-6" is Monday-Friday, the
# weekday cadence /health and docs/STRATEGY.md describe. Same five runs a week; sends stay inside the shared caps.
[triggers]
crons = ["0 11 * * 2-6"]

[[d1_databases]]
binding = "OUTREACH_D1"
database_name = "qnfo-outreach"
database_id = "d5077252-8187-41b2-a44e-f84f8724ee36"

[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# LIVING_PAPER d1 declaration removed 2026-09-22: it was NOT present on the live
# worker and env.LIVING_PAPER is unused in code (stale declaration, cf. #967).
