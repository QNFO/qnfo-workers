name: apply-driftguard-server-version

# DRIFT-GUARD-SERVER-VERSION-1 + DUP-WORKER-NAME-DIR-1 (issue #1384).
# Applies scripts/driftguard-server-version-patch.py to scripts/deploy-drift-guard.py
# and commits the result back to main. Race-safe commit-back (rebase + retry) --
# COMMITBACK-PUSH-RACE-1 taught us that a bare `git push` loses to concurrent writers.

on:
  push:
    # BRANCH-FILTER-1 (2026-09-30): without this, a push to ANY branch that touches this workflow's paths ran it,
    # including its production deploy / push-to-main steps. Editing lifecycle-sot-and-deploy.yml on a PR branch did
    # exactly that (run 36740563280, a real qnfo-lifecycle /content PUT from a feature branch).
    branches: [main]
    paths:
      - '.github/workflows/apply-driftguard-server-version.yml'
      - 'scripts/driftguard-server-version-patch.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-driftguard-server-version
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch (fail-closed)
        run: python3 scripts/driftguard-server-version-patch.py

      - name: Verify guard compiles and markers landed
        run: |
          set -e
          python3 -m py_compile scripts/deploy-drift-guard.py
          echo "py_compile: OK"
          test "$(grep -c 'SERVER-VERSION-1' scripts/deploy-drift-guard.py)" -ge 1
          test "$(grep -c 'DUP-WORKER-NAME-DIR-1' scripts/deploy-drift-guard.py)" -ge 1
          grep -n 'QNFO_|SERVER_' scripts/deploy-drift-guard.py
          echo "markers: OK"

      - name: Commit back (race-safe)
        run: |
          set -e
          if git diff --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git config user.name "qnfo-driftguard-bot"
          git config user.email "bot@qnfo.org"
          git add scripts/deploy-drift-guard.py
          git commit -m "fix(drift-guard): SERVER-VERSION-1 + DUP-WORKER-NAME-DIR-1 (#1384) [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "attempt $i lost the race, retrying"
            sleep 3
          done
          echo "commit-back failed after 5 attempts"
          exit 1
