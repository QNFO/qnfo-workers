name: windows-suite-parity

# WINDOWS-SUITE-PARITY-1 (agent_issues 2832, pillar core): the offline suite set passed 429 of 429 on the ubuntu gate while the same commit
# failed 124 suites on the owner's Windows box on 2026-10-17 (a node:sqlite ?N binding shim, CRLF in generated fixtures) and 10 on
# 2026-10-18 with node 24 (a filesystem path where a URL is required, CRLF in a migration body, a suite that reads the network).
# Nothing measured the difference on a runner, so "a local red means red" could not be checked. This workflow runs
# `node scripts/run-suites.mjs --all` on windows-latest under node 22 and node 24 and REPORTS the failing suites in the job summary.
# It is advisory by design: the run step is continue-on-error and the job stays green, so a Windows-only failure never blocks a merge;
# the gate stays the ubuntu run in deploy-gate.yml. The issue is done when both legs of a run report an empty failing list.
# No secrets and no network credentials are used; nothing is uploaded: the report is the job summary only.
# Triggers: manual dispatch, and a push to main that changes the runner itself (scripts/run-suites.mjs) or this file. No schedule
# (CRON-HOURLY-FLOOR-1 does not apply: it declares no cron). Step names are colon-free (WORKFLOW-YAML-LINT-1).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/run-suites.mjs"
      - ".github/workflows/windows-suite-parity.yml"

permissions:
  contents: read

concurrency:
  group: windows-suite-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: suites on windows (node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Run every offline suite
        id: suites
        continue-on-error: true
        run: |
          set +e
          node --version
          git config --show-origin core.autocrlf || echo "core.autocrlf is unset"
          node scripts/run-suites.mjs --all --jobs 4 > suite-report.txt 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          tail -n 25 suite-report.txt
          exit $rc
      - name: Report the failing suites
        if: always()
        run: |
          rc="${{ steps.suites.outputs.exit_code }}"
          oks=0
          fails=0
          if [ -f suite-report.txt ]; then
            oks=$(grep -c '^ok ' suite-report.txt || true)
            fails=$(grep -c '^FAIL ' suite-report.txt || true)
          fi
          {
            echo "### windows suite parity, node ${{ matrix.node }}"
            echo ""
            echo "run-suites exit code: ${rc:-none, the runner did not finish}"
            echo "core.autocrlf: $(git config core.autocrlf || echo unset)"
            echo "${oks:-0} suites ok, ${fails:-0} failed"
            echo ""
            echo "failing suites:"
            echo '```'
            if [ -f suite-report.txt ]; then grep '^FAIL ' suite-report.txt | head -60 || true; fi
            echo '```'
            echo ""
            echo "last lines of the runner output:"
            echo '```'
            if [ -f suite-report.txt ]; then tail -n 12 suite-report.txt; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
