name = "qnfo-cloud-ops"
main = "worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]


[observability]
enabled = true
head_sampling_rate = 1

[ai]
binding = "AI"

[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# secret (set via wrangler secret put): CF_TOKEN
# secret (set via wrangler secret put): DIGEST_TO
[[services]]
binding = "EMAIL"
service = "qnfo-email"

# secret (set via wrangler secret put): EMAIL_API_KEY
# secret (set via wrangler secret put): GH_TOKEN
# secret (set via wrangler secret put): GMAIL_PASS
[[d1_databases]]
binding = "GRAPH"
database_name = "qnfo-graph"
database_id = "a1954b92-d681-4d02-b1f6-f9a2eb4c265d"

# secret (set via wrangler secret put): INFRA_TOKEN
[[d1_databases]]
binding = "LIVING"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[d1_databases]]
binding = "OUTREACH"
database_name = "qnfo-outreach"
database_id = "d5077252-8187-41b2-a44e-f84f8724ee36"

# secret (set via wrangler secret put): OPS_ADMIN_TOKEN
#
# OPS_VZ-INDEX-DELETED-1 (2026-09-30, qnfo-ops remediation, issue-class DEPLOY-BLOCKED):
# the Vectorize binding below was declared here, but the referenced index
# `qnfo-cloud-ops` NO LONGER EXISTS in the account. Any deploy that merges this
# declaration is rejected by the Cloudflare API with
#   HTTP 400 / code 10160 "Vectorize binding 'OPS_VZ' references index
#   'qnfo-cloud-ops' which has been deleted"
# which is recorded verbatim in qnfo-audit deployment_history ids 194 and 195
# (qnfo-ops:cf_worker_deploy, 2026-09-30T08:03:20Z and 08:05:17Z). GET
# /workers/scripts/qnfo-cloud-ops/bindings returns 15 bindings and NO vectorize
# binding, so the LIVE worker does not carry OPS_VZ at all -- the declaration was
# dead weight whose only observable effect was to fail every binding-merging deploy
# of this worker, which in turn blocked landing the jobOutreach fix (issues
# 1294/1508) and the cron-registration repair (issue 1500).
#
# The worker guards every use with `if (env.OPS_VZ)` (worker.js lines 103, 2237,
# 2263), so omitting the binding degrades the optional cloud-ops doc index and
# breaks nothing else. Commented out to match live reality. RE-ENABLE ONLY AFTER
# the index is recreated in the account.
# [[vectorize]]
# binding = "OPS_VZ"
# index_name = "qnfo-cloud-ops"

[[d1_databases]]
binding = "PORTFOLIO"
database_name = "portfolio-state"
database_id = "d80fdf2a-0a60-45a3-968b-2907ce806dcd"

[[services]]
binding = "QNFO_INFRA"
service = "qnfo-infra"

# v1.13.1 - self-registration to the qnfo-ops service registry (cross-service discovery).
# Secret: REGISTRY_TOKEN (shared with qnfo-ops /registry/register) - set via wrangler secret put.
[[services]]
binding = "QNFO_OPS"
service = "qnfo-ops"

[[send_email]]
binding = "SEND_EMAIL"
name = "SEND_EMAIL"

[[r2_buckets]]
binding = "VAULT"
bucket_name = "d-drive"

# AMS_SCHEDULE-derived cron triggers. CF-DOW-1: ISO->CF day-of-week corrected
# (Cloudflare cron DOW is 1=Sunday..7=Saturday, NOT ISO 1=Monday). 21 jobs.
# Re-sync offsets at the 2026-10-25 CET flip (+2 CEST -> +1 CET).
#
# CRON-LIMIT-DECLARED-21-1 (CORRECTED 2026-09-30 by qnfo-ops, issue 1665): there is
# NO per-Worker cron cap. The Workers limits table documents Cron Triggers per
# ACCOUNT only (5 free / 250 paid); scripts/raw_put.py defines CF_ACCOUNT_MAX_CRONS
# = 250 and no CF_MAX_CRONS guard exists. The prior note here claimed a 3-per-Worker
# cap and a live single trigger ["30 5 * * 1"]; both were artifacts of the PUT
# /schedules body-shape bug (HTTP 400 code 10026), fixed in PR 97
# (SCHEDULES-API-SHAPE-1). worker_schedules (2026-09-30T19:00:41Z) now shows all 21
# triggers below registered live - an exact set match with this declaration. Issue
# 1500 (CLOUD-OPS-CRON-DISPATCH-NOOP-1) is resolved; no dispatcher rewrite is needed
# to fit a cap that does not exist.
[triggers]
crons = ["15 4 * * *", "0 6,12 * * 2-6", "30 6 * * 2-6", "0 7,13 * * 2-6", "0 8 * * 2-6", "0 15 * * 6", "0 4 * * 1", "0 6 * * 2", "0 7 * * 1", "0 6 * * 7", "0 9 * * 2-6", "0 9 3 9 *", "5 3,15 * * *", "0 4 1 * *", "0 5 * * 2", "30 5 * * 2", "15 5 * * 2", "30 7 * * 2-6", "30 3 * * 2", "20 4 * * *", "10 3 * * *"]
