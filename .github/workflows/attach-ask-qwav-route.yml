name: attach-ask-qwav-route

# ASK-QWAV-ROUTE-1 (2026-10-02, pillar reach). Routes ask.qwav.tech to qnfo-ai-search 2.x, whose page and API
# replace the static Pages project ask-qwav (its ask route has been dead since idea-hub disabled /api/ask).
# Same self-triggering, fail-closed, commit-back pattern as attach-lifecycle-custom-domain.yml: a push of this file
# or its script starts the first run, the script waits for the canonical deploy of qnfo-ai-search 2.x, creates
# one zone route (reversible: delete the route id in ci-status/attach-ask-qwav-route.json) and verifies
# https://ask.qwav.tech/health names qnfo-ai-search before reporting success.
# WORKFLOW-YAML-LINT-1: every step name below is colon-free.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-ask-qwav-route.yml'
      - 'scripts/attach-ask-qwav-route.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: attach-ask-qwav-route
  cancel-in-progress: false

jobs:
  attach-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the idempotent fail-closed route script
        id: attach
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          rc=0
          python3 scripts/attach-ask-qwav-route.py || rc=$?
          echo "attach_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "ATTACH_RC=$rc"
          exit 0

      - name: Echo the route result artifact
        run: |
          set -uo pipefail
          if [ -f ci-status/attach-ask-qwav-route.json ]; then
            cat ci-status/attach-ask-qwav-route.json
          else
            echo "NO_ARTIFACT_WRITTEN"
          fi

      - name: Commit the route result back to main (race-safe)
        id: commitback
        run: |
          set -uo pipefail
          git config user.name "qnfo-selfheal-bot"
          git config user.email "bot@qnfo.org"
          git add -A ci-status/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "ci(attach-domain): record ASK-QWAV-ROUTE-1 result [skip ci]"
          for i in 1 2 3 4 5; do
            echo "commit-back attempt $i"
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "PUSH_OK attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "PUSH_FAILED after 5 attempts"
          exit 1
