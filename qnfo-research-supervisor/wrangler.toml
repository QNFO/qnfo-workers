name = "qnfo-research-supervisor"
main = "worker.js"
compatibility_date = "2026-08-10"
workers_dev = true
usage_model = "standard"

# v1.1.1 (2026-09-06): durable supervisor + v2-drain driver over the research-publication pipeline.
# Survey + remediate stalls (stale research-exec claims, stale version_queue 'publishing'),
# then DRIVE the v2 publish drain (/run/drain-v2, atomic-lease since research-exec v0.5.15)
# when backlog exists. Halt-aware. Research-cycle /run driving DEFERRED (run() stage claims
# are not yet atomic - see worker.js header). D1 + one service binding (no auth secrets).

[[workflows]]
name = "research-supervisor"
binding = "RESEARCH_SUPERVISOR"
class_name = "ResearchSupervisor"
schedules = ["*/15 * * * *"]

[[services]]
binding = "RESEARCH_EXEC"
service = "qnfo-research-exec"

[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "LIVING_PAPER"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"
