name = "qnfo-fleet-dashboard"
main = "worker.js"
compatibility_date = "2026-09-07"

# Route: fleet.qnfo.org (custom domain, zone route fleet.qnfo.org/*)
# Cron: */15 * * * * (refresh loop)

[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "LIVING"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[d1_databases]]
binding = "OUTREACH"
database_name = "qnfo-outreach"
database_id = "d5077252-8187-41b2-a44e-f84f8724ee36"

[[d1_databases]]
binding = "GRAPH"
database_name = "qnfo-graph"
database_id = "a1954b92-d681-4d02-b1f6-f9a2eb4c265d"

[[kv_namespaces]]
binding = "FLEET_CFG"
id = "d3768b93a76640be83151b00a8b42717"

# CF_TOKEN is a secret (set via: wrangler secret put CF_TOKEN)

[[services]]
binding = "SVC_QNFO_OPS"
service = "qnfo-ops"
environment = "production"

[[services]]
binding = "SVC_QNFO_AI"
service = "qnfo-ai"
environment = "production"

[[services]]
binding = "SVC_QNFO_KAIZEN"
service = "qnfo-kaizen"
environment = "production"

[[services]]
binding = "SVC_QNFO_OUTREACH"
service = "qnfo-outreach"
environment = "production"

[[services]]
binding = "SVC_QNFO_PAPER_REVISER"
service = "qnfo-paper-reviser"
environment = "production"

[[services]]
binding = "SVC_QNFO_SOCIAL"
service = "qnfo-social"
environment = "production"

[[services]]
binding = "SVC_PERSONAL_API"
service = "personal-api"
environment = "production"

[[services]]
binding = "SVC_QNFO_RESEARCH_EXEC"
service = "qnfo-research-exec"
environment = "production"

[[services]]
binding = "SVC_QNFO_CLOUD_OPS"
service = "qnfo-cloud-ops"
environment = "production"

[triggers]
crons = ["*/15 * * * *"]
