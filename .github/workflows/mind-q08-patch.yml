name: mind-q08-patch

# MIND-Q08-4b (2026-10-21): retrigger marker. GitHub does not run a workflow for the push
# that first creates it, so this touch is the event that actually starts the run.
# MIND-Q08-4 (2026-10-21): apply the mind/worker.js patch, deploy it, and verify the live
# host in the same run. Two independent paths reach the same Definition of Done:
#   path 1 - direct `wrangler deploy` (primary, works with CLOUDFLARE_API_TOKEN)
#   path 2 - commit the patched file to main so canonical-deploy picks it up (fallback)
# The verification step is identical for both, so a run that reports success has been
# measured on the live surface rather than inferred from a green deploy step.

on:
  push:
    branches: [main]
    paths:
      - scripts/mind_q08_patch.py
      - .github/workflows/mind-q08-patch.yml
  workflow_dispatch:

concurrency:
  group: mind-q08-patch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  patch-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Apply patch (idempotent)
        run: python3 scripts/mind_q08_patch.py

      - name: Syntax check
        run: node --check mind/worker.js && echo "NODE_CHECK_OK"

      - name: Deploy (path 1 - direct wrangler)
        id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          cd mind
          npx --yes wrangler deploy 2>&1 | tee /tmp/deploy.log
          echo "exit=${PIPESTATUS[0]}"

      - name: Commit patched worker (path 2 - durable)
        id: commit
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.QNFO_GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "qnfo-fleet"
          git config user.email "fleet@qnfo.org"
          if git diff --quiet -- mind/worker.js; then
            echo "no change to commit (already patched)"; exit 0
          fi
          git add mind/worker.js
          git commit -m "feat(mind): MIND-Q08-4 complete the chain, name the source type, publish the outside view, add the seven-day sheet [skip ci]"
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then echo "PUSH_OK attempt $i"; exit 0; fi
            sleep $((i * 5))
          done
          echo "PUSH_FAILED after 5 attempts"; exit 1

      - name: Verify live surface (both paths)
        run: python3 scripts/mind_q08_patch.py --verify

      - name: Record result
        if: always()
        run: |
          mkdir -p ci-status
          python3 - <<'PY'
          import json, os, time
          json.dump({
            "run": os.environ.get("GITHUB_RUN_ID"),
            "deploy_path": "wrangler-direct",
            "ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          }, open("ci-status/mind-q08-patch.json", "w"), indent=2)
          PY

      - name: Commit status artifact
        if: always()
        env:
          GH_PAT: ${{ secrets.QNFO_GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git config user.name "qnfo-fleet"
          git config user.email "fleet@qnfo.org"
          git add ci-status/mind-q08-patch.json || true
          if git diff --cached --quiet; then echo "NO_CHANGES status unchanged"; exit 0; fi
          git commit -m "ci(status): mind-q08-patch result [skip ci]"
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then echo "PUSH_OK attempt $i"; exit 0; fi
            sleep $((i * 5))
          done
          echo "PUSH_FAILED status artifact"; exit 0
