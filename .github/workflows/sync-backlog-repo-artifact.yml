name: sync-backlog-repo-artifact

# COMMITBACK-DRIFT-1 (2026-09-29).
#
# OBSERVED (verified 2026-09-29 ~15:47Z, all from tool output):
#   live qnfo-backlog-exec  VERSION = "2.0.1-health-probe-budget"   (cf_worker_read)
#   repo qnfo-backlog-exec/worker.js              VERSION = "2.0.0-full-register-inventory", 33159 B, sha 4a5e0ae2
#   repo qnfo-backlog-exec/deployed-current.worker.js  same version (mirror in parity)
#   ci-status/backlog-health-cheap.json           ABSENT
#
# So apply-backlog-health-cheap.yml PATCHED and DEPLOYED successfully, but its
# commit-back step never landed: the repository is now BEHIND live and the
# machine-readable status artifact was never published. That is the repo-behind
# direction mirror-autosync.yml explicitly documents as the regression class where
# an unattended mirror copy reverted a live fix (qnfo-lifecycle 1.6.2-cronconsolidate).
# A deploy that leaves the repo behind live is a deploy with no verifiable record.
#
# WHAT THIS DOES: re-runs the repo's own idempotent patcher
# (scripts/patch-backlog-health-cheap.py, which patches BOTH worker.js and
# deployed-current.worker.js), asserts the result parses as an ES module, asserts
# repo/mirror parity, asserts the artifact VERSION is the version LIVE actually
# serves, and commits the repair back with a bounded retry.
#
# IT DELIBERATELY DOES NOT DEPLOY. The live worker already carries the fix; the
# assertion step fails closed if that stops being true, so this workflow can never
# move live backwards. It is a repo->live reconciliation actor, not a deploy actor.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-backlog-repo-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-backlog-repo-artifact
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply the idempotent /health patch to the repo artifacts
        run: python3 scripts/patch-backlog-health-cheap.py

      - name: Verify the artifact parses as an ES module
        run: |
          set -euo pipefail
          cp qnfo-backlog-exec/worker.js /tmp/be.mjs
          node --check /tmp/be.mjs
          echo "syntax OK"
          grep -cF "HEALTH-PROBE-BUDGET-1" qnfo-backlog-exec/worker.js

      - name: Verify source/mirror parity (blocking)
        run: |
          set -euo pipefail
          cmp qnfo-backlog-exec/worker.js qnfo-backlog-exec/deployed-current.worker.js
          echo "source and deployed-current mirror are byte-identical"

      - name: Assert the artifact VERSION is the version LIVE serves (fail closed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          V=$(grep -o 'var VERSION = "[^"]*";' qnfo-backlog-exec/worker.js | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "artifact=$V"
          ok=0
          for i in $(seq 1 8); do
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/qnfo-backlog-exec/content" \
              -o /tmp/live.js || true
            has_v=$(grep -cF "$V" /tmp/live.js 2>/dev/null || true)
            echo "attempt=$i has_version=$has_v"
            if [ "$has_v" -ge 1 ]; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::live qnfo-backlog-exec does not serve $V; refusing to sync the repo backwards"
            exit 1
          fi

      - name: Publish machine-readable status
        if: always()
        run: |
          set -uo pipefail
          mkdir -p ci-status
          cat > ci-status/backlog-repo-sync.json <<EOF
          {
            "workflow": "sync-backlog-repo-artifact",
            "issue": "COMMITBACK-DRIFT-1 / 1368",
            "job_status": "${{ job.status }}",
            "head": "${{ github.sha }}",
            "ts": "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          }
          EOF
          cat ci-status/backlog-repo-sync.json

      - name: "Commit back (race-safe: pull --rebase + bounded retry)"
        if: always()
        run: |
          set -uo pipefail
          git config user.name  "qnfo-fleet-bot"
          git config user.email "fleet-bot@qnfo.org"
          git add qnfo-backlog-exec/worker.js \
                  qnfo-backlog-exec/deployed-current.worker.js \
                  ci-status/backlog-repo-sync.json
          if git diff --cached --quiet; then
            echo "nothing to commit (repo already matches live)"
            exit 0
          fi
          git commit -m "fix(backlog-exec): sync repo artifacts to live 2.0.1-health-probe-budget (COMMITBACK-DRIFT-1, #1368) [skip ci]"
          for i in 1 2 3 4 5; do
            echo "commit-back attempt $i"
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "commit-back OK on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "::error::COMMITBACK-PUSH-RACE-1: could not land the repair after 5 attempts"
          exit 1
