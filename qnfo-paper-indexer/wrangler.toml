name = "qnfo-paper-indexer"
main = "deployed-current.worker.js"
compatibility_date = "2026-08-10"
workers_dev = true

# Bindings verified from live CF API 2026-09-13 (BINDING-PRESERVATION-1)
# SECRET-HYGIENE-1 2026-09-22: the stale `[vars] INDEX_TOKEN` was removed. It was not
# live, and the worker now reads the token from the INDEX_TOKEN *secret* binding.
# Secrets (wrangler secret put): INDEX_TOKEN
[ai]
binding = "AI"

[[d1_databases]]
binding = "LIVING_PAPER"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[vectorize]]
binding = "PAPER_VZ"
index_name = "qwav-research-v2"

[triggers]
crons = ["0 6 * * *"]

# d1 binding (AUDIT-REMEDIATE-1 2026-09-22; verified vs live CF bindings)
[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"
