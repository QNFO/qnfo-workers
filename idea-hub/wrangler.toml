name = "idea-hub"
main = "worker.js"
compatibility_date = "2026-09-01"
# REACH-IDEA-1 (#2001): /api/subscribe forwards to qnfo-subscribers.q08.workers.dev; without this flag a request served on
# idea-hub.q08.workers.dev would reach the same-zone worker as Cloudflare error 1042 (404).
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

# Bindings verified from live CF API 2026-09-13 (BINDING-PRESERVATION-1)

[observability]
enabled = true
head_sampling_rate = 1

# AGENT_ORCH (qnfo-agent-orchestrator) removed 2026-10-06: worker retired (ORCH-RETIRE-1, #1756); worker.js never read it.

[ai]
binding = "AI"

[[d1_databases]]
binding = "LIVING_PAPER"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# Secrets (set via wrangler secret put):
# SYNC_TOKEN

# PAPER_VZ -> qwav-research-v2 (768-dim, bge-base-en-v1.5) — Ask QNFO RAG (replaces retired qnfo-qwav)
[[vectorize]]
binding = "PAPER_VZ"
index_name = "qwav-research-v2"


# IDEA-TRIAGE-CONSUMER-ABSENT-1 (issue 1689): hourly proposal triage (ported from retired qnfo-idea-triage).
[triggers]
crons = ["23 * * * *"]

# OWNER-SIGNAL-INTAKE-1 (1.7.0, #2104, pillar research): the owner-corpus feeder reads note bodies from the owner's
# Obsidian vault (same bucket calendar-api binds as VAULT; notes_intake indexes it). Read-only use.
[[r2_buckets]]
binding = "VAULT"
bucket_name = "obsidian-vault"
