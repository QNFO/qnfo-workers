name = "qnfo-fleet-advisor"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[triggers]
crons = ["*/20 * * * *"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[services]]
binding = "BACKLOG"
service = "qnfo-backlog-exec"
environment = "production"
