name: remediation-verifier

# CONSUMER for qnfo-audit.remediation_contracts.
# Closes happen ONLY through remediation_verification_autoclose_ins: this workflow inserts a
# remediation_verifications row on a genuine probe pass and the DB trigger performs the close.
# CI never writes agent_issues directly, so every close carries the same audit trail.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Probe only, write nothing'
        type: boolean
        default: false

concurrency:
  group: remediation-verifier
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: python -m py_compile scripts/remediation_verifier.py

      - name: Probe contracts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: edb167b78c9fb901ea5bca3ce58ccc4b
          CF_AUDIT_D1_ID: 35e2e573-92f3-46ac-83c6-22f6429fc5e5
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/remediation_verifier.py --report --dry-run
          else
            python scripts/remediation_verifier.py --report
          fi
