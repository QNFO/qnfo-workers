name: research-code

# CODE-REACH-1 (2026-10-06, pillars research and reach; docs/CODE-REACH-PROGRAM.md).
#
# research-code/<name>/ holds QNFO research libraries (paper companions and standalone tools) staged here until each one
# has its own public repository. This gate runs every library's own tests on every pull request and push that touches
# it, so nothing untested is ever copied out:
#   * Python libraries: install the package, run its unittest suite, run its CLI once;
#   * Lean libraries: lake build, then fail if any theorem depends on sorryAx.
# No cron (SCHEDULE-EVENT-NEVER-FIRES-1). No unquoted colon in a step name (WORKFLOW-YAML-LINT-1).

on:
  pull_request:
    paths:
      - 'research-code/**'
      - '.github/workflows/research-code.yml'
  push:
    branches: [main]
    paths:
      - 'research-code/**'
      - '.github/workflows/research-code.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    # RUNNER-PIN-2 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest becomes Ubuntu 26 by 2026-11-19 (a notice on every job meanwhile); pinned to ubuntu-24.04 until an ubuntu-26.04 trial run is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lib: [agentic-collapse, ignorance-audit]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: install and test
        working-directory: research-code/${{ matrix.lib }}
        run: |
          pip install .
          python -m unittest discover -s tests -v
          ${{ matrix.lib }} --version
  lean:
    # RUNNER-PIN-2 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest becomes Ubuntu 26 by 2026-11-19 (a notice on every job meanwhile); pinned to ubuntu-24.04 until an ubuntu-26.04 trial run is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          lake-package-directory: research-code/ultrametric-lean
      - name: no sorry
        working-directory: research-code/ultrametric-lean
        run: |
          lake env lean AxiomCheck.lean | tee axioms.txt
          ! grep -q sorryAx axioms.txt
