name = "qnfo-backlog-exec"
main = "worker.js"
compatibility_date = "2024-11-01"


[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[triggers]
crons = ["10 1 * * *"]

# FLEET_FEED service binding removed 2026-09-30: its target worker qnfo-fleet-feed was deleted in
# REORG-2026-09-25 wave-5b, and Cloudflare rejects any upload that declares a binding to a missing
# worker (error 10144), which blocked every canonical deploy of this worker. worker.js guards on
# env.FLEET_FEED, so the feed call is simply skipped.
