name: artifacts-mirror-sync

# ARTIFACTS-REDUNDANCY-1 (owner handoff 2026-10-18, human_actions 106): a second, Cloudflare-hosted copy of the fleet
# source in the Artifacts repo qnfo/fleet-artifacts, pushed from main after every merge. scripts/artifacts-mirror-sync.py
# pushes HEAD to the dedicated branch github-main, never forces, reads the branch back, and fails closed.
# It needs the repository secret ARTIFACTS_TOKEN (a repo-scoped write token for fleet-artifacts); without it the run
# warns and exits 0 without touching the remote.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mirror:
    # RUNNER-PIN-2 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest becomes Ubuntu 26 by 2026-11-19 (a notice on every job meanwhile); pinned to ubuntu-24.04 until an ubuntu-26.04 trial run is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: mirror main into Artifacts (fail closed, never force)
        env:
          ARTIFACTS_TOKEN: ${{ secrets.ARTIFACTS_TOKEN }}
        run: python scripts/artifacts-mirror-sync.py
