name = "jnl-pipeline"
main = "worker.js"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

[[d1_databases]]
binding = "AUDIT"
database_id = "8be80cdb-979d-401f-b3ab-6a16869473ec"

# binding CORPUS: type=vectorize (see deployed config)

# secret: JNL_OPS_TOKEN -> wrangler secret put JNL_OPS_TOKEN

# secret: JNL_TOKEN -> wrangler secret put JNL_TOKEN

[[r2_buckets]]
binding = "PARSE_CACHE"
bucket_name = "jnl-parse-cache"

[[kv_namespaces]]
binding = "STATE"
id = "None"

# secret: ZENODO_TOKEN -> wrangler secret put ZENODO_TOKEN
