name = "qnfo-deploy-guard"
main = "worker.js"
# charter-pillar: security
# COMPAT-ADVANCE-WAVE-1 (2026-10-12, metric workers_compat_date_behind, qnfo-ops COMPAT-DATE-DECLARED-APPLY-1): the date moves
# to 2026-10-10 on the next canonical deploy. Reviewed against qnfo-ops COMPAT_FLIPS between the old date and this one:
# 2026-08-04 nodejs_compat default on (this worker reads no timer id as a number, has no typeof process/Buffer branch and
# imports no node: module), 2026-10-01 Durable Object eviction (no Durable Object here). /ops/deploy keeps the date only
# when /health answers with the deployed VERSION and otherwise restores the previous date (deployment_history compat-restore).
# COMPAT-ADVANCE-REVIEW-RESTORED-1 (2026-10-25): the condition COMPAT-ADVANCE-REVIEW-WITHHELD-1 set is now met - the
# worker is scan-clean. qnfo-deploy-guard 1.3.30 renamed its four fetch-timeout handles to timerId, so
# scripts/compat-risk-scan.mjs reports risks=[] for this worker. The earlier timer-ids finding was a FALSE POSITIVE:
# the detector links a setTimeout handle to later numeric use by NAME across function scopes, and an unrelated
# timestamp variable (var t = ms(rows[i].ts)) in a different function was also called `t`. Restored WITH coverage
# rather than leaving the worker unscanned, exactly as the withheld commit prescribed.
# compat-advance: reviewed 2026-11-09 (compat-risk-scan clean; no COMPAT_FLIPS entry between 2026-10-10 and 2026-11-04)
compatibility_date = "2026-11-04"
# FLEET-PROBE-1042-1 (2026-09-30): refreshRegistryVersion() reads <worker>.q08.workers.dev/health; without
# this flag that same-zone subrequest is error 1042 (HTTP 404), so the live-version read silently failed.
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true


[observability]
enabled = true
head_sampling_rate = 1

# WORKERS-STANDARDS-1 (owner standards 2026-10-12): logs and traces declared. Workers docs: `enabled` alone turns on logs only;
# traces need [observability.traces]. Traces are sampled at the default rate of 1 (low-traffic worker).
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

head_sampling_rate = 0.05 # TRACES-SAMPLING-BEFORE-BILLING-1: stored traces bill from 2026-12-01
[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[kv_namespaces]]
binding = "FLEET_CONFIG"
id = "d3768b93a76640be83151b00a8b42717"

[triggers]
crons = ["*/20 * * * *"]

# DEPLOY-GUARD-HEALTH-BINDING-1 (issue 9680): refreshRegistryVersion reads personal-watch /health through this binding (CH_<WORKER> convention), public host as fallback.
[[services]]
binding = "CH_PERSONAL_WATCH"
service = "personal-watch"
environment = "production"

# DEPLOY-GUARD-HEALTH-BINDING-2 (issue 9708): one CH_<WORKER> binding per live worker directory with a /health route (all 200 on 2026-11-09), so refreshRegistryVersion never needs the public workers.dev hop.

