name = "qnfo-evolve"
main = "worker.js"
# COMPAT-ADVANCE-WAVE-2 (2026-10-18, portfolio UPG-qnfo-evolve): the date moves from the LIVE
# 2026-08-01 to 2026-10-10 on the next canonical deploy. Measured 2026-10-18T06:31Z:
# worker_compat_state held live_date=2026-08-01, toml_date=2026-10-10, days_behind=78, and the
# file carried no review line, which is why the fleet kept flagging it. Reviewed against
# qnfo-ops COMPAT_FLIPS for the two flips in that window:
#   2026-08-04 nodejs_compat default on (needs: any). This worker imports no node: module, has no
#     Buffer, holds no timer handle (no setTimeout/setInterval) and never reads the Node process
#     global -- the 15 "process" occurrences in worker.js are the v_process_path_gaps D1 COLUMN
#     (row.process), not process.env. The added globals and Timeout objects are therefore never
#     touched. The only binding is D1 AUDIT, read through env.AUDIT.
#   2026-10-01 durable-object I/O eviction (needs: durable_object). This worker declares no
#     Durable Object, so the flip cannot reach it.
# Post-deploy check: /health must answer ok with VERSION 0.2.3, and the next cron tick must
# record a sweep in evolve_filings/cloud_ops_events.
# compat-advance: reviewed 2026-10-18
compatibility_date = "2026-10-10"
workers_dev = true
# charter-pillar: autonomy (EVOLVE-1)
#
# WHY THE PILLAR IS autonomy: this worker exists so that a registered gap becomes named work and a
# closed gap is closed by the machine, not by the owner noticing. It is the "human as override,
# never dependency" pillar applied to the improvement loop itself.
#
# NO BINDINGS BEYOND D1, AND NO SECRET, ON PURPOSE. It reads the fleet's registers and writes
# agent_issues rows it owns. A worker that cannot deploy, cannot edit code and holds no credential
# cannot damage the fleet when it is wrong -- the worst it can do is file a bad issue, which the
# merge gate then refuses.
#
# traces are declared explicitly: the top-level [observability] switch enables logs only, and a
# worker that ships with no traces cannot be diagnosed after the fact.

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# limits-not-declared: bound the CPU so a pathological register cannot run to the wall clock.
[limits]
cpu_ms = 30000

# Quarter-hourly at minute 2, off the fleet's 10-minute control tick (minute 0) and off the
# code-orchestrator's plan tick. CRON_RATE_GUARD-1 requires at least 10 minutes between fires;
# 15 satisfies it with margin.
[triggers]
crons = ["2,17,32,47 * * * *"]

[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"
