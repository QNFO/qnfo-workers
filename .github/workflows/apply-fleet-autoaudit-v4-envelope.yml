name: apply-fleet-autoaudit-v4-envelope

# D1-REST-ENVELOPE-OK-1 (#1403), 2026-09-29.
#
# Applies scripts/fleet-autoaudit-v4-envelope-patch.py to scripts/fleet-autoaudit.py, gates
# on py_compile AND on a byte-exact blob-hash assertion, commits, and pushes with a
# rebase + retry loop.
#
# WHY THE BLOB ASSERTION EXISTS: the patched artifact was produced and verified outside CI
# (Cloudflare container, against main @ 79ce43d1): 16617 -> 17593 bytes, PY_COMPILE_OK,
# idempotent on a second run, helper semantics 5/5, git blob sha1
# d7b5c4ad9a078e0195bd823a41db2ed8c27f3ce5. Asserting that exact hash here means a green
# run PROVES CI reproduced that same artifact -- it cannot silently commit a different
# variant. If the hash ever differs, the job fails closed and commits nothing.
#
# WHY THIS CLOSES THE LOOP: the commit touches scripts/fleet-autoaudit.py, which is NOT in
# this workflow's paths, so there is no self-trigger loop; but it IS a push to main, and
# .github/workflows/fleet-autodeploy.yml now triggers on every push to main. That run
# executes the FIXED audit, whose D1 probes will stop reporting false write failures, which
# is what un-skips the "auto-deploy repo-ahead workers" step.
#
# ADVERSARIAL: a green run proves the patch applied and reproduced the verified artifact. It
# does NOT prove the next audit classifies correctly, does NOT prove the auto-deploy step
# finds candidates (the strictly-ahead rule decides that, and the last observed run found
# none), and does NOT prove any worker is healthy. It also does not fix the separate
# cancellation/queue starvation of fleet-autodeploy (AUDIT-CADENCE-STARVATION-1).

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fleet-autoaudit-v4-envelope-patch.py'
      - '.github/workflows/apply-fleet-autoaudit-v4-envelope.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-fleet-autoaudit-v4-envelope
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: apply fail-closed patch
        run: python scripts/fleet-autoaudit-v4-envelope-patch.py

      - name: gate on py_compile
        run: python -m py_compile scripts/fleet-autoaudit.py

      - name: assert patched blob matches the container-verified artifact
        run: |
          set -euo pipefail
          want="d7b5c4ad9a078e0195bd823a41db2ed8c27f3ce5"
          got="$(git hash-object scripts/fleet-autoaudit.py)"
          echo "patched blob: $got"
          echo "verified blob: $want"
          if [ "$got" != "$want" ]; then
            echo "::error::patched blob $got != container-verified $want -- refusing to commit"
            exit 1
          fi
          echo "blob assertion PASSED (CI reproduced the verified artifact byte-for-byte)"

      - name: commit and push (rebase + retry)
        run: |
          set -euo pipefail
          git config user.name  "qnfo-selfheal-bot"
          git config user.email "selfheal-bot@qnfo.org"
          if git diff --quiet; then
            echo "no change to commit (patch already applied)"
            exit 0
          fi
          git add scripts/fleet-autoaudit.py
          git commit -m "fix(fleet-autoaudit): gate D1 probes on the CF v4 envelope, not res.get('ok') (#1403)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected on attempt $i; rebasing onto origin/main"
            git pull --rebase --autostash origin main
            sleep $((i * 3))
          done
          echo "::error::push failed after 5 attempts (concurrent writers)"
          exit 1
