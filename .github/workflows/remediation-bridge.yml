name: remediation-bridge

# REMEDIATION-CONTRACT-BRIDGE-1 (2026-10-01).
#
# Measured state before this workflow: qnfo-audit held 88 open rows in
# `agent_issues` and only 2 of them carried a row in `remediation_contracts`.
# The consumer (scripts/remediation-consumer.py) verifies contracts, but nothing
# created one from an issue, so 86 of 88 open issues had no verification path at
# all and the armed auto-close triggers could never fire for them. This workflow
# runs the bridge that closes that gap, so every open issue is either (a) backed
# by a machine-executable probe, or (b) explicitly registered as
# `needs-machine-probe` and therefore visibly unverifiable instead of silently
# unverified.
#
# CADENCE (SCHEDULE-EVENT-NEVER-FIRES-1): the GitHub `schedule` event has never
# fired on this repository, so the cron below is opportunistic. The load-bearing
# triggers are `push` and `workflow_run` chained off workflows that do fire.
#
# LOOP SAFETY: this workflow writes no repository file except its own ci-status
# artifact, and that commit carries `[skip ci]`, so it cannot re-trigger itself
# or fleet-autodeploy. The chain is acyclic.
#
# ADVERSARIAL: a green run proves the bridge executed and what it counted. It
# does NOT prove the fleet is healthy, and it does NOT close any issue. A
# contract registered as `needs-machine-probe` is fail-closed: the consumer will
# not run it, so no pass can be fabricated for it. Closing still requires the
# consumer to observe expected == observed.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/remediation_contract_bridge.py'
      - 'scripts/remediation_probe_map.json'
      - '.github/workflows/remediation-bridge.yml'
  workflow_run:
    workflows: ["apply-pending-patches", "fleet-autodeploy", "mirror-sync"]
    types: [completed]
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remediation-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Self-test the probe map (every probe must be a literal SELECT)
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("scripts/remediation_probe_map.json")
          if not p.exists():
              print("no probe map present; bridge registers every unmapped issue inactive")
              sys.exit(0)
          d = json.loads(p.read_text())
          bad = []
          for k, v in (d.get("probes") or {}).items():
              probe = (v or {}).get("probe") if isinstance(v, dict) else v
              s = (probe or "").strip()
              low = s.lower()
              if not (low.startswith("select") or low.startswith("with")):
                  bad.append((k, "not-a-select"))
                  continue
              for kw in ("insert into", "update ", "delete from", "drop ", "alter ",
                         "create ", "pragma ", "replace into"):
                  if kw in low:
                      bad.append((k, "write-keyword:" + kw.strip()))
                      break
              else:
                  body = s.rstrip().rstrip(";")
                  if ";" in body:
                      bad.append((k, "multi-statement"))
          if bad:
              print(json.dumps({"ok": False, "bad_probes": bad}))
              sys.exit(1)
          print(json.dumps({"ok": True, "probes": len(d.get("probes") or {})}))
          PY

      - name: Run the contract bridge
        id: bridge
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 scripts/remediation_contract_bridge.py | tee /tmp/remediation-bridge.json
          echo "--- bridge output above ---"

      - name: Publish the status artifact
        if: always()
        run: |
          set -uo pipefail
          mkdir -p ci-status
          python3 - <<'PY'
          import json, pathlib
          raw = pathlib.Path("/tmp/remediation-bridge.json")
          try:
              d = json.loads(raw.read_text())
          except Exception as e:
              d = {"ok": False, "error": "no parseable bridge output: %s" % e}
          d["marker"] = "REMEDIATION-CONTRACT-BRIDGE-1"
          d["head"] = "${{ github.sha }}"
          d["job_status"] = "${{ job.status }}"
          pathlib.Path("ci-status/remediation-bridge.json").write_text(json.dumps(d, indent=1)[:8000])
          print(json.dumps({k: d.get(k) for k in (
              "ok", "open_issues", "inserted_active", "inserted_needs_machine_probe",
              "active_contracts", "active_with_executable_probe",
              "active_with_prose_probe", "open_issues_without_active_contract")}))
          PY

      - name: Commit the status artifact
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          git config user.name "qnfo-selfheal-bot"
          git config user.email "bot@qnfo.org"
          git add ci-status/remediation-bridge.json
          if git diff --cached --quiet; then echo "no status change"; exit 0; fi
          git commit -m "ci(status): remediation-bridge [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "status pushed on attempt $i"
              exit 0
            fi
            sleep 4
          done
          echo "status push failed after 3 attempts"
          exit 0
