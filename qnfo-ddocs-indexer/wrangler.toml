name = "qnfo-ddocs-indexer"
main = "worker.js"
compatibility_date = "2026-08-10"
workers_dev = true

[[r2_buckets]]
binding = "DDOCS"
bucket_name = "qnfo-ddocs"

[[vectorize]]
binding = "DDOC_VZ"
index_name = "qnfo-ddocs"

[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[ai]
binding = "AI"

[triggers]
crons = ["37 */2 * * *"]

# SECRET-HYGIENE-1 2026-09-22:
#  - INDEX_TOKEN migrated to a *secret* binding. CF refuses a secret while a same-named
#    plain_text var exists, so the var is dropped on the next deploy and the secret set
#    immediately after. The previously-committed value must be treated as burned + rotated.
#  - DDOC_PREFIX removed: it is NOT live and the worker treats env.DDOC_PREFIX as an
#    OPTIONAL OVERRIDE, so declaring it here would silently change behaviour on deploy.
