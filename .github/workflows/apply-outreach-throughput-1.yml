name: apply-outreach-throughput-1

# OUTREACH-THROUGHPUT-1 (issue #1508).
# Server-side applier: the ops endpoint cannot round-trip a 126 KB worker.js through its
# output channel (live GW_MAX_OUT=32768, see issue #1531), so the fix ships as a small,
# fail-closed patch script that this workflow applies and commits.
# Mirrors the deleted apply-outreach-selector-terminal-status.yml that issue #1518 records
# as having been clobbered by a stale-base graft.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-outreach-throughput-1.py'
      - '.github/workflows/apply-outreach-throughput-1.yml'

permissions:
  contents: write

concurrency:
  group: apply-outreach-throughput-1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch (fail-closed)
        run: python3 scripts/apply-outreach-throughput-1.py

      - name: Commit and push
        run: |
          git config user.name  "qnfo-ops-bot"
          git config user.email "ops@qnfo.org"
          if git diff --quiet; then
            echo "no changes to commit (already applied)"
            exit 0
          fi
          git add -A
          git commit -m "fix(outreach): OUTREACH-THROUGHPUT-1 cap 3->8, selector window 10->25, email-lookup failure terminal, followup validEmail guard (#1508)"
          git push origin HEAD:main
