name: apply-binding-merge-repair-1

# BINDING-INSTALL-MERGE-1 repair driver (2026-09-29, issue #1448).
#
# ROOT CAUSE OF THE REPAIR NEVER LANDING (WORKFLOW-HEREDOC-INDENT-1, found 2026-09-29 17:2xZ):
# the first version of this file embedded `python3 - <<'PY' ... PY` heredocs inside `run: |`
# block scalars, with the heredoc BODY written at column 0. A block scalar ends at the first
# line indented less than its indentation indicator, so the body lines terminated the scalar and
# became document-level YAML -> the file was INVALID. GitHub therefore created each run with
# ZERO jobs and an instant failure (runs 36602032585 / 36602057343 / 36602052992: total_count 0,
# updated_at == created_at). The repair driver was dead on arrival and no canonical deploy of
# qnfo-research-exec ever happened, which is why QNFO_AI is STILL absent from the live worker.
# This version is heredoc-free and mirrors the proven shape of apply-binding-install-gate-1.yml.
#
# WHY A CANONICAL DEPLOY AND NOT raw_put.py: raw_put.py performs exactly one
# PUT /workers/scripts/<name>/content, which re-sends the EXISTING binding set and can never ADD
# a binding. The canonical path (POST /ops/deploy -> opsDeploy -> cfWorkerDeploy) now unions the
# declared non-secret bindings from the worker's wrangler.toml into the live set, so ONE canonical
# deploy of qnfo-research-exec installs its declared QNFO_AI service binding.
#
# IMPACT BEING REPAIRED: qnfo-research-exec has run without QNFO_AI since before 2026-09-16, so
# routerFetch() fell back to a PUBLIC fetch of a same-account workers.dev hostname (blocked from
# Worker context) -> 609 gw-fallback 404s -> every gateway call degraded to the short Workers AI
# fallback -> stageRevise() requires >= 10000 chars -> the research pipeline terminalised
# (agent_issues 1291/1304/1306/1345/1365/1366/1406 + siblings).
#
# This workflow declares NO cron: SCHEDULE-EVENT-NEVER-FIRES-1 (the GitHub `schedule` event has
# never fired on this repository). It fires on push to itself, and on manual dispatch.
# It is idempotent: re-running re-deploys the same repo artifact and re-asserts the same invariant.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-binding-merge-repair-1.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: apply-binding-merge-repair-1
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Canonical deploy of qnfo-research-exec (installs declared bindings)
        env:
          OPS_ROUTER_AUTH_KEY: ${{ secrets.OPS_ROUTER_AUTH_KEY }}
          OPS_AUTH_KEY: ${{ secrets.OPS_AUTH_KEY }}
          OPS_KEY: ${{ secrets.OPS_KEY }}
        run: |
          set -uo pipefail
          KEY="${OPS_ROUTER_AUTH_KEY:-${OPS_AUTH_KEY:-${OPS_KEY:-}}}"
          if [ -z "$KEY" ]; then
            echo "FAIL: no ops deploy credential configured (OPS_ROUTER_AUTH_KEY / OPS_AUTH_KEY / OPS_KEY all empty)"
            exit 2
          fi
          echo "credential_present=1 source=${KEY:+configured}"
          export OPS_ROUTER_AUTH_KEY="$KEY"
          python3 scripts/canonical_deploy.py --worker qnfo-research-exec --path qnfo-research-exec/worker.js 2>&1 | tee /tmp/canonical-deploy.log
          rc=${PIPESTATUS[0]}
          echo "canonical_deploy_exit=$rc"
          test "$rc" -eq 0 || exit "$rc"

      - name: Verify QNFO_AI service binding is present on the live worker
        id: verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          ok=0
          for i in $(seq 1 6); do
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/qnfo-research-exec/settings" -o /tmp/settings.json || true
            if grep -q '"QNFO_AI"' /tmp/settings.json 2>/dev/null; then
              ok=1
              break
            fi
            echo "attempt $i: QNFO_AI not present yet"
            sleep 10
          done
          if [ "$ok" = "1" ]; then
            echo "binding_present=1" >> "$GITHUB_OUTPUT"
            python3 -c "import json;d=json.load(open('/tmp/settings.json'));n=[b.get('name') for b in d.get('result',{}).get('bindings',[])];print('live_binding_names='+json.dumps(n));assert 'QNFO_AI' in n,'QNFO_AI missing from settings';print('QNFO_AI binding CONFIRMED on live qnfo-research-exec')"
            exit 0
          fi
          echo "binding_present=0" >> "$GITHUB_OUTPUT"
          echo "FAIL: QNFO_AI still absent after a canonical deploy - the BINDING-INSTALL-MERGE-1 fix is not live on qnfo-ops"
          exit 1

      - name: Publish machine-readable status
        if: always()
        env:
          BINDING_PRESENT: ${{ steps.verify.outputs.binding_present }}
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          mkdir -p ci-status
          printf '{\n  "check": "binding-merge-repair-1",\n  "issue": 1448,\n  "worker": "qnfo-research-exec",\n  "binding": "QNFO_AI",\n  "binding_present": "%s",\n  "job_status": "%s",\n  "head": "%s",\n  "ts": "%s"\n}\n' "${BINDING_PRESENT:-unknown}" "$JOB_STATUS" "$HEAD_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci-status/binding-merge-repair-1.json
          cat ci-status/binding-merge-repair-1.json

      - name: Commit back the status artifact (race-safe, non-blocking)
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          git config user.name  "qnfo-fleet-bot"
          git config user.email "fleet-bot@qnfo.org"
          git add -f ci-status/binding-merge-repair-1.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "ci(status): binding-merge-repair-1 [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "commit-back OK on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "commit-back failed after 5 attempts (non-blocking)"
