name: branch-cleanup

on:
  schedule:
    # 04:17 UTC daily (offset from on-the-hour to avoid GitHub scheduler noise)
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup-stale-branches:
    name: Delete stale feature branches
    # RUNNER-PIN-2 (2026-11-04): pinned to ubuntu-24.04 because ubuntu-latest moves to Ubuntu 26 until 2026-11-19; unpin after a green trial run on ubuntu-26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Clean up stale branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"

          # Collect branch lists. Always preserve main, release-* and the CI artifact branch.
          mapfile -t all_branches < <(gh api "repos/$REPO/branches?per_page=100" --paginate -q '.[].name')
          mapfile -t open_pr_branches < <(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate -q '.[].head.ref')
          mapfile -t merged_pr_branches < <(gh api "repos/$REPO/pulls?state=closed&per_page=100" --paginate -q '.[] | select(.merged_at != null) | .head.ref')
          mapfile -t closed_pr_branches < <(gh api "repos/$REPO/pulls?state=closed&per_page=100" --paginate -q '.[] | select(.merged_at == null) | .head.ref')

          is_in() {
            local needle="$1"; shift
            printf '%s\n' "$@" | grep -qx "$needle"
          }

          for branch in "${all_branches[@]}"; do
            # Protected / reserved namespaces
            if [[ "$branch" == "main" ]] || [[ "$branch" == release-* ]] || [[ "$branch" == "fleet-artifacts" ]]; then
              continue
            fi

            # Branches with open PRs are still live
            if is_in "$branch" "${open_pr_branches[@]}"; then
              continue
            fi

            # Branches whose PRs merged should already be gone via delete_branch_on_merge,
            # but clean up any that survived (e.g. merged before the setting was on).
            if is_in "$branch" "${merged_pr_branches[@]}"; then
              echo "Deleting merged PR branch: $branch"
              gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" || true
              continue
            fi

            # Closed-unmerged PRs are explicitly abandoned; delete their feature branches.
            if is_in "$branch" "${closed_pr_branches[@]}"; then
              if [[ "$branch" == codeagent-* ]] || [[ "$branch" == agent-* ]] || [[ "$branch" == copilot/* ]]; then
                echo "Deleting closed-unmerged feature branch: $branch"
                gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" || true
              fi
              continue
            fi

            # Orphan feature branches: only delete if they add no unique commits vs main.
            if [[ "$branch" == codeagent-* ]] || [[ "$branch" == agent-* ]] || [[ "$branch" == copilot/* ]]; then
              ahead_by=$(gh api "repos/$REPO/compare/main...$branch" -q '.ahead_by')
              if [[ "$ahead_by" == "0" ]]; then
                echo "Deleting orphan branch with no unique commits: $branch"
                gh api --method DELETE "repos/$REPO/git/refs/heads/$branch" || true
              fi
            fi
          done
