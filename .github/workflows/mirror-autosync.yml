name: mirror-autosync

# MIRROR-AUTOSYNC-1 (issue #1229): the automatic half of the repo-internal parity
# self-audit. deploy-drift.yml FAILS CLOSED when a mirror diverges from its source;
# this workflow regenerates the mirrors and PROPOSES the repair as a pull request.
#
# WHY A PR AND NOT A DIRECT PUSH: scripts/mirror-guard.py --fix copies
# <dir>/worker.js over <dir>/deployed-current.worker.js. That is the correct
# direction when the source is ahead, but it is a REGRESSION when the mirror is a
# capture of a live deploy that is ahead of the repo (the DEPLOY-UNLOGGED-MUTATION
# class, issues #1340-#1343). Canonical case found 2026-09-29: qnfo-lifecycle live
# /health reports 1.6.2-cronconsolidate while both repo files carry 1.6.2, so an
# unattended cp would have reverted a live fix. Auto-propose; merge deliberately.
on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# WORKFLOW-CONCURRENCY-1 (2026-10-17): a second run of the same workflow on the
# same branch supersedes the first instead of paying for both. Previously absent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autosync:
    # RUNNER-PIN-2 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest becomes Ubuntu 26 by 2026-11-19 (a notice on every job meanwhile); pinned to ubuntu-24.04 until an ubuntu-26.04 trial run is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: detect repo-internal mirror drift (report)
        run: |
          set +e
          {
            echo "mirror-guard report (pre-repair):"
            echo '```'
            python scripts/mirror-guard.py || true
            echo '```'
          } | tee /tmp/mirror-before.txt
      - name: regenerate mirrors from source
        run: python scripts/mirror-guard.py --fix
      - name: propose repair PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: mirror-autosync/repair
          delete-branch: true
          commit-message: "mirror-autosync: regenerate deployed-current mirrors from source"
          title: "mirror-autosync: repo-internal mirror drift repair"
          body-path: /tmp/mirror-before.txt
