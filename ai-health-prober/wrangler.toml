name = "ai-health-prober"
main = "worker.js"
compatibility_date = "2026-09-01"

# --- AI binding (used by probeOne -> env.AI.run) ---
[ai]
binding = "AI"

# --- D1: qnfo-audit (same database as qnfo-observability's AUDIT binding) ---
[[d1_databases]]
binding = "QNFO_AUDIT"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# --- CRON-FIX-20260929 ---
# Previously ABSENT. Without this block the worker's `scheduled()` handler can
# never fire, which is why freshness_guard froze on 2026-09-19T00:20:46Z.
# The worker source (v2.3.5) was written against a */20 cadence
# (see AMH-NAMESPACE-2 / MODEL-DEGRADED "refiled every */20 cron" comments).
[triggers]
crons = ["*/20 * * * *"]
