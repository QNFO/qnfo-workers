name = "qnfo-email-orchestrator"
main = "worker.js"
compatibility_date = "2026-08-10"

# Management: wrangler-managed since 2026-09-08 model-audit deploy (BINDING-PRESERVATION-1 active toml)

[observability]
enabled = true
head_sampling_rate = 1

[vars]
DRY_RUN = "false"

[ai]
binding = "AI"

[[d1_databases]]
binding = "AUDIT_DB"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "OUTREACH_DB"
database_name = "qnfo-outreach"
database_id = "d5077252-8187-41b2-a44e-f84f8724ee36"

[[services]]
binding = "EMAIL"
service = "qnfo-email"
environment = "production"
# EMAIL-CALLER-PROPS-1 (CLAUDE.md #1703 rule): qnfo-email 2.5.1+ authenticates this binding by ctx.props.caller. The
# EMAIL_API_KEY copy this worker sent was not accepted by qnfo-email /send (401; email_reply_queue 56 on 2026-10-05).
# Installed by qnfo-ops BINDING-PROPS-APPLY-1 on the canonical deploy.
props = { caller = "qnfo-email-orchestrator" }

# secret: EMAIL_API_KEY (set via wrangler secret put; persists across deploys)
[triggers]
crons = ["0 */3 * * *", "*/15 * * * *"]
