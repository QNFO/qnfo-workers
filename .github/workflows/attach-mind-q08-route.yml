name: attach-mind-q08-route

# MIND-Q08-1 (2026-10-21): routes mind.q08.org to q08-mind, the inside reading surface. Same self-triggering,
# fail-closed, commit-back pattern as attach-me-q08-route.yml: a push of this file or its script starts the run, the
# script waits for the canonical deploy of q08-mind, creates the zone route (and an originless proxied AAAA record when
# none exists) and verifies from outside the account that https://mind.q08.org/health names q08-mind, removing what it
# created otherwise. Reversible: delete the ids in ci-status/attach-mind-q08-route.json.
# MIND-Q08-3 (2026-10-21): the script no longer reads an unreadable scripts API (http 0/403) as "worker absent".
# It now has three independent existence paths and fails closed only on a definitive 404; outside verification of
# /health and /api/entries.json stays the real gate.
# WORKFLOW-YAML-LINT-1: every step name below is colon-free.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-mind-q08-route.yml'
      - 'scripts/attach-mind-q08-route.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: attach-mind-q08-route
  cancel-in-progress: false

jobs:
  attach-and-verify:
    # RUNNER-PIN-2 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest becomes Ubuntu 26 by 2026-11-19; pinned to ubuntu-24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run the idempotent fail-closed route script
        id: attach
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          rc=0
          python3 scripts/attach-mind-q08-route.py || rc=$?
          echo "attach_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "ATTACH_RC=$rc"
          exit 0

      - name: Echo the route result artifact
        run: |
          set -uo pipefail
          if [ -f ci-status/attach-mind-q08-route.json ]; then
            cat ci-status/attach-mind-q08-route.json
          else
            echo "NO_ARTIFACT_WRITTEN"
          fi

      - name: Commit the route result back to main (race-safe)
        id: commitback
        env:
          MAIN_PUSH_TOKEN: ${{ secrets.QNFO_GH_PAT }}
        run: |
          set -uo pipefail
          git config user.name "qnfo-selfheal-bot"
          git config user.email "bot@qnfo.org"
          git add ci-status/attach-mind-q08-route.json
          bash scripts/push_artifact.sh "ci(attach-domain): record MIND-Q08-3 result [skip ci]" ci-status/attach-mind-q08-route.json
