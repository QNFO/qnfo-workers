name: attach-lifecycle-custom-domain

# ATTACH-LIFECYCLE-CUSTOM-DOMAIN-1 (agent_issues #1517), 2026-09-30.
#
# WHY A DEDICATED WORKFLOW AND NOT AN APPLIER UNDER scripts/*patch*.py
# -------------------------------------------------------------------
# apply-pending-patches.yml owns scripts/*patch*.py and deploys changed workers. This change
# is NOT a worker edit -- it is an account-level API mutation (Workers custom domain). Running
# it under the applier would misreport it as a code patch and give it no verification of its
# own. Instead this mirrors the proven self-triggering pattern already used by
# lifecycle-sot-and-deploy.yml: `push` on this file (and its script) starts its own first run,
# so no dispatch credential is required -- the GITHUB_TOKEN available to the ops endpoint
# cannot dispatch workflows.
#
# The script itself is fail-closed and idempotent; it exits non-zero if the token cannot
# list/create domains or if the attached hostname never answers 200 externally. A red job
# here therefore means the blocker is real and is printed verbatim, never masked.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-lifecycle-custom-domain.yml'
      - 'scripts/attach-lifecycle-custom-domain.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attach-lifecycle-custom-domain
  cancel-in-progress: false

jobs:
  attach-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Attach lifecycle.qnfo.org -> qnfo-lifecycle (idempotent, fail-closed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/attach-lifecycle-custom-domain.py
