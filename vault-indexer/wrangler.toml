name = "vault-indexer"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

[triggers]
# CRON-RATE-CEILING-1 (owner directive 2026-09-23): a cron may not fire more than once
# per 10 minutes, nor more than 144 times per 24h. Was "*/5 * * * *" = 288 fires/24h.
# scheduled(event, env, ctx) calls run(env) with no cron-string branch, so the
# incremental vault re-index simply sweeps on a longer cadence.
# DRIFT NOTE 2026-09-23 (CRON-SCHEDULE-EXTERNAL-DRIFT-1): repo and LIVE were both set to
# "*/10"; a CONCURRENT actor then re-timed LIVE to "*/15" out-of-band. Repo now mirrors
# LIVE. "*/15" = 96 fires/24h with headroom under the 144/24h ceiling.
crons = ["*/15 * * * *"]

[[r2_buckets]]
binding = "VAULT"
bucket_name = "obsidian-vault"

[[d1_databases]]
binding = "PERSONAL"
database_name = "personal-life"
database_id = "e8d6c61a-10b7-4086-b81e-9e6e85afa407"

[[vectorize]]
binding = "VZ"
index_name = "personal-life"

[ai]
binding = "AI"
