name: apply-selfheal-analyzer-live

# SELFHEAL-ANALYZER-LIVE-1 (issue 1165, 2026-09-29).
#
# WHY THIS WORKFLOW EXISTS: scripts/selfheal-analyzer-patch.py repairs the telemetry
# self-heal analyzer, which is STRUCTURALLY DEAD on live qnfo-ops. Without a workflow to
# invoke the applier it would repeat ORPHANED-APPLIER-1 -- a fix in the repo with no
# execution path to production. This workflow IS that execution path.
#
# THE DEFECT (verified live 2026-09-29):
#   telemetry_analyze() extracts the failing tool from cloud_ops_events.text with
#       /(?:tool|tool_name|called)[=: ]+([A-Za-z0-9_.-]+)/i
#   but text holds the BARE tool name ("ops_d1_query"). Executing that regex against all
#   15 distinct text values present returned NO MATCH for 15 of 15, so toolKey was always
#   "" and every row was discarded by `if (!toolKey) continue;`. filed:0 was permanent.
#   Corroborating: issue_ledger category 'telemetry-self-heal' last wrote 2026-09-26
#   09:30:41 -- nothing filed for three days.
#   Two further defects in the same function: the recovery gate treated ONE success after
#   the last error as full recovery (so a tool failing 260x/24h alongside thousands of
#   successes could never file), and the auto-resolve fingerprint used text.slice(0,60)
#   while the file fingerprint used toolKey, so resolve could never match file.
#
# VERSION-PIN-AGNOSTIC-1 (issue 1355): this preflight asserts the ANALYZER PROPERTY, not a
# frozen version literal. A version pin blocked a real fix twice today (STALE-PREFLIGHT-1).
#
# DEPLOY: scripts/raw_put.py PUTs to the CF API /content endpoint, which updates CODE ONLY
# and preserves live bindings (BINDING-PRESERVATION-1); it is fail-closed. The applier
# writes worker.js AND its deployed-current mirror in one commit so mirror-guard stays
# green and the qnfo-fleet-control */20 redeploy cron cannot revert the fix.
#
# NOTE the commit message is passed as single-line -m flags, never as an inline multi-line
# string: a multi-line git commit -m inside a run: | scalar puts continuation lines at
# column 1, terminates the scalar, and makes the whole workflow invalid YAML -- the
# documented defect that produced runs with zero jobs.

on:
  push:
    paths:
      - 'scripts/selfheal-analyzer-patch.py'
      - '.github/workflows/apply-selfheal-analyzer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-selfheal-analyzer
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply patch (fail-closed)
        id: apply
        run: |
          set -euo pipefail
          python3 scripts/selfheal-analyzer-patch.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change produced (already applied)"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: ESM syntax gate (blocking)
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cp qnfo-ops/worker.js /tmp/selfheal-check.mjs
          node --check /tmp/selfheal-check.mjs
          echo "ESM parse OK"

      - name: Mirror parity for the patched pair (blocking)
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cmp qnfo-ops/worker.js qnfo-ops/deployed-current.worker.js
          echo "qnfo-ops source and mirror are byte-identical"

      - name: Fleet mirror-guard report (non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/mirror-guard.py || true

      - name: Commit and push to the triggering branch
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "qnfo-selfheal-bot"
          git config user.email "ops@qnfo.org"
          git add -u
          if git diff --cached --quiet; then
            echo "nothing staged; exiting"
            exit 0
          fi
          git diff --cached --stat
          SUBJECT="fix(qnfo-ops): #1165 telemetry self-heal analyzer can now actually file"
          BODY="Issue 1165: telemetry_analyze() extracted the failing tool with a tool=NAME regex, but cloud_ops_events.text holds the bare tool name, so the extraction returned empty for 15 of 15 real values and every row was discarded -- filed:0 was permanent and issue_ledger category telemetry-self-heal last wrote 2026-09-26. The extractor now accepts a bare tool name and falls back to the tool=NAME pattern. The recovery gate is replaced: a tool files when its failure RATE is at least 15 percent of its calls in the window and its last error is recent, instead of being skipped forever because it had one success after its last error. The auto-resolve fingerprint is unified on toolKey so a recovered tool's ticket can actually resolve. The applier writes both worker.js and its deployed-current mirror so the fleet redeploy cron cannot revert the fix."
          FOOT="Co-authored-by: Chatbox <chatbox@chatboxai.com>"
          git commit -m "$SUBJECT" -m "$BODY" -m "$FOOT"
          git push origin "HEAD:${{ github.ref_name }}"

  deploy:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight - artifact must carry the analyzer fix (version-pin-agnostic)
        id: pre
        run: |
          set -euo pipefail
          VER="$(grep -o 'var VERSION = "[^"]*";' qnfo-ops/worker.js | head -1 | sed 's/^var VERSION = "//; s/";$//')"
          echo "artifact_version=$VER" >> "$GITHUB_OUTPUT"
          echo "artifact VERSION=$VER"
          test "$(grep -cF 'SELFHEAL-EXTRACTOR-BARE-NAME-1' qnfo-ops/worker.js || true)" -ge 1
          test "$(grep -cF 'SELFHEAL-RATE-NOT-ABSENCE-1' qnfo-ops/worker.js || true)" -ge 1
          test "$(grep -cF 'SELFHEAL-FINGERPRINT-MISMATCH-1' qnfo-ops/worker.js || true)" -ge 1
          test "$(grep -cF 'out.rates' qnfo-ops/worker.js || true)" -ge 1
          test "$(grep -cF 'd1StripLiterals' qnfo-ops/worker.js || true)" -ge 1
          cmp qnfo-ops/worker.js qnfo-ops/deployed-current.worker.js
          echo "preflight OK: bare-name extractor, rate gate, unified fingerprint, prior D1 guard all present; mirrors byte-identical"

      - name: Deploy qnfo-ops (binding-preserving CF API /content PUT)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/raw_put.py qnfo-ops qnfo-ops/worker.js

      - name: Verify LIVE bundle carries the analyzer fix
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECT_VER: ${{ steps.pre.outputs.artifact_version }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/qnfo-ops/content" \
            -o /tmp/live-selfheal.js
          echo "live-bytes=$(wc -c < /tmp/live-selfheal.js)"
          echo "expected-version=$EXPECT_VER"
          test "$(grep -cF "$EXPECT_VER" /tmp/live-selfheal.js || true)" -ge 1
          test "$(grep -cF 'SELFHEAL-EXTRACTOR-BARE-NAME-1' /tmp/live-selfheal.js || true)" -ge 1
          test "$(grep -cF 'out.rates' /tmp/live-selfheal.js || true)" -ge 1
          echo "VERIFIED: live qnfo-ops carries the repaired self-heal analyzer"
