name: apply-deploy-guard-wrap-v2

# DEPLOY-GUARD-WRAP-2 (2026-09-29): wires scripts/raw_put.py into the deploy-guard
# deploy_locks lease + the fleet_deploys ledger.
#
# Root cause (issues 1361-1364): raw_put.py writes its ledger row to
# qnfo-audit.deployment_history, but qnfo-deploy-guard reads fleet_deploys to compute
#   logged = ms(latest fleet_deploys.ts) >= ms(modified_on) - 180000
# Table mismatch => every raw_put.py deploy is reported as unlogged-mutation (high);
# with no deploy_locks row held, also uncoordinated-deploy (high).
#
# The patcher is idempotent and fail-closed (exit 3 on anchor mismatch or syntax error).
# Pushing this file triggers the run.

on:
  push:
    paths:
      - '.github/workflows/apply-deploy-guard-wrap-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply DEPLOY-GUARD-WRAP-2 patch to scripts/raw_put.py
        run: python3 scripts/deploy-guard-wrap-patch-v2.py

      - name: Fail-closed verification
        run: |
          set -e
          python3 -c "import ast; ast.parse(open('scripts/raw_put.py').read()); print('ast.parse OK')"
          for m in 'DEPLOY-GUARD-WRAP-2' 'guard_lock(worker)' 'guard_ledger(worker' 'guard_unlock()' 'import atexit'; do
            n=$(grep -cF "$m" scripts/raw_put.py)
            echo "marker '$m' count=$n"
            test "$n" -ge 1 || { echo "MISSING MARKER: $m"; exit 3; }
          done
          echo "--- guard wiring present ---"
          grep -n "DEPLOY_GUARD_URL\|/lock/acquire\|/lock/release\|guard_ledger" scripts/raw_put.py

      - name: Commit patched deployer
        run: |
          set -e
          git config user.name  "qnfo-ci"
          git config user.email "ci@qnfo.org"
          git add scripts/raw_put.py
          if git diff --cached --quiet; then
            echo "no change to commit (already applied)"
          else
            git commit -m "fix(ci): DEPLOY-GUARD-WRAP-2 wire raw_put.py into deploy-guard lock + fleet_deploys ledger (closes #1361 #1362 #1363 #1364)"
            git push
          fi
          git log -1 --format='HEAD=%H %s'
