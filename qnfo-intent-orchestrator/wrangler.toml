name = "qnfo-intent-orchestrator"
main = "worker.js"
# COMPAT-DATE-DECLARED-APPLY-1 canary (qnfo-ops 2.42.0). The canonical deploy applies the date below on this worker's next
# deploy because of the review line, keeps it only when /health then answers with the deployed VERSION, and otherwise
# uploads 2026-08-01 again. Reviewed against the compatibility flags page, defaults between 2026-08-01 and 2026-10-10:
# 2026-08-04 nodejs_compat and nodejs_compat_v2 on by default (scripts/compat-risk-scan.mjs: no process.env, no Node global
# checks, no node: imports, no timer id used as a number, so no opt-out flag is needed); 2026-09-08 Python only;
# 2026-10-01 Durable Object eviction (this worker has no Durable Object). No WebSockets.
# compat-advance: reviewed 2026-10-12
compatibility_date = "2026-10-10"
workers_dev = true

# Secrets (preserved across deploys, set via wrangler secret put):
#   INTENT_TOKEN - Bearer token for all endpoints
#   RT           - qnfo-ai router key (outbound classification/triage via service binding)
#   CF_TOKEN     - Cloudflare API token (Email Sending)
#   CF_ACCOUNT   - account id
#   DIGEST_TO    - digest recipient (rowan.quni@outlook.com)
#   DIGEST_FROM  - sending address (agent@qnfo.org)
#   INDEX_TOKEN  - personal-life-search ingest token
#   DISPATCH_TOKEN - shared dispatch token accepted by qnfo-agent-orchestrator (X-Sync-Token)

[[d1_databases]]
binding = "D1"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[vectorize]]
binding = "VZ_P"
index_name = "personal-life"

[[vectorize]]
binding = "VZ_R"
index_name = "qnfo-ai-log"

# STALE-BINDING-FIX (2026-09-15): PLS -> personal-life-search removed. Target returns 404
# (worker no longer deployed). Intent `activity` path already try/catch-guarded -> degrades
# gracefully. Dead binding otherwise blocks redeploy (API code 10144).
[[services]]
binding = "QNFO_AI"
service = "qnfo-ai"
# INTERNAL-CALLER-PROPS-1 (#1703): qnfo-ai authenticates this binding by ctx.props.caller, so a router key
# rotation no longer strands this worker. Installed by qnfo-ops BINDING-PROPS-APPLY-1 on the canonical deploy.
props = { caller = "qnfo-intent-orchestrator" }

# v1.3.0 - promote accepted event intents into the calendar-api store (plane-aware)
[[services]]
binding = "CAL_API"
service = "qnfo-lifecycle"
props = { caller = "qnfo-intent-orchestrator", member = "calendar-api" }
environment = "production"

# v1.3.4 - self-registration to the qnfo-ops service registry (cross-service discovery).
# Secret: REGISTRY_TOKEN (shared with qnfo-ops /registry/register) - set via wrangler secret put.
[[services]]
binding = "QNFO_OPS"
service = "qnfo-ops"
environment = "production"

[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["0 6 * * *", "30 6 * * *"]
