# CONTAINER-CONFIG-RESTORE-1 (2026-09-29, issue #1485). LIVE EVIDENCE, NOT INFERENCE:
#   deployment_history id 172 -> qnfo-containers-pilot deployed 2026-09-29T19:30:35.100Z by
#   "qnfo-ops:cf_worker_deploy" with notes "bindings_preserved=2". GET /bindings returned
#   ONLY {d1 AUDIT, secret PILOT_TOKEN, durable_object_namespace SHELL_CONTAINER} - the
#   [[containers]] block below is not a binding, so the redeploy rebuilt metadata without
#   it. First cloud_ops_events row of kind=container.error with text
#   "Cannot read properties of undefined (reading 'running')" landed at 19:30:43.591Z,
#   i.e. 8 SECONDS after that deploy. Blast radius: shell_exec, exec_python, exec_node,
#   container_install, git_clone_exec, container_workspace_exec, shell_pipeline.
#   This commit deliberately touches wrangler.toml to fire deploy-containers-pilot.yml,
#   because wrangler deploy is the only path that transmits [[containers]].
#
#   RETRIGGER NOTE (2026-09-29): the first attempt (commit 129f0a2b) carried "[skip ci]"
#   in its message, which suppresses GitHub Actions push triggers, so
#   deploy-containers-pilot.yml never ran and ci-status/ gained no
#   deploy-containers-pilot.json. This retrigger deliberately uses a message with NO skip
#   token. A deploy trigger must never carry [skip ci] - that is the CI-TRIGGER-SKIP-1
#   class: the fix commit disables the workflow that would apply the fix.
#
# DO-MIGRATION-NOTE-1 2026-09-22 (R3/F2): a `wrangler deploy --dry-run` validates
# client-side structure ONLY - it cannot prove the server accepts this migration. The
# class already exists (created via the API), so a real wrangler deploy may FAIL CLOSED
# (Cloudflare rejects a creating migration for an already-depended-on class). It never
# wipes. The operative deploy path remains scripts/raw_put.py (binding-preserving).

name = "qnfo-containers-pilot"
main = "worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# qnfo-containers-pilot v1.0.0 — Full-stack shell execution on Cloudflare Containers
# Image: nikolaik/python-nodejs:python3.12-nodejs22 (Python 3.12 + Node.js 22 + npm)
# Startup: installs git + ripgrep + curl via apt-get on first cold start (~10-15s)
# Scale-to-zero: idle containers shut down automatically (cost = $0 when idle)
# Cost: $0.00002/vCPU-sec + $0.0000025/GiB-sec (utilization-based, Firecracker VM)
# BINDING-PRESERVATION-1: bindings verified from live CF API 2026-09-13

# CONTAINER-ROOTFS-CAPACITY-STRUCTURAL-1 (issue #1456) — instance_type lite -> basic.
# MEASURED 2026-09-29: /dev/vdc 1.9G total / 1.7G used / 121M free (94%). /usr = 1494M
# (base image), /workspace 39M, apt cache 12K, /root/.cache 1M, /tmp 1M — the caches were
# ALREADY clean, so cache hygiene cannot close the gap (the ENOSPC-CACHE-1 fix in worker.js
# v1.0.2 reclaimed the apt cache but not the capacity gap). A manual reclaim freed 198M
# (94% -> 83%), leaving the ~1.5G image as the floor.
# lite  = 1/16 vCPU, 256 MiB RAM, 2 GB disk  (too small; also the source of transient
#         `container error` under git+node+python)
# basic = 1/4 vCPU,  1 GiB RAM,   4 GB disk  (~2.4G free over the image)
# DEPLOY BLOCKER: instance_type is part of the [[containers]] config, NOT a binding and
# NOT a /content field — GET .../bindings returns only {d1 AUDIT, secret PILOT_TOKEN,
# durable_object_namespace SHELL_CONTAINER}. So scripts/raw_put.py (/content PUT) and the
# ops cf_worker_deploy path CANNOT apply this and risk dropping the container config;
# applying it requires `wrangler deploy` of this directory with a CF token.

[[containers]]
class_name = "ShellContainer"
image = "docker.io/nikolaik/python-nodejs:python3.12-nodejs22"
instance_type = "basic"
max_instances = 3

[[durable_objects.bindings]]
name = "SHELL_CONTAINER"
class_name = "ShellContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShellContainer"]

[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# Auth: wrangler secret put PILOT_TOKEN

