name: codeql

# GHA-AUDIT-CODEQL-1 (issue 2509, pillar security/cost, 2026-10-13).
#
# The repository ran CodeQL "default setup", which scans every push to main. GHA-AUDIT-1
# counted 26 such runs in 88 minutes (about 6 runner-hours), most of them for the fleet
# bots' `ci(status) [skip ci]` artifact commits, competing for the runner slots that
# canonical-deploy and the remediation loops need.
#
# This advanced setup scans the same languages, but:
#   - a `[skip ci]` commit skips it (default setup ignores that marker);
#   - pushes that touch only the bot artifact trees (ci-status/**, audits/**) are ignored;
#   - a weekly schedule still sweeps the whole tree.
#
# GitHub rejects advanced-setup uploads while default setup is enabled, so default setup
# must be turned off in Settings > Code security > CodeQL analysis (or by
# PATCH /repos/{owner}/{repo}/code-scanning/default-setup {"state":"not-configured"}
# with a token holding security_events admin).
#
# CODEQL-DEFAULT-PRECHECK-1 (2026-10-13): until that switch is made, every PR showed three red
# `analyze` checks ("CodeQL analyses from advanced configurations cannot be processed when the
# default setup is enabled", PR 1212). The precheck asks whether default setup's dynamic
# workflow (dynamic/github-code-scanning/codeql) is active, which `actions: read` can see (the
# default-setup endpoint itself needs admin and answers 403 to this token), and skips the analysis
# while it is, so the analysis takes over by itself once default setup is turned off. A failed
# read runs it.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ci-status/**'
      - 'audits/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'ci-status/**'
      - 'audits/**'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# GHA-AUDIT-1: a newer push to a PR cancels the superseded run; push runs are grouped per sha and never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      default_setup: ${{ steps.state.outputs.default_setup }}
    steps:
      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh api "repos/${{ github.repository }}/actions/workflows" --paginate \
                --jq '.workflows[] | select(.path == "dynamic/github-code-scanning/codeql") | .state' 2>/dev/null); then
            if printf '%s\n' "$out" | grep -qx active; then s=configured; else s=not-configured; fi
          else
            s=unknown
          fi
          echo "default setup: $s"
          echo "default_setup=$s" >> "$GITHUB_OUTPUT"

  analyze:
    name: analyze (${{ matrix.language }})
    needs: precheck
    if: needs.precheck.outputs.default_setup != 'configured'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - ci-status
              - audits
              - archive
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:${{ matrix.language }}"
