name = "personal-api"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# ============================================================
# personal-api (personal twin) - canonical repo mirror (2026-09-03)
# Recreated from the live deployed bundle (no local source existed) so the
# worker now has a canonical git home + wrangler deploy path. Bindings below
# reproduce the live settings. Secrets (never in git): API_KEY, CAL_TOKEN,
# CF_TOKEN, INFRA_TOKEN.
# v3.1.0: VISION-1 personal endpoint accepts images (vision-capable WA models
# ordered first; upstream no longer answers "no image" via non-vision
# deepseek) + MEDIA-INGEST-1 image capture to R2 personal-media + D1 table.
# ============================================================

[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "PERSONAL"
database_name = "personal-life"
database_id = "e8d6c61a-10b7-4086-b81e-9e6e85afa407"

[[vectorize]]
binding = "VZ"
index_name = "personal-life"

[[services]]
binding = "CAL_API"
service = "calendar-api"
environment = "production"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "personal-media"

# Secrets (wrangler secret put): API_KEY, CAL_TOKEN, CF_TOKEN, INFRA_TOKEN
