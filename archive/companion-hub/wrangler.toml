name = "companion-hub"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# Bindings verified from live CF API 2026-09-13 (BINDING-PRESERVATION-1)
[ai]
binding = "AI"

[[r2_buckets]]
binding = "DDRIVE"
bucket_name = "d-drive"

[[services]]
binding = "EMAIL"
service = "qnfo-email"
environment = "production"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "personal-media"

[[d1_databases]]
binding = "PERSONAL"
database_name = "personal-life"
database_id = "e8d6c61a-10b7-4086-b81e-9e6e85afa407"

[[vectorize]]
binding = "VZ"
index_name = "personal-life"
