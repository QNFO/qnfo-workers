name: apply-cf-worker-read-404-hint

# CF-WORKER-READ-404-HINT-1 (issue 1382, 2026-09-29).
#
# WHY THIS WORKFLOW EXISTS: scripts/cf-worker-read-404-hint-patch.py repairs the
# cf_worker_read tool so a guessed worker name returns actionable output (the
# deployed-name list + near-name matches) instead of a bare
# `CF API 404 reading <worker>`. The script was committed (ea8a14b) with NO
# workflow to invoke it -- ORPHANED-APPLIER-1, the defect class issue 1383
# tracks. This workflow IS that execution path.
#
# THE DEFECT (verified live 2026-09-29): cf_worker_read failed 21 times in 6h
# (~13% of calls) and every failure was a guessed worker name (audit-hub,
# jnl-referee, qnfo-qwav, memory-mcp, docs, papers, qnfo-error-selfheal). The
# bare 404 carries no discovery information, so callers burn further calls
# guessing. Same class as ops_d1_query `no such column`, which was fixed by
# returning `available_columns`; this is the cf_worker_read equivalent.
#
# VERSION-PIN-AGNOSTIC-1 (issue 1355): the preflight asserts the PROPERTY
# (marker + hint string + mirror parity), never a frozen version literal, so a
# stale pin cannot block a real fix (STALE-PREFLIGHT-1).
#
# DEPLOY: scripts/raw_put.py PUTs the CF API /content endpoint (code only,
# BINDING-PRESERVATION-1, fail-closed, deploy-guard lock+ledger wired).
# The applier writes worker.js AND its deployed-current mirror in one commit so
# mirror-guard stays green and the fleet redeploy cron cannot revert the fix.
#
# NOTE commit messages are passed as single-line -m flags, never as an inline
# multi-line string: a multi-line git commit -m inside a run: | scalar puts
# continuation lines at column 1, terminates the scalar, and makes the whole
# workflow invalid YAML -- the documented defect that produced runs with zero
# jobs.

on:
  push:
    paths:
      - 'scripts/cf-worker-read-404-hint-patch.py'
      - '.github/workflows/apply-cf-worker-read-404-hint.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-cf-worker-read-404-hint
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply patch (fail-closed)
        id: apply
        run: |
          set -euo pipefail
          python3 scripts/cf-worker-read-404-hint-patch.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change produced (already applied)"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: ESM syntax gate (blocking)
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cp qnfo-ops/worker.js /tmp/wr404-check.mjs
          node --check /tmp/wr404-check.mjs
          echo "ESM parse OK"

      - name: Mirror parity for the patched pair (blocking)
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cmp qnfo-ops/worker.js qnfo-ops/deployed-current.worker.js
          echo "qnfo-ops source and mirror are byte-identical"

      - name: Commit and push (push-race retry)
        if: steps.apply.outputs.changed == 'true'
        env:
          BR: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "qnfo-selfheal-bot"
          git config user.email "ops@qnfo.org"
          git add -u
          if git diff --cached --quiet; then
            echo "nothing staged; exiting"
            exit 0
          fi
          git diff --cached --stat
          SUBJECT="fix(qnfo-ops): #1382 cf_worker_read returns deployed-name hint on 404"
          BODY="Issue 1382: cf_worker_read failed 21 times in 6h (~13% of calls) and every failure was a caller-guessed worker name (audit-hub, jnl-referee, qnfo-qwav, memory-mcp, docs, papers, qnfo-error-selfheal). A bare CF API 404 carries no discovery information, so callers burn further calls guessing. The tool now lists how many workers exist plus near-name matches from the CF scripts list, mirroring the available_columns pattern that fixed the ops_d1_query no-such-column family. The applier writes worker.js and its deployed-current mirror in one commit so mirror-guard stays green and the fleet redeploy cron cannot revert the fix."
          FOOT="Co-authored-by: Chatbox <chatbox@chatboxai.com>"
          git commit -m "$SUBJECT" -m "$BODY" -m "$FOOT"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$BR"; then
              echo "push OK on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed; refetching and rebasing"
            git fetch origin "$BR"
            if ! git rebase "origin/$BR"; then
              git rebase --abort || true
              git reset --hard "origin/$BR"
              python3 scripts/cf-worker-read-404-hint-patch.py
              git add -u
              if git diff --cached --quiet; then
                echo "patch already present at origin; nothing to push"
                exit 0
              fi
              git commit -m "$SUBJECT" -m "$BODY" -m "$FOOT"
            fi
            sleep 5
          done
          echo "push failed after 5 attempts"
          exit 1

  deploy:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight - artifact must carry the 404-hint fix (version-pin-agnostic)
        id: pre
        run: |
          set -euo pipefail
          VER="$(grep -o 'var VERSION = "[^"]*";' qnfo-ops/worker.js | head -1 | sed 's/^var VERSION = "//; s/";$//')"
          echo "artifact_version=$VER" >> "$GITHUB_OUTPUT"
          echo "artifact VERSION=$VER"
          test "$(grep -cF 'CF-WORKER-READ-404-HINT-1' qnfo-ops/worker.js || true)" -ge 1
          test "$(grep -cF 'not a deployed worker' qnfo-ops/worker.js || true)" -ge 1
          test "$(grep -cF 'workers exist' qnfo-ops/worker.js || true)" -ge 1
          cmp qnfo-ops/worker.js qnfo-ops/deployed-current.worker.js
          echo "preflight OK: cf_worker_read carries the 404 hint; mirrors byte-identical"

      - name: Deploy qnfo-ops (binding-preserving CF API /content PUT)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/raw_put.py qnfo-ops qnfo-ops/worker.js

      - name: Verify LIVE bundle carries the 404-hint fix
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECT_VER: ${{ steps.pre.outputs.artifact_version }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/qnfo-ops/content" \
            -o /tmp/live-wr404.js
          echo "live-bytes=$(wc -c < /tmp/live-wr404.js)"
          echo "expected-version=$EXPECT_VER"
          test "$(grep -cF "$EXPECT_VER" /tmp/live-wr404.js || true)" -ge 1
          test "$(grep -cF 'CF-WORKER-READ-404-HINT-1' /tmp/live-wr404.js || true)" -ge 1
          test "$(grep -cF 'not a deployed worker' /tmp/live-wr404.js || true)" -ge 1
          echo "VERIFIED: live qnfo-ops cf_worker_read returns a deployed-name hint on 404"
