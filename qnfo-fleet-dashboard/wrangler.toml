name = "qnfo-fleet-dashboard"
main = "worker.js"
# COMPAT-ADVANCE-WAVE-2 (2026-10-12, metric workers_compat_date_behind, qnfo-ops COMPAT-DATE-DECLARED-APPLY-1): the date moves
# from 2026-08-01 to 2026-10-10 on the next canonical deploy. Reviewed against qnfo-ops COMPAT_FLIPS between the two dates:
# 2026-08-04 nodejs_compat default on (this worker reads no timer id as a number, has no typeof process/Buffer branch and
# imports no node: module);
# 2026-10-01 Durable Object eviction (no Durable Object here). /ops/deploy reads /health through its
# COMPAT-HEALTH-BINDINGS-2 binding before the upload, keeps the date only when /health answers with the deployed VERSION
# and otherwise restores the previous date (deployment_history compat-restore).
# compat-advance: reviewed 2026-10-12
compatibility_date = "2026-10-10"
workers_dev = true

# OWNER-VOICE-CAP-PARITY-1 (2026-10-17, agent_issues 2729): qnfo-social posts q08.org links by design since Q08-OPEN-1
# (owner directive 2026-10-09, "remove all filters and blocks"), and the guard flags that link unless SOCIAL_ALLOW_Q08
# is "1". Without this var the 05:00Z run re-paused every social channel the day after any post carried a q08 link.
[vars]
SOCIAL_ALLOW_Q08 = "1"

# qnfo-fleet-dashboard v1.8.0 - ONE human page (what needs the owner, money, clock). Machine state stays under /api/*.
# Purpose: at-a-glance view of every scheduled worker (crons + next UTC runs), 24h invocation/error analytics
# (CF GraphQL), D1 pipeline audits (qnfo-audit/outreach/living-paper), endpoint probes, and device-bound tasks.
# Cron refresh = every 15 min (cloud); GET /api/state auto-refreshes when older than 15 min.
# Secrets (set via wrangler secret put): CF_TOKEN (account analytics read; used for GraphQL 24h per-script stats)


[observability]
enabled = true
head_sampling_rate = 1

# WORKERS-STANDARDS-1 (owner standards 2026-10-12): logs and traces declared. Workers docs: `enabled` alone turns on logs only;
# traces need [observability.traces]. Traces are sampled at the default rate of 1.
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

head_sampling_rate = 0.01 # TRACES-SAMPLING-BEFORE-BILLING-1: stored traces bill from 2026-12-01
[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "OUTREACH"
database_name = "qnfo-outreach"
database_id = "d5077252-8187-41b2-a44e-f84f8724ee36"

[[d1_databases]]
binding = "LIVING"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[d1_databases]]
binding = "GRAPH"
database_name = "qnfo-graph"
database_id = "a1954b92-d681-4d02-b1f6-f9a2eb4c265d"

# IDENTITY-STORE-1 (2026-10-01, NO-CLAUDE-RUNTIME-DEPENDENCY-1, agent_issues 1723): the owner's private documents (identity,
# CV, opportunities, archives, edit history) live in their own D1, bound ONLY to this worker. Never bind it anywhere else.
[[d1_databases]]
binding = "IDENTITY"
database_name = "qnfo-identity"
database_id = "6c26125a-908a-4774-9812-f1f0e60afc5f"

# FLEET-CMD-1 (2026-10-02): the command line's owner sign-in mails a 6-digit code to the owner's verified Email Routing
# address only (the same address the fleet's owner nudges use). Nobody can choose where a code is sent.
[[send_email]]
name = "SEND_EMAIL"
allowed_destination_addresses = ["rwnquni@outlook.com"]

[triggers]
crons = ["*/15 * * * *"]

[[services]]
binding = "SVC_QNFO_AI"
service = "qnfo-ai"
environment = "production"
# INTERNAL-CALLER-PROPS-1 (#1703): qnfo-ai authenticates this binding by ctx.props.caller, so a router key
# rotation no longer strands this worker. Installed by qnfo-ops BINDING-PROPS-APPLY-1 on the canonical deploy.
props = { caller = "qnfo-fleet-dashboard" }

# IPATENT-USAGE-1 (2026-10-02): iPatent's /api/metrics (page views by source, searches and drafts by topic; no text).
[[services]]
binding = "SVC_QNFO_IPATENT"
service = "qnfo-ipatent"
environment = "production"

[[services]]
binding = "SVC_PERSONAL_API"
service = "personal-api"
environment = "production"

[[services]]
binding = "SVC_QNFO_OPS"
service = "qnfo-ops"
environment = "production"

# SVC_QNFO_KAIZEN (qnfo-kaizen) removed 2026-10-06: worker retired (WORKER-RETIRE-WAVE-2, #1756).

[[services]]
binding = "SVC_QNFO_PAPER_REVISER"
# REVISER-FOLD-1 (#1756): qnfo-paper-reviser runs as a member of qnfo-research-exec; props.member routes this binding to
# the member (its /run/* and /debug/* routes, authenticated by props in place of X-Reviser-Token). The live binding to the
# old script is removed after that script is deleted (cf-ops-actions unbind-service, SERVICE-REPOINT-1); the next
# canonical deploy installs this one.
service = "qnfo-research-exec"
environment = "production"
props = { caller = "qnfo-fleet-dashboard", member = "qnfo-paper-reviser" }


[[services]]
binding = "SVC_QNFO_RESEARCH_EXEC"
service = "qnfo-research-exec"
environment = "production"



[[kv_namespaces]]
binding = "FLEET_CFG"
id = "d3768b93a76640be83151b00a8b42717"


# CMD-ASK-FAST-1: read-only (published_pieces counts and titles) for the command line's Q08 answers
[[d1_databases]]
binding = "Q08"
database_name = "q08-signal"
database_id = "10fd74b7-c4b3-43c7-9ca5-855213f44a69"

# DASHBOARD-FULL-ACCESS-1 (1.31.0, 2026-10-12): the command line's second model path. When qnfo-ai refuses a leg (the
# SVC_QNFO_AI binding lost its props after a dashboard secret edit at 09:33Z and every ask answered HTTP 401) the same
# Workers AI model runs through this binding.
[ai]
binding = "AI"

# DASHBOARD-FULL-ACCESS-1: console "call" targets (owner session). Each authenticates by props.caller, never a key copy.
[[services]]
binding = "SVC_QNFO_EMAIL"
service = "qnfo-email"
environment = "production"
props = { caller = "qnfo-fleet-dashboard" }

[[services]]
binding = "SVC_QNFO_CLOUD_OPS"
service = "qnfo-cloud-ops"
environment = "production"
props = { caller = "qnfo-fleet-dashboard" }

[[services]]
binding = "SVC_QNFO_FLEET_CONTROL"
service = "qnfo-fleet-control"
environment = "production"
props = { caller = "qnfo-fleet-dashboard" }
