name: deploy-drift

# DRIFT-ZERO repo<->live monitor. mirror-guard covers repo-internal parity; this
# covers repo(worker.js) VERSION vs LIVE /health for the narrative-generation
# surfaces we own. Scheduled (not on push) so a just-pushed, not-yet-redeployed
# source is not a false red. A red run = a real repo<->live mismatch to reconcile.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # MIRROR-CONTENT-DRIFT-1 (issue #1229): repo-internal parity is deterministic
      # and self-fixable, so it FAILS CLOSED. A red step here means the canonical
      # deploy would ship a stale mirror; remediate with:
      #   python scripts/mirror-guard.py --fix && git commit -am 'mirror-sync'
      # (mirror-autosync.yml performs exactly that repair on a 6-hourly schedule).
      - name: repo-internal mirror parity (fail-closed)
        run: python scripts/mirror-guard.py
      - name: repo <-> live VERSION drift (narrative surfaces)
        run: python scripts/deploy-drift-guard.py
      - name: repo <-> live VERSION drift (all live workers, report only)
        continue-on-error: true
        run: python scripts/deploy-drift-guard.py --all
