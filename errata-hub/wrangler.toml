name = "errata-hub"
main = "worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Bindings verified from live CF API 2026-09-22 (BINDING-PRESERVATION-1).
# Previously this file was missing SEND_EMAIL + AUDIT_DB and used an invalid
# [[browser]] array, so a `wrangler deploy` would have failed or wiped bindings.
# Top-level keys (send_email) MUST precede any [[...table]] header.

send_email = [
  { name = "SEND_EMAIL" }
]

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

[[d1_databases]]
binding = "GRAPH_DB"
database_name = "qnfo-graph"
database_id = "a1954b92-d681-4d02-b1f6-f9a2eb4c265d"

[[r2_buckets]]
binding = "MIRROR"
bucket_name = "qnfo-releases"

[[d1_databases]]
binding = "PAPERS_DB"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[d1_databases]]
binding = "WATCH_DB"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "AUDIT_DB"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# Secrets (set via wrangler secret put):
# ERRATA_TOKEN
# ZENODO_TOKEN
