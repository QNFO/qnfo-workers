name: attach-me-q08-route

# COMPANION-DOMAIN-1 (2026-10-19, pillar personal). Routes me.q08.org to personal-api 4.14+, so the owner's companion has one
# address to remember (owner: "for personal shit, use q08.org"). Same self-triggering, fail-closed, commit-back pattern as
# attach-surface-routes.yml: a push of this file or its script starts the run, the script waits for the canonical deploy of
# personal-api 4.14+, creates the zone route (and an originless proxied AAAA record when none exists) and verifies that
# https://me.q08.org/health names personal-api, removing what it created otherwise. Reversible: delete the ids in
# ci-status/attach-me-q08-route.json.
# WORKFLOW-YAML-LINT-1: every step name below is colon-free.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-me-q08-route.yml'
      - 'scripts/attach-me-q08-route.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: attach-me-q08-route
  cancel-in-progress: false

jobs:
  attach-and-verify:
    # RUNNER-PIN-2 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest becomes Ubuntu 26 by 2026-11-19 (a notice on every job meanwhile); pinned to ubuntu-24.04 until an ubuntu-26.04 trial run is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run the idempotent fail-closed route script
        id: attach
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          rc=0
          python3 scripts/attach-me-q08-route.py || rc=$?
          echo "attach_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "ATTACH_RC=$rc"
          exit 0

      - name: Echo the route result artifact
        run: |
          set -uo pipefail
          if [ -f ci-status/attach-me-q08-route.json ]; then
            cat ci-status/attach-me-q08-route.json
          else
            echo "NO_ARTIFACT_WRITTEN"
          fi

      - name: Commit the route result back to main (race-safe)
        id: commitback
        env:
          MAIN_PUSH_TOKEN: ${{ secrets.QNFO_GH_PAT }}
        run: |
          set -uo pipefail
          git config user.name "qnfo-selfheal-bot"
          git config user.email "bot@qnfo.org"
          # ARTIFACT-PUSH-CONFLICT-1: a result artifact is a snapshot (latest wins); push_artifact.sh re-applies it onto
          # origin/main instead of rebasing, so a concurrent run cannot leave a merge conflict (run 37965468938, #863).
          git add ci-status/attach-me-q08-route.json
          bash scripts/push_artifact.sh "ci(attach-domain): record COMPANION-DOMAIN-1 result [skip ci]" ci-status/attach-me-q08-route.json
