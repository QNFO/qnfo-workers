name = "qnfo-proof"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# ============================================================
# qnfo-proof v0.1.0 - ADVERSARIAL PROOF VERIFICATION (server-side
# port of tobiasosborne/vibefeld protocol, MIT). Lamport-style
# structured proofs: provers convince, verifiers attack; taint
# tracking; hash-chained event ledger in qnfo-audit D1.
# Auth: x-proof-token header == PROOF_TOKEN secret (fail closed).
# Secrets: PROOF_TOKEN (mutations), REGISTRY_TOKEN (registry).
# ============================================================

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "PROOF_DB"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[services]]
binding = "QNFO_OPS"
service = "qnfo-ops"
