name = "qnfo-ai"
main = "worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["streams_enable_constructors"]
workers_dev = true

# CRITICAL FIX (v4.3.0): v4.2.0 was deployed WITHOUT this binding ->
# env.AI undefined -> all tier-0 Workers AI free models returned
# "All models failed." while DeepSeek API (secret) worked.
# NOTE: wrangler 4.118.0 validates the ai field as a SINGLE table object
# ("should be an object but got [array]") — [ai] not [[ai]].
[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1


# v4.4.0 — internal RAG (/v1/search) + query history (/v1/history)
# PAPER_VZ -> qwav-research-v2 (768-dim, bge-base-en-v1.5) — same index qnfo-archive uses
[[vectorize]]
binding = "PAPER_VZ"
index_name = "qwav-research-v2"

# v4.5.0 — restore zero-latency query logging -> qnfo-ai-log (semantic recall of past queries)
[[vectorize]]
binding = "LOG_VZ"
index_name = "qnfo-ai-log"

# v5.2.0 — QNFO Vectorize indexes (QNFO endpoint ONLY — separation mandate: personal
# lives on the personal-api endpoint, never here).
[[vectorize]]
binding = "NOTES_VZ"
index_name = "qnfo-notes"

[[vectorize]]
binding = "TASKS_VZ"
index_name = "qnfo-tasks"

[[vectorize]]
binding = "HANDOFFS_VZ"
index_name = "qnfo-handoffs"

[[vectorize]]
binding = "INFRA_VZ"
index_name = "qnfo-infra"

[[vectorize]]
binding = "CLOUD_OPS_VZ"
index_name = "qnfo-cloud-ops"

[[vectorize]]
binding = "IPATENT_VZ"
index_name = "ipatent-corpus"

# QNFO_AUDIT -> qnfo-audit D1 (ai_queries table) for /v1/history
[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# v4.7.0 — QNFO RECORDS RAG: service binding to the qnfo-infra retrieval oracle
# (papers, KG, programs, notes, tasks, emails, past queries) + INFRA_TOKEN secret
# (same value as qnfo-infra's INFRA_TOKEN) for authenticated oracle calls.
[[services]]
binding = "QNFO_INFRA"
service = "qnfo-infra"
environment = "production"

# v5.14.0 - QNFO.OPS.010 Stage C: twin calendar retrieval (plane=qnfo)
[[services]]
binding = "CAL_API"
service = "calendar-api"
environment = "production"

# v5.16.2 - QNFO.OPS.011: restore QNFO_INTENT service binding. auto-express (expressIdea)
# was silently 404ing: the binding was absent so expressIdea fell back to a public
# workers.dev fetch, which returns 404 from a Worker (same-account restriction).
[[services]]
binding = "QNFO_INTENT"
service = "qnfo-intent-orchestrator"
environment = "production"


# v5.19.0 - MEDIA-INGEST-1: R2 image store (images sent to the endpoint are captured for
# training / audit / reprocessing; retention pruned by worker mediaPrune ~2GiB/21d).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "qnfo-media"
