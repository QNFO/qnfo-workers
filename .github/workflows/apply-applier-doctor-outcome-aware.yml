name: apply-applier-doctor-outcome-aware

# APPLIER-DOCTOR-OUTCOME-AWARE-1 (issue 1413 + the APPLIER-ROT false-positive class)
#
# Applies scripts/applier-doctor-outcome-aware-patch.py (fail-closed), gates the
# result on py_compile, commits it race-safely (this repo lands ~12 commits per
# 2 minutes, so a bare `git push` loses the race and silently drops the fix --
# that is the APPLIER-ROT never_landed mode), then re-runs the doctor in
# report-only mode and commits the refreshed measurement.
#
# The commit touches scripts/applier-doctor.py, ci-status/ and audits/ -- none of
# which are in this workflow's trigger paths -- so no self-retrigger loop exists.

on:
  push:
    # BRANCH-FILTER-1 (2026-09-30): without this, a push to ANY branch that touches this workflow's paths ran it,
    # including its production deploy / push-to-main steps. Editing lifecycle-sot-and-deploy.yml on a PR branch did
    # exactly that (run 36740563280, a real qnfo-lifecycle /content PUT from a feature branch).
    branches: [main]
    paths:
      - 'scripts/applier-doctor-outcome-aware-patch.py'
      - '.github/workflows/apply-applier-doctor-outcome-aware.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-applier-doctor-outcome-aware
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: apply applier (fail-closed)
        run: python scripts/applier-doctor-outcome-aware-patch.py

      - name: syntax gate
        run: python -m py_compile scripts/applier-doctor.py

      - name: assert outcome-aware contract
        run: |
          set -euo pipefail
          grep -q 'def outcome_present(' scripts/applier-doctor.py
          grep -q 'verdict = "superseded"' scripts/applier-doctor.py
          grep -q '"superseded": superseded_l,' scripts/applier-doctor.py
          echo "CONTRACT OK"

      - name: commit and push (race-safe)
        run: |
          set -euo pipefail
          git config user.name "qnfo-selfheal-bot"
          git config user.email "fleet-bot@qnfo.org"
          git add scripts/applier-doctor.py
          if git diff --cached --quiet; then
            echo "NO_CHANGE: applier-doctor.py already outcome-aware"
            exit 0
          fi
          git commit -m "fix(ci): applier-doctor is outcome-aware; superseded != rot (APPLIER-DOCTOR-OUTCOME-AWARE-1, closes 1413/1414-1424/1436-1438)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "PUSHED on attempt $i"
              exit 0
            fi
            echo "push attempt $i lost the race; rebasing"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "FAIL(1): commit-back never reached main after 5 attempts"
          exit 1

      - name: refresh measurement (report-only)
        continue-on-error: true
        env:
          ALLOW_DIRTY: "0"
        run: python scripts/applier-doctor.py

      - name: commit refreshed report (race-safe)
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "qnfo-selfheal-bot"
          git config user.email "fleet-bot@qnfo.org"
          git add ci-status/applier-doctor.json audits/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "NO_CHANGE: report unchanged"
            exit 0
          fi
          git commit -m "chore(ci): refresh applier-doctor measurement [skip ci]"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "REPORT PUSHED on attempt $i"
              exit 0
            fi
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "WARN: report push did not land (non-fatal)"

      - name: summary
        run: |
          echo "=== ci-status/applier-doctor.json ==="
          cat ci-status/applier-doctor.json || true
