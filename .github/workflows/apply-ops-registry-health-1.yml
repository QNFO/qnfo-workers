name: apply-ops-registry-health-1

# OPS-REGISTRY-HEALTH-1. Server-side applier (same fail-closed, idempotent mechanism as
# apply-fleet-selfstate-1.yml and apply-outreach-attempt-cap-1.yml).
#
# Fixes the measured defect that 27 of 38 workers reported healthy:null from the ops
# fleet_status tool, because that tool iterates only the 12 services ops holds bindings for.
#
# The push step fetches and rebases before every attempt and retries (main is not protected but
# this repo takes bot pushes from many actors and main advances within seconds).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-ops-registry-health-1.py'
      - '.github/workflows/apply-ops-registry-health-1.yml'
  schedule:
    - cron: '37 */2 * * *'

permissions:
  contents: write

concurrency:
  group: apply-ops-registry-health-1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch (fail-closed, idempotent)
        run: python3 scripts/apply-ops-registry-health-1.py

      - name: Commit and push (fetch + rebase + retry)
        run: |
          set -euo pipefail
          git config user.name  "qnfo-ops-bot"
          git config user.email "ops@qnfo.org"
          if git diff --quiet; then
            echo "already applied -- nothing to commit (idempotent no-op)"
            exit 0
          fi
          git add -A
          git commit -m "feat(ops): OPS-REGISTRY-HEALTH-1 fleet_status probes all 38 registry base_urls, not only the 12 service bindings; report probed/unprobed"
          for i in $(seq 1 8); do
            git fetch origin main --quiet || true
            git rebase origin/main || { echo "REBASE CONFLICT on attempt $i"; git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected on attempt $i, retrying"
            sleep 15
          done
          echo "push failed after 8 attempts"
          exit 1

      - name: Verify patch present
        run: |
          set -euo pipefail
          grep -n 'OPS-REGISTRY-HEALTH-1' qnfo-ops/worker.js
          grep -n 'unprobedCount' qnfo-ops/worker.js
          grep -n 'registry-http' qnfo-ops/worker.js
