name = "calendar-api"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# v0.2.0 - hourly R2 .ics publish (QNFO.OPS.010 Stage C)

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["17 * * * *"]

[[d1_databases]]
binding = "CAL_DB"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[r2_buckets]]
binding = "ICS_R2"
bucket_name = "qnfo-assets"

# NOTES-INTAKE-FOLD-1 (issue 1639): notes-intake's Obsidian vault pipeline runs in this worker's hourly cron.
[[r2_buckets]]
binding = "VAULT"
bucket_name = "obsidian-vault"
