name: apply-fleet-selfstate-1

# FLEET-SELFSTATE-1. Server-side applier: the ops endpoint cannot round-trip a ~130 KB worker.js
# through its output channel, so the fix ships as a small, fail-closed, idempotent patch script
# (same mechanism as apply-outreach-attempt-cap-1.yml, which landed green on run 36736730489).
#
# The push step fetches and rebases before every attempt and retries: main is NOT protected, but
# this repo takes bot pushes from many actors and main advances within seconds, which is what
# killed apply-outreach-throughput-1.yml (run 36735258890 failed at "Commit and push" while its
# "Apply patch" step succeeded -- the patch was valid, the push raced).
#
# Self-retiring: once the patch is present the apply step prints an idempotent no-op and the job
# exits without committing. The schedule is a retry guard for the race above.
#
# After this lands, qnfo-fleet-control's own scan/heal cron (auto_heal=1) detects the canonical
# version 0.4.39-selfstate-1 against the deployed 0.4.38 and lands the deploy itself.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-fleet-selfstate-1.py'
      - '.github/workflows/apply-fleet-selfstate-1.yml'
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: write

concurrency:
  group: apply-fleet-selfstate-1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch (fail-closed, idempotent)
        run: python3 scripts/apply-fleet-selfstate-1.py

      - name: Commit and push (fetch + rebase + retry)
        run: |
          set -euo pipefail
          git config user.name  "qnfo-ops-bot"
          git config user.email "ops@qnfo.org"
          if git diff --quiet; then
            echo "already applied -- nothing to commit (idempotent no-op)"
            exit 0
          fi
          git add -A
          git commit -m "feat(fleet): FLEET-SELFSTATE-1 GET /state - probe all 38 registry workers, aggregate issues+queues+freshness, snapshot to fleet_state_snapshots"
          for i in $(seq 1 8); do
            git fetch origin main --quiet || true
            git rebase origin/main || { echo "REBASE CONFLICT on attempt $i"; git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected on attempt $i, retrying"
            sleep 15
          done
          echo "push failed after 8 attempts"
          exit 1

      - name: Verify patch present on main
        run: |
          set -euo pipefail
          grep -c 'FLEET-SELFSTATE-1' qnfo-fleet-control/worker.js
          grep -n 'async function selfState(env)' qnfo-fleet-control/worker.js
          grep -n 'if (p === "/state")' qnfo-fleet-control/worker.js
