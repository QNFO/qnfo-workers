name: deploy-qnfo-ops

# SERVER-SIDE-DEPLOY-1 (2026-09-27). Re-pinned 2026-09-29. Version-agnostic since 2026-09-29.
#
# Carries qnfo-ops from qnfo-workers main to LIVE using the repo's own
# binding-preserving deployer (scripts/raw_put.py -> CF API /content).
#
# WHY /content AND NOT wrangler: the /content endpoint updates the CODE ONLY,
# preserving every live binding (BINDING-PRESERVATION-1). qnfo-ops has 49 live
# bindings; a wrangler deploy that cannot reproduce them would silently drop
# them. raw_put.py is fail-closed: it exits 3 and deploys nothing on any error, so a
# partial deploy cannot occur.
#
# COMPAT-PRESERVE-1 (2026-09-29, issue 1358): raw_put.py now reads the live /settings and
# carries compatibility_date + compatibility_flags into the PUT metadata, floors the date at
# 2026-08-01 for a new worker, fails closed when the settings cannot be read, and re-reads
# /settings after the PUT to assert the date and flags survived. Without this the /content
# PUT cleared compatibility_date, which turns off streams_enable_constructors and breaks every
# streaming response while non-streaming keeps working (ledger 2.36.46). This workflow is
# re-triggered after that patch so the LAST write to the live bundle is guaranteed to have been
# made by the settings-preserving deployer.
#
# STALE-PREFLIGHT-1 (first fixed 2026-09-29, RECURRED same day, fixed properly here):
# this workflow previously hard-pinned a literal VERSION string in its preflight. It was
# first pinned to 2.37.13-attachguard-xml-form while the artifact had moved to
# 2.37.17-d1-schema-hint, and after the re-pin it was pinned to
# 2.37.18-d1-guard-literal-fn-aware -- a version that NEVER EXISTED (the literal-aware
# release was 2.37.18-d1-guard-literal-aware and the function-aware release is
# 2.37.19-d1-guard-literal-fn-aware). Net effect: the fix for issue #1349 was committed
# to main at 2.37.19 while live stayed at 2.37.17, and BOTH deploy paths were pinned to a
# version that could never match. That is the DEPLOY-NON-CANONICAL / deploy-drift root
# cause for the ops endpoint itself.
#
# PERMANENT REMEDIATION: the preflight no longer compares against any hard-coded version.
# It reads VERSION out of the artifact under test and verifies that the LIVE bundle carries
# that same version. A future release therefore cannot be blocked by a stale pin -- the
# pin-drift failure mode is structurally removed, not re-pinned.
#
# DEPLOY-VERIFY-RACE-1 (2026-09-29): the verify step issued a SINGLE GET against the
# eventually-consistent CF /content endpoint and hard-failed on a stale read, so successful
# deploys were reported red (runs 36568465877 / 36568539865 / 36568596207: step 8 success,
# step 9 failure, live VERSION correct ~40s later). The verify step now polls with a bounded
# retry budget and still fails closed if the live bundle never converges.
#
# WORKFLOW-YAML-LINT-1 (2026-09-29): the DEPLOY-VERIFY-RACE-1 edit pushed at 12:35:49Z
# introduced an unquoted colon inside a step NAME -- "... (retry: CF /content ...)".
# A colon followed by a space inside a plain YAML scalar is a parse error, so GitHub
# created every subsequent deploy-qnfo-ops run with ZERO jobs and conclusion=failure:
# the canonical deploy path for this worker was dead AND produced no job log for
# anyone to read, which is why the watchdog could only report it as `unknown`. The
# name is now quoted, and scripts/workflow-lint.py gates the whole class repo-wide.
#
# SUPERSEDE-TOLERANT-VERIFY-1 (2026-09-29): run 36591685670 deployed successfully at step 8
# and still went red at step 9. The verifier compared the LIVE version against THIS run's
# artifact version and treated any difference as failure -- but several apply+deploy
# pipelines now deploy qnfo-ops concurrently, so a run that started against 2.37.20 read
# back 2.37.22 (a NEWER build of the same worker) and declared a successful deploy failed.
# With a 0.74% tool-failure rate and live==repo at 2.37.22, the deploy path was working
# correctly while CI reported the opposite. A verifier that cannot distinguish "my deploy
# did not land" from "my deploy landed and was superseded" is not evidence, it is noise.
# The verifier now parses the numeric build out of both versions: equality still passes;
# a strictly NEWER live build passes as SUPERSEDED (the PUT landed, a later pipeline
# advanced it); an OLDER or unparseable live build still fails closed after the retry
# budget. It never passes on a bundle that lacks the guard or still carries the legacy
# message, so the guard-invariant checks are unchanged and unconditional.
#
# This workflow now also owns the deploy for any change to qnfo-ops/worker.js: the
# push.paths below include the artifact, so a worker change has a real path to live
# instead of relying on the qnfo-fleet-control redeploy cron.

on:
  push:
    # DEPLOY-BRANCH-FILTER-1 (2026-09-30): this workflow ends in `raw_put.py qnfo-ops`, a
    # PRODUCTION deploy. Without a branch filter any push to ANY branch that touched the paths
    # below deployed that branch's qnfo-ops/worker.js: bringing PR branches up to date from main
    # (which changes qnfo-ops/worker.js on the branch) deployed qnfo-ops from #87 and #97 (run
    # 36728140486, 14:20Z; harmless only because the content equalled main). Production deploys
    # come from main; use workflow_dispatch for anything else.
    branches: [main]
    paths:
      - '.github/workflows/deploy-qnfo-ops.yml'
      - 'qnfo-ops/worker.js'
      - 'qnfo-ops/deployed-current.worker.js'
      - 'scripts/raw_put.py'
      - 'scripts/d1guard-battery.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-qnfo-ops
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read artifact VERSION (no hard-coded pin)
        id: ver
        run: |
          set -euo pipefail
          V=$(grep -o 'var VERSION = "[^"]*";' qnfo-ops/worker.js | head -1 | sed 's/.*"\(.*\)".*/\1/')
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "artifact VERSION=$V"

      - name: Mirror parity (blocking)
        run: |
          set -euo pipefail
          cmp qnfo-ops/worker.js qnfo-ops/deployed-current.worker.js
          echo "source and deployed-current mirror are byte-identical"

      - name: D1-GUARD-BATTERY-1 self-audit (blocking)
        run: node scripts/d1guard-battery.mjs

      - name: Deploy qnfo-ops (binding-preserving CF API /content PUT)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/raw_put.py qnfo-ops qnfo-ops/worker.js

      - name: "Verify live VERSION equals the artifact VERSION (retry, supersede-tolerant)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          V="${{ steps.ver.outputs.version }}"
          # VERSION-MONOTONIC-TUPLE-1: order versions as (major, minor, patch) integers. This used to
          # print \1\2\3 (dots deleted), so 2.37.32 -> 23732 outranked 2.38.2 -> 2382 and the
          # SUPERSEDED branch below could pass a verify against an OLDER live build.
          build_of() {
            local t
            t=$(printf '%s' "$1" | sed -n 's/^\([0-9][0-9]*\)\.\([0-9][0-9]*\)\.\([0-9][0-9]*\).*$/\1 \2 \3/p')
            [ -n "$t" ] || return 0
            set -- $t
            printf '%d' $(( 10#$1 * 100000000 + 10#$2 * 10000 + 10#$3 ))
          }
          VB="$(build_of "$V")"
          echo "artifact=$V build=$VB"
          ok=0
          for i in $(seq 1 12); do
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/qnfo-ops/content" \
              -o /tmp/live.js || true
            bytes=$(wc -c < /tmp/live.js 2>/dev/null || echo 0)
            has_v=$(grep -cF "$V" /tmp/live.js 2>/dev/null || true)
            has_g=$(grep -cF 'd1ReadOnlyGuard' /tmp/live.js 2>/dev/null || true)
            has_old=$(grep -cF 'mutation keywords are rejected anywhere' /tmp/live.js 2>/dev/null || true)
            # VERIFY-SILENT-ABORT-1: under GitHub's default `bash -e` plus `set -o pipefail` this
            # assignment exits non-zero whenever the live read has no `var VERSION` line (empty or
            # error body, different bundling), killing the step 0.3s in with no diagnostic. That is
            # the `unknown` failure class: the run went red before printing the attempt line below.
            # `|| true` lets the loop print bytes/has_version and retry, and the final error then
            # carries the evidence.
            LIVEV=$(grep -o 'var VERSION = "[^"]*";' /tmp/live.js 2>/dev/null | head -1 | sed 's/.*"\(.*\)".*/\1/' || true)
            LB="$(build_of "$LIVEV")"
            echo "attempt=$i bytes=$bytes expect=$V live=$LIVEV has_version=$has_v has_guard=$has_g has_legacy_msg=$has_old"
            # Guard invariants are unconditional: they never pass on a bad bundle.
            if [ "$has_g" -ge 2 ] && [ "$has_old" = "0" ]; then
              if [ "$has_v" -ge 1 ]; then ok=1; break; fi
              if [ -n "$LB" ] && [ -n "$VB" ] && [ "$((10#$LB))" -gt "$((10#$VB))" ]; then
                echo "SUPERSEDED: live $LIVEV (build $LB) is newer than this artifact $V (build $VB); the PUT landed and a later pipeline advanced the worker"
                ok=1; break
              fi
            fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::VERIFY-FAILED - live qnfo-ops did not converge to $V and did not supersede it within 12 attempts (~3 min)"
            exit 1
          fi
          echo "VERIFIED: live qnfo-ops carries $V or a strictly newer build, guard invariants intact"
