name: apply-research-exec-terminal-rescue

# RESEARCH-TERMINAL-RESCUE-1 (2026-09-29). See the RESEARCH-TERMINAL agent_issues cluster.
#
# ROOT CAUSE (pinned in source, qnfo-research-exec/worker.js):
#   markError()'s terminal branch (recover_count >= 3) sets status='failed' and returns.
#   FAILED-REARM-1 requires recover_count < 3, so a terminal row can NEVER be re-armed:
#   the wedge is permanent by construction. The table already carries an UNUSED
#   `terminal_rearms` column - the intended second-tier bound.
#   Observed live: 19 rows recover_count=4, terminal_rearms=1, attempt=0; plus 3 rows
#   "revise: output too short" (absolute 1e4 floor, no retry).
#
# This workflow applies the patch, syntax-checks it, canonically deploys it, verifies the
# live version, and commits the patched sources + a machine-readable status back.
#
# NO-CRON-NOTE: this repository's GitHub `schedule` event has never fired
# (SCHEDULE-EVENT-NEVER-FIRES-1), so this workflow declares no cron. It fires on push to
# itself or on manual dispatch.
#
# WORKFLOW-YAML-LINT-1: heredoc bodies are indented to the block-scalar column (never 0).

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-research-exec-terminal-rescue.yml'
      - 'scripts/research-exec-terminal-rescue-patch.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-research-exec-terminal-rescue
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Apply RESEARCH-TERMINAL-RESCUE-1 (fail-closed, idempotent)"
        id: patch
        run: |
          set -uo pipefail
          python3 scripts/research-exec-terminal-rescue-patch.py 2>&1 | tee /tmp/patch.log
          rc=${PIPESTATUS[0]}
          echo "patch_exit=$rc" >> "$GITHUB_OUTPUT"
          test "$rc" -eq 0 || exit "$rc"

      - name: "Syntax check both targets"
        run: |
          set -uo pipefail
          node --check qnfo-research-exec/worker.js
          node --check qnfo-research-exec/deployed-current.worker.js
          echo "SYNTAX_OK"

      - name: "Canonical deploy of qnfo-research-exec"
        id: deploy
        env:
          OPS_ROUTER_AUTH_KEY: ${{ secrets.OPS_ROUTER_AUTH_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${OPS_ROUTER_AUTH_KEY:-}" ]; then
            echo "FAIL: OPS_ROUTER_AUTH_KEY secret is not configured"
            echo "deploy_outcome=no-secret" >> "$GITHUB_OUTPUT"
            exit 2
          fi
          python3 scripts/canonical_deploy.py --worker qnfo-research-exec --path qnfo-research-exec/worker.js 2>&1 | tee /tmp/canonical-deploy.log
          rc=${PIPESTATUS[0]}
          echo "canonical_deploy_exit=$rc"
          echo "deploy_outcome=$rc" >> "$GITHUB_OUTPUT"
          test "$rc" -eq 0 || exit "$rc"

      - name: "Verify live version and that no binding was lost"
        id: verify
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CF_ACCOUNT_ID:-}" ]; then
            echo "live_version=unknown-no-cf-secret" >> "$GITHUB_OUTPUT"
            echo "SKIP: CF API secrets unavailable in this repo; verify with cf_worker_read"
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/qnfo-research-exec/settings" \
              -o /tmp/settings.json || true
            if grep -q 'terminal-rescue' /tmp/settings.json 2>/dev/null; then
              echo "attempt $i: new version observed"
              break
            fi
            echo "attempt $i: new version not present yet"
            sleep 10
          done
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/settings.json'))
          res = d.get('result', {})
          names = sorted(b.get('name') for b in res.get('bindings', []))
          expected = {'AI', 'GITHUB_TOKEN', 'GRAPH_DB', 'LIVING_PAPER', 'MIRROR', 'PDF_SVC',
                      'PILOT_TOKEN', 'QNFO_AUDIT', 'RESEARCH_HALT', 'ROUTER_TOKEN',
                      'ZENODO_TOKEN', 'QNFO_AI'}
          print('live_binding_names=' + json.dumps(names))
          missing = sorted(expected - set(names))
          if missing:
              print('FAIL: expected bindings missing after deploy: ' + json.dumps(missing))
              raise SystemExit(1)
          print('ALL EXPECTED BINDINGS PRESENT')
          PY
          echo "binding_present=1" >> "$GITHUB_OUTPUT"

      - name: "Publish and commit the patched sources and status"
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outputs.deploy_outcome }}
          BINDING_PRESENT: ${{ steps.verify.outputs.binding_present }}
          PATCH_EXIT: ${{ steps.patch.outputs.patch_exit }}
        run: |
          set -uo pipefail
          mkdir -p ci-status
          python3 - <<'PY'
          import json, os, time
          rec = {
              "check": "research-exec-terminal-rescue-1",
              "worker": "qnfo-research-exec",
              "version": "0.9.22-terminal-rescue",
              "markers": ["TERMINAL-RESCUE-1", "REVISE-RETRY-1", "RECONCILE-RETRY-1"],
              "patch_exit": os.environ.get("PATCH_EXIT", "unknown"),
              "deploy_outcome": os.environ.get("DEPLOY_OUTCOME", "unknown"),
              "binding_present": os.environ.get("BINDING_PRESENT", "unknown"),
              "ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          }
          json.dump(rec, open("ci-status/research-exec-terminal-rescue.json", "w"), indent=2)
          print(json.dumps(rec))
          PY
          git config user.name "qnfo-fleet-bot"
          git config user.email "fleet-bot@qnfo.org"
          git add qnfo-research-exec/worker.js qnfo-research-exec/deployed-current.worker.js ci-status/research-exec-terminal-rescue.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "fix(research-exec): apply RESEARCH-TERMINAL-RESCUE-1 (0.9.22-terminal-rescue)"
          for i in 1 2 3 4 5; do
            echo "commit-back attempt $i"
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "commit-back OK on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::commit-back failed after 5 attempts"
          exit 0
