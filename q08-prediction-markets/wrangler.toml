name = "q08-prediction-markets"
main = "worker.js"
# charter-pillar: personal
compatibility_date = "2026-11-07"

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true

# PM-CONSOLIDATE-1: one D1 (TRADES_DB). SIGNALS_DB held the identical schema and is no longer bound.
[[d1_databases]]
binding = "TRADES_DB"
database_name = "q08-trades"
database_id = "5f43fb60-01cf-4d1f-842e-1b634f6ccc81"

[triggers]
crons = ["*/5 * * * *"]

# PM-SIGNALS-1: short-term news-driven probability estimates go through the fleet AI router, never a per-worker key
# (INTERNAL-CALLER-PROPS-1 #1703: qnfo-ai authenticates this binding by ctx.props.caller; installed by the canonical deploy).
[[services]]
binding = "QNFO_AI"
service = "qnfo-ai"
environment = "production"
props = { caller = "q08-prediction-markets" }

# PM-CHARTER-1: the review loop publishes the pm_* metrics and the worker heartbeat to the fleet's audit database, where the metric triggers file breaches.
[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"
