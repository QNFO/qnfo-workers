name: deploy-gate

# The repo IS the deploy source: qnfo-fleet-control redeploys qnfo-ops from main on a */20
# cron. A broken bundle or a leftover merge marker on main is therefore not merely a red CI
# run -- it is a bundle the cron can carry, or silently fail to carry (WORKER-BUILD-GATE-1).
# This workflow is the permanent gate that must stay green before anything reaches main.
#
# Gates enforced (see scripts/deploy_gate.py):
#   WORKER-BUILD-GATE-1     `wrangler deploy --dry-run` -- a REAL bundle build
#   CONFLICT-MARKER-GATE-1  <<<<<<< / ======= / >>>>>>> in any worker source
# The coordinated + logged deploy itself happens LOCALLY under
# `deploy_guard.py with-lock` (DEPLOY-GUARD-BYPASS-1); CI validates the artifact, it does
# not deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine changed worker dirs
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD^"
          fi
          git diff --name-only "$BASE" HEAD 2>/dev/null | awk -F/ 'NF>1{print $1}' | sort -u | sed '/^$/d' > /tmp/changed.txt || true
          echo "changed dirs:"; cat /tmp/changed.txt || true

      - name: Gate every changed worker dir (build + conflict markers)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          rc=0
          while read -r d; do
            [ -z "$d" ] && continue
            if [ -f "$d/wrangler.toml" ]; then
              echo "::group::deploy-gate $d"
              python3 scripts/deploy_gate.py --check "$d" || rc=1
              echo "::endgroup::"
            else
              echo "skip $d (no wrangler.toml)"
            fi
          done < /tmp/changed.txt
          exit $rc

      - name: Gate ALL worker dirs (full sweep on manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          rc=0
          for d in */ ; do
            d="${d%/}"
            if [ -f "$d/wrangler.toml" ]; then
              echo "::group::deploy-gate $d"
              python3 scripts/deploy_gate.py --check "$d" || rc=1
              echo "::endgroup::"
            fi
          done
          exit $rc

      # CRON-RATE-CEILING-1 (owner directive 2026-09-23): no worker cron may execute more
      # than once every 10 minutes, nor more than 144 times in any 24-hour period.
      # Runs on EVERY push over ALL worker dirs -- a cron regression must fail CI even when
      # the edited worker is not the one carrying the offending cron.
      - name: CRON-RATE-CEILING-1 sweep (all worker dirs)
        run: python3 scripts/cron_rate_guard.py --root .

      # NARRATIVE-PROMPT-GUARD-1 (2026-09-26): a free-form narrative system prompt must
      # guide PROCESS, not prescribe specific output TEXT. Fails if a narrative-generation
      # worker source re-acquires the output-text prescriptions stripped from qnfo-ai v5.28.6.
      - name: NARRATIVE-PROMPT-GUARD-1 (narrative prompt guides process, not output text)
        run: python3 scripts/narrative-prompt-guard.py

      # CLOUDFLARE-ONLY-HOST-1 (owner directive 2026-10-01): all data, dashboards and UI are hosted on Cloudflare,
      # never on claude.ai. Fails when any tracked file links a claude.ai-hosted artifact, doc or page as a place
      # the fleet or the owner keeps something. Runs on every push and PR over the whole tree.
      - name: CLOUDFLARE-ONLY-HOST-1 (no fleet data or UI on claude.ai)
        run: python3 scripts/cloudflare-only-host-guard.py

      # IDENTITY-WEEKLY-1: the weekly identity review that replaced a claude.ai Routine runs in qnfo-fleet-dashboard,
      # the only worker bound to the private qnfo-identity store; its offline suite (synthetic doc, stubbed APIs,
      # recording D1, Monday-once throttle) must stay green.
      - name: IDENTITY-WEEKLY-1 offline suite (qnfo-fleet-dashboard)
        run: node qnfo-fleet-dashboard/identity-weekly.test.mjs

      # OWNER-EDIT-1 + IDENTITY-STORE-1: the owner edits owner_docs (the Identity doc) on fleet.qnfo.org, stored in the
      # private qnfo-identity D1. The suite drives the real fetch handler against in-memory SQLite D1s (node:sqlite needs
      # Node 22, so this last step switches runtime).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: OWNER-EDIT-1 and IDENTITY-STORE-1 offline suite (qnfo-fleet-dashboard)
        run: node qnfo-fleet-dashboard/owner-edit.test.mjs

      # OBJECTIVE-REVISION-APPLY-1 + OWNER-NOTES-ROUTE-1: owner decisions made on fleet.qnfo.org are applied on Cloudflare
      # (ratified weight changes, constraints filed as fleet work, card notes queued as intents), never by a session.
      - name: OBJECTIVE-REVISION-APPLY-1 and OWNER-NOTES-ROUTE-1 offline suite (qnfo-fleet-dashboard)
        run: node qnfo-fleet-dashboard/objective-apply.test.mjs

      # WATCHMAKER-INDEX-1: the fleet's own daily count of recurring operations that still need a person or a session.
      - name: WATCHMAKER-INDEX-1 offline suite (qnfo-fleet-dashboard)
        run: node qnfo-fleet-dashboard/watchmaker.test.mjs
      - name: OPEN-ACCESS-1 offline suite (qnfo-fleet-dashboard)
        run: node qnfo-fleet-dashboard/open-access.test.mjs
      # Q08-REVIEW-2026-10-31 (#1716): the one-shot q08 decision on bot-filtered RUM page views and the cadence cap
      # q08-signal-engine reads (Q08-CADENCE-CAP-1); a deferral never satisfies the remediation probe.
      - name: Q08-REVIEW-2026-10-31 offline suite (qnfo-fleet-dashboard + q08-signal-engine)
        run: node qnfo-fleet-dashboard/q08-review.test.mjs

      # SAI-COMPOSITE-WEIGHTS-1 (#1739): survival_state.sai and the charter's Autonomy composite are the owner-weighted SAI.
      # The suite locks the scorer's SAI formula to the dashboard's computeSai (parity on a live fixture and 400 random
      # inputs), proves a sai_config weight change moves the SAI, and replays the DoD against an in-memory SQLite D1.
      - name: SAI-COMPOSITE-WEIGHTS-1 offline suite (qnfo-autonomy-scorer, parity with qnfo-fleet-dashboard)
        run: node --test qnfo-autonomy-scorer/sai.test.mjs

      # OUTREACH-CONSENT-1 + OUTREACH-OPTOUT-EVIDENCE-1 (#1710): cold email carries the opt-out line, never a fake "Re:",
      # honours suppression and the shared caps, and records per-send opt-out evidence the DoD probe reads.
      - name: OUTREACH-CONSENT-1 offline suite (qnfo-cloud-ops)
        run: node qnfo-cloud-ops/outreach-consent.test.mjs
      - name: OUTREACH-CF-DOW-1 cron weekday check (qnfo-outreach)
        run: node qnfo-outreach/cron-dow.test.mjs

      # ERRATA-HUB-CRONS-UNDECLARED-1 + ERRATA-PUBLISH-GATE-1 (#1747): errata-hub's hourly members run, record a tick, and
      # make no Zenodo call, store re-point or mail from the publish member while pipeline_flags.errata_publish_enabled is off.
      - name: ERRATA-PUBLISH-GATE-1 offline suite (errata-hub)
        run: node errata-hub/errata-crons.test.mjs
