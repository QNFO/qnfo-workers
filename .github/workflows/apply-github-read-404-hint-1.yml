name: apply-github-read-404-hint-1

# Applies GITHUB-READ-404-HINT-1 (issue #1391): github_repo_read() enumerates
# near-miss paths on HTTP 404 instead of returning a bare "path not found".
#
# Self-triggering: this file's own push, or a push of the patch script, fires it.
# Always publishes an artifact (ci-status/github-read-404-hint-1.json) so a
# zero-effect run can never be silent (FAILURE-ARTIFACT-LOSS-1).

on:
  push:
    paths:
      - 'scripts/patch-github-read-404-hint-1.py'
      - '.github/workflows/apply-github-read-404-hint-1.yml'
  workflow_dispatch:

concurrency:
  group: apply-github-read-404-hint-1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pre-state (rollback reference)
        id: pre
        run: |
          PRE_VER=$(curl -s --max-time 20 https://ops.qnfo.org/health | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' | head -1)
          echo "pre_version=$PRE_VER" >> "$GITHUB_OUTPUT"
          echo "PRE_VERSION=$PRE_VER"

      - name: Apply patch (fail-closed)
        id: apply
        run: |
          set +e
          python3 scripts/patch-github-read-404-hint-1.py .
          RC=$?
          set -e
          echo "apply_rc=$RC" >> "$GITHUB_OUTPUT"
          echo "APPLY_RC=$RC"
          if [ "$RC" != "0" ]; then
            echo "::error::patch aborted rc=$RC (anchor mismatch or missing file) - nothing written"
            exit "$RC"
          fi

      - name: Syntax check
        run: |
          node --check qnfo-ops/worker.js
          node --check qnfo-ops/deployed-current.worker.js
          echo "node --check OK"

      - name: Guard (marker present)
        run: |
          C=$(grep -c 'GITHUB-READ-404-HINT-1' qnfo-ops/worker.js)
          echo "marker_count=$C"
          test "$C" -ge 1 || { echo "::error::marker missing"; exit 1; }
          grep -c 'nearest match' qnfo-ops/worker.js

      - name: Commit patch
        id: commit
        run: |
          git config user.name "qnfo-ci"
          git config user.email "ci@qnfo.org"
          if git diff --quiet; then
            echo "committed=no-change" >> "$GITHUB_OUTPUT"
            echo "nothing to commit"
            exit 0
          fi
          git add qnfo-ops/worker.js qnfo-ops/deployed-current.worker.js
          git commit -m "fix(qnfo-ops): GITHUB-READ-404-HINT-1 github_repo_read lists near-miss paths on 404 (issue #1391)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "committed=yes" >> "$GITHUB_OUTPUT"
              echo "PUSH_OK attempt=$i"
              break
            fi
            echo "push attempt $i rejected, rebasing"
            git pull --rebase origin main || true
            sleep $((i * 3))
          done

      - name: Deploy qnfo-ops (binding-preserving)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          python3 scripts/raw_put.py qnfo-ops qnfo-ops/worker.js
          RC=$?
          set -e
          echo "deploy_rc=$RC" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_RC=$RC"

      - name: Verify live
        id: verify
        run: |
          POST_VER=""
          for i in 1 2 3 4 5 6; do
            POST_VER=$(curl -s --max-time 20 https://ops.qnfo.org/health | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' | head -1)
            echo "poll $i -> $POST_VER"
            case "$POST_VER" in *github-read-404-hint*) break;; esac
            sleep 10
          done
          echo "post_version=$POST_VER" >> "$GITHUB_OUTPUT"
          case "$POST_VER" in
            *github-read-404-hint*) echo "VERIFY OK";;
            *) echo "::warning::live version is '$POST_VER' - fix not confirmed on /health";;
          esac

      - name: Publish artifact (always)
        if: always()
        run: |
          mkdir -p ci-status
          cat > ci-status/github-read-404-hint-1.json <<JSON
          {
            "applier": "GITHUB-READ-404-HINT-1",
            "issue": 1391,
            "head": "${{ github.sha }}",
            "apply_rc": "${{ steps.apply.outputs.apply_rc }}",
            "committed": "${{ steps.commit.outputs.committed }}",
            "deploy_rc": "${{ steps.deploy.outputs.deploy_rc }}",
            "pre_version": "${{ steps.pre.outputs.pre_version }}",
            "post_version": "${{ steps.verify.outputs.post_version }}",
            "ts": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cat ci-status/github-read-404-hint-1.json

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-read-404-hint-1
          path: ci-status/github-read-404-hint-1.json
          if-no-files-found: warn
