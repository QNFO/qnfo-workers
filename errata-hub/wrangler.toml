name = "errata-hub"
main = "worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Bindings verified from live CF API 2026-09-22 (BINDING-PRESERVATION-1).
# Previously this file was missing SEND_EMAIL + AUDIT_DB and used an invalid
# [[browser]] array, so a `wrangler deploy` would have failed or wiped bindings.
# Top-level keys (send_email) MUST precede any [[...table]] header.

send_email = [
  { name = "SEND_EMAIL" }
]

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

[[d1_databases]]
binding = "GRAPH_DB"
database_name = "qnfo-graph"
database_id = "a1954b92-d681-4d02-b1f6-f9a2eb4c265d"

[[r2_buckets]]
binding = "MIRROR"
bucket_name = "qnfo-releases"

[[d1_databases]]
binding = "PAPERS_DB"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[d1_databases]]
binding = "WATCH_DB"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "AUDIT_DB"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# ERRATA-HUB-CRONS-UNDECLARED-1 (2026-10-02, #1747, charter pillar: research). scheduled() dispatches each trigger to a
# folded member: :00 errata-watch (AI triage of personal email into errata_queue), :15 errata-respond (AI-drafted
# correction into errata_actions, receipt to the owner only), :30 errata-publish (Zenodo version, gated off by qnfo-audit
# pipeline_flags.errata_publish_enabled; while off it only records would_publish). Every tick upserts errata_watch
# tick:<member>. Net-zero: these replace the hourly triggers of the folded qnfo-errata-watch, -respond and -publish
# workers and the retired errata-orchestrator schedule, none of which is deployed.
# The canonical deploy reads the first occurrence of the cron key below, so no comment above may spell it.
[triggers]
# CRON-SINGLE-TRIGGER-1 (2026-10-02, #1785): ONE hourly trigger; worker.js CRON_TABLE holds the former list
# (0 * * * *, 15 * * * *, 30 * * * *) and runs each entry in the hour it fired.
crons = ["0 * * * *"]

# Secrets (set via wrangler secret put):
# ERRATA_TOKEN
# ZENODO_TOKEN
