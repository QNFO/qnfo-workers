name: codeql

# GHA-AUDIT-CODEQL-1 (issue 2509, pillar security/cost, 2026-10-13).
#
# The repository ran CodeQL "default setup", which scans every push to main. GHA-AUDIT-1
# counted 26 such runs in 88 minutes (about 6 runner-hours), most of them for the fleet
# bots' `ci(status) [skip ci]` artifact commits, competing for the runner slots that
# canonical-deploy and the remediation loops need.
#
# This advanced setup scans the same languages, but:
#   - a `[skip ci]` commit skips it (default setup ignores that marker);
#   - pushes that touch only the bot artifact trees (ci-status/**, audits/**) are ignored;
#   - a weekly schedule still sweeps the whole tree.
#
# GitHub rejects advanced-setup uploads while default setup is enabled, so default setup
# must be turned off in Settings > Code security > CodeQL analysis (or by
# PATCH /repos/{owner}/{repo}/code-scanning/default-setup {"state":"not-configured"}
# with a token holding security_events admin).
#
# CODEQL-DEFAULT-PRECHECK-1 (2026-10-13): until that switch is made, every PR showed three red
# `analyze` checks ("CodeQL analyses from advanced configurations cannot be processed when the
# default setup is enabled", PR 1212). The precheck asks whether default setup's dynamic
# workflow (dynamic/github-code-scanning/codeql) is active, which `actions: read` can see (the
# default-setup endpoint itself needs admin and answers 403 to this token), and skips the analysis
# while it is, so the analysis takes over by itself once default setup is turned off. A failed
# read runs it.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ci-status/**'
      - 'audits/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'ci-status/**'
      - 'audits/**'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# GHA-AUDIT-1: a newer push to a PR cancels the superseded run; push runs are grouped per sha and never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  precheck:
    # RUNNER-PIN-2 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest becomes Ubuntu 26 by 2026-11-19 (a notice on every job meanwhile); pinned to ubuntu-24.04 until an ubuntu-26.04 trial run is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      default_setup: ${{ steps.state.outputs.default_setup }}
    steps:
      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CODEQL-DEFAULT-PRECHECK-2 (2026-10-30): the dynamic workflow stays listed as active after default setup is switched off, so "active"
          # alone skipped the analysis for good: the last scan of main was 2026-10-13 (17 days, 220 stale alerts). Default setup counts as
          # configured only while that workflow has actually run in the last 7 days (it runs on every push to main). Any failed read runs it.
          if out=$(gh api "repos/${{ github.repository }}/actions/workflows" --paginate \
                --jq '.workflows[] | select(.path == "dynamic/github-code-scanning/codeql") | select(.state == "active") | .id' 2>/dev/null); then
            wf=$(printf '%s\n' "$out" | head -n 1)
            if [ -z "$wf" ]; then
              s=not-configured
            elif latest=$(gh api "repos/${{ github.repository }}/actions/workflows/$wf/runs?per_page=1" --jq '.workflow_runs[0].created_at // ""' 2>/dev/null); then
              since=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
              if [ -n "$latest" ] && [[ "$latest" > "$since" ]]; then s=configured; else s=not-configured; fi
            else
              s=unknown
            fi
          else
            s=unknown
          fi
          echo "default setup: $s"
          echo "default_setup=$s" >> "$GITHUB_OUTPUT"

  analyze:
    name: analyze (${{ matrix.language }})
    needs: precheck
    if: needs.precheck.outputs.default_setup != 'configured'
    # RUNNER-PIN-2 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest becomes Ubuntu 26 by 2026-11-19 (a notice on every job meanwhile); pinned to ubuntu-24.04 until an ubuntu-26.04 trial run is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - ci-status
              - audits
              - archive
              # CODEQL-SCOPE-1 (2026-10-18): frozen pre-release snapshots (worker-<ver>.js, never deployed), the generated
              # deployed-current mirror (byte-identical to worker.js, which is scanned) and offline test fixtures doubled
              # or tripled every finding: 100 open alerts, most of them copies. Deployed source keeps full coverage.
              - "**/worker-[0-9]*.js"
              - "**/deployed-current.worker.js"
              - "**/*.test.mjs"
              - "**/*.test.py"
              - "qnfo-fleet-advisor"
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
