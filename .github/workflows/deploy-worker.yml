name: Deploy Worker
on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker directory (qnfo-ai)'
        required: true
        type: string
        default: 'qnfo-ai'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Cloudflare API (bundle PUT + keep_bindings)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER="${{ github.event.inputs.worker }}"
          case "$WORKER" in
            qnfo-ai) MAIN="worker.js";;
            conference-radar) MAIN="worker.js";;
            *) echo "Unsupported worker: $WORKER"; exit 1;;
          esac
          BUNDLE="$WORKER/deployed-current.worker.js"
          test -f "$BUNDLE" || { echo "Missing $BUNDLE"; exit 1; }
          curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F "metadata={\"main_module\":\"${MAIN}\",\"keep_bindings\":[\"ai\",\"d1\",\"vectorize\",\"service\",\"secret_text\",\"kv_namespace\",\"r2_bucket\"]};type=application/json" \
            -F "${MAIN}=@${BUNDLE};filename=${MAIN};type=application/javascript+module" > /tmp/deploy.out
          python3 -c "import json,sys; d=json.load(open('/tmp/deploy.out')); sys.exit(0 if d.get('success') else 1)" && echo "DEPLOY OK" || { cat /tmp/deploy.out; exit 1; }
