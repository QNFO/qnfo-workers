name = "qnfo-code-orchestrator"
main = "worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# qnfo-code-orchestrator v0.2.0 -- durable code-task loop (D1 state, model ladder, container + Dynamic Workers verifiers, PR-gated)
# v0.1.1 history: integration slice: reads repos via qnfo-code-agent
# (GitHub tool server) and runs Python in its OWN Cloudflare Container.
# v0.1.1 = red-team remediation: read-error propagation, honest capabilities, output caps,
#          AUDIT_DB cloud_ops_events logging. v0.2 adds the LLM plan loop + edit/PR.
[[containers]]
# CONTAINER-NAME-1 (2026-10-01, deploy-code-orchestrator run 36842850801): the first wrangler deploy uploaded the worker but stopped at
# "There is already an application with the name qnfo-code-orchestrator-pycontainer deployed that is associated with a different durable
# object namespace". That earlier application is left alone (deleting it is destructive); this deploy gets its own name.
name = "qnfo-code-orchestrator-pycontainer-v2"
class_name = "PyContainer"
image = "docker.io/library/python:3.12-slim"
instance_type = "lite"
max_instances = 2

[[durable_objects.bindings]]
name = "PY_CONTAINER"
class_name = "PyContainer"

# DO-EXPORTS-1 (#286, run 36847868908): wrangler 4.145 reconciles Durable Object `exports` and rejected the legacy
# migrations array: "[provisioned_class_missing_from_config] class 'PyContainer' has a provisioned Durable Object
# namespace but is not declared in `exports`". Per Cloudflare's "Migrate from the legacy migrations flow", an existing
# worker moves to `exports` with no data migration: the provisioned namespace stays, only the config shape changes.
# The class was created by `new_sqlite_classes`, so its storage is sqlite. `exports` and `migrations` are mutually
# exclusive and the change is one-way, so there is deliberately no [[migrations]] block.
[exports.PyContainer]
type = "durable-object"
storage = "sqlite"

[[d1_databases]]
binding = "AUDIT_DB"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# Secrets (fail-closed):
#   ORCH_TOKEN      -- bearer auth for /task + /exec
#   CODE_AGENT_KEY  -- to call qnfo-code-agent /v1/repo/read (same value as code-agent's secret)

# ---- v0.2.0 task loop ----
# Model calls: Workers AI via the AI binding; the ladder (cheapest first) is env.MODEL_LADDER or the code default.
[ai]
binding = "AI"

# Dynamic Workers: run candidate JS in an isolated Worker with no network (globalOutbound: null).
# Used only by the OFF-by-default JS verifier; enable with JS_VERIFY = "dynamic" AFTER
# POST /v1/probe/dynamic-cpu reports enforced:true on the real platform (local workerd did not enforce cpuMs).
[[worker_loaders]]
binding = "LOADER"

[vars]
JS_VERIFY = "off"
# PULL-BASED PR PUBLISHING: no GitHub PR-write credential here; verified patches park as status ready_to_publish and
# .github/workflows/code-task-publish.yml turns them into PRs with the Actions GITHUB_TOKEN.
PR_PUBLISH_MODE = "pull"

# Cron drives the loop with no human session. CRON-RATE-CEILING-1: one fire per 10 minutes is the floor (144/day).
[triggers]
crons = ["*/10 * * * *"]
