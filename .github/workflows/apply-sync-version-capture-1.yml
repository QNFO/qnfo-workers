name: apply-sync-version-capture-1

# SYNC-VERSION-CAPTURE-1 (issue #1509, AUDIT-PROBE-DEGENERATE-VERSION-NULL-1).
#
# worker_live_audit.live_version was NULL for 110/110 rows, including the 5 SYNC
# rows, because scripts/deploy-drift-guard.py emitted its `sync_workers` class as
# bare worker-name strings and scripts/fleet-autoaudit.py therefore wrote
# put(w, 200, None, None, 1, "SYNC"). match=1 proved liveness, not version sync.
#
# This workflow applies scripts/patch-sync-version-capture-1.py (fail-closed,
# idempotent), then proves the fix FUNCTIONALLY by executing the patched
# consumer's classify() against both the object form and the legacy bare-string
# form, before committing. No worker deploy is involved: both targets are CI
# scripts consumed by the drift-guard / auto-audit workflows.
#
# WHY IT IS WRITTEN THIS WAY (the classes it must not join):
#   * BLOCK-SCALAR-COL0-1 -- every embedded-script line stays inside the `run: |`
#     scalar's indentation; a column-0 line terminates the scalar and makes the
#     whole workflow unparseable (this is the defect repaired in
#     apply-cloud-ops-cron-dow-1.yml on 2026-09-30).
#   * WORKFLOW-YAML-LINT-1 -- every step name is colon-free.
#   * SCHEDULE-EVENT-NEVER-FIRES-1 -- push-triggered + workflow_dispatch, never
#     schedule-only.
#   * COMMITBACK-DRIFT-1 / the 409 class -- the commit-back retries with
#     pull --rebase --autostash because fleet agents push every few minutes.
#   * VERIFY-NOT-ASSUME-1 -- a grep-only check cannot catch a consumer that
#     parses but drops the value, so the guard is exercised, not just read.

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-sync-version-capture-1.py"
      - ".github/workflows/apply-sync-version-capture-1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-sync-version-capture-1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply patch (fail-closed, idempotent)
        run: |
          set -euo pipefail
          export REPO_ROOT="$GITHUB_WORKSPACE"
          python3 scripts/patch-sync-version-capture-1.py
          echo "--- post-state markers ---"
          grep -c 'SYNC-VERSION-CAPTURE-1' scripts/deploy-drift-guard.py
          grep -c 'SYNC-VERSION-CAPTURE-1' scripts/fleet-autoaudit.py
          echo "--- pre-state must be gone ---"
          if grep -q 'sync_workers.append(worker)' scripts/deploy-drift-guard.py; then
            echo "FAIL: bare-string append still present"; exit 1
          fi
          if grep -q 'put(w, 200, None, None, 1, "SYNC")' scripts/fleet-autoaudit.py; then
            echo "FAIL: degenerate NULL SYNC write still present"; exit 1
          fi
          echo PRE_STATE_GONE
          python3 -m py_compile scripts/deploy-drift-guard.py scripts/fleet-autoaudit.py
          echo PY_COMPILE_OK

      - name: Functional test - the consumer must capture the version
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import ast, json
          src = open('scripts/fleet-autoaudit.py', encoding='utf-8').read()
          tree = ast.parse(src)
          fn = [n for n in tree.body
                if isinstance(n, ast.FunctionDef) and n.name == 'classify'][0]
          fn.body.append(ast.Return(value=ast.Name(id='rows', ctx=ast.Load())))
          mod = ast.Module(body=[fn], type_ignores=[])
          ast.fix_missing_locations(mod)
          ns = {}
          exec("def _w(it):\n    return it.get('worker') if isinstance(it, dict) else it\n", ns)
          exec(compile(mod, '<classify>', 'exec'), ns)
          rows = ns['classify']({'sync_workers': [
              {'worker': 'w1', 'dir': 'd', 'version': '9.9.9'}, 'w2']})
          r1 = rows.get('w1')
          r2 = rows.get('w2')
          print('object_form_row =', json.dumps(r1))
          print('legacy_form_row =', json.dumps(r2))
          assert r1 and r1['live'] == '9.9.9', 'object form version NOT captured'
          assert r1['match'] == 1, 'object form match flag wrong'
          assert r2 and r2['match'] == 1, 'legacy bare-string form regressed'
          print('FUNCTIONAL_TEST_PASS')
          PYEOF

      - name: Commit the patched CI scripts
        run: |
          set -euo pipefail
          git config user.name "qnfo-selfheal-bot"
          git config user.email "bot@qnfo.org"
          git add scripts/deploy-drift-guard.py scripts/fleet-autoaudit.py
          if git diff --cached --quiet; then
            echo "NO_CHANGES (already applied) - skipping commit"
            exit 0
          fi
          git commit -m "fix(ci): SYNC-VERSION-CAPTURE-1 - drift guard emits the sync version, fleet-autoaudit captures it (#1509) [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "PUSH_OK attempt $i"
              exit 0
            fi
            echo "push attempt $i failed; retrying in 10s"
            sleep 10
          done
          echo "PUSH_FAILED after 5 attempts"
          exit 1

      - name: Publish machine-readable status
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p ci-status
          printf '{"workflow":"apply-sync-version-capture-1","issue":"1509 / SYNC-VERSION-CAPTURE-1","head":"%s","ts":"%s"}\n' \
            "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" > ci-status/sync-version-capture-1.json
          cat ci-status/sync-version-capture-1.json
          git config user.name "qnfo-selfheal-bot"
          git config user.email "bot@qnfo.org"
          git add ci-status/sync-version-capture-1.json
          if git diff --cached --quiet; then echo "status unchanged"; exit 0; fi
          git commit -m "ci(status): apply-sync-version-capture-1 run [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "STATUS_PUSH_OK attempt $i"
              exit 0
            fi
            sleep 10
          done
          echo "status push failed"
          exit 0
