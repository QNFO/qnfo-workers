name: indexnow-submit

# EXTERNAL (non-Cloudflare) IndexNow submitter.
#
# The qnfo-gateway Worker cron shares Cloudflare's egress IP, which IndexNow throttles (429)
# across the shared relay and Bing. A Worker cannot change its egress IP, so the durable floor
# is a submitter on a DIFFERENT IP: GitHub Actions runs on GitHub/Azure egress. This runs the
# same submission the operator path proved (460/460 landed) and is belt-and-braces with the
# Worker fan-out (which keeps yandex.com first, since that engine still accepts CF egress).

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-submit
  cancel-in-progress: false

jobs:
  submit:
    # RUNNER-PIN-2 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest becomes Ubuntu 26 by 2026-11-19 (a notice on every job meanwhile); pinned to ubuntu-24.04 until an ubuntu-26.04 trial run is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: submit papers.qnfo.org URLs to IndexNow (external egress)
        run: python scripts/indexnow-submit.py
