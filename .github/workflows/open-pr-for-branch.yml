name: open-pr-for-branch
run-name: open-pr-for-branch ${{ github.ref_name }}
# COMPANION-PR-1: a session without a working GitHub token pushes a claude/** branch and this opens the pull request, so the lane merges it after checks.
on:
  push:
    branches:
      - 'claude/**'
permissions:
  contents: read
  pull-requests: write
jobs:
  open:
    timeout-minutes: 5
    # RUNNER-PIN-2 (2026-11-04): pinned to ubuntu-24.04 because ubuntu-latest moves to Ubuntu 26 until 2026-11-19; unpin after a green trial run on ubuntu-26.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Open a pull request when none exists
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$n" = "0" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --title "$BRANCH" --body "Opened by open-pr-for-branch (COMPANION-PR-1) for a session without a GitHub token. work-claim: unreachable (no fleet network); no other open PR touches this branch."
          fi
