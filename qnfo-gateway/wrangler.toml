name = "qnfo-gateway"
main = "worker.js"
compatibility_date = "2026-08-01"


[observability]
enabled = true
head_sampling_rate = 1

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "qnfo-graph"
database_id = "a1954b92-d681-4d02-b1f6-f9a2eb4c265d"

[[d1_databases]]
binding = "LIVING_PAPER"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[r2_buckets]]
binding = "QNFO_BUCKET"
bucket_name = "qnfo"

# SCHOLAR-PDF-URL-1 (2026-10-01, agent_issues #1714): /papers/<slug>.pdf asks qnfo-pdf (live) to render a
# paper once and stores the result in QNFO_BUCKET under pdf/<slug>/. A same-account fetch to *.workers.dev
# can fail as CF error 1042, so the call goes through this binding; the canonical deploy installs it.
[[services]]
binding = "PDF_RENDERER"
service = "qnfo-pdf"
environment = "production"

# Secrets (wrangler secret put): SYNC_TOKEN, TURNSTILE_SECRET

[triggers]
crons = ["0 6 * * *"]
