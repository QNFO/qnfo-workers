name: apply-schedules-body-1498

# RAWPUT-SCHEDULES-FAILED-1 (issue 1498).
# Root cause proven against Cloudflare's official OpenAPI schema: PUT .../schedules takes a
# top-level JSON ARRAY of workers_schedule objects (required: cron), not {"crons":[...]}, and the
# GET result is {schedules:[...]} rather than a bare array. raw_put.py sent the object form and
# parsed the response as a list, so every repo `crons = [...]` edit was inert fleet-wide
# (deployment_history rows 188-193: schedules=FAILED HTTP 400 code 10026) and every deploy re-PUT.
# This applier applies the patch, proves the shape against a stub endpoint, and commits back.

on:
  push:
    # BRANCH-FILTER-1 (2026-09-30): without this, a push to ANY branch that touches this workflow's paths ran it,
    # including its production deploy / push-to-main steps. Editing lifecycle-sot-and-deploy.yml on a PR branch did
    # exactly that (run 36740563280, a real qnfo-lifecycle /content PUT from a feature branch).
    branches: [main]
    paths:
      - 'scripts/patch-schedules-body-1498.py'
      - 'scripts/test_schedules_shape_1498.py'
      - '.github/workflows/apply-schedules-body-1498.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-schedules-body-1498
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch (fail-closed, idempotent)
        run: python3 scripts/patch-schedules-body-1498.py

      - name: Verify pre-state gone + markers + syntax
        run: |
          set -euo pipefail
          grep -q 'CF-SCHEDULES-BODY-SHAPE-1' scripts/raw_put.py
          grep -q 'CF-SCHEDULES-RESPONSE-SHAPE-1' scripts/raw_put.py
          grep -q 'LOCAL-TOKEN-PATH-REMOVED-1' scripts/raw_put.py
          if grep -q 'LENOVO' scripts/raw_put.py; then echo 'PRE_STATE_GONE_FAILED: client-side token path still present'; exit 1; fi
          if grep -q 'json.dumps({"crons"' scripts/raw_put.py; then echo 'OLD_BODY_STILL_PRESENT'; exit 1; fi
          python3 -m py_compile scripts/raw_put.py scripts/patch-schedules-body-1498.py scripts/test_schedules_shape_1498.py
          echo 'MARKERS OK'

      - name: Functional test against stub CF endpoint
        run: REPO_ROOT=. python3 scripts/test_schedules_shape_1498.py

      - name: Commit back (rebase-retry)
        run: |
          set -euo pipefail
          if git diff --quiet; then echo "no change to commit (already applied)"; exit 0; fi
          git config user.name "qnfo-ci"
          git config user.email "ci@qnfo.org"
          git add scripts/raw_put.py
          git commit -m "fix(deploy): schedules PUT body must be an array + GET result is an object (issue 1498) [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then echo "PUSHED attempt $i"; exit 0; fi
            echo "push race, retry $i"; sleep 4
          done
          echo "PUSH_FAILED after 5 attempts"; exit 1

      - name: Status file
        if: always()
        run: |
          set -uo pipefail
          mkdir -p ci-status
          printf '{"fix":"RAWPUT-SCHEDULES-FAILED-1","issue":1498,"run":"%s","conclusion":"%s"}\n' \
            "$GITHUB_RUN_ID" "${{ job.status }}" > ci-status/schedules-body-1498.json
          git add ci-status/schedules-body-1498.json || true
          git commit -m "ci-status: schedules-body-1498 [skip ci]" || true
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then break; fi
            sleep 4
          done
