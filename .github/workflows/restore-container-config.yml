name: restore-container-config

# CONTAINER-CONFIG-RESTORE-6 (issues #1485 / #1487), 2026-09-29 — qnfo-ops session.
# RESTORE-5 added this workflow but no run has published
# ci-status/restore-container-config.json yet (dir listing at 19:4xZ shows the file absent).
# This commit re-fires the trigger on the workflow's own path, so the run's outcome artifact
# is published either way (the artifact step is `if: always()`), which makes the blocker
# readable from the repo even when the restore itself fails closed.
#
# ROOT CAUSE ALREADY PINNED AT SOURCE (qnfo-ops, this session): cfWorkerDeploy reads live
# /settings for compatibility_date + compatibility_flags ONLY and never carries `containers`
# into the upload metadata, so no /content deploy from qnfo-ops can restore the block — it can
# only preserve it. That is why this workflow (which PUTs `containers` explicitly) is the sole
# restore path. Verified by reading qnfo-ops/worker.js@main cfWorkerDeploy: the metadataPart
# Object.assign is _mp + bindings + compatibility_date + compatibility_flags + exports. No
# containers key exists in it.
#
# GAP THIS CLOSES (measured, not inferred)
#   scripts/restore_container_config.py (CONTAINER-CONFIG-RESTORE-3) is the only path that
#   can ADD [[containers]] back: it PUTs /content with `containers` present in the upload
#   metadata and deliberately OMITS `bindings` and `[[migrations]]`, so it cannot strip
#   bindings and cannot trip DO-MIGRATION-NOTE-1.
#
# SOURCE SAFETY (removes the rollback hazard)
#   qnfo-containers-pilot/worker.js and qnfo-containers-pilot/deployed-current.worker.js are
#   byte identical (sha e0f9e043a9f5a879a01914c982f708af471815b2, VERSION
#   1.0.3-clone-egress-timeout-fallback), so uploading the repo source does NOT revert the
#   CLONE-EGRESS-TIMEOUT-FALLBACK-1 fix.
#
# FAIL-CLOSED
#   The script exits 3 without mutating the script if CLOUDFLARE_API_TOKEN is absent, if
#   wrangler.toml declares no [[containers]], or if GET /settings cannot be read. The
#   post-state assertion below independently re-reads /settings and fails the job if
#   `containers` is still absent, so a green run cannot be a false green.
#
# CI-TRIGGER-SKIP-1: the commits this workflow makes carry NO skip token.

# CONTAINER-WORKFLOW-SPRAWL-1 (2026-09-30, agent_issues #1506): DISPATCH-ONLY (break-glass).
# This one-shot restore used to fire on every push touching scripts/restore_container_config.py or
# qnfo-containers-pilot/wrangler.toml, alongside four sibling restorers and the real deploy
# (deploy-containers-pilot.yml). Measured on the 2026-09-30T18:33Z push: FIVE unconditional
# /content re-uploads of qnfo-containers-pilot in 13 s (fleet_deploys 1080-1086), racing each other
# for the deploy lock. The automatic path is now container-config-selfheal-cron.yml, gated by
# scripts/container_restore_gate.py (restore only on evidence of the #1485 class). Run this by hand
# only when that gate is wrong.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-container-config
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      WORKER: qnfo-containers-pilot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: credential presence check (fail loud, never silent)
        id: creds
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "rc=no-token" >> "$GITHUB_OUTPUT"
            echo "::error::CLOUDFLARE_API_TOKEN is EMPTY in this workflow - the restore cannot run and #1485 stays open. The CI credential gap (APPLIER-CI-CREDENTIAL-GAP-1, issue #1486) is the blocker."
          else
            echo "rc=present" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN present (len ${#CLOUDFLARE_API_TOKEN}), account=${CLOUDFLARE_ACCOUNT_ID:-unset}"
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID is empty - the script falls back to its hardcoded account id"
          fi

      - name: pre-state (live /settings)
        continue-on-error: true
        run: |
          set -uo pipefail
          curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER}/settings" \
            -o /tmp/pre.json || true
          python3 - <<'PY' || cat /tmp/pre.json || true
          import json
          d = json.load(open('/tmp/pre.json'))
          r = d.get('result') or {}
          print('PRE containers :', json.dumps(r.get('containers')))
          print('PRE bindings   :', json.dumps([b.get('name') for b in (r.get('bindings') or [])]))
          print('PRE compat_date:', r.get('compatibility_date'))
          PY

      - name: restore [[containers]] via /content metadata
        id: restore
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/restore_container_config.py 2>&1 | tee /tmp/restore.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: post-state assertion (authoritative, fail closed)
        id: post
        continue-on-error: true
        run: |
          set -uo pipefail
          sleep 10
          curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER}/settings" \
            -o /tmp/post.json || true
          python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/post.json'))
          r = d.get('result') or {}
          c = r.get('containers')
          names = [b.get('name') for b in (r.get('bindings') or [])]
          print('POST containers:', json.dumps(c))
          print('POST bindings  :', json.dumps(names))
          if not c:
              print('::error::containers STILL absent after restore -- #1485 remains open')
              sys.exit(1)
          if 'AUDIT' not in names:
              print('::error::the AUDIT d1 binding was lost -- roll forward immediately')
              sys.exit(1)
          print('CONTAINERS_RESTORED')
          PY

      - name: publish outcome artifact
        if: always()
        run: |
          set -uo pipefail
          mkdir -p ci-status
          tail_json="$(tail -c 4000 /tmp/restore.log 2>/dev/null | tr -d '\r' | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))' || echo '""')"
          cat > ci-status/restore-container-config.json <<JSON
          {
            "workflow": "restore-container-config",
            "issues": ["1485", "1487"],
            "worker": "${WORKER}",
            "creds_rc": "${{ steps.creds.outputs.rc }}",
            "restore_rc": "${{ steps.restore.outputs.rc }}",
            "post_outcome": "${{ steps.post.outcome }}",
            "head": "$GITHUB_SHA",
            "ts": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "restore_tail": $tail_json
          }
          JSON
          python3 -c "import json; json.load(open('ci-status/restore-container-config.json'))" \
            && cat ci-status/restore-container-config.json \
            || { echo "::error::artifact is not valid JSON"; exit 1; }

      - name: commit outcome artifact
        if: always()
        run: |
          set -uo pipefail
          git config user.name "qnfo-ci"
          git config user.email "ci@qnfo.org"
          git add ci-status/restore-container-config.json || true
          git commit -m "chore(ci): restore-container-config outcome" || true
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push origin HEAD:main; then echo "PUSH OK attempt=$i"; exit 0; fi
            sleep $((i*3))
          done
          echo "::warning::outcome artifact not pushed after retries"
          exit 0
