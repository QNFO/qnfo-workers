name = "qnfo-artifacts"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Cloudflare Artifacts (closed beta; access granted on account quniverse).
# The namespace is fixed at bind time -- the worker never takes a namespace parameter.
[[artifacts]]
binding = "ARTIFACTS"
namespace = "qnfo"

# Re-falsification store for the beta dependency (artifacts_probes).
[[d1_databases]]
binding = "AUDIT_DB"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# Item 3: periodic re-probe so a beta revocation/shape change is recorded, not silent.
[triggers]
crons = ["17 */6 * * *"]

[vars]
ARTIFACTS_NAMESPACE = "qnfo"

# ARTIFACTS_TOKEN is a secret (wrangler secret put ARTIFACTS_TOKEN --name qnfo-artifacts).
# The worker fails closed (503) until it is set. Never commit the value.
