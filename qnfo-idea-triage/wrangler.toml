name = "qnfo-idea-triage"
main = "worker.js"
compatibility_date = "2026-08-01"

# Secrets (persist across deploys; set once via wrangler/API):
#   TRIAGE_TOKEN   - bearer token for /triage and commit endpoints
#   DISPATCH_TOKEN - X-Sync-Token accepted by qnfo-agent-orchestrator /task
#   INDEXNOW_KEY   - IndexNow submission key (public, served by the key-file worker)

[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[d1_databases]]
binding = "LIVING_PAPER"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["0 * * * *", "*/10 * * * *"]
