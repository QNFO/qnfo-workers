name = "qnfo-goal-author"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# qnfo-goal-author v0.1.0 - SELF-AUTHORED GOALS: fleet authors its own instrumental goals.
# Purpose: close the autonomy gap "self-authored goals absent BY DESIGN" (independent_decision 2.5/5,
# s5_policy 3.0/5). Daily loop: gather signals -> synthesize falsifiable goals -> classify
# instrumental vs objective-revision -> score -> auto-adopt top-N instrumental -> route objective
# revisions to propose->ratify -> re-prioritize -> receipts.
# INVARIANT: terminal objective is READ-ONLY; objective-revision candidates are NEVER auto-adopted.
# Canonical source: QNFO/qnfo-workers/qnfo-goal-author/worker.js
# Cron: daily 02:00 UTC (cloud layer).

[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[ai]
binding = "AI"

[triggers]
crons = ["0 2 * * *", "0 3 * * 1"]
