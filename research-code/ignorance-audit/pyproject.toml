[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ignorance-audit"
version = "0.1.0"
description = "The Universal Ignorance Audit as a library: the fifteen-question instrument, protocol checks, model-agnostic administration, and scoring for its pre-registered claim."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LicenseRef-QNFO-ULA-2.0" }
dependencies = []
authors = [{ name = "Rowan Brad Quni-Gudzinas" }]
keywords = ["epistemics", "ignorance", "AI-assisted research", "research governance", "metascience"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
]

[project.urls]
Paper = "https://doi.org/10.5281/zenodo.21901984"

[project.scripts]
ignorance-audit = "ignorance_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
