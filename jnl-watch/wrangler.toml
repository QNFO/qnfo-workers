name = "jnl-watch"
main = "worker.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "AUDIT"
database_name = "jnl-audit"
database_id = "8be80cdb-979d-401f-b3ab-6a16869473ec"

[[vectorize]]
binding = "CORPUS"
index_name = "jnl-corpus"

[[r2_buckets]]
binding = "PARSE_CACHE"
bucket_name = "jnl-parse-cache"

[[kv_namespaces]]
binding = "STATE"
id = "0cf89b469bcb47058e343611d9117897"

[triggers]
crons = ["*/10 * * * *"]
