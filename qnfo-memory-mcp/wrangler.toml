name = "qnfo-memory-mcp"
main = "worker.js"
# COMPAT-DATE-DECLARED-APPLY-1 canary (qnfo-ops 2.42.0). The canonical deploy applies the date below on this worker's next
# deploy because of the review line, keeps it only when /health then answers with the deployed VERSION, and otherwise
# uploads 2026-08-10 again. Reviewed against the compatibility flags page, defaults between 2026-08-10 and 2026-10-10:
# 2026-09-08 Python only; 2026-10-01 Durable Object eviction (this worker has no Durable Object). The 2026-08-04
# nodejs_compat default is already in effect at the live date; scripts/compat-risk-scan.mjs finds nothing. No WebSockets.
# compat-advance: reviewed 2026-10-12
# COMPAT-ADVANCE-WAVE-2 (2026-10-12): this file changes so the canonical deploy runs and the declared date above is applied
# (GET ops.qnfo.org/compat read "next deploy advances to 2026-10-10" with no deploy since the declaration).
compatibility_date = "2026-10-10"


[observability]
enabled = true
head_sampling_rate = 1

# WORKERS-STANDARDS-1 (owner standards 2026-10-12): logs and traces declared. Workers docs: `enabled` alone turns on logs only;
# traces need [observability.traces]. Traces are sampled at the default rate of 1 (low-traffic worker).
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

head_sampling_rate = 0.05 # TRACES-SAMPLING-BEFORE-BILLING-1: stored traces bill from 2026-12-01
[ai]
binding = "AI"

[[d1_databases]]
binding = "GRAPH_DB"
database_name = "qnfo-graph"
database_id = "a1954b92-d681-4d02-b1f6-f9a2eb4c265d"

[[d1_databases]]
binding = "LIVING_PAPER"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[vectorize]]
binding = "PAPER_VZ"
index_name = "qwav-research-v2"
