name = "qnfo-observability"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# qnfo-observability v1.0.0 - canonical fleet observability layer.
# Purpose: ingest Cloudflare Logpush workers_trace_events from R2 into structured D1 (worker_logs),
#          accept direct structured events (POST /log), serve log queries + fleet summary,
#          emit hourly digest to cloud_ops_events + alerts. Makes the fleet observable to itself.
# Cron: hourly ingest+digest (cloud layer, NOT device-bound).
# Canonical source: QNFO/qnfo-workers/qnfo-observability/

[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[r2_buckets]]
binding = "LOGS"
bucket_name = "qnfo-audit"

[triggers]
crons = ["17 * * * *"]
