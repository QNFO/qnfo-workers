name: apply-container-start-race

# START-RACE-1 (issue #1344) applier.
# Fires on push of its own patcher/workflow (the repo's apply-*.yml convention),
# so pushing this file triggers the run. Also dispatchable by hand.
on:
  push:
    paths:
      - scripts/container-start-race-patch.py
      - .github/workflows/apply-container-start-race.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: record pre-deploy live version (rollback reference)
        run: |
          curl -sf https://qnfo-containers-pilot.q08.workers.dev/health > /tmp/pre.json || echo '{}' > /tmp/pre.json
          cat /tmp/pre.json
          python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/pre.json'))
          except Exception:
              d = {}
          print("PRE_DEPLOY_VERSION=" + str(d.get("version")))
          PY

      - name: apply START-RACE-1 patch
        run: python3 scripts/container-start-race-patch.py

      - name: guard - patched source parses and carries the lock
        run: |
          set -e
          node --check qnfo-containers-pilot/worker.js
          grep -qF 'this._starting = this._doStart()' qnfo-containers-pilot/worker.js
          grep -qF '1.0.1-start-race-lock' qnfo-containers-pilot/worker.js
          echo "GUARD OK"

      - name: commit patched source
        run: |
          set -e
          git config user.name "qnfo-ci"
          git config user.email "ci@qnfo.org"
          git add qnfo-containers-pilot/worker.js
          if git diff --cached --quiet; then
            echo "no source change to commit (already applied)"
          else
            git commit -m "fix(containers): START-RACE-1 memoise in-flight start + bounded retry (#1344)"
            git push
          fi

      # Binding- and settings-preserving module deploy (raw_put.py reads live
      # /settings first and fails closed rather than clearing compatibility_date).
      # Deliberately NOT `wrangler deploy`: wrangler.toml cannot reproduce the
      # live bindings and the DO migration note warns a wrangler deploy fails closed.
      - name: deploy qnfo-containers-pilot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/raw_put.py qnfo-containers-pilot qnfo-containers-pilot/worker.js

      - name: verify live version advanced
        id: verify
        run: |
          set -e
          sleep 10
          for i in 1 2 3 4 5; do
            curl -sf https://qnfo-containers-pilot.q08.workers.dev/health > /tmp/post.json && break
            echo "attempt $i: health not ready"; sleep 6
          done
          cat /tmp/post.json
          grep -qF '1.0.1-start-race-lock' /tmp/post.json
          echo "VERIFY OK: live version is 1.0.1-start-race-lock"

      # Fail-closed recovery: restore the previously recorded live artifact.
      - name: rollback on failed verification
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "verification failed - rolling back to qnfo-containers-pilot/deployed-current.worker.js"
          python3 scripts/raw_put.py qnfo-containers-pilot qnfo-containers-pilot/deployed-current.worker.js || true
          curl -s https://qnfo-containers-pilot.q08.workers.dev/health || true

      - name: summary
        if: always()
        run: |
          echo "pre : $(cat /tmp/pre.json 2>/dev/null)"
          echo "post: $(cat /tmp/post.json 2>/dev/null)"
