name: create-vectorize-calibration

# VECTORIZE-INDEX-DELETED-1 (#254). qnfo-fleet-calibrator declares a Vectorize binding VEC_CAL to index
# `qnfo-calibration`. That index was deleted, and Cloudflare error 10160 then rejected every deploy of the worker
# (canonical-deploy run 36843898636). PR #265 removed the binding so the worker could deploy; this workflow
# recreates the index so the binding can be restored.
#
# Additive and idempotent: it lists existing indexes first and does nothing if `qnfo-calibration` already exists.
# It never deletes or modifies an index. Dimensions are 768 because probeVec in qnfo-fleet-calibrator/worker.js
# queries with a 768-length vector; the metric is cosine. The index holds only synthetic probe traffic.
# Secrets: reuses CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID only and never prints them.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: create-vectorize-calibration
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INDEX: qnfo-calibration
    steps:
      - name: Require Cloudflare credentials
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured - refusing to no-op"
            exit 1
          fi

      - name: Create the index if it does not exist
        run: |
          set -uo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/vectorize/v2/indexes"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS --max-time 30 -H "$auth" "$base/$INDEX" -o /tmp/get.json -w "get http=%{http_code}\n" || true
          if jq -e '.success == true and .result.name == env.INDEX' /tmp/get.json >/dev/null 2>&1; then
            echo "index $INDEX already exists - nothing to do"
            jq -c '{name: .result.name, config: .result.config}' /tmp/get.json
            exit 0
          fi
          echo "index $INDEX not found - creating (768 dimensions, cosine)"
          curl -sS --max-time 60 -X POST -H "$auth" -H "Content-Type: application/json" "$base" \
            -d "{\"name\":\"$INDEX\",\"description\":\"qnfo-fleet-calibrator synthetic probe index\",\"config\":{\"dimensions\":768,\"metric\":\"cosine\"}}" \
            -o /tmp/create.json -w "create http=%{http_code}\n" || true
          jq -c '{success, errors, result: (.result | {name, config})}' /tmp/create.json
          jq -e '.success == true' /tmp/create.json >/dev/null

      - name: Verify the index now exists
        run: |
          set -uo pipefail
          curl -sS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/vectorize/v2/indexes/$INDEX" -o /tmp/verify.json
          jq -c '{success, name: .result.name, config: .result.config}' /tmp/verify.json
          jq -e '.success == true and .result.name == env.INDEX' /tmp/verify.json >/dev/null
