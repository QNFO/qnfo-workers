name: attach-travel-host

# TRAVEL-HOST-1 (2026-10-19, pillar personal). Serves the travel planner (personal-companion 1.33.0+, TRAVEL-CHAT-1) at
# travel.q08.org: owner directive 2026-10-19, personal services on an easy q08.org subdomain. Same self-triggering,
# fail-closed, commit-back pattern as attach-surface-routes.yml: a push of this file or its script starts the run, the
# script waits for the canonical deploy, creates the zone route (and an originless proxied AAAA record when the name has
# none), verifies from outside and rolls back what it created on failure. Reversible: delete the ids in
# ci-status/attach-travel-host.json.
# WORKFLOW-YAML-LINT-1: every step name below is colon-free.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-travel-host.yml'
      - 'scripts/attach-travel-host.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: attach-travel-host
  cancel-in-progress: false

jobs:
  attach-and-verify:
    # RUNNER-PIN-2 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest becomes Ubuntu 26 by 2026-11-19 (a notice on every job meanwhile); pinned to ubuntu-24.04 until an ubuntu-26.04 trial run is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run the idempotent fail-closed host script
        id: attach
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          rc=0
          python3 scripts/attach-travel-host.py || rc=$?
          echo "attach_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "ATTACH_RC=$rc"
          exit 0

      - name: Commit the result back to main (race-safe)
        run: |
          set -uo pipefail
          git config user.name "qnfo-selfheal-bot"
          git config user.email "bot@qnfo.org"
          git add ci-status/attach-travel-host.json
          bash scripts/push_artifact.sh "ci(attach-domain): record TRAVEL-HOST-1 result [skip ci]" ci-status/attach-travel-host.json

      - name: Fail the job when the host did not verify
        if: steps.attach.outputs.attach_rc != '0'
        run: |
          echo "TRAVEL-HOST-1 did not verify; see ci-status/attach-travel-host.json"
          exit 1
