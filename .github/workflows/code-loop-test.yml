name: code-loop-test

# CODE-TASK-LOOP-1: the qnfo-code-orchestrator v0.2.0 loop is not deployed, so nothing at runtime would notice it
# regressing. This runs its offline acceptance test (real SQL via node:sqlite, real python3 as the container, scripted
# model and code-agent; Dynamic Workers errors replayed from the real workerd) on every PR/push that touches it.
# A red run on main is filed by ci-watchdog (it is on that workflow's watch list).

on:
  pull_request:
    paths:
      - "qnfo-code-orchestrator/**"
      - ".github/workflows/code-loop-test.yml"
  push:
    branches: [main]
    paths:
      - "qnfo-code-orchestrator/**"
      - ".github/workflows/code-loop-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: node --check qnfo-code-orchestrator/worker.js
      - name: Loop acceptance test
        run: node --no-warnings qnfo-code-orchestrator/test-loop.mjs
      - name: Hunk patch test (HUNK-NO-EOL-1)
        run: node --no-warnings qnfo-code-orchestrator/test-hunk.mjs
      # ISSUE-PLANNER-1: prose issues from trusted sources become code tasks; everything else is refused or recorded.
      - name: Issue planner test
        run: node --no-warnings qnfo-code-orchestrator/planner.test.mjs
      # PLAN-DENY-NEGATION-1 (#1807): advice that forbids a cap/secret/deletion change is planned; a request for one is refused.
      - name: Planner deny rule (PLAN-DENY-NEGATION-1)
        run: node --no-warnings qnfo-code-orchestrator/plan-deny-negation.test.mjs
      # No-final-newline patches (incl. appending after a final line without newline, 120 seeded random edits) apply via git.
      - name: No-final-newline patch round trips
        run: node --no-warnings qnfo-code-orchestrator/no-eol.test.mjs
      # JS-VERIFY-FAIL-CLOSED-1 (#445): only post-parse errors pass the Dynamic Workers syntax check.
      - name: JS verifier fails closed
        run: node --no-warnings qnfo-code-orchestrator/verify-closed.test.mjs
      # SELF-REPAIR-1: failed model rounds back off and end as one fleet issue, never a needs_human owner card.
      - name: Self-repair test (SELF-REPAIR-1)
        run: node --no-warnings qnfo-code-orchestrator/self-repair.test.mjs
