name = "personal-api"
main = "worker.js"
compatibility_date = "2026-08-01"

# Deploy: wrangler deploy from this directory (canonical since v2.1.0 - all bindings
# reproduced in this file: ai + PERSONAL d1 + VZ vectorize + CAL_API service).
# Secrets API_KEY/CF_TOKEN/INFRA_TOKEN persist independently across wrangler deploys.

[ai]
binding = "AI"

[[d1_databases]]
binding = "PERSONAL"
database_name = "personal-life"
database_id = "e8d6c61a-10b7-4086-b81e-9e6e85afa407"

[[vectorize]]
binding = "VZ"
index_name = "personal-life"

# v2.1.0 - QNFO.OPS.010 Stage C: twin calendar retrieval (plane=personal)
[[services]]
binding = "CAL_API"
service = "calendar-api"
environment = "production"
