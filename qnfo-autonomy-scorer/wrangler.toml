name = "qnfo-autonomy-scorer"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# One run per day. Scores are recomputed from live facts; judgement dimensions are never touched.
[triggers]
crons = ["17 5 * * *"]
