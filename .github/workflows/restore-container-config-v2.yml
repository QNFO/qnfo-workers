name: restore-container-config-v2

# CONTAINER-CONFIG-RESTORE-8 (issues #1485 / #1487 / #1494), qnfo-ops 2026-09-29.
#
# WHY THIS WORKFLOW EXISTS -- MEASURED, NOT INFERRED
#   scripts/restore_container_config_v2.py is the first restore path that sends
#   `containers` AND `exports` AND the complete binding set in ONE metadata part. The
#   earlier path (restore-container-config-1485.yml -> restore_container_config.py)
#   produced, at 2026-09-29T19:45:06Z (head 45433495):
#       PUT /content -> HTTP 200
#       post /settings containers: null
#       post /settings bindings: ["PILOT_TOKEN"]     <-- AUDIT + SHELL_CONTAINER DROPPED
#   so the worker lost its D1 binding and its durable-object binding, and the container
#   runtime signature (ctx.container undefined) persisted. cf_worker_bindings confirmed
#   count=1 afterwards. Omitting `bindings` from the /content metadata did NOT preserve
#   them -- BINDING-PRESERVATION-1 is satisfied by sending them, not by omitting them.
#
# FAIL-CLOSED / NO-FALSE-GREEN
#   Steps that gather evidence carry continue-on-error:true so a failure can never skip the
#   recovery step. The FINAL GATE carries NO continue-on-error: it re-runs the verifier and
#   exits 1 unless bindings are complete and the runtime probe is clean. A green run
#   therefore means exactly one thing -- the container worker is restored.
#
# CI-TRIGGER-SKIP-1: this workflow's commits carry NO skip token.
# SCHEDULE-EVENT-NEVER-FIRES-1: `schedule` is deliberately absent (the schedule event has
#   never fired on this repo); the trigger is the push to the paths below.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/restore_container_config_v2.py'
      - 'scripts/verify_container_restore.py'
      - '.github/workflows/restore-container-config-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-container-config-v2
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      WORKER: qnfo-containers-pilot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: credential presence check (fail loud, never silent)
        id: creds
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "rc=no-token" >> "$GITHUB_OUTPUT"
            echo "::error::CLOUDFLARE_API_TOKEN is EMPTY in this workflow - the restore cannot run and #1485 stays open."
          else
            echo "rc=present" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN present (len ${#CLOUDFLARE_API_TOKEN}), account=${CLOUDFLARE_ACCOUNT_ID:-unset}"
          fi
          if [ -z "${PILOT_TOKEN:-}" ]; then
            echo "::warning::PILOT_TOKEN is empty - the secret binding can only be preserved, not rebuilt, and the /status probe will be skipped."
          fi

      - name: restore [[containers]] + bindings in one metadata part
        id: restore
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/restore_container_config_v2.py 2>&1 | tee /tmp/restore.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: independent read-back (writes the status artifact either way)
        id: verify
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/verify_container_restore.py 2>&1 | tee /tmp/verify.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: commit status artifact (race-safe, non-blocking)
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          git config user.name "qnfo-selfheal-bot"
          git config user.email "selfheal@qnfo.org"
          git add ci-status/restore-container-config-v2.json || true
          if git diff --cached --quiet; then
            echo "artifact unchanged - nothing to commit"
            exit 0
          fi
          git commit -m "ci(containers): restore-container-config-v2 outcome artifact (issue #1485)" || true
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "artifact pushed on attempt $i"
              break
            fi
            echo "push attempt $i failed; retrying"
            sleep 5
          done

      - name: FINAL GATE - containers + bindings must actually be restored
        if: always()
        run: |
          set -o pipefail
          python3 scripts/verify_container_restore.py
