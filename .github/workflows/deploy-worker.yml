name: Deploy Worker
on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker directory (any dir containing deployed-current.worker.js)'
        required: true
        type: string
        default: 'qnfo-ai'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Cloudflare API (bundle PUT + keep_bindings)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          WORKER='${{ github.event.inputs.worker }}'
          MAIN='worker.js'
          BUNDLE="${WORKER}/deployed-current.worker.js"
          if [ ! -f "$BUNDLE" ]; then
            echo "::error::Missing bundle ${BUNDLE} for worker '${WORKER}'"
            echo 'Available worker dirs with bundles:'
            find . -maxdepth 2 -name deployed-current.worker.js | sed 's|^\./||;s|/deployed-current.worker.js||' | sort
            exit 1
          fi
          echo "Deploying ${WORKER} from ${BUNDLE} (bytes: $(wc -c < "$BUNDLE"))"
          curl -sS -o /tmp/deploy.out -w '%{http_code}' -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F 'metadata={"main_module":"worker.js","keep_bindings":["ai","d1","vectorize","service","secret_text","kv_namespace","r2_bucket"]};type=application/json' \
            -F "${MAIN}=@${BUNDLE};filename=${MAIN};type=application/javascript+module" > /tmp/http.code
          echo "HTTP $(cat /tmp/http.code)"
          if ! python3 -c "import json,sys; d=json.load(open('/tmp/deploy.out')); sys.exit(0 if d.get('success') else 1)"; then
            echo '--- CF response ---'
            cat /tmp/deploy.out
            exit 1
          fi
          echo 'DEPLOY OK'
