name = "qnfo-paper-indexer"
main = "worker.js"
compatibility_date = "2026-08-10"
workers_dev = true
usage_model = "standard"

[[d1_databases]]
binding = "LIVING_PAPER"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[vectorize]]
binding = "PAPER_VZ"
index_name = "qwav-research-v2"

# v2.1 (2026-08-12): [ai] single-table OBJECT form per cloudflare skill v3.47 —
# [[ai]] array form fails wrangler >= 4.118 validation ("field ai should be an object")
[ai]
binding = "AI"

[vars]
INDEX_TOKEN = "chnx-idx-v1-k9m2n4p7r5t8"
