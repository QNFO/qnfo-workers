name: apply-fleetfix-1299-1193

# FLEETFIX-1299-1193 (2026-09-29).
#
# Applies scripts/fleetfix-1299-1193-patch.py to two workers and their
# deployed-current mirrors, commits the result, then deploys BOTH workers with the
# repo's own binding-preserving deployer and re-verifies the LIVE bundles.
#
# WHY /content AND NOT wrangler: scripts/raw_put.py PUTs to the CF API /content
# endpoint, which updates the CODE ONLY and preserves every live binding
# (BINDING-PRESERVATION-1). raw_put.py is fail-closed: it exits 3 and deploys nothing
# on any error, so a partial deploy cannot occur.
#
# #1299 DISSEMINATION-BLUESKY-REPLY-ARITY-1: qnfo-social drainDissemination() passed
#   the embed object into postText()'s REPLY slot (signature is
#   postText(s, text, reply, opts)), so every drained Bluesky post 400'd with
#   'Missing required key "root" at $.record.reply' and the retry sweep is terminal
#   at retry_count=3. Live evidence: dissemination_tracker id=rev-quniverse-fleet-lessons.
#
# #1193 CRON-LASTFIRED-SHARED-TIMESTAMP-1: fleet-exec registered crons=["0 * * * *"]
#   (one tick/hour) while fleet_crons rows 8/13/9/14/11/10 all fired in the same
#   instant despite distinct declared cadences. Cadence -> */10, the maximum allowed
#   by CRON-RATE-CEILING-1 (<=144 fires/24h, >=10-minute spacing).
#
# Cron triggers are NOT part of the /content PUT, so the fleet-exec schedule is
# applied separately against the /schedules endpoint and then read back.
#
# NOTE the commit message is passed as single-line -m flags and never as an inline
# multi-line string: a multi-line `git commit -m "..."` inside a `run: |` block scalar
# puts its continuation lines at column 1, terminates the scalar, and makes the whole
# workflow file invalid YAML -- the documented defect that made the earlier
# apply-ops-patch.yml create runs with zero jobs (see the note in mirror-sync.yml).

on:
  push:
    paths:
      - 'scripts/fleetfix-1299-1193-patch.py'
      - '.github/workflows/apply-fleetfix-1299-1193.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-fleetfix-1299-1193
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply patch (fail-closed)
        id: apply
        run: |
          set -euo pipefail
          python3 scripts/fleetfix-1299-1193-patch.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no change produced"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Verify the deployed-current mirrors stay in sync
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 scripts/mirror-guard.py

      - name: Cron rate ceiling gate (CRON-RATE-CEILING-1)
        run: |
          set -euo pipefail
          python3 scripts/cron_rate_guard.py

      - name: Commit and push to the triggering branch
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "qnfo-fleetfix-bot"
          git config user.email "ops@qnfo.org"
          git add -u
          if git diff --cached --quiet; then
            echo "nothing staged; exiting"
            exit 0
          fi
          git diff --cached --stat
          SUBJECT="fix(dissem+cron): #1299 Bluesky reply arity, #1193 fleet-exec cadence"
          BODY="#1299 drainDissemination passed the embed object as postText()'s reply argument, so every drained Bluesky post 400'd with 'Missing required key root at \$.record.reply' and rows stalled permanently at retry_count=3; the embed now goes to the opts slot. #1193 fleet-exec registered crons=[0 * * * *] while six fleet_crons rows fired in one shared instant; cadence is now */10, the CRON-RATE-CEILING-1 maximum. Both worker.js sources and their deployed-current mirrors move in the same commit so mirror-guard stays green."
          FOOT="Co-authored-by: Chatbox <chatbox@chatboxai.com>"
          git commit -m "$SUBJECT" -m "$BODY" -m "$FOOT"
          git push origin "HEAD:${{ github.ref_name }}"

  deploy:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight - artifacts must carry both fixes
        run: |
          set -euo pipefail
          test "$(grep -cF 'postText(s, text, null, { embed:' qnfo-social/worker.js)" = "1"
          test "$(grep -cF 'fleet-executor/0.3.2' fleet-exec/worker.js)" = "1"
          test "$(grep -cF 'crons = ["*/10 * * * *"]' fleet-exec/wrangler.toml)" = "1"
          cmp qnfo-social/worker.js qnfo-social/deployed-current.worker.js
          cmp fleet-exec/worker.js fleet-exec/deployed-current.worker.js
          echo "preflight OK: both fixes present, mirrors byte-identical"

      - name: Deploy qnfo-social (binding-preserving CF API /content PUT)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/raw_put.py qnfo-social qnfo-social/worker.js

      - name: Deploy fleet-exec (binding-preserving CF API /content PUT)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/raw_put.py fleet-exec fleet-exec/worker.js

      - name: Apply fleet-exec cron schedule (*/10)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/fleet-exec/schedules" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '[{"cron":"*/10 * * * *"}]' -o /tmp/sched.json
          cat /tmp/sched.json
          grep -q '"success":true' /tmp/sched.json
          echo "cron schedule applied"

      - name: Verify LIVE bundles carry both fixes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for w in qnfo-social fleet-exec; do
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$w/content" \
              -o "/tmp/$w.live.js"
            echo "$w live-bytes=$(wc -c < "/tmp/$w.live.js")"
          done
          test "$(grep -cF '0.7.16-dissem-reply-arity' /tmp/qnfo-social.live.js)" -ge 1
          test "$(grep -cF 'fleet-executor/0.3.2' /tmp/fleet-exec.live.js)" -ge 1
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/fleet-exec/schedules" \
            -o /tmp/sched-readback.json
          cat /tmp/sched-readback.json
          grep -qF '*/10 * * * *' /tmp/sched-readback.json
          echo "VERIFIED: live qnfo-social carries 0.7.16-dissem-reply-arity, live fleet-exec carries fleet-executor/0.3.2 and the */10 schedule"
