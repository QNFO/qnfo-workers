name: windows-suite-parity

# WINDOWS-SUITE-PARITY-1 (agent_issues 2832, pillar core): the offline suite set passed 429 of 429 on the ubuntu gate while the same commit
# failed 124 suites on the owner's Windows box on 2026-10-17 (a node:sqlite ?N binding shim, CRLF in generated fixtures) and 10 on
# 2026-10-18 with node 24 (a filesystem path where a URL is required, CRLF in a migration body, a suite that reads the network).
# Nothing measured the difference on a runner, so "a local red means red" could not be checked. This workflow runs
# `node scripts/run-suites.mjs --all` on windows-latest under node 22 and node 24 and REPORTS the failing suites in the job summary.
# It is advisory for merging: the workflow is not a required check and the gate stays the ubuntu run in deploy-gate.yml, so a
# Windows-only failure never blocks a merge. WINDOWS-PARITY-PROBE-1 (2026-10-20): its CONCLUSION now reports parity. Until then the run
# step was continue-on-error and the job always ended green, so run 2 of 2026-10-19 read success with 4 suites red on both legs
# (576 passed, 4 failed), and nothing could probe a result that lived only in the job summary. The run step still continues on error and
# the summary is unchanged; a last step turns the run red when the runner exit code was not 0 or any suite failed. Success therefore
# means both node legs ran every suite with an empty failing list, failure means a Windows-only red. The issue is done when a run
# is green: the contract issue-2832 (migrations/2026-10-19-windows-parity-probe.sql) reads the latest completed run on main
# through the public GitHub API each hour. Runs before this change report nothing and are left out by a creation date in that probe.
# No secrets and no network credentials are used; nothing is uploaded: the report is the job summary and the run conclusion.
# Triggers: manual dispatch, and a push to main that changes the runner itself (scripts/run-suites.mjs) or this file. No schedule
# (CRON-HOURLY-FLOOR-1 does not apply: it declares no cron). Step names are colon-free (WORKFLOW-YAML-LINT-1). The probe reads the latest
# completed run, so a fix to a Windows-red suite is seen once this workflow runs again: dispatch it after the fix lands.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/run-suites.mjs"
      - ".github/workflows/windows-suite-parity.yml"

permissions:
  contents: read

concurrency:
  group: windows-suite-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: suites on windows (node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Run every offline suite
        id: suites
        continue-on-error: true
        run: |
          set +e
          node --version
          git config --show-origin core.autocrlf || echo "core.autocrlf is unset"
          node scripts/run-suites.mjs --all --jobs 4 > suite-report.txt 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          # ANNOTATION-FIXTURE-QUIET-1 (2026-10-20): the report holds the suites' own stdout, and a suite that replays a failure prints
          # `::error::fallback deploy failed for c` (scripts/direct_content_deploy.py); echoing the tail made it an error annotation on
          # each leg. The summary below writes to a file, which the runner does not read for commands.
          bash scripts/stop-commands.sh tail -n 25 suite-report.txt
          exit $rc
      - name: Report the failing suites
        if: always()
        run: |
          rc="${{ steps.suites.outputs.exit_code }}"
          oks=0
          fails=0
          if [ -f suite-report.txt ]; then
            oks=$(grep -c '^ok ' suite-report.txt || true)
            fails=$(grep -c '^FAIL ' suite-report.txt || true)
          fi
          {
            echo "### windows suite parity, node ${{ matrix.node }}"
            echo ""
            echo "run-suites exit code: ${rc:-none, the runner did not finish}"
            echo "core.autocrlf: $(git config core.autocrlf || echo unset)"
            echo "${oks:-0} suites ok, ${fails:-0} failed"
            echo ""
            echo "failing suites:"
            echo '```'
            if [ -f suite-report.txt ]; then grep '^FAIL ' suite-report.txt | head -60 || true; fi
            echo '```'
            echo ""
            echo "last lines of the runner output:"
            echo '```'
            if [ -f suite-report.txt ]; then tail -n 12 suite-report.txt; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # WINDOWS-PARITY-DIAG-1 (2026-10-20, agent_issues 100324 and 2832): the run step above keeps only a 25-line tail in the log, and the
          # failing list lived only in the job summary, which the REST API and the log tool cannot read, so a red run named no suite. The
          # runner prints one `FAIL <ms> ms <suite>` line per failing suite and a group with the last 40 lines of its output; the names go out
          # as ONE annotation (suite paths only, no fixture text, so it is a signal and not noise) and the groups go to the log with workflow
          # commands off, because a suite that replays a failure prints `::error::` lines of its own.
          if [ -f suite-report.txt ]; then
            names=$(grep -E '^FAIL +[0-9]+ ms ' suite-report.txt | sed -E 's/^FAIL +[0-9]+ ms +//' | tr -d '\r' | tr '\n' ' ' | cut -c1-1500)
            if [ -n "$names" ]; then echo "::error title=windows suite parity node ${{ matrix.node }}::failing suites: $names"; fi
            sed -n '/^::group::FAIL /,/^::endgroup::/p' suite-report.txt | head -600 > failed-suites.txt
            bash scripts/stop-commands.sh cat failed-suites.txt
          fi
      - name: Fail the run when a suite is red on Windows
        if: always()
        run: |
          rc="${{ steps.suites.outputs.exit_code }}"
          fails=0
          if [ -f suite-report.txt ]; then
            fails=$(grep -c '^FAIL ' suite-report.txt || true)
          fi
          if [ "$rc" != "0" ] || [ "${fails:-0}" -gt 0 ]; then
            echo "windows suite parity is red on node ${{ matrix.node }}, run-suites exit code ${rc:-none}, ${fails:-0} failing suites"
            exit 1
          fi
          echo "windows suite parity is green on node ${{ matrix.node }}, every suite passed and the failing list is empty"
