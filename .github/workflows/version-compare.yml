name: version-compare

# Fails when the fleet version comparator stops being fail-closed.
#
# Origin: 2026-09-13 fleet error audit. The live deploy control plane was issuing
# an hourly redeploy of a healthy worker against a LOWER version:
#   fleet_drift_report  personal-companion  deployed=v1.1.0 canonical=1.0.0
#   fleet_deploys       personal-companion  v1.1.0 -> 1.0.0  ok=0  (x30)
# Cause: a leading "v" makes parseInt("v1") NaN -> 0, so "v1.1.0" parsed as
# [0,1,0] and was judged behind "1.0.0" = [1,0,0]. Production was independently
# confirmed healthy at v1.1.0 (https://reading.q08.org/health).
#
# qnfo-fleet-control/version-compare.mjs is the corrected comparator. Its
# load-bearing rule is rule 5: equal numeric cores with DIFFERING suffixes are
# UNORDERABLE, not ordered. A naive semver rule (release > prerelease) would
# order "3.6.1" ABOVE "3.6.1-subscribers" and downgrade the live gateway
# (fleet_status=3.6.1-subscribers, registry=3.6.1), and would order "1.14.1"
# above "1.14.1-gtd-guard" and strip the cloud-ops guard. The suffix is a
# build/feature label with no defined direction, so "do not act" is the only
# safe answer.
#
# This suite is the regression lock for that rule. It is NOT wired into the live
# deployer yet (qnfo-fleet-control/worker.js is 75,875 B, above the 32,768-char
# read cap of the ops endpoint, so the wiring patch could not be validated).
# Pinning the module now means the wiring cannot land against a comparator that
# has silently reverted to semver ordering.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the comparator suite
        run: node qnfo-fleet-control/version-compare.test.mjs

      - name: Assert the fail-closed invariants explicitly
        # The suite exits non-zero on failure, but assert the two properties that
        # cause real damage if they regress, so the failure mode is named in CI.
        run: |
          set -euo pipefail
          out=$(node qnfo-fleet-control/version-compare.test.mjs)
          echo "$out"

          echo "$out" | grep -q "0 failed" \
            || { echo "::error::comparator suite reported failures"; exit 1; }

          # A naive semver rule would order these; they must stay UNORDERABLE.
          node --input-type=module -e '
            import { compareVersions, deployDecision, UNORDERABLE } from "./qnfo-fleet-control/version-compare.mjs";
            const bad = [];
            const mustBeUnorderable = [
              ["3.6.1-subscribers", "3.6.1"],
              ["1.14.1", "1.14.1-gtd-guard"],
              ["2.1.0", "qnfo-qwav/fabric-20260910"],
            ];
            for (const [a, b] of mustBeUnorderable) {
              if (compareVersions(a, b) !== UNORDERABLE) bad.push(`not UNORDERABLE: ${a} vs ${b}`);
            }
            const mustNotAct = [
              ["v1.1.0", "1.0.0", "the personal-companion downgrade"],
              ["v2.0.0", "1.9.9", "a v-prefixed genuine downgrade"],
            ];
            for (const [deployed, canonical, why] of mustNotAct) {
              const d = deployDecision(deployed, canonical);
              if (d !== "no-act") bad.push(`expected no-act for ${deployed} -> ${canonical} (${why}), got ${d}`);
            }
            if (bad.length) { console.error(bad.join("\n")); process.exit(1); }
            console.log("fail-closed invariants hold");
          '
