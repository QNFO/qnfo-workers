name = "idea-hub"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Bindings verified from live CF API 2026-09-13 (BINDING-PRESERVATION-1)
[[services]]
binding = "AGENT_ORCH"
service = "qnfo-agent-orchestrator"
environment = "production"

[ai]
binding = "AI"

[[d1_databases]]
binding = "LIVING_PAPER"
database_name = "living-paper"
database_id = "70a58cb3-b2cd-498d-877f-ecca86859a22"

[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

# Secrets (set via wrangler secret put):
# SYNC_TOKEN

# PAPER_VZ -> qwav-research-v2 (768-dim, bge-base-en-v1.5) — Ask QNFO RAG (replaces retired qnfo-qwav)
[[vectorize]]
binding = "PAPER_VZ"
index_name = "qwav-research-v2"

[triggers]
crons = ["0 */6 * * *"]
