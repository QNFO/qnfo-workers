name: apply-preserve-worker-meta-fix

# PRESERVE-WORKER-METADATA-1 applier + deploy runner (issue #1487).
#
# ROOT CAUSE: qnfo-ops cfWorkerDeploy() rebuilt deploy metadata from GET /bindings
# only, so worker-LEVEL metadata (containers, migrations, limits, observability,
# logpush, placement, tail_consumers, assets) was silently STRIPPED on every deploy
# through that path. Observed 2026-09-29: deployment_history id 172 redeployed
# qnfo-containers-pilot at 19:30:35Z; the first
# "Cannot read properties of undefined (reading 'running')" row landed 19:30:43Z,
# 8 seconds later, and every container tool returned HTTP 500 (outage #1485).
#
# DEPLOY PATH IS DELIBERATE: scripts/raw_put.py uses PUT /content, which replaces
# the module while PRESERVING settings/metadata. cf_worker_deploy is the stripper.
# This workflow therefore deploys via raw_put.py and NEVER via cf_worker_deploy.

on:
  push:
    paths:
      - 'scripts/cf-worker-deploy-preserve-meta-patch.py'
      - '.github/workflows/apply-preserve-worker-meta-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-preserve-worker-meta-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      applied: ${{ steps.push.outputs.applied }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Show pre-state
        run: |
          set -euo pipefail
          echo "head=$(git rev-parse --short HEAD)"
          echo "versions:"; grep -o 'var VERSION = "[^"]*"' qnfo-ops/worker.js || true
          echo "marker_count=$(grep -c 'PRESERVE-WORKER-METADATA-1' qnfo-ops/worker.js || true)"

      - name: Apply
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 scripts/cf-worker-deploy-preserve-meta-patch.py

      - name: Syntax gate (real ESM check)
        run: |
          set -euo pipefail
          cp qnfo-ops/worker.js /tmp/w.mjs
          node --check /tmp/w.mjs
          echo "ESM_OK"

      - name: Content gate
        run: |
          set -euo pipefail
          grep -q 'PRESERVE-WORKER-METADATA-1' qnfo-ops/worker.js || { echo "::error::marker missing"; exit 1; }
          grep -q 'var VERSION = "2.37.29-preserve-worker-meta";' qnfo-ops/worker.js || { echo "::error::version not bumped"; exit 1; }
          if grep -q 'var VERSION = "2.37.28-affirm-veto";' qnfo-ops/worker.js; then
            echo "::error::stale version literal survived"; exit 1
          fi
          grep -q '_preservedMeta' qnfo-ops/worker.js || { echo "::error::preserved-meta plumbing missing"; exit 1; }
          grep -q 'PRESERVE-WORKER-METADATA-1: source references ctx.container' qnfo-ops/worker.js || { echo "::error::fail-closed container guard missing"; exit 1; }
          # the stripper form must be gone: metadataPart must now spread _preservedMeta
          grep -q '_compatFlags } : {}, Object.keys(_exports).length ? { exports: _exports } : {}, _preservedMeta));' qnfo-ops/worker.js || { echo "::error::metadataPart still strips worker-level metadata"; exit 1; }
          echo "CONTENT_GATE_OK"

      - name: Mirror gate
        run: |
          set -euo pipefail
          grep -q 'PRESERVE-WORKER-METADATA-1' qnfo-ops/deployed-current.worker.js || { echo "::error::mirror not patched"; exit 1; }
          cmp qnfo-ops/worker.js qnfo-ops/deployed-current.worker.js && echo "MIRROR_PARITY_OK"

      - name: Commit and push (race-safe)
        id: push
        run: |
          set -euo pipefail
          git config user.name "qnfo-selfheal-bot"
          git config user.email "fleet-bot@qnfo.org"
          git add qnfo-ops/worker.js qnfo-ops/deployed-current.worker.js
          if git diff --cached --quiet; then
            echo "nothing to commit - already applied"
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "fix(qnfo-ops): #1487 cf_worker_deploy no longer strips worker-level metadata (PRESERVE-WORKER-METADATA-1)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "PUSH_OK attempt=$i"
              echo "applied=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((i * 3))
          done
          echo "::error::push failed after 5 attempts"
          exit 1

  deploy:
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.apply.outputs.sha }}

      - name: Confirm deployed revision carries the fix
        run: |
          set -euo pipefail
          echo "deploying sha=${{ needs.apply.outputs.sha }}"
          grep -q 'var VERSION = "2.37.29-preserve-worker-meta";' qnfo-ops/worker.js || { echo "::error::checked-out revision lacks the fix"; exit 1; }

      - name: Deploy via SAFE path (raw_put.py -> PUT /content)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 scripts/raw_put.py qnfo-ops qnfo-ops/worker.js

      - name: Live readback gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/qnfo-ops/content" \
              -o /tmp/live.js
            if grep -q '2.37.29-preserve-worker-meta' /tmp/live.js; then
              echo "LIVE_VERIFIED version=2.37.29-preserve-worker-meta attempt=$i bytes=$(wc -c < /tmp/live.js)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::live qnfo-ops does not serve 2.37.29-preserve-worker-meta"
          exit 1
