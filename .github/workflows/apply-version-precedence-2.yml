name: apply-version-precedence-2

# VERSION-PRECEDENCE-2-MULTI-DECLARATION-1 (issue #1388).
#
# Self-applying applier. Patches scripts/deploy-drift-guard.py so the repo<->live version
# resolver stops reading the FIRST of two `const VERSION` declarations in a concatenated
# artifact (fleet-exec: line 7 "fleet-executor/0.3.2" vs line 186 "1.0.2" = the value
# /health serves), which produced a permanent false DRIFT row on a canonical deploy target.
#
# Trigger is `push` on this workflow's own two paths, so the commit that adds it self-fires
# the run, plus workflow_dispatch as a manual fallback. No cron is declared -- the
# `schedule` event has never fired on this repository (SCHEDULE-EVENT-NEVER-FIRES-1), so a
# cron-only writer would never run. Step names carry no unquoted colon
# (WORKFLOW-YAML-LINT-1). The commit-back message carries [skip ci] so the patch cannot
# re-trigger this workflow.

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-version-precedence-2.py
      - .github/workflows/apply-version-precedence-2.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-version-precedence-2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the VERSION-PRECEDENCE-2 patch
        run: python3 scripts/patch-version-precedence-2.py

      - name: Verify the patched resolver
        run: python3 scripts/patch-version-precedence-2.py --verify-only

      - name: Publish status artifact
        if: always()
        run: |
          mkdir -p ci-status
          printf '{\n  "workflow": "apply-version-precedence-2",\n  "defect": "VERSION-PRECEDENCE-2-MULTI-DECLARATION-1",\n  "issue": 1388,\n  "head": "%s",\n  "ts": "%s"\n}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci-status/version-precedence-2.json
          cat ci-status/version-precedence-2.json

      - name: Commit back the patched guard
        run: |
          if git diff --quiet -- scripts/deploy-drift-guard.py ci-status/version-precedence-2.json; then
            echo "no diff - patch already applied, nothing to commit"
            exit 0
          fi
          git config user.name "qnfo-fleet-bot"
          git config user.email "fleet-bot@qnfo.org"
          git add scripts/deploy-drift-guard.py ci-status/version-precedence-2.json
          git commit -m "fix(drift-guard): VERSION-PRECEDENCE-2-MULTI-DECLARATION-1 - last plain VERSION wins (issue #1388) [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "commit-back pushed on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "commit-back failed after 5 attempts"
          exit 1

      - name: Re-dispatch the fleet audit
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run fleet-autodeploy.yml -f mode=audit
