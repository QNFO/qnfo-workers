name: restore-container-config-exec

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-container-config-exec.yml'
      - 'scripts/restore_container_config.py'
      - 'qnfo-containers-pilot/wrangler.toml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-container-config-exec
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: qnfo-containers-pilot
      PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: credential presence gate (names only, never values)
        id: creds
        run: |
          set -uo pipefail
          ok=yes
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "::error::CLOUDFLARE_API_TOKEN is empty"; ok=no; fi
          if [ -z "${CF_ACCOUNT_ID:-}" ]; then echo "::warning::CLOUDFLARE_ACCOUNT_ID empty - script falls back to its hardcoded account"; fi
          echo "has_api_token=$([ -n "${CLOUDFLARE_API_TOKEN:-}" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "has_pilot_token=$([ -n "${PILOT_TOKEN:-}" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "gate=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" = yes ] || exit 1

      - name: snapshot BEFORE (settings + bindings)
        id: before
        continue-on-error: true
        run: |
          set -uo pipefail
          ACCT="${CF_ACCOUNT_ID:-edb167b78c9fb901ea5bca3ce58ccc4b}"
          UA="QNFO-fleet-ci/1.0 (+https://qnfo.org; restore-container-config-exec)"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "User-Agent: $UA" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/scripts/$WORKER/settings" \
            -o /tmp/before_settings.json || true
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "User-Agent: $UA" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/scripts/$WORKER/bindings" \
            -o /tmp/before_bindings.json || true
          echo "--- BEFORE /settings (containers field) ---"
          python3 -c "import json;d=json.load(open('/tmp/before_settings.json'));r=d.get('result') or {};print(json.dumps({'success':d.get('success'),'containers':r.get('containers'),'compatibility_date':r.get('compatibility_date'),'bindings':[b.get('name') for b in (r.get('bindings') or [])]}))" || cat /tmp/before_settings.json
          echo "--- BEFORE /bindings ---"
          python3 -c "import json;d=json.load(open('/tmp/before_bindings.json'));print(json.dumps([b.get('name') for b in (d.get('result') or [])]))" || cat /tmp/before_bindings.json

      - name: run restore_container_config.py
        id: restore
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/restore_container_config.py 2>&1 | tee /tmp/restore.log
          rc=${PIPESTATUS[0]}
          echo "restore_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "restore_rc=$rc"

      - name: snapshot AFTER (settings + bindings + /status)
        id: after
        continue-on-error: true
        run: |
          set -uo pipefail
          ACCT="${CF_ACCOUNT_ID:-edb167b78c9fb901ea5bca3ce58ccc4b}"
          UA="QNFO-fleet-ci/1.0 (+https://qnfo.org; restore-container-config-exec)"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "User-Agent: $UA" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/scripts/$WORKER/settings" \
            -o /tmp/after_settings.json || true
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "User-Agent: $UA" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/scripts/$WORKER/bindings" \
            -o /tmp/after_bindings.json || true
          echo "--- AFTER /settings (containers field) ---"
          python3 -c "import json;d=json.load(open('/tmp/after_settings.json'));r=d.get('result') or {};print(json.dumps({'success':d.get('success'),'containers':r.get('containers'),'compatibility_date':r.get('compatibility_date'),'bindings':[b.get('name') for b in (r.get('bindings') or [])]}))" || cat /tmp/after_settings.json
          echo "--- AFTER /bindings ---"
          python3 -c "import json;d=json.load(open('/tmp/after_bindings.json'));print(json.dumps([b.get('name') for b in (d.get('result') or [])]))" || cat /tmp/after_bindings.json
          echo "--- /health ---"
          curl -s -o /tmp/health.json -w 'http=%{http_code}\n' https://$WORKER.q08.workers.dev/health || true
          cat /tmp/health.json || true
          echo
          echo "--- /status (authenticated, if token) ---"
          if [ -n "${PILOT_TOKEN:-}" ]; then
            curl -s -o /tmp/status.json -w 'http=%{http_code}\n' -H "Authorization: Bearer $PILOT_TOKEN" https://$WORKER.q08.workers.dev/status || true
            cat /tmp/status.json || true
          else
            echo "PILOT_TOKEN absent - /status probe skipped (informational only)"
          fi
          echo

      - name: publish outcome artifact (rc + full log + before/after)
        if: always()
        run: |
          set -uo pipefail
          mkdir -p ci-status
          j() { python3 -c 'import json,sys;print(json.dumps(open(sys.argv[1]).read()[-8000:]))' "$1" 2>/dev/null || echo '""'; }
          jf() { python3 -c 'import json,sys;print(json.dumps(open(sys.argv[1]).read()[-2000:]))' "$1" 2>/dev/null || echo '""'; }
          cat > ci-status/restore-container-config-exec.json <<JSON
          {
            "workflow": "restore-container-config-exec",
            "issue": 1485,
            "restore_rc": "${{ steps.restore.outputs.restore_rc }}",
            "has_api_token": "${{ steps.creds.outputs.has_api_token }}",
            "has_pilot_token": "${{ steps.creds.outputs.has_pilot_token }}",
            "before_settings": $(jf /tmp/before_settings.json),
            "after_settings": $(jf /tmp/after_settings.json),
            "restore_log_tail": $(j /tmp/restore.log),
            "health": $(jf /tmp/health.json),
            "status": $(jf /tmp/status.json),
            "head": "$GITHUB_SHA",
            "ts": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          python3 -c "import json;json.load(open('ci-status/restore-container-config-exec.json'))" \
            && echo "artifact is valid JSON" \
            || { echo "::error::artifact is not valid JSON"; exit 1; }
          cat ci-status/restore-container-config-exec.json

      - name: commit outcome artifact
        if: always()
        run: |
          set -uo pipefail
          git config user.name "qnfo-ci"
          git config user.email "ci@qnfo.org"
          git add ci-status/restore-container-config-exec.json || true
          git commit -m "chore(ci): restore-container-config-exec outcome" || true
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push origin HEAD:main; then echo "PUSH OK"; exit 0; fi
            sleep $((i*3))
          done
          echo "::warning::outcome artifact not pushed after retries"
          exit 0

      - name: summarize
        if: always()
        run: |
          {
            echo "## restore-container-config-exec"
            echo ""
            echo "restore_rc=\`${{ steps.restore.outputs.restore_rc }}\` (0 = containers restored, 3 = fail-closed, nothing mutated)"
            echo ""
            echo "Authoritative signal is \`restore_rc\`, not the presence of a green checkmark."
          } >> "$GITHUB_STEP_SUMMARY"
