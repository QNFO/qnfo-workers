name = "q08-signal-engine"
main = "worker.js"
# COMPAT-ADVANCE-WAVE-2 (2026-10-12, metric workers_compat_date_behind, qnfo-ops COMPAT-DATE-DECLARED-APPLY-1): the date moves
# from 2026-08-01 to 2026-10-10 on the next canonical deploy. Reviewed against qnfo-ops COMPAT_FLIPS between the two dates:
# 2026-08-04 nodejs_compat default on (this worker reads no timer id as a number, has no typeof process/Buffer branch and
# imports no node: module);
# 2026-10-01 Durable Object eviction (no Durable Object here). /ops/deploy reads /health through its
# COMPAT-HEALTH-BINDINGS-2 binding before the upload, keeps the date only when /health answers with the deployed VERSION
# and otherwise restores the previous date (deployment_history compat-restore).
# compat-advance: reviewed 2026-10-12
compatibility_date = "2026-10-10"
workers_dev = true

# Q08-ROUTE-1 (2026-09-26): q08.org/* and www.q08.org/* MUST be Workers routes to this
# worker. They were documented in README since 2026-09-14 but never declared here, so the
# hostnames kept resolving to the qnfo-hub Pages custom domain (audit_pages id=11,
# status=active) and q08.org served the generic QNFO hub template with a catch-all 200.
# Declaring them makes the next `wrangler deploy` install the routes. The qnfo-hub Pages
# custom domains for these hostnames must then be detached (zone/Pages-level API, not in
# repo scope) or the route will not win.
#
# NOTE for CI: deploy_gate.py runs `wrangler deploy --dry-run` for changed dirs; if
# CLOUDFLARE_API_TOKEN lacks q08.org zone access the dry-run may fail here. That failure
# is the point -- it surfaces the missing zone permission rather than hiding it.
#
# ADVERSE-EFFECT WARNING (2026-09-29, qnfo-ops): adding a route for a hostname that is
# still an active Pages custom domain can make the *deploy itself* fail on hostname
# conflict. If that happens, revert this block and fix the Pages domain first.
routes = [
  { pattern = "q08.org/*", zone_name = "q08.org" },
  { pattern = "www.q08.org/*", zone_name = "q08.org" }
]

# Native Email Routing send binding — tokenless (no EMAIL_API_KEY needed).
# Proven pattern from qnfo-outreach. q08.org Email Routing is enabled/ready.
# NOTE: must be a TOP-LEVEL key (before any [table]) or TOML scopes it away.
send_email = [
  { name = "SEND_EMAIL" }
]


# Q08-FORECAST-PROMOTE-1 (owner directive 2026-10-09): queue each published forecast (only forecasts) for qnfo-social's
# cross-post. "0" stops it; essays stay held by Q08_SOCIAL_QUEUE (Q08-PERSONAL-CHANNEL-HOLD-1).
[vars]
Q08_SOCIAL_FORECASTS = "1"
Q08_SOCIAL_ESSAYS = "1"

[observability]
enabled = true
head_sampling_rate = 1

# WORKERS-STANDARDS-1 (owner standards 2026-10-12): logs and traces declared. Workers docs: `enabled` alone turns on logs only;
# traces need [observability.traces]. Traces are sampled at the default rate of 1.
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

head_sampling_rate = 0.05 # TRACES-SAMPLING-BEFORE-BILLING-1: stored traces bill from 2026-12-01
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "q08-signal"
database_id = "10fd74b7-c4b3-43c7-9ca5-855213f44a69"

# Shared distribution queue: qnfo-social reads social_threads and cross-posts
# to Bluesky + Buffer (Mastodon/LinkedIn/X). Tokenless cross-worker handoff.
[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[[services]]
binding = "EMAIL"
service = "qnfo-email"
environment = "production"

[triggers]
crons = ["0 * * * *", "30 * * * *", "0 17 * * *"]
