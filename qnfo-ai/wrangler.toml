name = "qnfo-ai"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# CRITICAL FIX (v4.3.0): v4.2.0 was deployed WITHOUT this binding ->
# env.AI undefined -> all tier-0 Workers AI free models returned
# "All models failed." while DeepSeek API (secret) worked.
# NOTE: wrangler 4.118.0 validates the ai field as a SINGLE table object
# ("should be an object but got [array]") — [ai] not [[ai]].
[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1


# v4.4.0 — internal RAG (/v1/search) + query history (/v1/history)
# PAPER_VZ -> qwav-research-v2 (768-dim, bge-base-en-v1.5) — same index qnfo-archive uses
[[vectorize]]
binding = "PAPER_VZ"
index_name = "qwav-research-v2"

# v4.5.0 — restore zero-latency query logging -> qnfo-ai-log (semantic recall of past queries)
[[vectorize]]
binding = "LOG_VZ"
index_name = "qnfo-ai-log"

# QNFO_AUDIT -> qnfo-audit D1 (ai_queries table) for /v1/history
[[d1_databases]]
binding = "QNFO_AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"
