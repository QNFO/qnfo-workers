name: apply-github-write-409-retry

# GITHUB-FILE-WRITE-409-NO-RETRY-1 (issue 1372, 2026-09-29). See
# scripts/github-write-409-retry-patch.py for the full defect record.
#
# SUMMARY: github_file_write() -- the ops endpoint's own commit tool, and the tool every
# apply-* repair path depends on -- issued a SINGLE contents PUT with no re-read of the head
# sha and no retry. Verified live 2026-09-29 from the endpoint's own telemetry rate table:
# 18 errors / 64 successes = 21.95% failure rate, the highest of any write tool, because
# multiple fleet agents push to this repo every few minutes and the caller's blob sha is
# stale by the time the PUT lands (HTTP 409).
#
# EQUIVALENCE-AWARE (v2, 2026-09-29): the repair is already live, landed by a concurrent
# fleet agent under a DIFFERENT marker (GITHUB-409-RETRY-1) and version (2.37.22-github409-retry).
# The guard script now detects the defect class (any known marker, or the behavioural
# bounded-attempts/409-422 signature inside githubFileWrite) and NO-OPS with exit 0 on an
# already-repaired artifact. Both marker checks below therefore accept EITHER marker: an
# exact-marker grep under `set -e` returns 0 matches -> exit 1 -> a false red run.
#
# FAILURE-ARTIFACT-LOSS-1 (2026-09-29, issue 1381): this workflow used to pair an
# `if: always()` publish step with a commit-back that early-exits whenever
# job.status != success. The result was that the status artifact of a FAILED run -- the
# one run whose outcome most needs reading, because ci-status/*.json is the only outcome
# channel reachable without the GitHub Actions API -- was written inside the runner and
# then discarded with it. The commit-back is now SPLIT: the artifact is persisted on
# every run (always), while the source+mirror commit-back stays green-only so the repo
# can never run ahead of live. scripts/workflow-lint.py now gates both properties.
#
# This workflow mirrors the repository's established apply-* convention:
#   1. patch the artifact (idempotent, fail-closed, equivalence-aware)
#   2. verify it still parses as an ES module and that the repo/mirror pair is byte-identical
#   3. deploy with the canonical binding-preserving deployer (scripts/raw_put.py ->
#      CF API /content PUT; BINDING-PRESERVATION-1 + COMPAT-PRESERVE-1 -- a wrangler deploy
#      would drop qnfo-ops's 49 live bindings)
#   4. verify the live bundle carries the expected VERSION and a retry marker (bounded retry;
#      CF /content is eventually consistent, DEPLOY-VERIFY-RACE-1)
#   5. publish a machine-readable status artifact so the outcome is verifiable through the
#      GitHub contents API without the Actions API
#   6. commit back race-safely -- artifact always, source only when green
#
# YAML SAFETY: every step name containing a colon is quoted. An unquoted colon-space inside a
# plain scalar is a parse error that makes GitHub create zero-job runs (WORKFLOW-YAML-LINT-1,
# hit twice on 2026-09-29). scripts/workflow-lint.py gates the class.
#
# NO CRON: SCHEDULE-EVENT-NEVER-FIRES-1 -- the GitHub schedule event has never fired on this
# repository, so this workflow declares none. It fires on push and on manual dispatch.

on:
  push:
    branches: [main]
    paths:
      - "scripts/github-write-409-retry-patch.py"
      - ".github/workflows/apply-github-write-409-retry.yml"
  workflow_dispatch:

concurrency:
  group: apply-github-write-409-retry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  patch-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Patch githubFileWrite retry (fail-closed, idempotent, equivalence-aware)
        id: guard
        run: python3 scripts/github-write-409-retry-patch.py

      - name: Verify artifact parses as an ES module
        run: |
          set -euo pipefail
          cp qnfo-ops/worker.js /tmp/ops.mjs
          node --check /tmp/ops.mjs
          echo "syntax OK"
          ok=0
          for M in GITHUB-409-RETRY-1 GITHUB-FILE-WRITE-409-NO-RETRY-1; do
            if grep -qF "$M" qnfo-ops/worker.js; then echo "retry marker present: $M"; ok=1; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::RETRY-MARKER-ABSENT no known 409-retry marker found in qnfo-ops/worker.js"
            exit 1
          fi

      - name: Verify source/mirror parity (blocking)
        run: |
          set -euo pipefail
          cmp qnfo-ops/worker.js qnfo-ops/deployed-current.worker.js
          echo "source and deployed-current mirror are byte-identical"

      - name: Deploy qnfo-ops (binding-preserving CF API /content PUT)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/raw_put.py qnfo-ops qnfo-ops/worker.js

      - name: "Verify live VERSION and retry marker (bounded retry - /content is eventually consistent)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          V=$(grep -o 'var VERSION = "[^"]*";' qnfo-ops/worker.js | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "expect=$V"
          ok=0
          for i in $(seq 1 12); do
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/qnfo-ops/content" \
              -o /tmp/live.js || true
            bytes=$(wc -c < /tmp/live.js 2>/dev/null || echo 0)
            has_v=$(grep -cF "$V" /tmp/live.js 2>/dev/null || true)
            has_m=0
            for M in GITHUB-409-RETRY-1 GITHUB-FILE-WRITE-409-NO-RETRY-1; do
              if grep -qF "$M" /tmp/live.js 2>/dev/null; then has_m=1; fi
            done
            echo "attempt=$i bytes=$bytes expect=$V has_version=$has_v has_marker=$has_m"
            if [ "${has_v:-0}" -ge 1 ] && [ "$has_m" = "1" ]; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::VERIFY-FAILED live qnfo-ops did not converge to $V with a retry marker within 12 attempts (~3 min)"
            exit 1
          fi

      - name: Publish machine-readable status
        if: always()
        run: |
          set -uo pipefail
          mkdir -p ci-status
          cat > ci-status/github-write-409-retry.json <<EOF
          {
            "workflow": "apply-github-write-409-retry",
            "issue": "1372 / GITHUB-FILE-WRITE-409-NO-RETRY-1",
            "guard_exit": "${{ steps.guard.outcome }}",
            "job_status": "${{ job.status }}",
            "head": "${{ github.sha }}",
            "ts": "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          }
          EOF
          cat ci-status/github-write-409-retry.json

      - name: "Persist status artifact (always - a FAILED run's outcome must be readable)"
        if: always()
        run: |
          set -uo pipefail
          git config user.name  "qnfo-fleet-bot"
          git config user.email "fleet-bot@qnfo.org"
          git add ci-status/github-write-409-retry.json
          if git diff --cached --quiet; then
            echo "no status artifact change to commit"
            exit 0
          fi
          git commit -m "chore(ci-status): apply-github-write-409-retry outcome=${{ job.status }} [skip ci]"
          for i in 1 2 3 4 5; do
            echo "artifact commit attempt $i"
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "status artifact persisted on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "::error::ARTIFACT-COMMIT-FAILED after 5 attempts (FAILURE-ARTIFACT-LOSS-1 would recur)"
          exit 1

      - name: "Commit back source+mirror (green-only - the repo must never run ahead of live)"
        if: always()
        run: |
          set -uo pipefail
          if [ "${{ job.status }}" != "success" ]; then
            echo "job status is '${{ job.status }}'; refusing source commit-back so the repo cannot run ahead of live"
            exit 0
          fi
          git config user.name  "qnfo-fleet-bot"
          git config user.email "fleet-bot@qnfo.org"
          git add qnfo-ops/worker.js \
                  qnfo-ops/deployed-current.worker.js
          if git diff --cached --quiet; then
            echo "nothing to commit (patch was a no-op)"
            exit 0
          fi
          git commit -m "fix(qnfo-ops): #1372 github_file_write retries on 409 with re-read sha [skip ci]"
          for i in 1 2 3 4 5; do
            echo "commit-back attempt $i"
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "commit-back OK on attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "::error::COMMITBACK-FAILED after 5 attempts"
          exit 1
