name: attach-surface-routes

# SURFACE-ROUTES-1 (2026-10-02, pillar reach). Routes archive.qnfo.org, qwav.org, www.qwav.org and qwav.tech to
# qnfo-gateway 3.9+, which renders them with the QNFO design system (QDS-1) in place of two Pages projects that
# are stale or outside the repository. Same self-triggering, fail-closed, commit-back pattern as
# attach-ask-qwav-route.yml: a push of this file or its script starts the first run, the script waits for the
# canonical deploy of qnfo-gateway 3.9+, creates one zone route per host (reversible: delete the route ids in
# ci-status/attach-surface-routes.json) and verifies each host's /health names qnfo-gateway.
# WORKFLOW-YAML-LINT-1: every step name below is colon-free.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/attach-surface-routes.yml'
      - 'scripts/attach-surface-routes.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: attach-surface-routes
  cancel-in-progress: false

jobs:
  attach-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the idempotent fail-closed route script
        id: attach
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          rc=0
          python3 scripts/attach-surface-routes.py || rc=$?
          echo "attach_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "ATTACH_RC=$rc"
          exit 0

      - name: Echo the route result artifact
        run: |
          set -uo pipefail
          if [ -f ci-status/attach-surface-routes.json ]; then
            cat ci-status/attach-surface-routes.json
          else
            echo "NO_ARTIFACT_WRITTEN"
          fi

      - name: Commit the route result back to main (race-safe)
        id: commitback
        run: |
          set -uo pipefail
          git config user.name "qnfo-selfheal-bot"
          git config user.email "bot@qnfo.org"
          # ARTIFACT-PUSH-CONFLICT-1: a result artifact is a snapshot (latest wins); push_artifact.sh re-applies it onto
          # origin/main instead of rebasing, so a concurrent run cannot leave a merge conflict (run 37965468938, #863).
          bash scripts/push_artifact.sh "ci(attach-domain): record SURFACE-ROUTES-1 result [skip ci]" ci-status/attach-surface-routes.json
