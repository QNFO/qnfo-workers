# RETIRED-DUPLICATE-STUB - serves HTTP 410 for the retired repository-root worker.
#
# DUP-WORKER-NAME-GATE-1 (#1384) + SECRET-IN-PUBLIC-REPO-1, remediated 2026-09-29.
#
# Renamed to the Workers Builds target "qnfo-workers" on 2026-10-25. The Cloudflare
# Git integration builds this repository as worker "qnfo-workers" and warned on
# every deploy while the config carried the legacy name:
#   "Failed to match Worker name. Your config file is using the Worker name
#    qnfo-paper-indexer-root-legacy-dup, but the CI system expected qnfo-workers.
#    Overriding using the CI provided Worker name."
# The config now matches the build target so the override warning is gone. The
# deployed artifact is unchanged: worker.js serves 410 {"status":"retired"} and
# the live worker carries no bindings.
#
# This root-level config was the pre-move location of qnfo-paper-indexer. The worker
# now lives in qnfo-paper-indexer/ and its canonical config is
# qnfo-paper-indexer/wrangler.toml (main = "deployed-current.worker.js").
#
# Defects removed here on 2026-09-29 (still in force):
#   1. name = "qnfo-paper-indexer" collided with qnfo-paper-indexer/wrangler.toml, so a
#      deploy from the repository root silently clobbered the canonical worker.
#      Detected by scripts/dup-worker-name-gate.py (GATE_EXIT=1).
#   2. [vars] INDEX_TOKEN held a plaintext credential in a public repository.
#
# usage_model was removed on 2026-10-25: wrangler 4.x rejects it as an unexpected
# top-level field ("Unexpected fields found in top-level field: usage_model").
#
# No d1_databases, no vectorize, no [ai], no [vars], no secrets.
# This config must never carry a credential.
name = "qnfo-workers"
main = "worker.js"
compatibility_date = "2026-10-25"
workers_dev = true

# BP26-OBSERVABILITY-1 (2026-10-26, agent_issues 1000354): the Cloudflare API shows this stub as the only one of 35 deployed Workers with observability off
# (observability_enabled_share 34 of 35, scripts/bp26_repo.py). It serves 410 and holds no bindings, so logs and traces are declared the way every other worker
# declares them (the Workers docs: `enabled` alone turns on logs only) and sampled low, because a 410 has little to read.
[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.05

