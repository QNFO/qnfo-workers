name: apply-version-quote-1

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-version-quote-1.py"
      - ".github/workflows/apply-version-quote-1.yml"
      - "scripts/deploy-drift-guard.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-version-quote-1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply VERSION-QUOTE-1 applier
        run: python3 scripts/patch-version-quote-1.py

      - name: Verify patched guard compiles and carries both markers
        run: |
          set -e
          python3 -m py_compile scripts/deploy-drift-guard.py
          test "$(grep -c 'VERSION-QUOTE-1' scripts/deploy-drift-guard.py)" -ge 3
          test "$(grep -c 'SERVER_CONST' scripts/deploy-drift-guard.py)" -ge 2
          echo "verify ok"

      - name: Publish machine-readable status
        if: always()
        run: |
          mkdir -p ci-status
          printf '{"job":"version-quote-1","conclusion":"%s"}\n' "${{ job.status }}" > ci-status/version-quote-1.json

      - name: Commit the patched guard back to main
        run: |
          set -e
          git config user.name "qnfo-fleet-bot"
          git config user.email "fleet-bot@qnfo.org"
          git add scripts/deploy-drift-guard.py ci-status/version-quote-1.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "fix(deploy-drift-guard) VERSION-QUOTE-1 quote-agnostic VERSION plus SERVER_VERSION fallback"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "commit-back failed after 5 attempts"
          exit 1

      - name: Re-dispatch the fleet audit
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run fleet-autodeploy.yml -f mode=audit || true
