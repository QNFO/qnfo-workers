name = "qnfo-ddocs-indexer"
main = "worker.js"
compatibility_date = "2026-08-10"
workers_dev = true
usage_model = "standard"

[[r2_buckets]]
binding = "DDOCS"
bucket_name = "qnfo-ddocs"

[[vectorize]]
binding = "DDOC_VZ"
index_name = "qnfo-ddocs"

[[d1_databases]]
binding = "AUDIT"
database_name = "qnfo-audit"
database_id = "35e2e573-92f3-46ac-83c6-22f6429fc5e5"

[ai]
binding = "AI"

[triggers]
crons = ["37 */2 * * *"]

[vars]
INDEX_TOKEN = "ddx-v1-2026-k9m2n4p7r5t8w3x6"
DDOC_PREFIX = "2026-09-04"
