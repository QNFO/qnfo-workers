name = "q08-signal-engine"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "q08-signal"
database_id = "10fd74b7-c4b3-43c7-9ca5-855213f44a69"

[[services]]
binding = "EMAIL"
service = "qnfo-email"
environment = "production"

[triggers]
crons = ["0 */2 * * *"]

# ROUTER_TOKEN: optional; if set, routes through qnfo-ai service binding instead of Workers AI direct
