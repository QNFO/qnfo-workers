name: apply-raw-put-schedules

# RAW-PUT-SCHEDULES-1 (issue #1390, AUTODEPLOY-SCHEDULES-NOT-APPLIED-1).
#
# Applies scripts/raw-put-schedules-patch.py so scripts/raw_put.py PUTs
# /schedules for the crons declared in each artifact's wrangler.toml.
#
# NO Cloudflare deploy is required for this fix. raw_put.py is a repo script, not
# a worker: the change takes effect the next time ANY workflow deploys through
# raw_put.py, which includes the default-ON auto-updater
# (fleet-autodeploy.yml -> fleet-autoaudit.py --apply).
#
# WHY THIS WORKFLOW IS WRITTEN THIS WAY (the class it must not join):
#   * WORKFLOW-YAML-LINT-1 documents that an unquoted colon inside a step NAME
#     made deploy-qnfo-ops.yml unparseable, so GitHub created runs with ZERO jobs,
#     conclusion=failure and no job log -- the deploy silently stopped. Every step
#     name below is colon-free and .github/workflows/workflow-lint.yml gates it.
#   * FAILURE-ARTIFACT-LOSS-1 / CI-APPLIER-NEVER-APPLIES-1: appliers that only
#     commit on success leave no trace when they fail. The apply step here is
#     continue-on-error and the ci-status artifact is written with if always, so
#     a run that changes nothing is still visible in ci-status/.
#   * COMMITBACK-DRIFT-1 / the 409 class: the commit-back retries with
#     pull --rebase --autostash so a concurrent writer cannot silently strand it.

on:
  push:
    branches: [main]
    paths:
      - "scripts/raw-put-schedules-patch.py"
      - ".github/workflows/apply-raw-put-schedules.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-raw-put-schedules
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply patch fail-closed
        id: apply
        continue-on-error: true
        run: |
          set -uo pipefail
          export REPO_ROOT="$GITHUB_WORKSPACE"
          rc=0
          python3 scripts/raw-put-schedules-patch.py || rc=$?
          echo "apply_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "--- post-state ---"
          echo "marker=$(grep -c 'RAW-PUT-SCHEDULES-1' scripts/raw_put.py || true)"
          echo "schedules_refs=$(grep -c '/schedules' scripts/raw_put.py || true)"
          echo "put_schedules_def=$(grep -c 'def put_schedules' scripts/raw_put.py || true)"
          python3 -c "import ast; ast.parse(open('scripts/raw_put.py').read()); print('AST_OK')"
          exit $rc

      - name: Commit and push the patched deployer
        continue-on-error: true
        run: |
          set -uo pipefail
          git config user.name "qnfo-selfheal-bot"
          git config user.email "bot@qnfo.org"
          git add scripts/raw_put.py
          if git diff --cached --quiet; then
            echo "NO_CHANGES already applied"
            exit 0
          fi
          git commit -m "fix(ci): RAW-PUT-SCHEDULES-1 raw_put.py applies wrangler.toml crons (#1390)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "PUSH_OK attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "PUSH_FAILED after 5 attempts"
          exit 1

      - name: Write ci-status artifact
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p ci-status
          printf '{"workflow":"apply-raw-put-schedules","issue":"1390 / RAW-PUT-SCHEDULES-1","apply_rc":"%s","head":"%s","ts":"%s"}\n' \
            "${{ steps.apply.outputs.apply_rc }}" "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" \
            > ci-status/raw-put-schedules.json
          cat ci-status/raw-put-schedules.json
          git add ci-status/raw-put-schedules.json
          if git diff --cached --quiet; then
            echo "STATUS_UNCHANGED"
            exit 0
          fi
          git commit -m "ci(status): apply-raw-put-schedules run [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "STATUS_PUSH_OK attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "STATUS_PUSH_FAILED after 5 attempts"
          exit 1
