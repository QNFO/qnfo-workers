name: charter-guard

# QUNIVERSE-CHARTER-1 (2026-10-01).
#
# docs/QUNIVERSE-CHARTER.md is the system's charter. Its generated half is written daily by
# qnfo-fleet-control (CHARTER-LOOP-1) between two markers; its hand-written half carries the
# identity, objectives, SWOT, MVP, blue-sky footprint, roadmap and decision rules. This gate
# keeps the two halves and the code that grades them in agreement:
#   * charter.test.mjs replays the live-register fixture through the pure half of the loop
#     (target parsing, pillar health, MVP status, SWOT, horizons, render, splice);
#   * scripts/charter-guard.py checks the document shape, the pillar parity between the
#     document and CHARTER_PILLARS in the worker, and that every NEW worker directory names
#     the charter pillar it serves (a worker that cannot is parked, not built).
# No cron (SCHEDULE-EVENT-NEVER-FIRES-1). No unquoted colon in a step name (WORKFLOW-YAML-LINT-1).
# Writes no ci-status artifact, so no commit-back step is needed (ARTIFACT-STAGING-1).

on:
  pull_request:
    paths:
      - 'docs/QUNIVERSE-CHARTER.md'
      - 'docs/PORTFOLIO.md'
      - 'qnfo-fleet-control/**'
      - 'migrations/2026-10-02-metric-closed-loop.sql'
      - 'migrations/2026-10-02-performance-loop.sql'
      - 'scripts/charter-guard.py'
      - '*/wrangler.toml'
      - '.github/workflows/charter-guard.yml'
  push:
    branches: [main]
    paths:
      - 'docs/QUNIVERSE-CHARTER.md'
      - 'docs/PORTFOLIO.md'
      - 'qnfo-fleet-control/**'
      - 'migrations/2026-10-02-metric-closed-loop.sql'
      - 'migrations/2026-10-02-performance-loop.sql'
      - 'scripts/charter-guard.py'
      - '*/wrangler.toml'
      - '.github/workflows/charter-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: charter-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  charter:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check the governance kernel
        run: node --check qnfo-fleet-control/worker.js

      - name: Replay the charter loop offline
        run: |
          set -euo pipefail
          out=$(node qnfo-fleet-control/charter.test.mjs)
          echo "$out"
          echo "$out" | grep -q "0 failed" \
            || { echo "::error::charter loop suite reported failures"; exit 1; }

      - name: Replay the portfolio loop offline
        run: |
          set -euo pipefail
          out=$(node qnfo-fleet-control/portfolio.test.mjs)
          echo "$out"
          echo "$out" | grep -q "0 failed" \
            || { echo "::error::portfolio loop suite reported failures"; exit 1; }

      - name: Replay the loop watchdog offline
        run: |
          set -euo pipefail
          out=$(node qnfo-fleet-control/loopwatch.test.mjs)
          echo "$out"
          echo "$out" | grep -q "0 failed" \
            || { echo "::error::loop watchdog suite reported failures"; exit 1; }

      # OBJECTIVE-CONSTRAINTS-1 (owner-ratified goals 41, 43, 57): the suite replays the hourly tick against an in-memory
      # SQLite D1 (node:sqlite needs Node 22, so this step switches runtime; the steps after it are Python).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Replay the objective constraints offline
        run: |
          set -euo pipefail
          out=$(node qnfo-fleet-control/constraints.test.mjs)
          echo "$out"
          echo "$out" | grep -q "0 failed" \
            || { echo "::error::objective constraints suite reported failures"; exit 1; }

      # IMPROVEMENT-LOOP-1: metric history, week-on-week trends, regressions and fix durability (pure half and the hourly
      # tick against an in-memory SQLite D1 with the live integrity and close-evidence triggers).
      - name: Replay reach ideation offline
        run: |
          set -euo pipefail
          out=$(node qnfo-fleet-control/reach.test.mjs)
          echo "$out"
          echo "$out" | grep -q "0 failed" \
            || { echo "::error::reach ideation suite reported failures"; exit 1; }

      - name: Replay the improvement loop offline
        run: |
          set -euo pipefail
          out=$(node qnfo-fleet-control/improvement.test.mjs)
          echo "$out"
          echo "$out" | grep -q "0 failed" \
            || { echo "::error::improvement loop suite reported failures"; exit 1; }

      # ACT-BRIDGE-1: a metric trigger's code-task and code-anchor lines reach the issue on their own lines, where the code
      # loop's ISSUE-INTAKE-1 pattern (read from qnfo-code-orchestrator/worker.js) picks them up.
      - name: Replay the act bridge offline
        run: |
          set -euo pipefail
          out=$(node qnfo-fleet-control/act-bridge.test.mjs)
          echo "$out"
          echo "$out" | grep -q "0 failure(s)" \
            || { echo "::error::act bridge suite reported failures"; exit 1; }

      # PERFORMANCE-LOOP-1: lever experiments driven by hit metric triggers (bounds, STRATEGY caps, keep or revert on
      # metric_history, kill switch) and the five KPIs, replayed against an in-memory SQLite D1 with the live guards and both
      # 2026-10-02 metric migrations applied (remedy_efficacy_30d counts the experiments).
      - name: Replay the performance loop offline
        run: |
          set -euo pipefail
          out=$(node qnfo-fleet-control/performance.test.mjs)
          echo "$out"
          echo "$out" | grep -q "0 failed" \
            || { echo "::error::performance loop suite reported failures"; exit 1; }

      - name: Resolve the diff range
        id: range
        run: |
          set -euo pipefail
          HEAD_SHA='${{ github.sha }}'
          BASE_REF='${{ github.base_ref }}'
          BASE_REF="${BASE_REF:-main}"
          BASE=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA" 2>/dev/null || true)
          if [ -z "$BASE" ] || [ "$BASE" = "$(git rev-parse "$HEAD_SHA")" ]; then
            BASE=$(git rev-parse "$HEAD_SHA~1" 2>/dev/null || git rev-parse "$HEAD_SHA")
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "range $BASE..$HEAD_SHA"

      - name: Charter shape, pillar parity and new-worker pillar declarations
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/charter-guard.py
          python3 scripts/charter-guard.py "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"
