name: model-floor-guard

# MODEL-FLOOR-1 enforcement, moved off the owner's laptop (2026-10-17 local de-bloat).
# Scans repo worker sources and live deployed bundles for banned sub-frontier models.
# Exit 1 means at least one worker still carries a banned model at code level. The job is
# deliberately NOT ratcheted or continue-on-error: a red run is the true signal until the
# violating workers are fixed. The report is written to the job summary.
#
# Triggers: push to main on these two paths (primary), weekly cron, manual dispatch
# (CRON-MANDATE-1: far below 144/day). Push is primary because the repo's schedule event
# has been unreliable (SCHEDULE-EVENT-NEVER-FIRES-1 in guard-timebudget.yml).
# The script is a copy of qnfo-ops/scripts/model-floor-guard.mjs; keep the two in step.
# Step names are colon-free (WORKFLOW-YAML-LINT-1).

on:
  push:
    branches: [main]
    paths:
      - "*/worker.js"
      - "*/deployed-current.worker.js"
      - "scripts/model-floor-guard.mjs"
      - ".github/workflows/model-floor-guard.yml"
  # MODEL-FLOOR-PREMERGE-1 (2026-10-19, agent_issues 100121): the guard only ran after a merge, so PR 2753 put a banned model into main
  # and every later push went red until a fix merged. A pull request now runs the repo-source scan in diff mode (--base): it fails only
  # for a violation the change adds, so debt already on main never blocks an unrelated pull request. No token, no live sweep.
  pull_request:
    branches: [main]
    paths:
      - "*/worker.js"
      - "*/deployed-current.worker.js"
      - "scripts/model-floor-guard.mjs"
      - ".github/workflows/model-floor-guard.yml"
  # FLOOR-WATCH-1 (2026-10-17): the scan used to run only when its own two files changed or weekly, so a
  # worker that reintroduced a sub-frontier model was invisible for up to seven days. Every worker change
  # now scans the repo sources at once; the live-bundle sweep stays daily + weekly + manual.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-floor-guard-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    # RUNNER-PIN-2 (2026-10-20, WORKFLOW-FAILURE-AUDIT-1): ubuntu-latest becomes Ubuntu 26 by 2026-11-19 (a notice on every job meanwhile); pinned to ubuntu-24.04 until an ubuntu-26.04 trial run is green.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Scan repo sources and live bundles
        env:
          QNFO_WORKERS: ${{ github.workspace }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          LIVE=""
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}" > /dev/null 2>&1
            git worktree add --detach "$RUNNER_TEMP/floor-base" "${{ github.event.pull_request.base.sha }}" > /dev/null 2>&1
            BASE="--base $RUNNER_TEMP/floor-base"
          elif [ "${{ github.event_name }}" != "push" ]; then
            LIVE="--live"
          fi
          node scripts/model-floor-guard.mjs $LIVE $BASE > floor-report.txt 2>&1
          rc=$?
          { echo '### model-floor-guard'; echo "exit code: $rc"; echo '```'; head -c 60000 floor-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          head -40 floor-report.txt
          exit $rc


